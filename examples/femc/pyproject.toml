[project]
name = "femc"
version = "0.1.0"
description = "Converts datasets from FEMC's public data archive into archive packages."
requires-python = ">=3.12"
dependencies = [
    "archive-contract",
]

[project.scripts]
femc = "femc.cli:main"

[tool.uv.sources]
archive-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/femc"]
