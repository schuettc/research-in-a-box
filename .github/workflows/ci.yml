name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - run: uv sync --all-packages --locked
      - run: npm ci
      - run: just check-python check-schema

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: npm ci
      - run: just check-ts

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: pip-audit on the locked Python dependencies
        # The lock pins every package, so pip-audit audits it as is instead of resolving it in a venv.
        run: uv export --frozen --no-hashes --no-emit-workspace | uvx pip-audit -r /dev/stdin --disable-pip --no-deps
      - name: npm audit
        run: npm audit --audit-level=high
      - name: zizmor on the workflows
        run: uvx zizmor .github/workflows/

  stages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, typescript, security]
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.stages.outputs.list }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - id: stages
        run: echo "list=$(just stages)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: stages
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        stage: ${{ fromJSON(needs.stages.outputs.list) }}
    environment: ${{ matrix.stage }}
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: ${{ matrix.stage }}
    steps:
      - id: role
        name: Skip a stage with no deploy role
        env:
          ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -z "$ROLE_ARN" ]; then
            echo "::notice::$STAGE has no AWS_DEPLOY_ROLE_ARN in its environment; skipped"
            echo "connected=false" >> "$GITHUB_OUTPUT"
          else
            echo "connected=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.role.outputs.connected == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.role.outputs.connected == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: steps.role.outputs.connected == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - if: steps.role.outputs.connected == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.59.0
      - if: steps.role.outputs.connected == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - if: steps.role.outputs.connected == 'true'
        run: npm ci
      - if: steps.role.outputs.connected == 'true'
        run: just lambda-assets
      - if: steps.role.outputs.connected == 'true'
        working-directory: packages/infra
        run: npx cdk deploy "ResearchArchive-$STAGE" --require-approval never
      - if: steps.role.outputs.connected == 'true'
        run: just smoke "$STAGE"
