[project]
name = "archive-agent"
version = "0.1.0"
description = "The research-in-a-box MCP server and Claude Code plugin."
requires-python = ">=3.12"
dependencies = [
    "archive-client",
    "archive-contract",
    "cruise",
    "mcp>=2.3,<3",
]

[project.scripts]
archive-mcp = "archive_agent.server:main"

[tool.uv.sources]
archive-client = { workspace = true }
archive-contract = { workspace = true }
cruise = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archive_agent"]
