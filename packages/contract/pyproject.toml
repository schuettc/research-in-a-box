[project]
name = "archive-contract"
version = "0.1.0"
description = "The research-in-a-box archive contract: Pydantic models for an archive package."
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archive_contract"]
