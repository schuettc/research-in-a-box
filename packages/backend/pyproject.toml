[project]
name = "archive-backend"
version = "0.1.0"
description = "The research-in-a-box backend Lambda code."
requires-python = ">=3.12"
dependencies = ["archive-contract", "boto3"]

[tool.uv.sources]
archive-contract = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archive_backend"]
