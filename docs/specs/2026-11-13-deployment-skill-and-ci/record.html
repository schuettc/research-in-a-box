<script type="application/json" id="dz-record">{"fv":{"id":"","path":"research-archive-in-a-box/docs/specs/2026-11-13-deployment-skill-and-ci","key":"research-archive-in-a-box/deployment-skill-and-ci","record":{"schema":4,"title":"Deployment skill and CI (Plan 10a)","expect":3,"agent_at":"2026-11-14T06:54:49.572747Z","start":{"opening":{"text":"can we start all of the plans as planned so we don't forget them and have a way to track them with their own sessions\n\n(Saved as planned: mark this plan Planned with diazo_update planned: true and wait for Start planning. Do no research until then. It waits on Plan 4, the archive infrastructure.)\n\nBrief: Plan 10a in docs/planning-handoff.md. Starter prompt from the handoff:\n\n\u003e Read `docs/planning-handoff.md`. Plan the deployment skill and CI (Plan 10a). The skill ships in the repo and is for the person running an archive, not for researchers. Plan its steps and the points where it must stop and ask."},"findings":[{"text":"CI today runs checks only: a python job (just check-python check-schema) and a typescript job (just check-ts) on every push and PR. No deploy job, no security checks, no AWS access.","source":".github/workflows/ci.yml on origin/main","cases":"1 of 1 workflow"},{"text":"A deploy today is by hand from a laptop: just lambda-assets, then ARCHIVE_CONFIG=\u003cfile\u003e npx cdk deploy ResearchArchive-\u003cstage\u003e, after cdk bootstrap if the account has no CDKToolkit stack. Plans 4 and 6 each did this on a throwaway test stage and destroyed it.","source":"docs/specs/2026-11-13-archive-infrastructure-cdk-construct/plans/3-reindex-and-test-deploy.md:168-187","cases":"2 of 2 test deploys"},{"text":"The config defaults to one stage, prod. Other stages are entries in infrastructure.stages with an optional account and region; one stack per stage, ResearchArchive-\u003cstage\u003e. prod keeps its buckets and tables on destroy; other stages delete cleanly.","source":"packages/contract/src/archive_contract/config.py (Infrastructure, Stage); handoff Decision log 2026-11-13 (4, 10a)","cases":"1 of 1 config model"},{"text":"Every setting the skill must walk through is in ArchiveConfig and its JSON Schema: publisher, profiles, required, vocabularies, themes, licenses, access, and infrastructure (stages, alertEmail, monthlyBudgetUsd, modules.waf, modules.objectLock). Plans 6 and 7 will add embeddings and DOIs there.","source":"packages/contract/src/archive_contract/config.py; packages/web/src/schema/archive-contract.schema.json","cases":"12 settings today"},{"text":"The admin commands the skill can call already exist as just recipes: invite-user \u003cstage\u003e \u003cemail\u003e [group], reindex \u003cstage\u003e, reindex-status \u003cstage\u003e, lambda-assets.","source":"justfile on origin/main","cases":"4 recipes"},{"text":"The committed sample package is a clear seed candidate: invented data, CC-BY-4.0, access open, id stream-temperature-sample.","source":"examples/sample-package/datapackage.json","cases":"1 package"},{"text":"Seeding goes through Plan 7's submit and publish path, not a copy into the archive bucket plus a reindex: a copy is a second way to publish that skips archive:published, the checksum rewrite and the dataset page. Plan 7's publish is in its test-stage run now and lands before 10a builds.","source":"muster #960, reply from the coordinating session","cases":"1 ruling"},{"text":"The skill lives at .claude/skills/deploy-archive/ in the repo; Plan 9's plugin is for researchers and curators. The dataset-page rebuild command is Plan 8's; 10a runs it after a deploy once it exists (PARK1).","source":"muster #960, reply from the coordinating session","cases":"1 ruling"},{"text":"Teardown of a non-prod stage leaves the log group of CDK's S3 auto-delete helper; Plan 4 left it for 10a's teardown to delete (PARK12).","source":"docs/specs/2026-11-13-archive-infrastructure-cdk-construct/README.md:47","cases":"2 of 2 test teardowns"},{"text":"Accounts are invitation-only, so the first admin is just invite-user \u003cstage\u003e \u003cemail\u003e admin; Cognito emails a temporary password.","source":"handoff Decision log 2026-11-13 (4, 6, 7, 8, 9, 10a); justfile invite-user","cases":"1 recipe"},{"text":"A Claude Code skill committed at .claude/skills/\u003cname\u003e/SKILL.md is picked up when someone opens the clone in Claude Code, with no plugin install.","assumed":true}],"rounds":[{"take":"The brief asks for two things that can each deploy an archive: the skill and CI. I'd make **CI the only thing that ever deploys an archive stack**, and give the skill the job of getting a fork to the point where CI can, then watching it do so.\n\n**What the skill does, in order** (the diagram shows it; ✋ marks where it stops and asks):\n\n1. **Check prerequisites**: uv, Node 24, just, the AWS CLI signed in to the right account, gh signed in, the clone is a GitHub repo with Actions on.\n2. **Write the config** by asking about the archive, then every optional setting. It reads the settings and their descriptions from the contract's JSON Schema, so a setting Plan 6 or 7 adds shows up with no change to the skill.\n3. ✋ **Connect GitHub to AWS**: `cdk bootstrap` if the account has none, and one small stack with GitHub's OIDC provider and a deploy role that trusts only this repo. This creates IAM in their account, so it asks first.\n4. ✋ **Deploy**: commit `archive.yaml`, push, and follow the CI run. This is the step that starts costing money, so it says roughly what and asks.\n5. ✋ **First admin**: `just invite-user \u003cstage\u003e \u003cemail\u003e admin`. It sends a real email, so it confirms the address.\n6. ✋ **Seed** the sample package (CC-BY-4.0, invented) by submitting it through the archive's own submit API, the way any dataset arrives, and approving it as the new admin. It becomes public data on their archive, so it asks. This also proves the ingest and publish path works.\n7. **Smoke test**: a new `just smoke \u003cstage\u003e` that checks the site, the API, search, the seeded dataset's page and an open download.\n\n**Update** merges upstream into the fork, runs `just check`, and pushes, so CI deploys it. **Teardown** is the one thing run from the laptop, never from CI: ✋ it makes them type the stage name, and says plainly that `prod` keeps its buckets and tables.\n\n**CI** gains security checks and a deploy job that runs after the checks pass on `main`: it deploys `dev` first when a `dev` stage is configured, then `prod`. On a repo with no deploy role set up (this upstream repo, a fresh fork) the deploy job skips instead of failing.\n\nThe other way is for the skill to run `cdk deploy` from the laptop and leave CI for later. It's quicker to a first archive, but then a fork has two ways to deploy that drift apart, and the first push to `main` redeploys whatever the laptop didn't.\n\n*Revised after the coordinating session's answer (muster #960): the seed now goes through Plan 7's submit and publish path instead of a copy into the bucket plus a reindex, which would have been a second way to publish. Rebuilding dataset pages after a template change is Plan 8's command; CI runs it once it exists (PARK1).*","visuals":[{"kind":"mermaid","caption":"The deployment skill's steps; the hand marks where it stops and asks","mermaid":"flowchart TD\n  A[Check prerequisites] --\u003e B[Write archive.yaml\u003cbr/\u003esettings read from the JSON Schema]\n  B --\u003e C{{\"✋ Connect GitHub to AWS\u003cbr/\u003ecdk bootstrap + OIDC deploy role\"}}\n  C --\u003e D{{\"✋ Deploy\u003cbr/\u003ecommit, push, follow the CI run\"}}\n  D --\u003e E{{\"✋ First admin\u003cbr/\u003ejust invite-user stage email admin\"}}\n  E --\u003e F{{\"✋ Seed the sample package\u003cbr/\u003esubmit and approve through the API\"}}\n  F --\u003e G[Smoke test\u003cbr/\u003ejust smoke stage]\n  H[Update\u003cbr/\u003emerge upstream, just check, push] --\u003e D\n  I{{\"✋ Teardown, from the laptop\u003cbr/\u003etype the stage name\"}}"},{"kind":"table","caption":"Where it stops and asks, and why","table":{"columns":["Stop","What it would do","Why it asks"],"rows":[["Connect GitHub to AWS","cdk bootstrap, OIDC provider and deploy role","Creates IAM in their account"],["Deploy","Push to main; CI deploys the stage","Starts monthly cost"],["First admin","Invite one email as admin","Sends an email to a real person"],["Seed","Submit and publish the sample package","Becomes public data on their archive"],["Teardown","cdk destroy the stage","Cannot be undone; prod keeps data"]],"sample":""}}],"recommendation":"CI is the one deploy path. The skill sets up the fork, its config and GitHub's access to AWS, then pushes and follows the CI run. It stops and asks before each step that creates something in AWS, costs money, emails a person, publishes data or destroys anything. The seed goes through the archive's own submit and publish. Teardown runs from the laptop."}],"direction":{"round":1,"at":"2026-11-14T00:35:05.008007-06:00","by":"user"}},"understanding":{"points":[{"kind":"outcome","text":"Someone who forks the repo can deploy their own archive with Claude Code, using a deployment skill that ships in the repo and is for the person running the archive, not for researchers.","source":"said"},{"kind":"outcome","text":"The skill checks prerequisites, asks about the archive and writes archive.yaml, walks through every optional setting, connects GitHub Actions to the AWS account, deploys, invites the first admin, loads seed data and runs a smoke test. It also covers update and teardown.","source":"said"},{"kind":"outcome","text":"CI tests Python, the CDK and the web app, runs security checks, and deploys with OIDC.","source":"said"},{"kind":"outcome","text":"CI is the one deploy path (the direction). The skill sets up the fork and GitHub's access to AWS, then pushes and follows the CI run. Teardown runs from the laptop.","source":"said"},{"kind":"constraint","text":"The skill stops and asks before any step that costs money or cannot be undone. In the direction that is: connecting GitHub to AWS, the first deploy, inviting the first admin, publishing the seed, and teardown.","source":"said"},{"kind":"constraint","text":"A fork with only the default prod stage works. CI adds a dev deploy only when a dev stage is configured (Plan 4's note).","source":"said"},{"kind":"constraint","text":"The seed goes through the archive's own submit and publish path, never a copy into the bucket (the coordinating session, muster #960). The seed is the committed sample package, which is invented data under CC-BY-4.0.","source":"said"},{"kind":"constraint","text":"Build on what exists (the justfile recipes, ArchiveConfig, the default app) and plan only what this brief needs to work end to end now. Everything else goes to follow-ups (the coordinating session's rules).","source":"said"},{"kind":"constraint","text":"Rolling a template change out to existing dataset pages needs no command of this plan's: Plan 8 makes the reindex rewrite every page, so it is just reindex \u003cstage\u003e after a deploy. Wiring that in waits on Plan 8 (PARK1).","source":"said"},{"kind":"success","text":"On a fresh fork in a real AWS account, the skill takes it from a clone to a working archive with one published sample dataset, a passing smoke test and an invited admin, with CI doing the deploy. Teardown of a non-prod stage then leaves nothing behind.","source":"assumed"},{"kind":"success","text":"On this upstream repo, and on any fork not connected to AWS, CI's checks pass and the deploy job skips without failing.","source":"assumed"}],"confirmed":true,"revisions":[{"at":"0001-01-01T00:00:00Z","text":"Page rollout: no separate rebuild command; Plan 8 makes the reindex rewrite every page, so it is just reindex \u003cstage\u003e after a deploy (muster #960).","because":"note:plan"}]},"decisions":[{"id":"DCSN1","name":"How the seed signs in","question":"How should the skill sign in as the new admin to submit and approve the sample package on a real (prod) stage?","example":"After the first deploy, the skill has invited court@example.org as admin. To seed, it must call POST /api/submissions and then approve the submission, both of which need a signed-in token. Plan 7's test run gets tokens with a password client, but that client exists only on non-prod stages and never on prod. The command-line sign-in through the browser is Plan 9's to use, and Plan 9 hasn't been planned.","options":[{"id":"A","title":"Browser sign-in, built once as Plan 9's shared module","includes":"A new uv workspace package packages/client (archive-client, import archive_client), standard library only, in the shape Plan 9 set: archive_client/signin.py with AuthConfig(region, cognito_domain, cli_client_id), Tokens(access_token, id_token, expires_at, no refresh token), sign_in(config, *, open_browser=webbrowser.open) -\u003e Tokens, PKCE S256, state, a one-shot listener on localhost:8765, and SignInError. just seed \u003cstage\u003e imports it to submit and approve the sample package. Plan 9's CLI and MCP server import the same module later, and add AuthConfig.from_archive(url) then.","pulls_in":"A new small workspace package with its tests in this plan. Nothing new in AWS: the cli client already exists on every stage."},{"id":"B","title":"Wait for Plan 9's sign-in","includes":"This plan ships everything else now. The seed step and the smoke test's dataset checks are added once Plan 9's client exists.","pulls_in":"A fork deployed before then gets an empty archive and a smoke test without the dataset checks. A follow-up to come back."}],"recommendation":{"option":"A","why":"A deploy that ends in a published dataset is the proof the archive works end to end, and the cli client and its callback already exist on every stage, so nothing new goes into AWS. It is built once, in the exact shape Plan 9 will import, so there is never a second sign-in. The coordinating session and Plan 9 both agree to it.","evidence":[{"text":"The cli client already exists on every stage, code with PKCE, callback localhost:8765.","source":"packages/infra/src/auth.ts:38-68","output":"cli: client(\"CliClient\", [\"http://localhost:8765/callback\"])"},{"text":"Plan 7's password client is test-only and pinned off prod.","source":"docs/specs/2026-11-13-ingest-review-and-access-workflows/plans/1-submit-review-publish.md:201-218","output":"A synth test pins that a prod stage has no e2e client and no ADMIN_USER_PASSWORD_AUTH flow on any client."},{"text":"Plan 9 set the module's place and shape.","source":"muster #963","output":"packages/client, archive-client (import archive_client), standard library only. archive_client/signin.py holds AuthConfig(region, cognito_domain, cli_client_id), Tokens(...) and sign_in(config, *, open_browser=webbrowser.open) -\u003e Tokens"}]},"state":"decided","choice":"A","revisions":[{"at":"2026-11-14T00:38:12.198875-06:00","text":"Revised after the coordinating session (muster #963): option A now builds the sign-in once, as the shared module Plan 9's CLI and MCP server will import, rather than a script Plan 9 later moves.","because":""},{"at":"2026-11-14T00:39:17.307535-06:00","text":"Revised after Plan 9 fixed the module's shape (muster #963): option A now names it, archive_client.signin in a new packages/client.","because":""}]},{"id":"DCSN2","name":"Upstream updates to a fork","question":"How should upstream changes to the kit reach an adopter's fork?","example":"Upstream fixes a bug in the reindex. A fork made a month ago has its own archive.yaml and pushes to its own main, which CI deploys. Something has to bring the fix in without losing the fork's config.","options":[{"id":"A","title":"The skill's update step merges upstream","includes":"The skill adds the upstream remote if missing, merges upstream's main into the fork, resolves a conflict in archive.yaml by keeping the fork's values (and asks about anything else), runs just check, and pushes, so CI deploys it. It shows what changed upstream before it merges.","pulls_in":"Nothing new to run. Updates happen when the adopter asks for one."},{"id":"B","title":"GitHub's Sync fork button","includes":"The skill's docs point to Sync fork on GitHub, and CI deploys what it brings.","pulls_in":"Sync fork refuses whenever there is a conflict, so a fork that edited anything upstream also changed can't use it. Nothing is checked before the deploy."},{"id":"C","title":"A weekly workflow opens a PR","includes":"A scheduled workflow in the fork opens a pull request from upstream's main each week. The adopter merges it, and CI deploys.","pulls_in":"A new workflow and a token able to open PRs. Weekly PRs pile up in a fork nobody watches."}],"recommendation":{"option":"A","why":"It keeps the fork's config through a conflict, runs the same checks before anything deploys, and adds no new workflow. It's also the same skill the adopter already uses."},"state":"decided","choice":"A"},{"id":"DCSN3","name":"What the smoke test covers","question":"What should just smoke \u003cstage\u003e check after a deploy?","example":"CI has just deployed prod. Before calling it done, something has to show the archive actually answers: a site that loads, an API that responds, search that returns the seed.","options":[{"id":"A","title":"Read-only checks, no sign-in","includes":"The site's index loads, /api/health answers ok, /api/search finds the seeded dataset, /datasets/\u003cid\u003e serves its page, and one open file downloads from /data/... with the hash in its manifest. CI runs it after every deploy. The skill runs it after seeding.","pulls_in":"One small script and a just recipe. Nothing in AWS. Before the seed exists, the dataset checks are skipped and say so."},{"id":"B","title":"A plus signed-in checks","includes":"Also /api/whoami and a restricted download link, using a signed-in token.","pulls_in":"A token in CI, which means a stored credential or a test client on prod. Plan 7 keeps those off prod."},{"id":"C","title":"A full submit round trip every deploy","includes":"Submit, approve and publish a throwaway package on every deploy, then remove it.","pulls_in":"A sign-in in CI and test data published on prod each time. Removing a published version is takedown, which is Plan 7's open follow-up."}],"recommendation":{"option":"A","why":"It proves each public path a reader uses after every deploy with no credentials in CI. The submit path is proven once, by the seed."},"state":"decided","choice":"A"}],"calls":[{"id":"AGNT1","name":"Deploy role stack","question":"How does GitHub Actions get into the adopter's AWS account?","took":"A small separate CDK stack, ResearchArchiveDeploy, in packages/infra. It holds GitHub's OIDC provider and one role that trusts only this repo's GitHub environments and may assume only the CDK bootstrap roles. The skill deploys it from the laptop once per account, after cdk bootstrap if needed, and stores the role ARN as a repo variable.","instead":"Ask the adopter to make the provider and role by hand in the console, from written steps.","why":"Assuming the CDK bootstrap roles is how CDK itself scopes a deploy, so the role holds no broad permissions. A stack can be redeployed and destroyed like the rest. A stage in another account gets its own copy.","state":"standing"},{"id":"AGNT2","name":"Deploy order and environments","question":"When does CI deploy, and in what order?","took":"On every push to main once the checks pass, one job per stage in the order archive.yaml lists them, each waiting for the one before. Each job runs in a GitHub environment named for the stage, which is what the role's trust is scoped to. With no deploy-role variable set, the deploy job skips.","instead":"A manual approval before prod. An adopter can still add one as a required reviewer on the prod environment in GitHub's settings, with no code change.","why":"A prod-only fork deploys prod on push. A fork that lists dev before prod gets dev first. Environments are needed for the OIDC trust either way.","state":"standing"},{"id":"AGNT3","name":"Security checks","question":"Which security checks does CI run?","took":"Dependency audits (pip-audit on the exported uv lock, npm audit at high) and zizmor on the workflows, as one security job.","instead":"Add CodeQL or cdk-nag now.","why":"The deploy workflow is about to hold AWS access, so its workflows get checked. Dependencies are where real advisories land. CodeQL and cdk-nag stay follow-ups until a real finding calls for them.","state":"standing"},{"id":"AGNT4","name":"Settings from the schema","question":"How does the skill know every optional setting?","took":"It reads ArchiveConfig's JSON Schema (packages/web/src/schema/archive-contract.schema.json) for each setting's name, default and description, and validates the written file with the contract's load_config.","instead":"List the settings in the skill's text.","why":"Plans 6 and 7 add settings (embeddings, DOIs). Reading the schema means a new setting reaches the skill with no edit, and the list can never drift.","state":"standing"},{"id":"AGNT5","name":"Teardown from the laptop","question":"How does teardown work?","took":"A just destroy \u003cstage\u003e recipe run from the laptop, never in CI. The skill makes the user type the stage name and says that prod keeps its buckets and tables. After cdk destroy it deletes the leftover log group of CDK's S3 auto-delete helper (Plan 4's PARK12) and confirms the stack is gone.","instead":"A manually started teardown workflow in CI.","why":"A destroy should never be one click away in a shared repo's Actions tab.","state":"standing"},{"id":"AGNT6","name":"Cost before deploy","question":"What does the skill say before the first deploy?","took":"It names what bills while idle and what bills per use, and the monthly budget alarm already in the config. It gives no dollar figure, since none has been measured.","instead":"Measure an idle stage's bill first and quote it.","why":"The rule is to state only what is known. The budget alarm is already the guard.","state":"standing"},{"id":"AGNT7","name":"First admin's groups","question":"Which groups does the first admin join?","took":"admin, curator and contributor. just invite-user takes a comma-separated group list, so the skill runs just invite-user \u003cstage\u003e \u003cemail\u003e admin,curator,contributor.","instead":"The first admin is in admin only, and the seed step adds the other two groups for itself.","why":"Plan 7's routes check the groups one by one: creating a submission needs contributor and deciding needs curator. The person running a new archive does all three until they invite others. Plan 7 lets a curator decide their own submission, and the event records that they did.","state":"standing"}],"principles":[],"follow_ups":[{"id":"PARK1","name":"Page rollout by reindex","text":"Once Plan 8 makes the reindex rewrite every dataset page after its flip, rolling out a template change is just reindex \u003cstage\u003e after a deploy. Add that to the skill's update step (and decide then whether CI runs it after each deploy, since a reindex wants publishing quiet). Agreed with the coordinating session (muster #960).","kind":"improvement"},{"id":"PARK2","name":"CodeQL and cdk-nag","text":"Add CodeQL or cdk-nag to CI's security job once a real finding shows the dependency audits and zizmor miss something.","kind":"idea"}],"spec":{"hash":"eede9d6dc0b351091caac0edefa85aaca55b147ea42ed7576aa8b8e6865a8f89","sections":[{"id":"SPEC1","heading":"Goal","decisions":[]},{"id":"SPEC2","heading":"The deployment skill","decisions":["AGNT4","AGNT6","AGNT7"]},{"id":"SPEC3","heading":"Connecting GitHub to AWS","decisions":["AGNT1"]},{"id":"SPEC4","heading":"CI","decisions":["AGNT2","AGNT3"]},{"id":"SPEC5","heading":"Seeding and the sign-in","decisions":["DCSN1","AGNT7"]},{"id":"SPEC6","heading":"The smoke test","decisions":["DCSN3"]},{"id":"SPEC7","heading":"Update","decisions":["DCSN2"]},{"id":"SPEC8","heading":"Teardown","decisions":["AGNT5"]},{"id":"SPEC9","heading":"Risk and cost","decisions":["AGNT1","AGNT5"]},{"id":"SPEC10","heading":"Left out","decisions":["DCSN2","DCSN3","AGNT3"]},{"id":"SPEC11","heading":"How we'll know it works","decisions":["DCSN1","DCSN3","AGNT1","AGNT2","AGNT5"]}],"approved":{"hash":"07cea9ca59181466873ce6d480be93df17a865d1f03ec3a31da3b69be0b4715d","at":"2026-11-14T00:54:34.328226-06:00","body":"# Deployment skill and CI\n\n## Goal\n\nSomeone who forks the repo opens it in Claude Code and the deployment skill takes them from a clone to a working archive in their own AWS account: it checks what they need, writes `archive.yaml` with them, connects GitHub Actions to AWS, has CI deploy it, invites the first admin, publishes the sample package through the archive's own submit and publish path, and runs a smoke test. Update and teardown are part of the same skill. CI tests Python, the CDK and the web app, runs security checks, and is the one thing that deploys an archive stack. It builds on what Plans 1 to 9 built or are building (the justfile recipes, `ArchiveConfig`, the default CDK app, Plan 7's submissions API, Plan 8's reindex that rewrites pages) and rebuilds none of them.\n\n## The deployment skill\n\nThe skill is `.claude/skills/deploy-archive/SKILL.md` in the repo, for the person running an archive. A fork opened in Claude Code has it with no plugin install. Plan 9's plugin is for researchers and curators and doesn't carry it.\n\nIts steps, in order. ✋ marks a step where it stops, says what will happen and what it costs or changes, and waits for a yes:\n\n1. **Prerequisites.** uv, Node 24, just, the AWS CLI signed in (it shows `aws sts get-caller-identity` and asks whether that is the account), gh signed in, the clone's `origin` is the adopter's GitHub fork with Actions on. It says what is missing and how to install it, and goes no further until it is there.\n2. **The config.** It asks about the archive (publisher, the alert email, the monthly budget, profiles, licenses, access levels), then walks through every other setting with its default. It reads the settings, their defaults and their descriptions from `ArchiveConfig`'s JSON Schema, so a setting a later plan adds reaches the skill with no edit. It writes `archive.yaml` and validates it with the contract's `load_config` before going on. A fork keeps the default `prod` stage unless the adopter asks for another, such as `dev`.\n3. ✋ **Connect GitHub to AWS** (see Connecting GitHub to AWS). It creates IAM in their account.\n4. ✋ **Deploy.** It says what bills while the archive sits idle and what bills per use, and points to the budget alarm the config sets. It gives no dollar figure, since none has been measured. On a yes it commits `archive.yaml`, pushes to `main`, and follows the CI run with `gh run watch` on that run's id until it ends.\n5. ✋ **First admin.** It confirms the email address, then runs `just invite-user \u003cstage\u003e \u003cemail\u003e admin,curator,contributor`. Cognito emails a temporary password.\n6. ✋ **Seed.** It says the sample package becomes public data on their archive, then runs `just seed \u003cstage\u003e` (see Seeding).\n7. **Smoke test.** `just smoke \u003cstage\u003e` (see The smoke test). It reports each check.\n\nThe skill never runs `cdk deploy` itself. A stage in another account (an entry in `infrastructure.stages` with its own `account`) gets step 3 run once against that account.\n\nRests on: AGNT4, AGNT6, AGNT7\n\n## Connecting GitHub to AWS\n\nA small separate CDK stack, `ResearchArchiveDeploy`, lives in `packages/infra`. It holds GitHub's OIDC provider and one role whose trust allows only `repo:\u003cowner\u003e/\u003cname\u003e:environment:\u003cstage\u003e` for this fork's stages, and which may only assume the CDK bootstrap roles in its account (`cdk-*-deploy-role-*`, `cdk-*-file-publishing-role-*`, `cdk-*-image-publishing-role-*`, `cdk-*-lookup-role-*`). That is how CDK itself scopes a deploy, so the role holds no broad permissions.\n\nThe skill runs `cdk bootstrap` when the account and region have no `CDKToolkit` stack, deploys `ResearchArchiveDeploy` from the laptop, then creates one GitHub environment per stage and sets the role's ARN as the environment variable `AWS_DEPLOY_ROLE_ARN`, and the stage's region as `AWS_REGION`, with `gh api`. A synth test pins the trust to the repo and its environments and the role's permissions to the bootstrap roles.\n\nRests on: AGNT1\n\n## CI\n\n`ci.yml` keeps its two check jobs and gains:\n\n- **security**: `pip-audit` on the exported uv lock, `npm audit --audit-level=high`, and `zizmor` on `.github/workflows/`. It runs on every push and pull request beside the checks.\n- **deploy**: on a push to `main`, after the check and security jobs pass. It reads the stage list from `archive.yaml` through the contract and deploys one stage at a time in the order the file lists them, each waiting for the one before and stopping at the first failure. Each stage's job runs in the GitHub environment named for it, takes its credentials from `AWS_DEPLOY_ROLE_ARN` with `id-token: write`, runs `just lambda-assets` and `npx cdk deploy ResearchArchive-\u003cstage\u003e --require-approval never`, then `just smoke \u003cstage\u003e`.\n\nA prod-only fork deploys `prod` on every push to `main`. A fork that lists `dev` before `prod` gets `dev` first. A stage whose environment has no `AWS_DEPLOY_ROLE_ARN` is skipped with a notice and doesn't fail the run, so this upstream repo and a fork not yet connected stay green. An adopter who wants an approval before prod adds a required reviewer to the `prod` environment in GitHub's settings, with no code change.\n\nRests on: AGNT2, AGNT3\n\n## Seeding and the sign-in\n\nThe seed goes through the archive's own submit and publish path, the way any dataset arrives, never a copy into the bucket. The seed is the committed sample package (`examples/sample-package`, invented data under CC-BY-4.0, access `open`).\n\nThe sign-in is built once, as the shared module the Decision log fixes: a new uv workspace package `packages/client` (`archive-client`, import `archive_client`), standard library only. `archive_client.signin` holds `AuthConfig(region, cognito_domain, cli_client_id)`, `Tokens(access_token, id_token, expires_at)` with no refresh token, `sign_in(config, *, open_browser=webbrowser.open) -\u003e Tokens` (code with PKCE S256 and `state` through the existing `cli` app client, managed login in the browser, a one-shot listener on `localhost:8765`), and `SignInError`. The tokens stay in memory. Plan 9's CLI and MCP server import the same module and add `AuthConfig.from_archive(url)` later.\n\n`just seed \u003cstage\u003e` runs a small script that builds the `AuthConfig` from the stage's stack, signs in as the admin (the first sign-in sets their own password in the browser), and then:\n\n1. creates a submission for the sample package's files with `POST /api/submissions`, uploads each to its presigned URL, and submits it;\n2. follows `GET /api/submissions/{id}` until the submission leaves `checking`;\n3. approves it with `POST /api/submissions/{id}/decision` when it is `in-review` (a review policy that skips review publishes it with no decision);\n4. waits for `published`, then prints the dataset's URL.\n\nA submission that ends anywhere else (`needs-changes`, `rejected`, `failed`) stops the script with the status and its findings or events.\n\nRests on: DCSN1, AGNT7\n\n## The smoke test\n\n`just smoke \u003cstage\u003e` takes the site's domain from the stage's stack and checks, with no sign-in:\n\n- the site's `/` answers 200 with HTML;\n- `/api/health` answers `{\"status\": \"ok\"}`;\n- `/api/search?q=stream` lists `stream-temperature-sample`;\n- `/datasets/stream-temperature-sample` serves its page;\n- one open file of it downloads from `/data/stream-temperature-sample/\u003cversion\u003e/...` and its SHA-256 matches the manifest's hash.\n\nUntil the seed exists, the three dataset checks are skipped and say so, and the rest must pass. It exits non-zero on any failed check. CI runs it after every deploy, and the skill runs it after seeding. The submit path is proven once, by the seed, so CI holds no credentials for the archive.\n\nRests on: DCSN3\n\n## Update\n\nThe skill's update steps:\n\n1. Add the upstream remote (`schuettc/research-in-a-box`) if it is missing, and fetch it.\n2. Show what changed upstream since the fork's last merge (the commit list, and any change to `ArchiveConfig`'s settings).\n3. Merge upstream's `main` into the fork's `main`. A conflict in `archive.yaml` keeps the fork's values. A conflict anywhere else is shown to the adopter, who decides.\n4. Walk through any new setting the merge brought, as step 2 of the setup does.\n5. Run `just check`. On a failure it stops and pushes nothing.\n6. ✋ Push, and follow the CI run that deploys it.\n\nRests on: DCSN2\n\n## Teardown\n\n`just destroy \u003cstage\u003e` runs from the laptop, never in CI. The skill makes the adopter type the stage name, and says plainly that `prod` keeps its buckets and tables (they then hold the data and still bill for storage) while other stages delete everything. It runs `npx cdk destroy ResearchArchive-\u003cstage\u003e --force`, deletes the log group CDK's S3 auto-delete helper leaves behind (`/aws/lambda/ResearchArchive-\u003cstage\u003e-CustomS3AutoDeleteObjects*`, Plan 4's PARK12), and confirms the stack no longer exists. Removing `ResearchArchiveDeploy` and the GitHub environments is offered last, as its own ✋ step, only when no stage is left in that account.\n\nRests on: AGNT5\n\n## Risk and cost\n\n**Risk.** The deploy role is the riskiest piece: a trust that is too loose would let another repo deploy into the adopter's account. Its trust is pinned to the fork and its environments by a synth test, and it can only assume CDK's bootstrap roles. A bad commit on `main` deploys to `prod`, but only after the checks pass, `prod` retains its buckets and tables, and a revert deploys the fix the same way. A mistaken teardown is guarded by running only from the laptop with the stage name typed, and `prod` keeps its data even then. The seed publishes public data, so it asks first; until Plan 7's takedown exists, undoing it is by hand (delete the version's objects and catalog items, then reindex).\n\n**Cost.** New programs: `pip-audit` and `zizmor`, both run with `uvx`, nothing installed. AWS: the OIDC provider and role cost nothing. The user's steps: one walkthrough on a throwaway fork in an AWS account they choose, using a non-prod stage, where they answer the skill's stops, sign in once in the browser and approve the teardown.\n\nRests on: AGNT1, AGNT5\n\n## Left out\n\n- Running the reindex after a deploy so a template change reaches every page: waits on Plan 8's reindex that rewrites pages (PARK1).\n- CodeQL and cdk-nag (PARK2).\n- A one-click template, a custom domain, ORCID and university sign-in: Plan 4's follow-ups.\n- Signed-in smoke checks and a submit round trip on every deploy: they need credentials in CI or test data on `prod`.\n- A weekly upstream-sync workflow and GitHub's Sync fork button.\n- Plan 9's CLI and MCP use of `archive_client`, and `AuthConfig.from_archive`.\n\nRests on: DCSN2, DCSN3, AGNT3\n\n## How we'll know it works\n\n- `just check` and the new security job pass on this repo, and the deploy job skips with a notice because no environment has a deploy role.\n- A synth test shows `ResearchArchiveDeploy`'s role trusts only the fork's environments and may only assume the CDK bootstrap roles.\n- `archive_client.signin` has unit tests for the PKCE exchange and the one-shot listener, with the browser and Cognito's token endpoint faked.\n- On a throwaway fork in a real AWS account, with a non-prod stage, the skill runs end to end: it stops at each ✋ step, CI deploys the stage, the first admin is invited, `just seed` publishes the sample package after the admin signs in, and `just smoke` passes every check. `just destroy` then leaves no stack, bucket, table or helper log group for that stage.\n\nRests on: DCSN1, DCSN3, AGNT1, AGNT2, AGNT5\n"},"edited":"2026-11-14T00:54:36.632442-06:00"},"plans":[],"messages":[{"id":1,"card":"plan","from":"session","action":"note","text":"From Plan 4 (archive infrastructure): Court chose one stage, prod, by default (DCSN4). A dev stage is something an adopter adds as an entry in the config's infrastructure stages list, each with an optional account and region; the default app makes one stack per stage, ResearchArchive-\u003cstage\u003e. Plan 10a's brief assumes CI deploys to dev and prod, so its CI and deployment skill should handle a fork with prod only and add the dev deploy only when a dev stage is configured. Also from Plan 4: the config's infrastructure settings live in the Python ArchiveConfig, and the construct's props type is generated from its JSON Schema (DCSN2); reindex is started with just reindex \u003cstage\u003e (AGNT8).","at":"2026-11-13T15:09:22.672325-06:00","state":"answered","claim":"838a941334100589","sender":{"project":"personal","folder":"16413053007a"}},{"id":2,"card":"plan","from":"session","action":"note","text":"From the coordinating session for research-in-a-box. Court asked that every planning session know this. Muster alias: personal-personal/generic-package-format-and-contract (the name is left over from Plan 2; this session now coordinates all the plans).\n\n1. Send cross-plan questions here first: anything that touches another plan's interface, ownership or order, or the overall direction. Ask over muster or with diazo_note to this alias. Questions only Court can answer still go on your own page as decision cards.\n2. Send a one-line muster message here when your understanding is confirmed, your spec is printed, each plan is printed, and the build is done. I check each spec and plan for scope before Court approves it.\n3. Record anything other plans rely on in the Decision log of docs/planning-hand until it ends.\n5. ✋ **First admin.** It confirms the email address, then runs `just invite-user \u003cstage\u003e \u003cemail\u003e admin,curator,contributor`. Cognito emails a temporary password.\n6. ✋ **Seed.** It says the sample package becomes public data on their archive, then runs `just seed \u003cstage\u003e` (see Seeding).\n7. **Smoke test.** `just smoke \u003cstage\u003e` (see The smoke test). It reports each check.\n\nThe skill never runs `cdk deploy` itself. A stage in another account (an entry in `infrastructure.stages` with its own `account`) gets step 3 run once against that account.\n\nRests on: AGNT4, AGNT6, AGNT7\n\n## Connecting GitHub to AWS\n\nA small separate CDK stack, `ResearchArchiveDeploy`, lives in `packages/infra`. It holds GitHub's OIDC provider and one role whose trust allows only `repo:\u003cowner\u003e/\u003cname\u003e:environment:\u003cstage\u003e` for this fork's stages, and which may only assume the CDK bootstrap roles in its account (`cdk-*-deploy-role-*`, `cdk-*-file-publishing-role-*`, `cdk-*-image-publishing-role-*`, `cdk-*-lookup-role-*`). That is how CDK itself scopes a deploy, so the role holds no broad permissions.\n\nThe skill runs `cdk bootstrap` when the account and region have no `CDKToolkit` stack, deploys `ResearchArchiveDeploy` from the laptop, then creates one GitHub environment per stage and sets the role's ARN as the environment variable `AWS_DEPLOY_ROLE_ARN`, and the stage's region as `AWS_REGION`, with `gh api`. A synth test pins the trust to the repo and its environments and the role's permissions to the bootstrap roles.\n\nRests on: AGNT1\n\n## CI\n\n`ci.yml` keeps its two check jobs and gains:\n\n- **security**: `pip-audit` on the exported uv lock, `npm audit --audit-level=high`, and `zizmor` on `.github/workflows/`. It runs on every push and pull request beside the checks.\n- **deploy**: on a push to `main`, after the check and security jobs pass. It reads the stage list from `archive.yaml` through the contract and deploys one stage at a time in the order the file lists them, each waiting for the one before and stopping at the first failure. Each stage's job runs in the GitHub environment named for it, takes its credentials from `AWS_DEPLOY_ROLE_ARN` with `id-token: write`, runs `just lambda-assets` and `npx cdk deploy ResearchArchive-\u003cstage\u003e --require-approval never`, then `just smoke \u003cstage\u003e`.\n\nA prod-only fork deploys `prod` on every push to `main`. A fork that lists `dev` before `prod` gets `dev` first. A stage whose environment has no `AWS_DEPLOY_ROLE_ARN` is skipped with a notice and doesn't fail the run, so this upstream repo and a fork not yet connected stay green. An adopter who wants an approval before prod adds a required reviewer to the `prod` environment in GitHub's settings, with no code change.\n\nRests on: AGNT2, AGNT3\n\n## Seeding and the sign-in\n\nThe seed goes through the archive's own submit and publish path, the way any dataset arrives, never a copy into the bucket. The seed is the committed sample package (`examples/sample-package`, invented data under CC-BY-4.0, access `open`).\n\nThe sign-in is the shared module the Decision log fixes, `archive_client.signin` in `packages/client` (`archive-client`), which Plan 9's build is writing now on its own branch: `AuthConfig.from_archive(site_url)` reads the archive's `/auth-config.json` (written by Plan 8 at deploy), and `sign_in(config) -\u003e Tokens` signs in through the existing `cli` app client with PKCE in the browser and a one-shot listener on `localhost:8765`, keeping the one-hour tokens in memory and never the refresh token. This plan builds none of it: `just seed` imports it, and this plan's build of the seed waits on Plan 9's pull request merging.\n\n`just seed \u003cstage\u003e` runs a small script that takes the site's domain from the stage's stack, gets the `AuthConfig` with `AuthConfig.from_archive`, signs in as the admin (the first sign-in sets their own password in the browser), and then:\n\n1. creates a submission for the sample package's files with `POST /api/submissions`, uploads each to its presigned URL, and submits it;\n2. follows `GET /api/submissions/{id}` until the submission leaves `checking`;\n3. approves it with `POST /api/submissions/{id}/decision` when it is `in-review` (a review policy that skips review publishes it with no decision);\n4. waits for `published`, then prints the dataset's URL.\n\nA submission that ends anywhere else (`needs-changes`, `rejected`, `failed`) stops the script with the status and its findings or events.\n\nRests on: DCSN1, AGNT7\n\n## The smoke test\n\n`just smoke \u003cstage\u003e` takes the site's domain from the stage's stack and checks, with no sign-in:\n\n- the site's `/` answers 200 with HTML;\n- `/api/health` answers `{\"status\": \"ok\"}`;\n- `/api/search?q=stream` lists `stream-temperature-sample`;\n- `/datasets/stream-temperature-sample` serves its page;\n- one open file of it downloads from `/data/stream-temperature-sample/\u003cversion\u003e/...` and its SHA-256 matches the manifest's hash.\n\nUntil the seed exists, the three dataset checks are skipped and say so, and the rest must pass. It exits non-zero on any failed check. CI runs it after every deploy, and the skill runs it after seeding. The submit path is proven once, by the seed, so CI holds no credentials for the archive.\n\nRests on: DCSN3\n\n## Update\n\nThe skill's update steps:\n\n1. Add the upstream remote (`schuettc/research-in-a-box`) if it is missing, and fetch it.\n2. Show what changed upstream since the fork's last merge (the commit list, and any change to `ArchiveConfig`'s settings).\n3. Merge upstream's `main` into the fork's `main`. A conflict in `archive.yaml` keeps the fork's values. A conflict anywhere else is shown to the adopter, who decides.\n4. Walk through any new setting the merge brought, as step 2 of the setup does.\n5. Run `just check`. On a failure it stops and pushes nothing.\n6. ✋ Push, and follow the CI run that deploys it.\n\nRests on: DCSN2\n\n## Teardown\n\n`just destroy \u003cstage\u003e` runs from the laptop, never in CI. The skill makes the adopter type the stage name, and says plainly that `prod` keeps its buckets and tables (they then hold the data and still bill for storage) while other stages delete everything. It runs `npx cdk destroy ResearchArchive-\u003cstage\u003e --force`, deletes the log group CDK's S3 auto-delete helper leaves behind (`/aws/lambda/ResearchArchive-\u003cstage\u003e-CustomS3AutoDeleteObjects*`, Plan 4's PARK12), and confirms the stack no longer exists. Removing `ResearchArchiveDeploy` and the GitHub environments is offered last, as its own ✋ step, only when no stage is left in that account.\n\nRests on: AGNT5\n\n## Risk and cost\n\n**Risk.** The deploy role is the riskiest piece: a trust that is too loose would let another repo deploy into the adopter's account. Its trust is pinned to the fork and its environments by a synth test, and it can only assume CDK's bootstrap roles. A bad commit on `main` deploys to `prod`, but only after the checks pass, `prod` retains its buckets and tables, and a revert deploys the fix the same way. A mistaken teardown is guarded by running only from the laptop with the stage name typed, and `prod` keeps its data even then. The seed publishes public data, so it asks first; until Plan 7's takedown exists, undoing it is by hand (delete the version's objects and catalog items, then reindex).\n\n**Cost.** New programs: `pip-audit` and `zizmor`, both run with `uvx`, nothing installed. AWS: the OIDC provider and role cost nothing. The user's steps: one walkthrough on a throwaway fork in an AWS account they choose, using a non-prod stage, where they answer the skill's stops, sign in once in the browser and approve the teardown.\n\nRests on: AGNT1, AGNT5\n\n## Left out\n\n- Running the reindex after a deploy so a template change reaches every page: waits on Plan 8's reindex that rewrites pages (PARK1).\n- CodeQL and cdk-nag (PARK2).\n- A one-click template, a custom domain, ORCID and university sign-in: Plan 4's follow-ups.\n- Signed-in smoke checks and a submit round trip on every deploy: they need credentials in CI or test data on `prod`.\n- A weekly upstream-sync workflow and GitHub's Sync fork button.\n- `archive_client` itself: Plan 9 builds it, and this plan only imports it.\n\nRests on: DCSN2, DCSN3, AGNT3\n\n## How we'll know it works\n\n- `just check` and the new security job pass on this repo, and the deploy job skips with a notice because no environment has a deploy role.\n- A synth test shows `ResearchArchiveDeploy`'s role trusts only the fork's environments and may only assume the CDK bootstrap roles.\n- The seed script has unit tests for its submit, follow, approve and stop paths, with the API faked.\n- On a throwaway fork in a real AWS account, with a non-prod stage, the skill runs end to end: it stops at each ✋ step, CI deploys the stage, the first admin is invited, `just seed` publishes the sample package after the admin signs in, and `just smoke` passes every check. `just destroy` then leaves no stack, bucket, table or helper log group for that stage.\n\nRests on: DCSN1, DCSN3, AGNT1, AGNT2, AGNT5\n","plans":{},"wrapup":null,"readme":"\u003c!-- Written by diazo from decisions.json, spec.md and the plans; diazo rewrites it, so edit those instead. --\u003e\n\n# Deployment skill and CI (Plan 10a)\n\n`research-archive-in-a-box/deployment-skill-and-ci` · repo `research-archive-in-a-box`\n\n✓ Start → ✓ Understanding → ✓ Decisions → ✓ Spec → **Plans** → Build → Sign off\n\n## Pick up next\n\n- **PARK1 Page rollout by reindex:** Once Plan 8 makes the reindex rewrite every dataset page after its flip, rolling out a template change is just reindex \u0026lt;stage\u003e after a deploy. Add that to the skill's update step (and decide then whether CI runs it after each deploy, since a reindex wants publishing quiet). Agreed with the coordinating session (muster #960).\n- **PARK2 CodeQL and cdk-nag:** Add CodeQL or cdk-nag to CI's security job once a real finding shows the dependency audits and zizmor miss something.\n\n## What was asked\n\n\u003e can we start all of the plans as planned so we don't forget them and have a way to track them with their own sessions\n\u003e \n\u003e (Saved as planned: mark this plan Planned with diazo_update planned: true and wait for Start planning. Do no research until then. It waits on Plan 4, the archive infrastructure.)\n\u003e \n\u003e Brief: Plan 10a in docs/planning-handoff.md. Starter prompt from the handoff:\n\u003e \n\u003e \u003e Read `docs/planning-handoff.md`. Plan the deployment skill and CI (Plan 10a). The skill ships in the repo and is for the person running an archive, not for researchers. Plan its steps and the points where it must stop and ask.\n\n## Decisions\n\n- **DCSN1 How the seed signs in.** How should the skill sign in as the new admin to submit and approve the sample package on a real (prod) stage? The user chose A: Browser sign-in, built once as Plan 9's shared module.\n- **DCSN2 Upstream updates to a fork.** How should upstream changes to the kit reach an adopter's fork? The user chose A: The skill's update step merges upstream.\n- **DCSN3 What the smoke test covers.** What should just smoke \u0026lt;stage\u003e check after a deploy? The user chose A: Read-only checks, no sign-in.\n- **AGNT1 Deploy role stack.** A small separate CDK stack, ResearchArchiveDeploy, in packages/infra. It holds GitHub's OIDC provider and one role that trusts only this repo's GitHub environments and may assume only the CDK bootstrap roles. The skill deploys it from the laptop once per account, after cdk bootstrap if needed, and stores the role ARN as a repo variable. The user kept it.\n- **AGNT2 Deploy order and environments.** On every push to main once the checks pass, one job per stage in the order archive.yaml lists them, each waiting for the one before. Each job runs in a GitHub environment named for the stage, which is what the role's trust is scoped to. With no deploy-role variable set, the deploy job skips. The user kept it.\n- **AGNT3 Security checks.** Dependency audits (pip-audit on the exported uv lock, npm audit at high) and zizmor on the workflows, as one security job. The user kept it.\n- **AGNT4 Settings from the schema.** It reads ArchiveConfig's JSON Schema (packages/web/src/schema/archive-contract.schema.json) for each setting's name, default and description, and validates the written file with the contract's load_config. The user kept it.\n- **AGNT5 Teardown from the laptop.** A just destroy \u0026lt;stage\u003e recipe run from the laptop, never in CI. The skill makes the user type the stage name and says that prod keeps its buckets and tables. After cdk destroy it deletes the leftover log group of CDK's S3 auto-delete helper (Plan 4's PARK12) and confirms the stack is gone. The user kept it.\n- **AGNT6 Cost before deploy.** It names what bills while idle and what bills per use, and the monthly budget alarm already in the config. It gives no dollar figure, since none has been measured. The user kept it.\n- **AGNT7 First admin's groups.** admin, curator and contributor. just invite-user takes a comma-separated group list, so the skill runs just invite-user \u0026lt;stage\u003e \u0026lt;email\u003e admin,curator,contributor. The user kept it.\n\n## Spec\n\n- [Goal](spec.md#goal): rests on the understanding\n- [The deployment skill](spec.md#the-deployment-skill): rests on AGNT4, AGNT6, AGNT7\n- [Connecting GitHub to AWS](spec.md#connecting-github-to-aws): rests on AGNT1\n- [CI](spec.md#ci): rests on AGNT2, AGNT3\n- [Seeding and the sign-in](spec.md#seeding-and-the-sign-in): rests on DCSN1, AGNT7\n- [The smoke test](spec.md#the-smoke-test): rests on DCSN3\n- [Update](spec.md#update): rests on DCSN2\n- [Teardown](spec.md#teardown): rests on AGNT5\n- [Risk and cost](spec.md#risk-and-cost): rests on AGNT1, AGNT5\n- [Left out](spec.md#left-out): rests on DCSN2, DCSN3, AGNT3\n- [How we'll know it works](spec.md#how-well-know-it-works): rests on DCSN1, DCSN3, AGNT1, AGNT2, AGNT5\n\n## Plans\n\nNone yet.\n\n## Files\n\n| File | Written by | What it is |\n|---|---|---|\n| `README.md` | diazo | This summary: where it stands, what each file is, every decision and its answer. |\n| `record.html` | diazo | The whole record as one page that works offline. |\n| `decisions.json` | diazo | The full record, every thread. Names its schema. |\n| `spec.md` | the agent, header by diazo | The spec. |\n| `mockups/` | the agent and the user | Mockups (HTML) and the agent's pictures; the user's screenshots from before screenshots/. |\n| `diagrams/` | diazo | The drawn picture (SVG) of each mermaid diagram in the folder. |\n\n## Ids\n\nEvery card has an id: its prefix, then a number.\n\n- `DCSN`: a decision the user makes\n- `AGNT`: a call the agent made, which the user may reverse\n- `PRIN`: a principle\n- `PARK`: a follow-up, for later\n- `STEP`: a step only the user can do\n- `ASK`: an ask of someone other than the user\n- `PLAN`: a plan\n- `TASK`: a task of a plan\n\nThe full record is `decisions.json`; its schema is [schema/record.json](https://github.com/subaud-tools/diazo/blob/main/schema/record.json).\n","decisions":"# Deployment skill and CI (Plan 10a): decisions\n\n- **DCSN1 How the seed signs in.** How should the skill sign in as the new admin to submit and approve the sample package on a real (prod) stage? The user chose A: Browser sign-in, built once as Plan 9's shared module.\n- **DCSN2 Upstream updates to a fork.** How should upstream changes to the kit reach an adopter's fork? The user chose A: The skill's update step merges upstream.\n- **DCSN3 What the smoke test covers.** What should just smoke \u0026lt;stage\u003e check after a deploy? The user chose A: Read-only checks, no sign-in.\n- **AGNT1 Deploy role stack.** A small separate CDK stack, ResearchArchiveDeploy, in packages/infra. It
