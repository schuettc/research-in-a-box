<script type="application/json" id="dz-record">{"fv":{"id":"","path":"research-archive-in-a-box/docs/specs/2026-11-12-generic-package-format-and-contract","key":"research-archive-in-a-box/generic-package-format-and-contract","record":{"schema":4,"title":"Package format and contract (Plan 2)","expect":7,"agent_at":"2026-11-14T03:15:33.792207Z","start":{"opening":{"text":"i think we got started incorrectly here.\n\nthe goal here is to build a research in abox.  we'll use the FEMC data as an example, but we want to build this generically.  once we have the correct format, we can work on a process to migrate FEMC data\n\n[...]\n\nyes, let's do that.  we can delete that plan 2 and restart fresh\n\n(Brief: Plan 2 in docs/planning-handoff.md, revised 2026-11-12 to be generic first. Read the handoff, including the Decision log, before continuing.)"},"findings":[{"text":"Frictionless Data Package v2 requires only resources at package level. Name, id, licenses, title, description, version, created, keywords, contributors and sources are all optional. Extra properties are allowed.","source":"https://datapackage.org/standard/data-package/","cases":"1 standard"},{"text":"A Frictionless v2 resource requires a name plus either path or inline data. Its type is only table or unspecified (a plain file). A path array means one resource split across several files, not a set of sidecar files.","source":"https://datapackage.org/standard/data-resource/","output":"path or data [required] ... sometimes it can be convenient to have a single resource whose data is split across multiple files","cases":"1 standard"},{"text":"Frictionless v2 Table Schema already has field categories (code lists inline), missingValues, primaryKey, uniqueKeys and foreignKeys, and geopoint and geojson field types. A foreign key to another resource in the package is a standard way to point a column at a code-list table.","source":"https://datapackage.org/standard/table-schema/","cases":"1 standard"},{"text":"DataCite 4.6 has six mandatory properties: Identifier, Creator, Title, Publisher, PublicationYear and ResourceType. The recommended ones are Subject, Contributor, Date, RelatedIdentifier, Description (Abstract above all) and GeoLocation.","source":"https://datacite-metadata-schema.readthedocs.io/en/4.6/properties/overview/","output":"Table 1: 1 Identifier · 2 Creator · 3 Title · 4 Publisher · 5 PublicationYear · 10 ResourceType","cases":"1 standard"},{"text":"Google Dataset Search requires a schema.org Dataset name and a description of 50 to 5000 characters. Everything else (creator, license, temporalCoverage, spatialCoverage, distribution, identifier, funder) is recommended.","source":"https://developers.google.com/search/docs/appearance/structured-data/dataset","output":"Required properties: description (between 50 and 5000 characters long) · name","cases":"1 standard"},{"text":"Google counts as datasets: a table, a collection of tables, a file in a proprietary format, a collection of files that together make a dataset, and images capturing data.","source":"https://developers.google.com/search/docs/appearance/structured-data/dataset","cases":"1 standard"},{"text":"Plan 1 is settled: the repo is research-in-a-box, one repo with a uv workspace. The contract lives at packages/contract as its own package, archive-contract (import archive_contract); packages/tool (command cruise) and packages/backend depend on it. Nothing is published to PyPI: the contract is used through uv workspace sources, and cruise installs from the git repo. The generated JSON Schema is committed under packages/web/ and checked for drift by just check in CI. Tooling: Python \u003e=3.12, ruff, mypy strict with the Pydantic plugin, pytest, hatchling. The sample package belongs to Plan 2.","source":"diazo notes from Plan 1 (folder d65ecf18be29), 2026-11-12","cases":"1"},{"text":"FEMC's six practice datasets cover a table, a very wide table, a multi-file shapefile set shipped with CSV and XLSX copies, code lists, and a record whose data lives elsewhere. They serve as the test set once the format exists, not as its source.","source":"practice-data/femc/SOURCES.md and docs/planning-handoff.md","cases":"6 datasets"},{"text":"Zenodo makes a new version only when a record's files change, and edits metadata in place.","source":"https://help.zenodo.org/docs/deposit/manage-versions/","output":"Versioning is used when you have updated the files of your published record. If you just need to edit metadata (title, creators, description etc) then see Edit published records","cases":"1 repository"}],"rounds":[{"take":"Start the format from two generic sources instead of from any one archive.\n\n**1. Core fields come from what the exports require.** The kit must produce DataCite, schema.org and EML from the manifest, so a package is publishable only when those exports can be filled. Taking the union of their required fields gives a small, defensible core:\n\n- title (DataCite, Google)\n- description of at least 50 characters (Google)\n- at least one creator (DataCite)\n- rights: a license, or a recorded rights status (needed for any reuse)\n- at least one described resource (Frictionless)\n\nThe archive fills in publisher, publication year, identifier and resource type at publish, from its config. The *recommended* tier is DataCite's and Google's recommended lists: keywords, contributors, temporal and spatial coverage, related identifiers, funding and methods. Profiles such as ecology promote some recommended fields to required and add domain checks.\n\n**2. Resource kinds come from the shapes research data arrives in.** Frictionless only knows table and plain file. A small archive receives at least:\n\n- tables (CSV now, Parquet later)\n- spatial data, vector or raster, often several files that only work together\n- documents (methods, protocols, field sheets)\n- images and other media\n- other files in a domain format\n- data held elsewhere, linked rather than stored\n\nplus cross-cutting needs: code lists, which Frictionless can already point to with a foreign key to a small table in the package; the same data in several formats; and coverage that is still ongoing.\n\n**3. A committed sample package covers every kind.** It's an invented dataset with a clear license, with known gaps seeded in, so later plans test against it. Only then do we write each FEMC practice dataset down in the format, as a test.","visuals":[{"kind":"table","caption":"Which standard requires which field","table":{"columns":["Field","Frictionless v2","DataCite 4.6","Google (schema.org)","Core?"],"rows":[["Title / name","optional","mandatory","required","yes"],["Description","optional","recommended (abstract)","required, 50 to 5000 chars","yes"],["Creator","optional (contributors)","mandatory","recommended","yes"],["Publisher","-","mandatory","-","set by the archive"],["Publication year","-","mandatory","-","set at publish"],["Identifier","optional (id)","mandatory","recommended","set at publish"],["Resource type","-","mandatory","-","always Dataset"],["License / rights","optional","optional","recommended","yes, as license or rights status"],["Resources","required","-","recommended (distribution)","yes"],["Keywords / subjects","optional","recommended","recommended","recommended"],["Temporal coverage","-","recommended (Date)","recommended","recommended"],["Spatial coverage","-","recommended (GeoLocation)","recommended","recommended"],["Funding","-","optional","recommended","recommended"]],"sample":"3 standards"}}],"recommendation":"Define the core as the union of the export standards' required fields, define resource kinds from the generic shapes above, build the sample package to cover them, and use FEMC's six datasets only as the test afterwards."}],"done":[{"text":"Deleted the first Plan 2 folder, which had derived the format from FEMC's datasets; its FEMC findings were copied into the handoff first","ref":"docs/specs/2026-11-12-package-format-and-contract (removed)"},{"text":"Corrected the handoff: FEMC is an example, not the source; FEMC migration (Plan 5) moves after Plans 2 and 3; standard EML only in Plan 2; the sample package moves from Plan 1 to Plan 2; Plan 2 and 3 starter prompts no longer start from FEMC","ref":"docs/planning-handoff.md"},{"text":"Sent Plan 1 a note asking it to drop AGNT8 (the sample package moves to Plan 2) and flagging ecology-flavoured name candidates","ref":"diazo folder d65ecf18be29"}],"direction":{"round":1,"at":"2026-11-12T23:23:34.221051-06:00","by":"user"}},"understanding":{"points":[{"kind":"outcome","text":"A written package spec and a Python contract package, archive-contract (import archive_contract) at packages/contract, that the local tool and the backend import. It is designed from Frictionless Data Package v2, EML, DataCite and schema.org and from what any research group needs, not from FEMC.","source":"said"},{"kind":"outcome","text":"The core required fields are the union of what the exports require: title, a description of at least 50 characters, at least one creator, rights (a license or a recorded rights status) and at least one described resource. The archive fills in publisher, publication year, identifier and resource type at publish. A recommended tier follows DataCite's and Google's recommended lists, and profiles (core and ecology first) promote fields and add domain checks.","source":"said"},{"kind":"outcome","text":"Resource kinds cover the shapes a small archive receives: tables, vector and raster spatial data (often several files that only work together), documents, images and media, other files, and data held elsewhere. The format also holds code lists, the same data in several formats, and coverage that is still ongoing.","source":"said"},{"kind":"outcome","text":"Pydantic models for the manifest, profiles, the archive config file, the project record, the change log (changes.jsonl) and the findings format. A JSON Schema is generated from them and committed under packages/web/, checked for drift by just check.","source":"said"},{"kind":"outcome","text":"Standard EML import and export, plus schema.org and DataCite export generated from the manifest. Nobody edits those by hand.","source":"said"},{"kind":"outcome","text":"A committed sample package: a small invented dataset with a clear license, covering every resource kind, with known gaps seeded in so Plan 3's rules have predictable findings.","source":"said"},{"kind":"constraint","text":"Nothing in the core is specific to FEMC or to ecology. FEMC's six practice datasets are the test afterwards, written down in the format on paper.","source":"said"},{"kind":"constraint","text":"Every package is a valid Frictionless v2 Data Package. Standard properties are left out when unknown, never null. Our additions sit under the archive: prefix and may be null.","source":"said"},{"kind":"constraint","text":"Compatibility is tested against the frictionless library, which is not a run-time dependency.","source":"said"},{"kind":"constraint","text":"CSV first, with Parquet easy to add later: columns are described by logical type, and a resource's format is the only place the file type appears.","source":"said"},{"kind":"constraint","text":"Plan 1's conventions: Python 3.12 or later, ruff, mypy strict with the Pydantic plugin, pytest, hatchling. Nothing is published to PyPI: archive-contract is used through uv workspace sources, and cruise installs from the git repo.","source":"said"},{"kind":"constraint","text":"Out of scope: the quality rules themselves (Plan 3), tolerating FEMC's EML quirks (Plan 5), storage and the API (Plans 4 and 6).","source":"said"},{"kind":"success","text":"The spec is written, the sample package expresses every resource kind, each of the six FEMC practice datasets can be written in the format on paper, and the model list and module layout are agreed.","source":"said"},{"kind":"success","text":"The sample package passes the frictionless library's validation and our own structural validation, its EML export imports back to the same manifest fields, and just check passes with the JSON Schema committed.","source":"assumed"}],"confirmed":true},"decisions":[{"id":"DCSN1","name":"Packages without a license","question":"What does a package need on rights before the pipeline will publish it?","example":"A lab packages a field season's data with the local tool before its PI has chosen a license, so the package says 'undetermined'. Another group reuses an agency's data whose terms are set by the agency, not an open license. A third holds data under 'all rights reserved'. Which of these can the pipeline publish?","options":[{"id":"A","title":"Publish needs a license or a stated rights status","includes":"The local tool can package with rights 'undetermined', and the audit reports it. The pipeline refuses to publish until there is a license, or a stated status with its statement: public domain, third party sets the license (with where), or all rights reserved.","pulls_in":"A rights-status vocabulary in the contract, and a publish check in Plan 7. Anything with unknown rights waits unpublished until someone records them."},{"id":"B","title":"Publish the record without its files","includes":"As A, except a package with rights 'undetermined' can still be published as description-only. The record is findable and citable, and its files are withheld until rights are recorded.","pulls_in":"The same vocabulary, plus a rule that 'undetermined' forces the description-only level, which Plans 7 and 8 have to show."},{"id":"D","title":"Publish needs a real license, nothing else","includes":"Only a license (an SPDX id or a license URL) passes the publish check. Third-party and all-rights-reserved statements don't count.","pulls_in":"A simpler check. Data reused under another body's terms, or held under restrictive terms, can't be published until an open license is attached."},{"id":"C","title":"Refuse it at packaging","includes":"A package with no license and no stated rights is not a valid package at all.","pulls_in":"The local tool can't package data until its license is settled, so a group can't clean or audit its data first, which is when the gap is usually found."}],"recommendation":{"option":"A","why":"No published package has unknown rights, which is what your earlier note asked for. A stated status still lets a group publish data whose terms are real but are not an open license, which D would shut out. The standards treat rights as a statement, not only a license: DataCite's Rights property takes free text with an optional URI and identifier, and neither Frictionless nor DataCite makes it mandatory.","evidence":[{"text":"DataCite Rights is property 16, among the recommended and optional properties, not the mandatory six","source":"https://datacite-metadata-schema.readthedocs.io/en/4.6/properties/overview/","output":"Table 1: 1 Identifier · 2 Creator · 3 Title · 4 Publisher · 5 PublicationYear · 10 ResourceType"},{"text":"Frictionless v2 licenses is optional at package level","source":"https://datapackage.org/standard/data-package/"}]},"state":"decided","choice":"A","revisions":[{"at":"2026-11-12T23:33:11.9569-06:00","text":"Revised after your note: the pipeline requires rights to publish in every option. A now names a license or stated rights status as the requirement and is recommended. Added D, license only.","because":"note:DCSN1"},{"at":"2026-11-12T23:34:26.301193-06:00","text":"Revised after your note on the whole plan: generic examples and reasons only, recommendation unchanged.","because":"note:plan"}]},{"id":"DCSN2","name":"Column names","question":"Do tidy tables keep the source's column names, or rename them to a house style?","example":"A lab's spreadsheet has columns 'Temp (°C)', 'Site #' and 'DO mg/L'. Renaming them to temp_c, site_id and do_mg_l reads better, but the lab's own scripts, their older files and any EML that describes the columns all use the original names.","options":[{"id":"A","title":"Always keep the source names","includes":"The column name in data/ is the source name. Frictionless's title field holds a readable label, and description holds the definition.","pulls_in":"Nothing new in the format. Awkward names stay in the data."},{"id":"B","title":"Always rename to a house style","includes":"Every column is renamed to lower snake_case in data/, and the source name is kept in archive:sourceName.","pulls_in":"A naming rule in the contract and a rename on every import. Every EML round trip maps names both ways, and the group sees names that differ from their own files and scripts."},{"id":"C","title":"Keep by default, rename as a recorded change","includes":"Source names are kept, as in A. The local tool may propose a rename, which the person accepts and which is recorded in changes.jsonl with archive:sourceName on the field.","pulls_in":"archive:sourceName as an optional field property, and a rename change type agreed with Plan 3."}],"recommendation":{"option":"C","why":"Keeping names preserves the link to the originals, to the group's own code, and to any metadata that describes the columns by name. Frictionless already separates name from title, so a readable label costs nothing. C still lets a person fix a truly unusable name, with the change on record.","evidence":[{"text":"Frictionless fields carry name, title and description separately","source":"https://datapackage.org/standard/table-schema/"},{"text":"EML describes each column by attributeName, matched to the column header","source":"https://eml.ecoinformatics.org/schema/eml-attribute_xsd.html"}]},"state":"decided","choice":"C","revisions":[{"at":"2026-11-12T23:34:26.301193-06:00","text":"Revised after your note on the whole plan: generic examples and reasons only, recommendation unchanged.","because":"note:plan"}]},{"id":"DCSN3","name":"Where code lists live","question":"Where does a package keep the list of what each code in a column means?","example":"A vegetation survey records damage in three columns, damage_1, damage_2 and damage_3, which all use the same 12-code list. The same survey has a species column holding numeric codes that nobody ever wrote down.","options":[{"id":"A","title":"Inline on each column","includes":"Frictionless categories on the field, with value and label for each code.","pulls_in":"A shared list is copied onto every column that uses it (three copies in the example). Long lists bloat the manifest."},{"id":"B","title":"A small code-list table, linked by foreign key","includes":"Each list is a CSV resource under data/codes/ with code, label and description columns. Columns point at it with a Frictionless foreign key, so one list serves many columns.","pulls_in":"Code-list tables count as table resources. EML export writes them as enumerated domains. Frictionless validation checks every code is in its list."},{"id":"C","title":"Both, by size","includes":"Inline categories for a short list used by one column, a table for long or shared lists.","pulls_in":"Two ways to read a code list everywhere: the tool, the exports, the web app's column dictionary."}],"recommendation":{"option":"B","why":"One way to hold code lists, it shares a list across columns, and Frictionless already validates it. In every option, a column that holds codes with no list is marked archive:codeList: \"undocumented\", so Plan 3's rule can find it.","evidence":[{"text":"Frictionless v2 foreign keys can point a column at another resource in the package","source":"https://datapackage.org/standard/table-schema/"},{"text":"EML holds a code list as an enumeratedDomain on a nominal attribute","source":"https://eml.ecoinformatics.org/schema/eml-attribute_xsd.html"}]},"state":"decided","choice":"B","revisions":[{"at":"2026-11-12T23:34:26.301193-06:00","text":"Revised after your note on the whole plan: generic examples and reasons only, recommendation unchanged.","because":"note:plan"}]},{"id":"DCSN4","name":"Version numbers","question":"What makes a new version of a package, and how are versions numbered?","example":"A curator fixes a typo in a published dataset's description, and a month later the lab adds a year of new rows. Is each of those a new version that people can cite separately?","options":[{"id":"A","title":"Every change is a new version","includes":"Versions 1, 2, 3, and any change to data or metadata makes the next one.","pulls_in":"A typo fix mints a new version and, with DOIs on, a new DOI."},{"id":"B","title":"File changes make a version, metadata edits in place","includes":"Versions 1, 2, 3. Changing, adding or removing a file makes the next version. Metadata edits update the current version, and each edit is recorded in its history. The package keeps one stable id across versions.","pulls_in":"A metadata edit history in the manifest. Each version gets its own DOI when DOIs are on."},{"id":"C","title":"Semantic versions","includes":"major.minor.patch: a schema change is major, appended rows are minor, metadata is patch.","pulls_in":"Rules to classify every change, and arguments over edge cases. Citations look like software versions."}],"recommendation":{"option":"B","why":"A citation should guarantee the files did not change, and that is what B protects. Metadata fixes stay cheap. This is Zenodo's model, which researchers already know.","evidence":[{"text":"Zenodo makes a new version only when files change, and edits metadata in place","source":"https://help.zenodo.org/docs/deposit/manage-versions/","output":"Versioning is used when you have updated the files of your published record. If you just need to edit metadata (title, creators, description etc) then see Edit published records"}]},"state":"decided","choice":"B","revisions":[{"at":"2026-11-12T23:34:26.301193-06:00","text":"Revised after your note on the whole plan: checked it rests only on general practice; unchanged.","because":"note:plan"}]},{"id":"DCSN5","name":"Projects and their packages","question":"How does a project record relate to the packages under it?","example":"A long-running monitoring program publishes one dataset a year. Each dataset should show the program's name and purpose, and when the program's description is updated, every dataset should show the new one.","options":[{"id":"A","title":"Its own small record, packages point to it","includes":"A project.json with id, title, abstract, people and links, stored on its own. Each package names it with archive:project: \u003cid\u003e.","pulls_in":"A Project model in the contract, and a projects area in storage (Plan 4). A package's README and exports look up the project's title."},{"id":"B","title":"Copied into each package","includes":"Every package carries the project's title and abstract.","pulls_in":"Nothing new to store. Copies drift, and updating a project means editing every package."},{"id":"C","title":"A folder that holds its packages","includes":"A project folder with packages nested inside it.","pulls_in":"Moving a package between projects moves files. A package can't stand alone, which breaks 'a package is a plain folder'."}],"recommendation":{"option":"A","why":"One copy of the project, and packages stay self-contained folders. It matches how the exports already model it: DataCite links a dataset to its parent with a related identifier of type IsPartOf, and EML has its own project element.","evidence":[{"text":"DataCite relates a dataset to a larger whole with relationType IsPartOf","source":"https://datacite-metadata-schema.readthedocs.io/en/4.6/properties/relatedidentifier/"},{"text":"EML describes the research project as its own project element","source":"https://eml.ecoinformatics.org/schema/eml-project_xsd.html"}]},"state":"decided","choice":"A","revisions":[{"at":"2026-11-12T23:34:26.301193-06:00","text":"Revised after your note on the whole plan: generic examples and reasons only, recommendation unchanged.","because":"note:plan"}]},{"id":"DCSN6","name":"Multi-file resources","question":"How does a package describe something made of several files that only work together, such as a shapefile set?","example":"A shapefile layer of study plots is a .shp file plus .shx, .dbf and .prj files. None of them is usable alone, and Frictionless has no notion of sidecar files.","options":[{"id":"A","title":"One resource, member files listed","includes":"One resource with path pointing at the main file (.shp), archive:kind set to vector, and archive:files listing every member file with its size and hash.","pulls_in":"A member-file list in the resource model. Checksums, previews and the web app's file list read it."},{"id":"B","title":"Zip the set into one file","includes":"One plain file resource, a .zip.","pulls_in":"The contents can't be checked, previewed or given a spatial extent without unzipping."},{"id":"C","title":"One resource per file, grouped","includes":"Each file is its own resource, tied together by archive:group.","pulls_in":"Four resources for one layer. Every consumer has to regroup them, and a lone .dbf looks like a table."}],"recommendation":{"option":"A","why":"One resource per thing a person uses, with every file still checksummed. Frictionless's path array means one dataset split across files, not sidecars, so it doesn't fit, and A stays valid Frictionless because path names a real file. Google already counts a set of files that together make a dataset as one dataset.","evidence":[{"text":"A Frictionless path array is one resource split across several files","source":"https://datapackage.org/standard/data-resource/","output":"sometimes it can be convenient to have a single resource whose data is split across multiple files"},{"text":"Google counts a collection of files that together make a dataset","source":"https://developers.google.com/search/docs/appearance/structured-data/dataset"}]},"state":"decided","choice":"A","revisions":[{"at":"2026-11-12T23:34:26.301193-06:00","text":"Revised after your note on the whole plan: generic examples and reasons only, recommendation unchanged.","because":"note:plan"}]},{"id":"DCSN7","name":"Gaps the paper test found","question":"The paper test found eight things the format can't express. Which do we add to the format now?","example":"A column of air temperatures says 12.4 but nowhere says °C or °F, so the EML export writes the unit as `unknown`. The eight: (1) a start date with no known end, (2) units, (3) the source's preferred citation, (4) purpose separate from the description, (5) project keywords, (6) measurement scale (nominal, ordinal, interval, ratio), (7) how columns relate (a value and its uncertainty or flag), (8) a table inside another resource (a shapefile's attribute table).","options":[{"id":"A","title":"Add the six small ones now","includes":"Gaps 1 to 6, each one optional field: `end: \"unknown\"` on temporal coverage; `archive:unit` and `archive:measurementScale` (nominal, ordinal, interval, ratio, dateTime: EML's list) on a field; `archive:citation` and `archive:purpose` on the package; `keywords` on the project. The exports write each where its standard has a place. Gaps 7 and 8 become follow-ups.","pulls_in":"A PLAN3 of about two tasks: the fields with their exports and tests, and the paper test updated. One new spec section, reprinted for your approval."},{"id":"B","title":"Add all eight","includes":"As A, plus: `archive:ancillaryOf: {field, role}` on a column that qualifies another, with role uncertainty, detection-limit or quality-flag (the idea of the CF conventions' ancillary_variables), shown in the README and EML's attribute definition; and `archive:attributes`, a Table Schema on a vector resource for its attribute table, written as EML's spatialVector attributeList and checked by the validator against the .dbf columns.","pulls_in":"A PLAN3 of about three tasks. Related columns have no standard form in Frictionless or DataCite, so ours is our own convention; the attribute-table check reads .dbf headers, which the sample's pyshp already writes."},{"id":"D","title":"Hand them to Plans 3 and 5","includes":"The format stays as built. A note goes to Plan 3 (units, measurement scale: rules it may want) and to Plan 5 (all eight, since converting FEMC is where they show up). Those plans bring a contract change back when they need one.","pulls_in":"Nothing now. The contract changes later, while Plans 3, 5 and 8 may already be reading it."},{"id":"C","title":"Not yet: all eight as follow-ups","includes":"The format stays as built; the eight gaps are recorded here for later, with no notes sent.","pulls_in":"Nothing now. Every EML export keeps writing `unknown` units, and imported citations and purposes are dropped."}],"recommendation":{"option":"B","why":"With concrete designs, gaps 7 and 8 are about one more task, not open design work, and closing all eight now means Plan 5 converts FEMC's records into a format that can hold everything the paper test found. Each is optional, so nothing already built breaks.","evidence":[{"text":"The nine other planning folders have no rounds and no decisions yet","source":"decisions.json in docs/specs/2026-11-13-*","output":"rounds 0 decisions 0 spec False (9 of 9 folders)"},{"text":"EML's measurement scales and spatial vectors with their own attribute lists","source":"https://eml.ecoinformatics.org/schema/eml-attribute_xsd.html and https://eml.ecoinformatics.org/schema/eml-spatialvector_xsd.html"},{"text":"The paper test's list, each gap with the datasets that showed it","source":"documents/femc-paper-test.md (merged in #3)","output":"start with no known end (3 datasets), units (2), column relationships (1), measurement scale (2), table inside another resource (1), preferred citation (5 of 6), project keywords (4 projects), purpose (4)"}]},"state":"decided","choice":"B","revisions":[{"at":"2026-11-13T11:24:47.060817-06:00","text":"Revised after your note: added D, handing the gaps to Plans 3 and 5 by note instead of changing the format now.","because":"note:DCSN7"},{"at":"2026-11-13T11:32:36.915755-06:00","text":"Revised after your note: measurement scale moved into A (it's one field matching EML's list), and B now gives concrete designs for related columns and a shapefile's attribute table.","because":"note:DCSN7"}]}],"calls":[{"id":"AGNT1","name":"Resource kinds vocabulary","question":"What values does archive:kind take?","took":"table, vector, raster, document, media, file and linked. Code-list tables are tables. A resource with no kind is read as file.","instead":"A longer list (separate image, audio, video, notebook) or fewer kinds, with the rest left to mediatype.","why":"It matches Round 1's shapes one to one, and mediatype already says the exact type.","state":"standing"},{"id":"AGNT2","name":"Same data, several formats","question":"How is a copy of the same data in another format marked?","took":"The copy is its own resource with archive:alternateOf: \u003cname of the primary resource\u003e. Only the primary carries the schema.","instead":"Treat each copy as an independent resource with its own schema.","why":"Groups often ship one table as CSV and XLSX, or one layer as a shapefile and a CSV. One schema avoids the descriptions drifting apart.","state":"standing"},{"id":"AGNT3","name":"Linked resources","question":"How is data held elsewhere described?","took":"A resource with archive:kind linked whose path is the remote URL (allowed by Frictionless), with no hash or bytes. Compatibility tests run frictionless with remote fetching off.","instead":"Keep the URL only in an archive: property with no path, which is not valid Frictionless.","why":"It stays valid Frictionless, and the location of data held on GitHub, an agency server or another repository is a real field, not buried in a citation or a description.","state":"standing"},{"id":"AGNT4","name":"Access levels per package","question":"Where is the access level set, and what values does it take?","took":"One level per package: open, restricted, by-request or description-only. Unpublished is a state of the package, not an access level.","instead":"A level per resource, for example open tables with restricted precise locations.","why":"Repositories such as Zenodo set access per record, and a per-resource override can be added later without breaking packages. Precise locations are already handled by the column sensitivity flag.","state":"standing"},{"id":"AGNT5","name":"Column sensitivity flags","question":"What does a per-column sensitivity flag look like?","took":"archive:sensitivity on a field, one of personal, sensitive-location or confidential. No flag means not sensitive.","instead":"A free-text note, or a numeric level.","why":"Three named reasons map to what a curator does about each: remove people, coarsen locations, restrict access.","state":"standing"},{"id":"AGNT6","name":"Profiles as data files","question":"How is a profile defined?","took":"As a data file in the contract (YAML, read into a Pydantic Profile model) listing the fields it promotes to required, its vocabularies and the ids of the rules it switches on. Rule code lives in Plan 3.","instead":"Profiles as Python classes with their own validators.","why":"An adopter can read and copy a profile without writing code, and it keeps checks in one place, the rules engine.","state":"standing"},{"id":"AGNT7","name":"EML versions","question":"Which EML versions are imported and exported?","took":"Export EML 2.2.0. Import standard EML 2.1.1 and 2.2.0.","instead":"Export 2.1.1 as well, for archives whose tools only read the older version.","why":"2.2.0 is the current release. Many existing archives still hold 2.1.1 records, so import has to read it.","state":"standing"},{"id":"AGNT8","name":"Legacy identifiers as a list","question":"How are a dataset's older identifiers stored?","took":"archive:legacyIdentifiers as a list of {scheme, value}, such as {scheme: eml-package-id, value: knb-lter-xyz.12.3}.","instead":"A fixed set of named keys for the identifier kinds we know today.","why":"Every archive has its own identifier kinds (package ids, internal table names, page codes, accession numbers). A list holds any of them without changing the contract.","state":"standing"},{"id":"AGNT9","name":"Sample package subject","question":"What is the invented sample dataset about?","took":"A small stream temperature study at invented sites, licensed CC-BY-4.0. It has a logger table with a code-list table, a site shapefile set, a small raster, a methods document, a site photo, the table again as XLSX, a linked resource and ongoing coverage. Its seeded gaps are listed in its README.","instead":"A non-field subject, such as a survey of people or a lab assay.","why":"It exercises every resource kind and both the core and ecology profiles, while staying small enough to commit.","state":"standing"},{"id":"AGNT10","name":"Change log and findings shapes","question":"Where are the change log and findings formats defined, and who confirms them?","took":"The contract defines both models (Change and Finding), drafted in this spec. Plan 3 has no planning folder yet, so it confirms or changes them when its session starts, and this folder sends it a diazo note then. A change from Plan 3 is an edit to the contract, not a reopened decision here.","instead":"Hold this spec until Plan 3 is planned far enough to agree the shapes first.","why":"Both are stored in the package and read by the backend and the web app, so they belong with the contract. Waiting on a plan that hasn't started would stall Plans 4 and 6, which need the rest of the format.","state":"standing"},{"id":"AGNT11","name":"Contract module layout","question":"How is archive_contract laid out?","took":"One module per record under `src/archive_contract/`: `manifest.py` (package and its archive: additions), `resources.py`, `fields.py`, `rights.py`, `project.py`, `changes.py`, `findings.py`, `profile.py`, `config.py`; `profiles/core.yaml` and `profiles/ecology.yaml`; `validate.py` (structural validation); `schema.py` (JSON Schema generation, from Plan 1); `exports/` (`eml.py`, `datacite.py`, `schemaorg.py`, `readme.py`); `imports/eml.py`.","instead":"A flat models.py with everything in one file, splitting later.","why":"Plans 3, 4, 6 and 7 each import a different slice; separate modules keep those imports narrow, and exports and imports are the code that grows.","state":"standing"},{"id":"AGNT12","name":"Branch from local main","question":"Which commit does the build branch start from?","took":"The local main at 7789d37: origin/main plus one commit of planning records, which the PR then carries.","instead":"Branch from origin/main and push the records commit to main separately.","why":"The records commit only touches docs/ and needs a PR anyway; one PR carries both.","state":"standing"},{"id":"AGNT13","name":"Drop the DataCite schema","question":"How is the DataCite export checked, given the only JSON Schema has no licence and isn't official?","took":"Remove the vendored DataCite JSON Schema. A test checks DataCite 4.x's mandatory properties and their shapes instead; Plan 7 confirms real acceptance when it mints test DOIs through DataCite's API.","instead":"Keep the unofficial, unlicensed schema as a test fixture.","why":"Its repo grants no licence and its README says it isn't official, so passing it proves little and redistributing it isn't clearly allowed.","state":"standing"},{"id":"AGNT14","name":"Only DataCite refuses rights","question":"Should the EML and schema.org exports refuse a package with undetermined or missing rights, as DataCite does?","took":"No: only DataCite refuses, as the plan says. EML and schema.org also serve previews and hand-offs before publishing; Plan 7's publish check is where unpublishable rights are stopped.","instead":"All three publication exports refuse, and only the README stays permissive.","why":"Refusing in every export would block previewing an unpublished package's metadata, which is when the rights gap gets found and fixed.","state":"standing"}],"principles":[{"id":"PRIN1","text":"FEMC is only the test afterwards. It is never the example on a card or the reason for a design choice; examples and reasons come from the standards and from any research group's data.","from":"note:plan","struck":false}],"follow_ups":[{"id":"PARK1","name":"Protect main, allow auto-merge","text":"main has no branch protection and auto-merge is off for the repo: PR #1 merged before CI ran, and PR #2 had to be merged by hand after CI. Require the python and typescript checks on main and turn on auto-merge in the repo settings.","kind":"improvement"},{"id":"PARK2","name":"EML code label delimiter","text":"The EML export writes a code's definition as 'label: description' and the import splits on ': ', so a label containing ': ' changes meaning on round trip. Pick an unambiguous encoding.","kind":"bug"},{"id":"PARK3","name":"schema.org rights statuses","text":"The schema.org export reads only licenses and ignores archive:rightsStatus (public-domain, third-party, all-rights-reserved). Map statuses where schema.org has a form.","kind":"improvement"},{"id":"PARK4","name":"EML keyword descriptor losses","text":"The EML import reads descriptorValue from a project descriptor named keywords but doesn't list the descriptor's other contents (citation, classification) as skipped.","kind":"improvement"}],"spec":{"hash":"ae37f7aaefa571fa594832c66fe67e61bf5c01ea3a2c3f4a98e22de6eadd7f47","sections":[{"id":"SPEC1","heading":"Goal","decisions":[]},{"id":"SPEC2","heading":"The package folder","decisions":["AGNT1","AGNT11"]},{"id":"SPEC3","heading":"The manifest's fields","decisions":["AGNT8"]},{"id":"SPEC4","heading":"Rights","decisions":["DCSN1"]},{"id":"SPEC5","heading":"Resources and their kinds","decisions":["AGNT1","AGNT2","AGNT3","DCSN6"]},{"id":"SPEC6","heading":"Columns","decisions":["DCSN2","DCSN3","AGNT5"]},{"id":"SPEC7","heading":"Versions and identifiers","decisions":["DCSN4"]},{"id":"SPEC8","heading":"Projects","decisions":["DCSN5"]},{"id":"SPEC9","heading":"Access levels","decisions":["AGNT4"]},{"id":"SPEC10","heading":"Profiles and the archive config","decisions":["AGNT6"]},{"id":"SPEC11","heading":"The change log and findings","decisions":["AGNT10","DCSN2"]},{"id":"SPEC12","heading":"Exports and import","decisions":["AGNT7","DCSN3","DCSN5"]},{"id":"SPEC13","heading":"The contract package","decisions":["AGNT11"]},{"id":"SPEC14","heading":"The sample package","decisions":["AGNT9","DCSN3","DCSN6"]},{"id":"SPEC15","heading":"Fields the paper test added","decisions":["DCSN7"]},{"id":"SPEC16","heading":"Risk and cost","decisions":["AGNT11"]},{"id":"SPEC17","heading":"Left out","decisions":["DCSN1","AGNT4"]},{"id":"SPEC18","heading":"How we'll know it works","decisions":["AGNT7","AGNT9"]}],"approved":{"hash":"9f91f0ead574b154211e012ddc9c055f592f5382998f730a3818cdd6c87aadd1","at":"2026-11-13T00:16:25.483708-06:00","body":"# The package format and the archive_contract package\n\n## Goal\n\nA written package format and a Python contract package, `archive-contract` (import `archive_contract`) at `packages/contract`, that the local tool, the backend, the web app's schema and the agent layer all build on. The format is designed from Frictionless Data Package v2, EML, DataCite and schema.org and from what any research group's data looks like. A committed, invented sample package exercises all of it, and FEMC's six practice datasets are written down in it afterwards as a test.\n\n## The package folder\n\nA package is a plain folder that is also a valid Frictionless v2 Data Package:\n\n```\nmy-dataset/\n  datapackage.json   the manifest\n  data/              tidy tables (CSV now, Parquet later)\n  data/codes/        code-list tables\n  original/          untouched source files\n  docs/              methods, protocols, field sheets\n  changes.jsonl      every cleaning step, with evidence\n  checksums.sha256   one line per file in the package\n  README.md          generated from the manifest, never edited\n```\n\nRules that hold everywhere:\n\n- Standard Frictionless properties are left out when unknown, never set to null.\n- Our additions sit under the `archive:` prefix and may be null.\n- A resource's `format` (and `mediatype`) is the only place a file type appears. Columns are described by logical type, so adding Parquet later changes no field definitions.\n\nRests on: AGNT1, AGNT11\n\n## The manifest's fields\n\nCore fields, required before a package can be published: a `title`; a `description` of at least 50 characters; at least one creator (a contributor with the creator role); rights (next section); and at least one described resource. This is the union of what DataCite, Google Dataset Search and Frictionless require.\n\nThe archive fills in publisher, publication year, identifier and resource type at publish, from its config.\n\nRecommended fields, following DataCite's and Google's recommended lists: keywords, other contributors, temporal coverage (an end date or `ongoing`), spatial coverage (a bounding box), related identifiers, funding and methods. A profile can promote any of them to required.\n\nTwo separate verdicts are recorded in the manifest and never merged: `archive:validation` (structurally valid or not, by which contract version, when) and `archive:quality` (the counts of findings by severity from the last audit). Valid structure says nothing about quality, and the reverse.\n\n`archive:legacyIdentifiers` holds any identifiers the data had elsewhere, as a list of `{scheme, value}`, such as `{scheme: \"eml-package-id\", value: \"knb-lter-xyz.12.3\"}`.\n\nRests on: AGNT8\n\n## Rights\n\nA package states its rights in one of two ways: one or more licenses in Frictionless `licenses` (an SPDX id or a license URL), or `archive:rightsStatus` with a statement. The statuses are:\n\n- `public-domain`\n- `third-party`, with where the terms are set\n- `all-rights-reserved`, with the statement\n- `undetermined`\n\nThe local tool packages and audits data with `undetermined`, and the audit reports it. Publishing (Plan 7) refuses a package until it has a license or a stated status other than `undetermined`.\n\nRests on: DCSN1\n\n## Resources and their kinds\n\nEvery resource has `archive:kind`, one of `table`, `vector`, `raster`, `document`, `media`, `file` or `linked`. A resource with no kind is read as `file`. Frictionless's own `type` stays `table` for tables and is left out otherwise.\n\n- **Several files that only work together** (a shapefile set, a raster with its world file) are one resource. `path` names the main file (the `.shp`), and `archive:files` lists every member file with its size and hash. Checksums, previews and the web app's file list read the member list.\n- **The same data in several formats** (a table as CSV and XLSX): the copy is its own resource with `archive:alternateOf` naming the primary. Only the primary carries the schema.\n- **Data held elsewhere**: `archive:kind: linked`, `path` is the remote URL, and there is no hash or size. Compatibility tests run the frictionless library with remote fetching off.\n\nRests on: AGNT1, AGNT2, AGNT3, DCSN6\n\n## Columns\n\nA table's columns use Frictionless Table Schema, with three additions.\n\n- **Names.** Source column names are kept. Frictionless `title` holds a readable label, `description` the definition. The local tool may propose a rename; when the person accepts, the new name goes into the tidy table, the old one into `archive:sourceName` on the field, and the rename into `changes.jsonl`.\n- **Code lists.** Each code list is a CSV table under `data/codes/` with `code`, `label` and `description` columns. A column that uses one points at it with a Frictionless foreign key, so one list serves many columns and Frictionless validation checks every code. A column that holds codes with no list is marked `archive:codeList: \"undocumented\"`.\n- **Sensitivity.** `archive:sensitivity` on a field is one of `personal`, `sensitive-location` or `confidential`. No flag means not sensitive.\n\nRests on: DCSN2, DCSN3, AGNT5\n\n## Versions and identifiers\n\nA package has one stable `id` across all its versions, and a `version` of `1`, `2`, `3` and so on. Changing, adding or removing a file makes the next version. A metadata edit updates the current version in place, and each edit is appended to `archive:metadataHistory` (when, who, which fields). When DOIs are on, each version gets its own DOI.\n\nRests on: DCSN4\n\n## Projects\n\nA project (a monitoring program, a grant, a long-term study) is its own small record, `project.json`, with an `id`, `title`, `abstract`, `people` and `links`. A package names its project with `archive:project: \u003cid\u003e`, or leaves it out. A package never copies the project's text and never sits inside a project folder.\n\nWhen a package is exported, the project's current title goes into its README, its DataCite record as a related identifier of type IsPartOf, and its EML project element.\n\nRests on: DCSN5\n\n## Access levels\n\nEach package has one `archive:access` level: `open`, `restricted`, `by-request` or `description-only`. Unpublished is a state of the package in the archive, not an access level.\n\nRests on: AGNT4\n\n## Profiles and the archive config\n\nA profile is a YAML file in the contract (`profiles/core.yaml`, `profiles/ecology.yaml`), read into a `Profile` model. It lists the recommended fields it promotes to required, its vocabularies and the ids of the rules it switches on. The rules themselves are code in Plan 3. The core profile holds only the core fields above.\n\nThe archive config file, read into an `ArchiveConfig` model, is the one file an adopter edits. It picks the profiles and sets required fields, vocabularies, themes, licenses and the access levels offered, plus the publisher name the archive fills in at publish. How it maps to the CDK construct is Plan 4's.\n\nRests on: AGNT6\n\n## The change log and findings\n\nBoth formats are models in the contract, drafted here and confirmed by Plan 3 when it starts.\n\n- **`Change`**, one line of `changes.jsonl`: an id, when, who made it (person, tool or agent) and who accepted it, its kind (such as `rename`, `retype`, `recode`, `fix-value`), its target (resource and field), before and after, the reason, and the evidence (row numbers or values).\n- **`Finding`**: the rule id, a severity (`error`, `warning` or `note`), a message, the target, the evidence, and an optional suggested fix.\n\nRests on: AGNT10, DCSN2\n\n## Exports and import\n\nGenerated from the manifest, never edited by hand:\n\n- EML 2.2.0, with code lists as enumerated domains and the project as the project element.\n- A DataCite record and schema.org Dataset JSON-LD.\n- `README.md`.\n\nImport reads standard EML 2.1.1 and 2.2.0 into a manifest. Tolerating one archive's non-standard EML is Plan 5's.\n\nRests on: AGNT7, DCSN3, DCSN5\n\n## The contract package\n\n`packages/contract/src/archive_contract/`:\n\n| Module | Holds |\n| --- | --- |\n| `manifest.py` | the package model and its `archive:` additions |\n| `resources.py`, `fields.py` | resources, member files, columns |\n| `rights.py`, `project.py` | rights statuses, the project record |\n| `changes.py`, `findings.py` | `Change` and `Finding` |\n| `profile.py`, `config.py`, `profiles/*.yaml` | profiles and the archive config |\n| `validate.py` | structural validation |\n| `schema.py` | JSON Schema generation (from Plan 1) |\n| `exports/` | `eml.py`, `datacite.py`, `schemaorg.py`, `readme.py` |\n| `imports/eml.py` | EML import |\n\nThe JSON Schema generated from the models replaces the skeleton's empty one under `packages/web/`, and Plan 1's drift check keeps it current. The frictionless library is a test-only dependency.\n\nRests on: AGNT11\n\n## The sample package\n\n`examples/sample-package/`: a small stream temperature study at invented sites, licensed CC-BY-4.0. It has a logger table with a code-list table, a site shapefile set, a small raster, a methods document, a site photo, the logger table again as XLSX, a linked resource and ongoing coverage. Known gaps are seeded in and listed in its README, so Plan 3's rules have predictable findings.\n\nRests on: AGNT9, DCSN3, DCSN6\n\n## Risk and cost\n\nRisk: low. The work adds code, docs and one example folder to a repo with no users yet. A mistake is undone by editing the contract; nothing is published or deployed, and no data from `practice-data/` is committed.\n\nCost: no steps for you beyond reviewing. No new programs: the frictionless library is a test-only Python dependency, and PyYAML reads the profiles.\n\nRests on: AGNT11\n\n## Left out\n\n- The quality rules and the commands that run them (Plan 3).\n- Tolerating FEMC's EML quirks, and converting FEMC's data (Plan 5).\n- Storage, tables and the API (Plans 4 and 6), and the publish check that enforces rights (Plan 7).\n- Parquet: only the room for it.\n- Per-resource access levels: one level per package for now.\n\nRests on: DCSN1, AGNT4\n\n## How we'll know it works\n\n- The sample package passes the frictionless library's validation and our own structural validation.\n- Its EML export imports back to the same manifest fields; its DataCite and schema.org exports validate against their schemas.\n- Each of FEMC's six practice datasets is written down in the format on paper, with anything it can't express listed.\n- `just check` passes with the generated JSON Schema committed.\n\nRests on: AGNT7, AGNT9\n"},"edited":"2026-11-13T11:58:11.110505-06:00"},"plans":[{"id":"PLAN1","topic":"contract-models-and-sample","covers":"The Pydantic models, structural validation, the generated JSON Schema and the committed sample package","hash":"daafc8ef92d405db2ee99ac79d9d0d8440ee0e89b034693abf5895a761c2e465","tasks":[{"id":"TASK1","heading":"Task 1: Resource, field and rights models","does":"fields.py, resources.py and rights.py with the archive: additions, the linked rule and the rights statuses, one test per rule","pulls_in":"Nothing new","serves":["DCSN1","DCSN2","DCSN3","DCSN6"],"state":"keep","build":"done","result":"6c1fac9 + 03cf2b6 (null extras kept, type/kind enforced) · just check exit 0","build_at":"2026-11-13T09:08:54.715078-06:00"},{"id":"TASK2","heading":"Task 2: Manifest and project models","does":"manifest.py (core and recommended fields, versions, project link, access, history, verdicts, coverage) and project.py, with missing_core_fields","pulls_in":"Nothing new","serves":["DCSN4","DCSN5"],"state":"keep","build":"done","result":"a6d3803 + 03cf2b6 (coverage needs end or ongoing) · just check exit 0","build_at":"2026-11-13T09:08:54.715078-06:00"},{"id":"TASK3","heading":"Task 3: Change, Finding, Profile and ArchiveConfig","does":"The drafted Change and Finding models, core and ecology profiles as YAML read into Profile, and ArchiveConfig","pulls_in":"PyYAML","serves":["DCSN2"],"state":"keep","build":"done","result":"6d94716 · contract tests exit 0 · just check exit 0 · uv lock --check exit 0","build_at":"2026-11-13T09:02:29.119669-06:00"},{"id":"TASK4","heading":"Task 4: Structural validation","does":"validate_package returns error Findings for broken references, missing member files, wrong hashes and stale checksums","pulls_in":"Nothing new","serves":["DCSN3","DCSN6"],"state":"keep","build":"done","result":"37b3cf9 + 03cf2b6 (symlinks refused, checksums all but _build, hash allowlist) · 158 tests pass","build_at":"2026-11-13T09:08:54.715078-06:00"},{"id":"TASK5","heading":"Task 5: The real JSON Schema","does":"The schema generator points at the manifest model and emits the other records under $defs; the committed schema is regenerated","pulls_in":"Nothing new","serves":[],"state":"keep","build":"done","result":"0a38fa1 · just schema exit 0 · just check (with drift check) exit 0","build_at":"2026-11-13T09:02:29.119669-06:00"},{"id":"TASK6","heading":"Task 6: The sample package","does":"A reproducible build of the invented stream temperature package covering every resource kind with seeded gaps, validated by our validator and the frictionless library","pulls_in":"frictionless, pyshp and openpyxl as dev dependencies","serves":["DCSN3","DCSN6"],"state":"keep","build":"done","result":"1064ecf · merged in PR #1 as c7ba8fc · CI run 43449582602 on main success (python, typescript)","build_at":"2026-11-13T09:02:29.119669-06:00"}],"approved":{"hash":"daafc8ef92d405db2ee99ac79d9d0d8440ee0e89b034693abf5895a761c2e465","at":"2026-11-13T08:46:29.858131-06:00","body":"# PLAN1: The contract models, validation, schema and sample package\n\n## Spec\n\n`docs/specs/2026-11-12-generic-package-format-and-contract/spec.md`, approved 2026-11-13.\n\n## The change\n\nFill `packages/contract` (the empty package from Plan 1's skeleton) with the Pydantic models the spec names, a structural validator, and the real JSON Schema in place of the skeleton's empty one. Then build the committed sample package under `examples/sample-package/` and prove it passes both our validator and the frictionless library.\n\nSerialisation rule for every model: standard Frictionless properties are dropped when unset (never written as null); `archive:` properties are written under their prefixed names and may be null. Models accept unknown properties and keep them, since Frictionless allows extra properties.\n\nRisk: low. New code and one example folder in a repo with no users; undone by editing or reverting the PR.\n\n## Left out\n\n- Exports and EML import: PLAN2.\n- The quality rules and the publish check (Plans 3 and 7). The validator checks structure only.\n- Anything under `practice-data/`.\n\n## Where\n\nThe repo `schuettc/research-in-a-box` once Plan 1's skeleton is pushed. Work in a worktree at `/Users/courtschuett/GitHub/personal/.worktrees/research-in-a-box/plan2-contract-models`, branch `plan2-contract-models` from `origin/main`, and finish with a PR with auto-merge on.\n\n### Task 1: Resource, field and rights models\n\n**Does:** Adds `fields.py` (a Table Schema field with `archive:sourceName`, `archive:codeList` and `archive:sensitivity`, plus foreign keys on the schema), `resources.py` (a resource with `archive:kind`, `archive:files` member list, `archive:alternateOf`, and the linked rule: a URL path with no hash or bytes) and `rights.py` (licenses, `archive:rightsStatus` with its statement, and the four statuses) with one test per rule the spec states.\n**Files:** `packages/contract/src/archive_contract/fields.py`, `resources.py`, `rights.py`, `packages/contract/tests/test_resources.py`, `test_fields.py`, `test_rights.py`\n**Checks:** `uv run pytest packages/contract`; `just check-python`\n**Serves:** DCSN1, DCSN2, DCSN3, DCSN6 (rests on calls AGNT1, AGNT2, AGNT3, AGNT5)\n\nTests cover: a resource with no kind reads as `file`; a linked resource with a hash is refused; `third-party` and `all-rights-reserved` need a statement; an unset standard property is absent from the dump while an unset `archive:` property may be null.\n\n### Task 2: Manifest and project models\n\n**Does:** Adds `manifest.py` (the package: core and recommended fields, `id`, integer-string `version`, `archive:project`, `archive:access`, `archive:legacyIdentifiers`, `archive:metadataHistory`, `archive:validation`, `archive:quality`, temporal coverage with `ongoing`, spatial coverage as a bounding box) and `project.py` (the `project.json` record) with tests.\n**Files:** `packages/contract/src/archive_contract/manifest.py`, `project.py`, `packages/contract/tests/test_manifest.py`, `test_project.py`\n**Checks:** `uv run pytest packages/contract`; `just check-python`\n**Serves:** DCSN4, DCSN5 (rests on calls AGNT4, AGNT8)\n\nThe core fields are optional on the model (a package can be built and audited without them); a `missing_core_fields(manifest)` helper lists which are absent, for Plan 3's audit and Plan 7's publish check to call.\n\n### Task 3: Change, Finding, Profile and ArchiveConfig\n\n**Does:** Adds `changes.py` and `findings.py` with the drafted `Change` and `Finding` shapes, `profile.py` reading `profiles/core.yaml` and `profiles/ecology.yaml` into `Profile`, and `config.py` with `ArchiveConfig`, each with tests; adds PyYAML as a dependency.\n**Files:** `packages/contract/src/archive_contract/changes.py`, `findings.py`, `profile.py`, `config.py`, `profiles/core.yaml`, `profiles/ecology.yaml`, `packages/contract/pyproject.toml`, `uv.lock`, matching tests\n**Checks:** `uv run pytest packages/contract`; `just check-python`\n**Serves:** DCSN2 (rests on calls AGNT6, AGNT10)\n\nThe ecology profile promotes temporal and spatial coverage and methods to required and names its rule ids; the rule ids are placeholders that Plan 3 owns, listed in a comment as such.\n\n### Task 4: Structural validation\n\n**Does:** Adds `validate.py` with `validate_package(path) -\u003e list[Finding]`: the manifest parses; every foreign key, `archive:alternateOf` and `archive:files` entry points at something that exists; every file listed has the size and hash recorded; `checksums.sha256` matches the files. Each problem is a `Finding` with severity `error` and the rule id `structure.\u003cname\u003e`.\n**Files:** `packages/contract/src/archive_contract/validate.py`, `packages/contract/tests/test_validate.py` and small fixture folders under `packages/contract/tests/fixtures/`\n**Checks:** `uv run pytest packages/contract`; `just check-python`\n**Serves:** DCSN3, DCSN6 (rests on call AGNT11)\n\nOne fixture per failure: a foreign key to a missing resource, a member file missing, a wrong hash, a stale checksums line.\n\n### Task 5: The real JSON Schema\n\n**Does:** Points `archive_contract.schema` at the manifest model (the skeleton's empty `ArchiveContract` model is removed) and also emits the `Project`, `Change`, `Finding` and `ArchiveConfig` schemas under `$defs`; regenerates the committed schema with `just schema`.\n**Files:** `packages/contract/src/archive_contract/schema.py`, `packages/contract/tests/test_schema.py`, `packages/web/src/schema/archive-contract.schema.json`\n**Checks:** `just check` (includes the drift check)\n**Serves:** none (rests on calls AGNT6, AGNT11)\n\n### Task 6: The sample package\n\n**Does:** Builds `examples/sample-package/`, a stream temperature study at invented sites under CC-BY-4.0, from a committed build script, and adds a test that validates it with `validate_package` and with the frictionless library (a dev dependency, remote fetching off).\n**Files:** `examples/sample-package/` (datapackage.json, data/, data/codes/, original/, docs/, changes.jsonl, checksums.sha256, README.md), `examples/sample-package/_build/make.py`, `packages/contract/tests/test_sample_package.py`, root `pyproject.toml` dev dependencies (frictionless, pyshp, openpyxl), `uv.lock`\n**Checks:** `uv run python examples/sample-package/_build/make.py \u0026\u0026 git diff --exit-code examples/sample-package` (the build is reproducible); `uv run pytest packages/contract/tests/test_sample_package.py`; `just check`\n**Serves:** DCSN3, DCSN6 (rests on calls AGNT1, AGNT2, AGNT3, AGNT9)\n\nContents, all small and invented:\n\n- `data/logger.csv`: about 60 rows of water temperature at three sites, with a `condition` column linked to `data/codes/condition-codes.csv` by foreign key.\n- `data/sites/`: a point shapefile set (`.shp`, `.shx`, `.dbf`, `.prj`) written with pyshp, as one `vector` resource with its members listed.\n- `data/depth.asc` and `data/depth.prj`: a tiny ESRI ASCII grid as one `raster` resource.\n- `data/logger.xlsx`: the logger table again, with `archive:alternateOf: logger`.\n- `docs/methods.md` (`document`) and `docs/site-photo.png` (`media`, a small generated image).\n- A `linked` resource pointing at `https://example.org/stream-temperature/discharge.csv`.\n- Temporal coverage `ongoing`; one accepted rename in `changes.jsonl`.\n\nSeeded gaps, listed in the README: one column with no description, one column whose description repeats its name, a coded column marked `archive:codeList: \"undocumented\"`, and a constant column. The README itself is hand-written for now and replaced by the generated one in PLAN2.\n"}},{"id":"PLAN2","topic":"exports-import-and-paper-test","covers":"EML, DataCite, schema.org and README exports, EML import, and FEMC's six datasets written in the format on paper","waits_on":["PLAN1"],"hash":"79c66f8263b96913a9fceaaacec3bb350f7e630b8d8c1263a9777079a2de19e3","tasks":[{"id":"TASK7","heading":"Task 1: README export","does":"render_readme from the manifest, with each resource and the column dictionary; the sample's README becomes generated and its gap list moves to _build/GAPS.md","pulls_in":"Nothing new","serves":["DCSN3","DCSN5"],"state":"keep","build":"done","result":"3714348 · README generated from the manifest · just check exit 0","build_at":"2026-11-13T11:08:46.309849-06:00"},{"id":"TASK8","heading":"Task 2: DataCite export","does":"to_datacite produces DataCite 4.x JSON, validated against DataCite's vendored JSON Schema; undetermined rights are refused","pulls_in":"jsonschema (dev), a vendored DataCite schema","serves":["DCSN1","DCSN4","DCSN5"],"state":"keep","build":"done","result":"7fd9c1d · validates against DataCite's JSON Schema · refuses undetermined or missing rights","build_at":"2026-11-13T11:08:46.309849-06:00"},{"id":"TASK9","heading":"Task 3: schema.org export","does":"to_schemaorg produces Dataset JSON-LD with Google's required fields, ongoing coverage as an open interval, and distributions","pulls_in":"Nothing new","serves":["DCSN5"],"state":"keep","build":"done","result":"bec8b93 · Google's required fields · ongoing as start/..","build_at":"2026-11-13T11:08:46.309849-06:00"},{"id":"TASK10","heading":"Task 4: EML 2.2.0 export","does":"to_eml writes dataTables with enumerated domains from code lists and otherEntity for other files, validated against the vendored EML 2.2.0 XSD","pulls_in":"lxml (dev), vendored EML XSDs","serves":["DCSN3","DCSN5"],"state":"keep","build":"done","result":"da9963e · validates against the EML 2.2.0 XSD (a broken document fails)","build_at":"2026-11-13T11:08:46.309849-06:00"},{"id":"TASK11","heading":"Task 5: EML import","does":"from_eml reads standard EML 2.1.1 and 2.2.0 into a manifest and code-list rows, lists what it skipped, and round-trips the sample","pulls_in":"Nothing new","serves":["DCSN1","DCSN3"],"state":"keep","build":"done","result":"7b692fd + a204e7a · reads EML 2.1.1 and 2.2.0, lists what it skips · sample round-trips","build_at":"2026-11-13T11:08:46.309849-06:00"},{"id":"TASK12","heading":"Task 6: The FEMC paper test","does":"Writes each of FEMC's six datasets down in the format, with what from_eml reads and skips, and lists what the format can't express","pulls_in":"Nothing new; no FEMC data committed","serves":["DCSN1","DCSN3","DCSN5","DCSN6"],"state":"keep","build":"done","result":"c2c058d + 0906808 (review fixes) · 198 tests · PR #3 CI green (runs 43470879322, 43470887680) · merged as 90e1a0b","build_at":"2026-11-13T11:08:46.309849-06:00"}],"approved":{"hash":"79c66f8263b96913a9fceaaacec3bb350f7e630b8d8c1263a9777079a2de19e3","at":"2026-11-13T10:46:53.67042-06:00","body":"# PLAN2: Exports, EML import and the FEMC paper test\n\n## Spec\n\n`docs/specs/2026-11-12-generic-package-format-and-contract/spec.md`, approved 2026-11-13. PLAN1 (merged in research-in-a-box#1) built the models this plan reads: `Manifest`, `Resource`, `Field`, `TableSchema`, `Project`, `RightsStatus`, `License` in `archive_contract`.\n\n## The change\n\nAdd the four exports the spec names (EML 2.2.0, DataCite, schema.org JSON-LD, README) and EML import (2.1.1 and 2.2.0), all generated from the manifest and never edited by hand. Prove them on the sample package: EML export validates against the EML 2.2.0 schema and imports back to the same manifest fields; DataCite validates against DataCite's JSON Schema; schema.org carries every field Google requires. Then write each of FEMC's six practice datasets down in the format on paper, listing anything the format can't express.\n\nRisk: low. New code and one document in a repo with no users; undone by reverting the PR. The paper test describes FEMC's public metadata and commits no FEMC data files.\n\n## Left out\n\n- Tolerating FEMC's non-standard EML (the misspelled `distibution` tag and others): Plan 5.\n- Converting FEMC's data into packages: Plan 5.\n- A DataCite XML export: the JSON form is what DataCite's REST API takes, and Plan 7 mints DOIs through it.\n- Exporting a whole project on its own: a project appears inside each package's exports.\n\n## Where\n\nRepo `schuettc/research-in-a-box`. Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-in-a-box/plan2-exports-import`, branch `plan2-exports-import` from `origin/main`, finishing with a PR merged once CI passes.\n\n### Task 1: README export\n\n**Does:** Adds `exports/readme.py` with `render_readme(manifest, project=None) -\u003e str`: title, description, citation line, creators, rights, project title, access level, coverage, and one section per resource with its kind and, for tables, the column dictionary (name, title, type, description, code list). Switches the sample build to write the generated README, and moves the sample's list of seeded gaps to `examples/sample-package/_build/GAPS.md`.\n**Files:** `packages/contract/src/archive_contract/exports/__init__.py`, `exports/readme.py`, `packages/contract/tests/test_export_readme.py`, `examples/sample-package/_build/make.py`, `examples/sample-package/_build/GAPS.md`, `examples/sample-package/README.md`, `examples/sample-package/checksums.sha256`\n**Checks:** `uv run pytest packages/contract`; `uv run python examples/sample-package/_build/make.py \u0026\u0026 git diff --exit-code examples/sample-package`; `just check`\n**Serves:** DCSN3, DCSN5 (rests on call AGNT11)\n\nTests: the sample's README names every resource and every column; a field marked `archive:codeList: \"undocumented\"` is shown as undocumented; a missing standard property prints nothing, not \"None\".\n\n### Task 2: DataCite export\n\n**Does:** Adds `exports/datacite.py` with `to_datacite(manifest, project=None, publisher=..., year=..., identifier=None) -\u003e dict` producing DataCite 4.x JSON: creators, titles, publisher, publicationYear, types (resourceTypeGeneral Dataset), descriptions (Abstract, plus Methods when present), subjects from keywords, dates (Collected from temporal coverage), geoLocations from the bounding box, rightsList from licenses or the rights statement, relatedIdentifiers (including IsPartOf the project), fundingReferences and version. Validates against DataCite's JSON Schema, vendored as a test fixture with its source URL and licence noted.\n**Files:** `packages/contract/src/archive_contract/exports/datacite.py`, `packages/contract/tests/test_export_datacite.py`, `packages/contract/tests/fixtures/schemas/datacite/`, root `pyproject.toml` dev dependency jsonschema, `uv.lock`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN1, DCSN4, DCSN5 (rests on call AGNT11)\n\nTests: the sample's record validates; an `undetermined` rights status is refused with a clear error (it can't be published); `third-party` writes its statement into rightsList.\n\n### Task 3: schema.org export\n\n**Does:** Adds `exports/schemaorg.py` with `to_schemaorg(manifest, project=None, url=None) -\u003e dict`, a schema.org `Dataset` JSON-LD: name, description, creator, license, keywords, temporalCoverage (an open interval `start/..` when ongoing), spatialCoverage as a GeoShape box, distribution (one DataDownload per non-linked resource with encodingFormat), isPartOf the project, version and identifier.\n**Files:** `packages/contract/src/archive_contract/exports/schemaorg.py`, `packages/contract/tests/test_export_schemaorg.py`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN5 (rests on call AGNT11)\n\nTests: Google's required name and 50-to-5000-character description are present; ongoing coverage gives `2024-06-01/..`; a linked resource appears with its remote URL as contentUrl.\n\n### Task 4: EML 2.2.0 export\n\n**Does:** Adds `exports/eml.py` with `to_eml(manifest, project=None) -\u003e str`: dataset title, creators, abstract, keywords, intellectual rights, coverage (temporal and geographic), methods, project, one `dataTable` per table resource with its attributes (code lists as `enumeratedDomain`, read from the code-list table; `archive:codeList: \"undocumented\"` as a text domain with a note), and `otherEntity` for every other local resource. Validates against the EML 2.2.0 XSD with lxml; the XSDs are vendored as a test fixture with their source and licence noted.\n**Files:** `packages/contract/src/archive_contract/exports/eml.py`, `packages/contract/tests/test_export_eml.py`, `packages/contract/tests/fixtures/schemas/eml-2.2.0/`, root `pyproject.toml` dev dependency lxml, `uv.lock`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN3, DCSN5 (rests on call AGNT7)\n\nThe export uses only the standard library's XML writer at run time; lxml is test-only, to validate.\n\n### Task 5: EML import\n\n**Does:** Adds `imports/eml.py` with `from_eml(xml: str) -\u003e Manifest` reading standard EML 2.1.1 and 2.2.0: title, creators, abstract, keywords, rights (a recognised licence URL or name becomes a license, other text becomes a `third-party` or `all-rights-reserved` status with the text as its statement), coverage, methods, project, and each `dataTable`'s attributes as fields (an `enumeratedDomain` becomes a code list, returned alongside the manifest as table rows to write under `data/codes/`). The original package id goes into `archive:legacyIdentifiers` with scheme `eml-package-id`. Round trip: `from_eml(to_eml(sample))` gives the same title, creators, description, keywords, rights, coverage, fields and code lists as the sample.\n**Files:** `packages/contract/src/archive_contract/imports/__init__.py`, `imports/eml.py`, `packages/contract/tests/test_import_eml.py`, `packages/contract/tests/fixtures/eml/` (one small invented 2.1.1 record and one 2.2.0 record)\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN1, DCSN3 (rests on calls AGNT7, AGNT8)\n\nStandard EML only: a record with a non-standard tag imports what is standard and returns a list of what it skipped, rather than failing.\n\n### Task 6: The FEMC paper test\n\n**Does:** Writes `docs/specs/2026-11-12-generic-package-format-and-contract/documents/femc-paper-test.md`: for each of the six practice datasets in `practice-data/femc/`, which resources it becomes and of which kind, how its rights are stated, its code lists, its legacy identifiers, its project, and what `from_eml` reads from its EML record and what it skips. Ends with a list of anything the format cannot express, each with the dataset that showed it. Runs `from_eml` on each record locally to fill in what is read and skipped; nothing from `practice-data/` is committed.\n**Files:** `docs/specs/2026-11-12-generic-package-format-and-contract/documents/femc-paper-test.md`\n**Checks:** `git status --porcelain --ignored practice-data` shows only `!! practice-data/`; `just check`\n**Serves:** DCSN1, DCSN3, DCSN5, DCSN6 (rests on calls AGNT1, AGNT3, AGNT8)\n\nAnything the paper test finds the format can't express is brought to the user as a decision before changing the contract.\n"}},{"id":"PLAN3","topic":"fields-from-the-paper-test","covers":"The eight optional fields the FEMC paper test found missing, with their exports, EML import and validation","hash":"436ec49749e1e54a5515f5aafd1bd24a936596a52cb1fb73afbdc34c415a2b80","tasks":[{"id":"TASK13","heading":"Task 1: The eight fields on the models","does":"Optional fields for unknown end, unit, measurement scale, citation, purpose, project keywords, related columns and a vector's attribute table, with their rules; JSON Schema regenerated","pulls_in":"Nothing new","serves":["DCSN7"],"state":"keep","build":"done","result":"c4a6c64 · eight optional fields with their rules, JSON Schema regenerated · just check exit 0","build_at":"2026-11-13T11:52:30.762405-06:00"},{"id":"TASK14","heading":"Task 2: Validator check for attribute tables","does":"validate_package compares a vector's archive:attributes with its .dbf header and reports mismatches","pulls_in":"Nothing new","serves":["DCSN7"],"state":"keep","build":"done","result":"5939b79 · .dbf header checked against archive:attributes (standard library) · just check exit 0","build_at":"2026-11-13T11:52:30.762405-06:00"},{"id":"TASK15","heading":"Task 3: Exports, import and the sample package","does":"The new fields go through README, EML, schema.org and DataCite, the EML import reads them back, the sample uses every one, and the paper test marks each gap closed","pulls_in":"Nothing new","serves":["DCSN7"],"state":"keep","build":"done","result":"d169882 + review fixes 73c5be0, 323ddfc, 04b042e · 255 tests · PR #4 CI green (runs 43478057995, 43478066110) · merged as ea2636d","build_at":"2026-11-13T12:03:10.357107-06:00"}],"approved":{"hash":"bc06ad27d33826e603cbce7ed94bb41ab5ab0a9d1f13c32d0baf547af63f164f","at":"2026-11-13T11:41:31.686286-06:00","body":"# PLAN3: The eight fields from the paper test\n\n## Spec\n\n`docs/specs/2026-11-12-generic-package-format-and-contract/spec.md`, section \"Fields the paper test added\" (DCSN7). PLAN1 and PLAN2 (merged in research-in-a-box#1 and #3) built the models, exports and EML import this plan extends.\n\n## The change\n\nAdd the eight optional fields the spec lists, carry each through the exports and the EML import where its standard has a place, check `archive:attributes` against the `.dbf` in the validator, and use every new field in the sample package so its round trip covers them. Then mark each gap closed in the paper test.\n\nRisk: low. Every field is optional, so existing packages stay valid; undone by reverting the PR.\n\n## Left out\n\n- Quality rules that use the new fields, such as \"numeric column with no unit\": Plan 3 (quality rules).\n- A unit vocabulary: `archive:unit` is free text for now.\n- Reading FEMC's non-standard EML into these fields: Plan 5.\n\n## Where\n\nRepo `schuettc/research-in-a-box`. Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-in-a-box/plan2-paper-test-fields`, branch `plan2-paper-test-fields` from `origin/main`, finishing with a PR merged once CI passes.\n\n### Task 1: The eight fields on the models\n\n**Does:** Adds to the models, each optional, with a test per rule: `end: \"unknown\"` on `TemporalCoverage` (exclusive with a real end and with `ongoing`); `archive:unit` and `archive:measurementScale` (nominal, ordinal, interval, ratio, dateTime) on `Field`; `archive:citation` and `archive:purpose` on `Manifest`; `keywords` on `Project`; `archive:ancillaryOf` (`field` naming another column in the same schema, `role` one of uncertainty, detection-limit, quality-flag) on `Field`; `archive:attributes` (a `TableSchema`) on `Resource`, allowed only when `archive:kind` is `vector`. Regenerates the committed JSON Schema.\n**Files:** `packages/contract/src/archive_contract/manifest.py`, `fields.py`, `resources.py`, `project.py`, matching tests, `packages/web/src/schema/archive-contract.schema.json`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN7\n\nTests: an ancillaryOf naming a missing column is refused; `archive:attributes` on a table resource is refused; `end: \"unknown\"` with `ongoing: true` is refused.\n\n### Task 2: Validator check for attribute tables\n\n**Does:** `validate_package` reads the `.dbf` header of a vector resource that has `archive:attributes` (with the standard library, from the member file listed in `archive:files`) and reports `structure.attributes-mismatch` for a column described but absent, or present but not described.\n**Files:** `packages/contract/src/archive_contract/validate.py`, `packages/contract/tests/test_validate.py`, a fixture under `packages/contract/tests/fixtures/`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN7\n\nReading the `.dbf` keeps to the package folder and refuses symlinks, as the rest of the validator does.\n\n### Task 3: Exports, import and the sample package\n\n**Does:** Carries the new fields through: README (citation, purpose, units, scale, related columns, the vector resource's attribute columns, project keywords); EML 2.2.0 (unit in place of `unknown`, measurementScale from the field when set, purpose, project keywords, attribute definition noting the related column, spatialVector attributeList, open-ended coverage for `end: \"unknown\"`); schema.org (`creditText`, open interval for unknown end); DataCite (purpose as a description of type Other). `from_eml` reads back units, scales, purpose, project keywords and the spatialVector attribute list, and drops their entries from `skipped`. Adds every new field to the sample package (a unit and scale on each logger column, a citation, a purpose, an uncertainty column for temperature, attribute columns on the sites shapefile) and extends the round-trip test to compare them.\n**Files:** `packages/contract/src/archive_contract/exports/readme.py`, `exports/eml.py`, `exports/schemaorg.py`, `exports/datacite.py`, `imports/eml.py`, matching tests, `examples/sample-package/_build/make.py`, `examples/sample-package/` (regenerated)\n**Checks:** `uv run pytest packages/contract`; `uv run python examples/sample-package/_build/make.py \u0026\u0026 git diff --exit-code examples/sample-package` (after commit); `just check`\n**Serves:** DCSN7\n\nThe sample's EML export still validates against the EML 2.2.0 XSD. The paper test document gets a line under each of its eight gaps saying it is closed and by which field.\n"},"edited":"2026-11-13T11:58:11.110505-06:00"}],"wrap_up":{"file":"wrap-up.md","hash":"78715205d00700610fdbe6d668fc765a566b7935831811228401247265c12292","printed_at":"2026-11-13T12:05:45.132084-06:00","due_at":"2026-11-13T12:05:05.509571-06:00","plans_at_print":["PLAN1","PLAN2","P
