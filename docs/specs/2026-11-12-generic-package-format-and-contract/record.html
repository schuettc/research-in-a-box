LAN3"]},"signoff":{"due_at":"2026-11-13T12:03:10.357107-06:00","built":"The package format and the archive_contract package, on main in schuettc/research-in-a-box: the models, structural validation and generated JSON Schema with the sample package (PLAN1, #1); README, DataCite, schema.org and EML exports, EML import and the FEMC paper test (PLAN2, #3); the eight fields the paper test found missing (PLAN3, #4). CI green on each.","try":["Read the sample package's generated README: examples/sample-package/README.md on GitHub. It shows the citation, purpose, units, scales, the code list and the shapefile's columns.","Read the paper test: docs/specs/2026-11-12-generic-package-format-and-contract/documents/femc-paper-test.md, with each of the eight gaps marked closed.","In a fresh clone (or after git fetch and git reset --hard origin/main in your clone), run just check: it exits 0 with 255 Python tests.","Export the sample to EML: uv run python -c \"from pathlib import Path; from archive_contract.manifest import Manifest; from archive_contract.exports.eml import to_eml; p=Path('examples/sample-package'); print(to_eml(Manifest.model_validate_json((p/'datapackage.json').read_text()), root=p)[:2000])\""],"posted_at":"2026-11-13T12:03:16.359706-06:00","signed_at":"2026-11-13T12:05:05.509571-06:00"},"messages":[{"id":1,"card":"plan","from":"session","action":"note","text":"Forwarded from Plan 1 (folder d65ecf18be29). The note reached the session that handed this folder over, not you. Plan 1 says it is settled: the repo is research-in-a-box, one repo with a uv workspace. The contract lives at packages/contract and is published as its own wheel, archive-contract (import archive_contract). The local tool (packages/tool, command cruise) and the backend (packages/backend) depend on it. The JSON Schema generated from the contract is committed under packages/web/ and checked for drift by just check in CI. Tooling: Python \u003e=3.12, ruff, mypy strict with the Pydantic plugin, pytest, hatchling. The sample package is yours, as agreed.","at":"2026-11-12T23:21:50.909038-06:00","state":"answered","claim":"4e7a5c53aeb9f342","sender":{"project":"personal"}},{"id":2,"card":"DIRN","from":"user","action":"direction","at":"2026-11-12T23:23:34.221051-06:00","state":"answered","claim":"2949e36e9ef43b48"},{"id":3,"card":"plan","from":"session","action":"note","text":"From Plan 1, a correction to my last note: nothing is published to PyPI. archive-contract (import archive_contract) is still its own package at packages/contract, but it is used only through uv workspace sources. cruise installs from the git repo with uv, which resolves the contract from the same checkout.","at":"2026-11-12T23:24:18.779881-06:00","state":"answered","claim":"b7611bbf8a64edce","sender":{"project":"personal","folder":"d65ecf18be29"}},{"id":4,"card":"UNDR","from":"user","action":"confirm","at":"2026-11-12T23:32:04.390012-06:00","state":"answered","claim":"f9eb8e7e201ffbbb"},{"id":5,"card":"DCSN1","from":"user","action":"note","text":"wouldn't our pipeline require a license?","at":"2026-11-12T23:32:47.930766-06:00","state":"answered","claim":"a0d252927a36ae02"},{"id":6,"card":"DCSN1","from":"agent","action":"reply","text":"Yes: publishing should require it, and the pipeline (Plan 7) is the right place to enforce that. The format still has to be able to say \"no license yet\", because people clean and package data with the local tool before anyone settles the rights, and the audit has to report the gap. So the question is only what counts as enough to publish. I've revised the card: A is now \"publish requires a license or a stated rights status\" and is my recommendation. D is new: publish requires a real license, with nothing else accepted. B, which publishes the record without its files, stays as an option but is no longer recommended.","at":"2026-11-12T23:33:11.9569-06:00","answers":[5]},{"id":7,"card":"plan","from":"user","action":"note","text":"are we building a generic pipeline or are we trying to build for FEMC data again?","at":"2026-11-12T23:33:12.034278-06:00","state":"answered","claim":"2fbe8ac29188da4d"},{"id":8,"card":"plan","from":"agent","action":"reply","text":"Generic. You're right to call it out: I had let FEMC creep back in as the examples and as the reason behind several recommendations, which is the same mistake the first Plan 2 made. I've rewritten all six cards and the calls that leaned on FEMC. Each example is now an ordinary research case, and each reason rests on the standards (Frictionless, DataCite, EML, schema.org) or on general repository practice. None of the recommendations changed: each one stood without FEMC. I've also recorded your note as a principle: FEMC is only the test afterwards, never the example or the reason for a design choice.","at":"2026-11-12T23:34:26.301193-06:00","answers":[7]},{"id":9,"card":"DCSN1","from":"user","action":"choose","option":"A","at":"2026-11-12T23:52:35.122748-06:00","state":"answered","claim":"3d9acdeb375f52ce"},{"id":10,"card":"DCSN2","from":"user","action":"note","text":"can we offer to rename them?","at":"2026-11-12T23:53:05.900673-06:00","state":"answered","claim":"cdbf74c330ffefce"},{"id":11,"card":"DCSN2","from":"agent","action":"reply","text":"Yes, that is option C. Source names are kept by default, and the local tool offers a rename, for example 'Temp (°C)' to temp_c. If you accept, the new name goes into the tidy table, the original is kept on the field as archive:sourceName, and the rename is recorded in changes.jsonl. Nothing is renamed without that yes, and the files in original/ are never touched. All the format needs for this is the one optional sourceName property. How the tool words the offer belongs to Plan 3.","at":"2026-11-12T23:53:12.816705-06:00","answers":[10]},{"id":12,"card":"DCSN2","from":"user","action":"choose","option":"C","at":"2026-11-12T23:54:05.745642-06:00","state":"answered","claim":"20ec5e91ae0f5c00"},{"id":13,"card":"plan","from":"user","action":"note","text":"Open the diazo planning folder\n /Users/courtschuett/GitHub/personal/research-archive-in-a-box/docs/specs/2026-11-12-generic-package-format-and-cont\n ract with diazo_open (the diazo skill) and continue it. DCSN1 (A) and DCSN2 (C) are decided; DCSN3 to DCSN6 are\n open, and the AGNT calls and principle PRIN1 are posted.'","at":"2026-11-12T23:55:50.796653-06:00","state":"answered","claim":"d3f38c311cfefa25"},{"id":14,"card":"plan","from":"agent","action":"reply","text":"This note reached me, the session that owns the folder now, so nothing moved. A note on this page always goes to whichever session owns the folder. To move the folder, paste that text into the other session's terminal pane instead. When that session runs diazo_open, it becomes the owner and the events go to it.","at":"2026-11-12T23:55:56.178014-06:00","answers":[13]},{"id":15,"card":"DCSN3","from":"user","action":"explain","at":"2026-11-12T23:57:08.625581-06:00","state":"answered","claim":"8e60473d912317e1"},{"id":16,"card":"DCSN3","from":"agent","action":"reply","text":"**The problem.** A column often holds short codes instead of words, such as `BR` for \"broken branch\". Without the list of what each code means, the data can't be read. The question is where in the package that list is written down.\n\n**Option B in practice.** The list is a tiny CSV of its own inside the package:\n\n`data/codes/damage-codes.csv`\n```\ncode,label,description\nBR,Broken branch,Branch snapped but still attached\nDF,Defoliation,More than 30% of leaves missing\n...\n```\n\nThe data table's schema in `datapackage.json` then points the three damage columns at it:\n```json\n\"foreignKeys\": [\n  {\"fields\": [\"damage_1\"], \"reference\": {\"resource\": \"damage-codes\", \"fields\": [\"code\"]}},\n  {\"fields\": [\"damage_2\"], \"reference\": {\"resource\": \"damage-codes\", \"fields\": [\"code\"]}},\n  {\"fields\": [\"damage_3\"], \"reference\": {\"resource\": \"damage-codes\", \"fields\": [\"code\"]}}\n]\n```\n\nWhat that gives you:\n- **One list, three columns.** Fix a label once and all three columns read it.\n- **Checking for free.** The Frictionless validator already reports any value in `damage_1` that isn't in the list, such as a typo `RB`, so we write no checking code for it.\n- **Readable on its own.** Someone who opens the folder without our tool sees a plain CSV of codes next to the data.\n- **The exports.** EML export turns each list into the `enumeratedDomain` EML expects on the column. The web app's column dictionary shows each code with its label.\n\n**Option A** writes the list into each column's entry in `datapackage.json` instead (Frictionless `categories`). That's fine for one column with three codes, but the 12-code damage list would be copied three times, and fixing a label means editing three places.\n\n**Option C** allows both, so every reader (the tool, the exports, the web app) has to handle two shapes.\n\n**A column with codes and no list**, like the species column in the example, is marked `\"archive:codeList\": \"undocumented\"`. The package is still valid, and Plan 3's audit lists it as a gap to fill. That works the same under any option.","at":"2026-11-12T23:57:30.656262-06:00","answers":[15]},{"id":17,"card":"DCSN3","from":"user","action":"choose","option":"B","at":"2026-11-12T23:59:20.967617-06:00","state":"answered","claim":"1c7db0ceda0f9614"},{"id":18,"card":"DCSN4","from":"user","action":"choose","option":"B","at":"2026-11-12T23:59:43.169841-06:00","state":"answered","claim":"886ac6721b82600f"},{"id":19,"card":"DCSN5","from":"user","action":"explain","at":"2026-11-13T00:00:18.074792-06:00","state":"answered","claim":"87088d052f0fff3d"},{"id":20,"card":"DCSN5","from":"agent","action":"reply","text":"**What a project is.** A project is the larger effort a dataset belongs to: a monitoring program, a grant or a long-term study. It produces many datasets over the years. Readers want to see \"this is part of the River Monitoring Program\" on each dataset page, and click through to every dataset from it.\n\n**Option A in practice.** The project is one small record of its own:\n\n`project.json`\n```json\n{\n  \"id\": \"river-monitoring\",\n  \"title\": \"River Monitoring Program\",\n  \"abstract\": \"Weekly water quality at 12 sites since 2004...\",\n  \"people\": [{\"name\": \"A. Researcher\", \"role\": \"lead\"}],\n  \"links\": [\"https://example.org/river-program\"]\n}\n```\n\nEach package's `datapackage.json` carries one line pointing at it:\n```json\n\"archive:project\": \"river-monitoring\"\n```\n\nWhat that gives you:\n- **One place to edit.** Update the program's abstract once and every dataset page shows the new text, because pages look it up rather than store a copy.\n- **Packages stay plain folders.** A package is still one self-contained folder you can zip, move or hand to someone, and it doesn't live inside the project.\n- **The exports.** When a package is exported, the archive writes the project's current title into its README and its DataCite and EML records. DataCite records the link as \"IsPartOf river-monitoring\", and EML has a project section for it. Both standards already treat a project as its own thing.\n- **Moving a dataset** to another project means changing one line.\n\n**Option B** copies the title and abstract into every package. Nothing new is stored, but after an abstract update, 20 yearly datasets show 20 slightly different versions until each one is edited.\n\n**Option C** nests the packages inside a project folder. Moving a dataset then means moving files, and a package can't stand alone. That breaks the settled rule that a package is a plain folder.\n\n**What A adds:** a small Project model in the contract and a place to store projects in the archive (Plan 4). A package with no project is fine: the line is simply left out.","at":"2026-11-13T00:00:36.386443-06:00","answers":[19]},{"id":21,"card":"DCSN5","from":"user","action":"choose","option":"A","at":"2026-11-13T00:11:28.189009-06:00","state":"answered","claim":"da9657f6c63f1a35"},{"id":22,"card":"DCSN6","from":"user","action":"choose","option":"A","at":"2026-11-13T00:11:41.512203-06:00","state":"answered","claim":"e735f1a9eac9743d"},{"id":23,"card":"spec","from":"user","action":"approve-spec","at":"2026-11-13T00:16:25.483708-06:00","state":"answered","claim":"7d8a11e7b27ed2fa"},{"id":24,"card":"PLAN1","from":"user","action":"approve-plan","at":"2026-11-13T08:46:29.858131-06:00","state":"answered","claim":"813669732102e21f"},{"id":25,"card":"PLAN2","from":"user","action":"approve-plan","at":"2026-11-13T10:46:53.67042-06:00","state":"answered","claim":"76b40e0a29e3945c"},{"id":26,"card":"DCSN7","from":"user","action":"note","text":"┌────────────────────────────────────────────────┬───────────────────────────────────────────────┐\n │ Plan                                           │ Session                                       │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 3 · Quality rules and the local tool (the CLI) │ personal/quality-rules-and-local-tool         │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 4 · Archive infrastructure (CDK)               │ personal/archive-infrastructure-cdk-construct │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 5 · FEMC migration and practice corpus         │ personal/femc-migration-and-practice-corpus   │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 6 · API and search                             │ personal/api-and-search                       │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 7 · Ingest, review and access                  │ personal/ingest-review-and-access-workflows   │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 8 · Web app                                    │ personal/web-app-catalog-and-curation         │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 9 · Agent layer                                │ personal/agent-layer-mcp-and-skills           │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 10a · Deployment skill and CI                  │ personal/deployment-skill-and-ci              │\n ├────────────────────────────────────────────────┼───────────────────────────────────────────────┤\n │ 10b · The FEMC report                          │ personal/femc-findings-report                 │\n └────────────────────────────────────────────────┴───────────────────────────────────────────────┘\n\n\nwe already have other plans.  will they address this?","at":"2026-11-13T11:24:09.876466-06:00","state":"answered","claim":"cbc899b880884b42"},{"id":27,"card":"DCSN7","from":"agent","action":"reply","text":"Not as briefed. None of those nine plans has started yet (no rounds, no decisions), and in the handoff none of them owns the format: they read the contract's fields, they don't add them. Plan 3 could add a rule like 'numeric column with no unit', but only once the format has a place to put a unit. Plan 5 is where these gaps will actually bite: converting FEMC records, it will find citations, purposes, units and open-ended dates with nowhere to go. I added option D: hand each gap to the plan that will hit it, by a note to Plans 3 and 5, and let them come back to the contract. I still recommend A, since adding the five small fields now is cheaper than changing the contract later under several plans that already read it.","at":"2026-11-13T11:24:47.060817-06:00","answers":[26]},{"id":28,"card":"DCSN7","from":"user","action":"note","text":"how do we close the other 3 gaps though?","at":"2026-11-13T11:32:13.351309-06:00","state":"answered","claim":"56c07eca5885d634"},{"id":29,"card":"DCSN7","from":"agent","action":"reply","text":"Each has a concrete fix. (6) Measurement scale: `archive:measurementScale` on a field, one of nominal, ordinal, interval, ratio or dateTime, which is exactly EML's own list, so the export writes it instead of guessing. That's as small as the first five, so I moved it into A. (7) Related columns: `archive:ancillaryOf` on the dependent column, naming the main column and a role (uncertainty, detection-limit or quality-flag), the same idea as the CF conventions' ancillary_variables. Exports have no standard place for it, so it shows in the README's column dictionary and EML's attribute definition. (8) A shapefile's attribute table: an `archive:attributes` Table Schema on the vector resource, which EML writes as the spatialVector's attributeList and the README shows like any table's columns; the validator checks it against the .dbf. B is now all eight with these designs, about one more task than A.","at":"2026-11-13T11:32:36.915755-06:00","answers":[28]},{"id":30,"card":"DCSN7","from":"user","action":"choose","option":"B","at":"2026-11-13T11:33:31.648905-06:00","state":"answered","claim":"4aad78fe9c40a05c"},{"id":31,"card":"PLAN3","from":"user","action":"approve-plan","at":"2026-11-13T11:41:31.686286-06:00","state":"answered","claim":"0fcfbb209eac0eb8"},{"id":32,"card":"SIGNOFF","from":"user","action":"sign-off","at":"2026-11-13T12:05:05.509571-06:00","state":"answered","claim":"7f14bf7c2072c314"},{"id":33,"card":"plan","from":"session","action":"note","text":"From Plan 6 (API and search, folder a40cd8cd2d67), a question about ownership and order. Plan 7 isn't planned yet, and the submission and review records (what a submission and a review event hold, the review-policy setting) are Plan 7's to decide; Plan 4's spec says so for review events. My proposal: Plan 6 builds the read side first, on what reindex already loads (the catalog file, dataset/project/file read endpoints, restricted download links, download counts, CLI sign-in). The submission, review and settings endpoints become a later Plan 6 plan, written once Plan 7 has decided those records. I'd also like Plan 6 to write the catalog file from a function in archive-backend that reindex calls now and Plan 7's publish step calls later, so it is never written two ways. Is that split and order fine with you, or should the write endpoints move to Plan 7 outright? Silence by the time Court answers my first round means I'll take it as fine.","at":"2026-11-13T21:15:20.41758-06:00","state":"answered","claim":"0abc990c9ad73a66","sender":{"project":"personal","folder":"a40cd8cd2d67"}}]},"view":{"status":{"DCSN1":"decided","DCSN2":"decided","DCSN3":"decided","DCSN4":"decided","DCSN5":"decided","DCSN6":"decided","DCSN7":"decided"},"step_status":{},"waiting_on":{},"need_you":0,"needs":[],"by_agent":14,"spec_hash":"ae37f7aaefa571fa594832c66fe67e61bf5c01ea3a2c3f4a98e22de6eadd7f47","plan_hashes":{"PLAN1":"daafc8ef92d405db2ee99ac79d9d0d8440ee0e89b034693abf5895a761c2e465","PLAN2":"79c66f8263b96913a9fceaaacec3bb350f7e630b8d8c1263a9777079a2de19e3","PLAN3":"436ec49749e1e54a5515f5aafd1bd24a936596a52cb1fb73afbdc34c415a2b80"},"plans":{"PLAN1":"done","PLAN2":"done","PLAN3":"done"},"task_status":{"TASK1":"done","TASK10":"done","TASK11":"done","TASK12":"done","TASK13":"done","TASK14":"done","TASK15":"done","TASK2":"done","TASK3":"done","TASK4":"done","TASK5":"done","TASK6":"done","TASK7":"done","TASK8":"done","TASK9":"done"},"task_waits":{},"waits_by":[],"need_agent":0,"changed":[],"diffs":{"PLAN3":{"added":1,"removed":1,"hunks":[{"section":"Task 3: Exports, import and the sample package","before":39,"lines":[{"op":"same","text":""},{"op":"same","text":"### Task 3: Exports, import and the sample package"},{"op":"same","text":""},{"op":"del","text":"**Does:** Carries the new fields through: README (citation, purpose, units, scale, related columns, the vector resource's attribute columns, project key on","mtime":0},{"path":"documents/femc-paper-test.md","mtime":0},{"path":"plans/1-contract-models-and-sample.md","mtime":0},{"path":"plans/2-exports-import-and-paper-test.md","mtime":0},{"path":"plans/3-fields-from-the-paper-test.md","mtime":0},{"path":"spec.md","mtime":0},{"path":"wrap-up.md","mtime":0}],"names":{"README.md":"2026-11-12-generic-package-format-and-contract.md","decisions.md":"2026-11-12-generic-package-format-and-contract-decisions.md","plans/1-contract-models-and-sample.md":"2026-11-12-generic-package-format-and-contract-plan-1-contract-models-and-sample.md","plans/2-exports-import-and-paper-test.md":"2026-11-12-generic-package-format-and-contract-plan-2-exports-import-and-paper-test.md","plans/3-fields-from-the-paper-test.md":"2026-11-12-generic-package-format-and-contract-plan-3-fields-from-the-paper-test.md","record.html":"2026-11-12-generic-package-format-and-contract.html","spec.md":"2026-11-12-generic-package-format-and-contract-spec.md","wrap-up.md":"2026-11-12-generic-package-format-and-contract-wrap-up.md"}},"spec":"---\ndiazo: research-archive-in-a-box/generic-package-format-and-contract\nfile: spec\nstatus: approved\napproved: 2026-11-13T00:16:25-06:00\nhash: ae37f7aaefa571fa594832c66fe67e61bf5c01ea3a2c3f4a98e22de6eadd7f47\nrests_on: [AGNT1, AGNT11, AGNT8, DCSN1, AGNT2, AGNT3, DCSN6, DCSN2, DCSN3, AGNT5, DCSN4, DCSN5, AGNT4, AGNT6, AGNT10, AGNT7, AGNT9, DCSN7]\nrecord: README.md\n---\n\n# The package format and the archive_contract package\n\n## Goal\n\nA written package format and a Python contract package, `archive-contract` (import `archive_contract`) at `packages/contract`, that the local tool, the backend, the web app's schema and the agent layer all build on. The format is designed from Frictionless Data Package v2, EML, DataCite and schema.org and from what any research group's data looks like. A committed, invented sample package exercises all of it, and FEMC's six practice datasets are written down in it afterwards as a test.\n\n## The package folder\n\nA package is a plain folder that is also a valid Frictionless v2 Data Package:\n\n```\nmy-dataset/\n  datapackage.json   the manifest\n  data/              tidy tables (CSV now, Parquet later)\n  data/codes/        code-list tables\n  original/          untouched source files\n  docs/              methods, protocols, field sheets\n  changes.jsonl      every cleaning step, with evidence\n  checksums.sha256   one line per file in the package\n  README.md          generated from the manifest, never edited\n```\n\nRules that hold everywhere:\n\n- Standard Frictionless properties are left out when unknown, never set to null.\n- Our additions sit under the `archive:` prefix and may be null.\n- A resource's `format` (and `mediatype`) is the only place a file type appears. Columns are described by logical type, so adding Parquet later changes no field definitions.\n\nRests on: AGNT1, AGNT11\n\n## The manifest's fields\n\nCore fields, required before a package can be published: a `title`; a `description` of at least 50 characters; at least one creator (a contributor with the creator role); rights (next section); and at least one described resource. This is the union of what DataCite, Google Dataset Search and Frictionless require.\n\nThe archive fills in publisher, publication year, identifier and resource type at publish, from its config.\n\nRecommended fields, following DataCite's and Google's recommended lists: keywords, other contributors, temporal coverage (an end date or `ongoing`), spatial coverage (a bounding box), related identifiers, funding and methods. A profile can promote any of them to required.\n\nTwo separate verdicts are recorded in the manifest and never merged: `archive:validation` (structurally valid or not, by which contract version, when) and `archive:quality` (the counts of findings by severity from the last audit). Valid structure says nothing about quality, and the reverse.\n\n`archive:legacyIdentifiers` holds any identifiers the data had elsewhere, as a list of `{scheme, value}`, such as `{scheme: \"eml-package-id\", value: \"knb-lter-xyz.12.3\"}`.\n\nRests on: AGNT8\n\n## Rights\n\nA package states its rights in one of two ways: one or more licenses in Frictionless `licenses` (an SPDX id or a license URL), or `archive:rightsStatus` with a statement. The statuses are:\n\n- `public-domain`\n- `third-party`, with where the terms are set\n- `all-rights-reserved`, with the statement\n- `undetermined`\n\nThe local tool packages and audits data with `undetermined`, and the audit reports it. Publishing (Plan 7) refuses a package until it has a license or a stated status other than `undetermined`.\n\nRests on: DCSN1\n\n## Resources and their kinds\n\nEvery resource has `archive:kind`, one of `table`, `vector`, `raster`, `document`, `media`, `file` or `linked`. A resource with no kind is read as `file`. Frictionless's own `type` stays `table` for tables and is left out otherwise.\n\n- **Several files that only work together** (a shapefile set, a raster with its world file) are one resource. `path` names the main file (the `.shp`), and `archive:files` lists every member file with its size and hash. Checksums, previews and the web app's file list read the member list.\n- **The same data in several formats** (a table as CSV and XLSX): the copy is its own resource with `archive:alternateOf` naming the primary. Only the primary carries the schema.\n- **Data held elsewhere**: `archive:kind: linked`, `path` is the remote URL, and there is no hash or size. Compatibility tests run the frictionless library with remote fetching off.\n\nRests on: AGNT1, AGNT2, AGNT3, DCSN6\n\n## Columns\n\nA table's columns use Frictionless Table Schema, with three additions.\n\n- **Names.** Source column names are kept. Frictionless `title` holds a readable label, `description` the definition. The local tool may propose a rename; when the person accepts, the new name goes into the tidy table, the old one into `archive:sourceName` on the field, and the rename into `changes.jsonl`.\n- **Code lists.** Each code list is a CSV table under `data/codes/` with `code`, `label` and `description` columns. A column that uses one points at it with a Frictionless foreign key, so one list serves many columns and Frictionless validation checks every code. A column that holds codes with no list is marked `archive:codeList: \"undocumented\"`.\n- **Sensitivity.** `archive:sensitivity` on a field is one of `personal`, `sensitive-location` or `confidential`. No flag means not sensitive.\n\nRests on: DCSN2, DCSN3, AGNT5\n\n## Versions and identifiers\n\nA package has one stable `id` across all its versions, and a `version` of `1`, `2`, `3` and so on. Changing, adding or removing a file makes the next version. A metadata edit updates the current version in place, and each edit is appended to `archive:metadataHistory` (when, who, which fields). When DOIs are on, each version gets its own DOI.\n\nRests on: DCSN4\n\n## Projects\n\nA project (a monitoring program, a grant, a long-term study) is its own small record, `project.json`, with an `id`, `title`, `abstract`, `people` and `links`. A package names its project with `archive:project: \u003cid\u003e`, or leaves it out. A package never copies the project's text and never sits inside a project folder.\n\nWhen a package is exported, the project's current title goes into its README, its DataCite record as a related identifier of type IsPartOf, and its EML project element.\n\nRests on: DCSN5\n\n## Access levels\n\nEach package has one `archive:access` level: `open`, `restricted`, `by-request` or `description-only`. Unpublished is a state of the package in the archive, not an access level.\n\nRests on: AGNT4\n\n## Profiles and the archive config\n\nA profile is a YAML file in the contract (`profiles/core.yaml`, `profiles/ecology.yaml`), read into a `Profile` model. It lists the recommended fields it promotes to required, its vocabularies and the ids of the rules it switches on. The rules themselves are code in Plan 3. The core profile holds only the core fields above.\n\nThe archive config file, read into an `ArchiveConfig` model, is the one file an adopter edits. It picks the profiles and sets required fields, vocabularies, themes, licenses and the access levels offered, plus the publisher name the archive fills in at publish. How it maps to the CDK construct is Plan 4's.\n\nRests on: AGNT6\n\n## The change log and findings\n\nBoth formats are models in the contract, drafted here and confirmed by Plan 3 when it starts.\n\n- **`Change`**, one line of `changes.jsonl`: an id, when, who made it (person, tool or agent) and who accepted it, its kind (such as `rename`, `retype`, `recode`, `fix-value`), its target (resource and field), before and after, the reason, and the evidence (row numbers or values).\n- **`Finding`**: the rule id, a severity (`error`, `warning` or `note`), a message, the target, the evidence, and an optional suggested fix.\n\nRests on: AGNT10, DCSN2\n\n## Exports and import\n\nGenerated from the manifest, never edited by hand:\n\n- EML 2.2.0, with code lists as enumerated domains and the project as the project element.\n- A DataCite record and schema.org Dataset JSON-LD.\n- `README.md`.\n\nImport reads standard EML 2.1.1 and 2.2.0 into a manifest. Tolerating one archive's non-standard EML is Plan 5's.\n\nRests on: AGNT7, DCSN3, DCSN5\n\n## The contract package\n\n`packages/contract/src/archive_contract/`:\n\n| Module | Holds |\n| --- | --- |\n| `manifest.py` | the package model and its `archive:` additions |\n| `resources.py`, `fields.py` | resources, member files, columns |\n| `rights.py`, `project.py` | rights statuses, the project record |\n| `changes.py`, `findings.py` | `Change` and `Finding` |\n| `profile.py`, `config.py`, `profiles/*.yaml` | profiles and the archive config |\n| `validate.py` | structural validation |\n| `schema.py` | JSON Schema generation (from Plan 1) |\n| `exports/` | `eml.py`, `datacite.py`, `schemaorg.py`, `readme.py` |\n| `imports/eml.py` | EML import |\n\nThe JSON Schema generated from the models replaces the skeleton's empty one under `packages/web/`, and Plan 1's drift check keeps it current. The frictionless library is a test-only dependency.\n\nRests on: AGNT11\n\n## The sample package\n\n`examples/sample-package/`: a small stream temperature study at invented sites, licensed CC-BY-4.0. It has a logger table with a code-list table, a site shapefile set, a small raster, a methods document, a site photo, the logger table again as XLSX, a linked resource and ongoing coverage. Known gaps are seeded in and listed in its README, so Plan 3's rules have predictable findings.\n\nRests on: AGNT9, DCSN3, DCSN6\n\n## Fields the paper test added\n\nWriting FEMC's six datasets down in the format found eight things it couldn't hold. Each is now an optional field:\n\n- **A start with no known end:** temporal coverage takes `end: \"unknown\"` beside a real end date or `ongoing`.\n- **Units:** `archive:unit` on a field, free text such as `degC` or `mg/L`. EML writes it in place of `unknown`.\n- **Measurement scale:** `archive:measurementScale` on a field, one of `nominal`, `ordinal`, `interval`, `ratio` or `dateTime` (EML's list). EML uses it instead of guessing from the type.\n- **Preferred citation:** `archive:citation` on the package, the citation the data's authors ask for. The README and schema.org (`creditText`) show it.\n- **Purpose:** `archive:purpose` on the package, why the data was collected. EML writes it as `purpose`, DataCite as a description of type Other.\n- **Project keywords:** `keywords` on the project record, written into EML's project.\n- **Related columns:** `archive:ancillaryOf: {field, role}` on a column that qualifies another, with role `uncertainty`, `detection-limit` or `quality-flag`. Shown in the README's column dictionary, and written to EML as an annotation on the attribute.\n- **A vector resource's attribute table:** `archive:attributes`, a Table Schema on a `vector` resource describing its attribute table. EML writes it as the spatialVector's attribute list, and the validator checks its columns against the `.dbf`.\n\nThe EML import reads each of these back where EML has a place for it.\n\nRests on: DCSN7\n\n## Risk and cost\n\nRisk: low. The work adds code, docs and one example folder to a repo with no users yet. A mistake is undone by editing the contract; nothing is published or deployed, and no data from `practice-data/` is committed.\n\nCost: no steps for you beyond reviewing. No new programs: the frictionless library is a test-only Python dependency, and PyYAML reads the profiles.\n\nRests on: AGNT11\n\n## Left out\n\n- The quality rules and the commands that run them (Plan 3).\n- Tolerating FEMC's EML quirks, and converting FEMC's data (Plan 5).\n- Storage, tables and the API (Plans 4 and 6), and the publish check that enforces rights (Plan 7).\n- Parquet: only the room for it.\n- Per-resource access levels: one level per package for now.\n\nRests on: DCSN1, AGNT4\n\n## How we'll know it works\n\n- The sample package passes the frictionless library's validation and our own structural validation.\n- Its EML export imports back to the same manifest fields; its DataCite and schema.org exports validate against their schemas.\n- Each of FEMC's six practice datasets is written down in the format on paper, with anything it can't express listed.\n- `just check` passes with the generated JSON Schema committed.\n\nRests on: AGNT7, AGNT9\n","plans":{"PLAN1":"---\ndiazo: research-archive-in-a-box/generic-package-format-and-contract\nfile: PLAN1\nstatus: done\napproved: 2026-11-13T08:46:29-06:00\nhash: daafc8ef92d405db2ee99ac79d9d0d8440ee0e89b034693abf5895a761c2e465\nrests_on: [AGNT1, AGNT10, AGNT11, AGNT2, AGNT3, AGNT4, AGNT5, AGNT6, AGNT8, AGNT9, DCSN1, DCSN2, DCSN3, DCSN4, DCSN5, DCSN6]\nrecord: README.md\n---\n\n# PLAN1: The contract models, validation, schema and sample package\n\n## Spec\n\n`docs/specs/2026-11-12-generic-package-format-and-contract/spec.md`, approved 2026-11-13.\n\n## The change\n\nFill `packages/contract` (the empty package from Plan 1's skeleton) with the Pydantic models the spec names, a structural validator, and the real JSON Schema in place of the skeleton's empty one. Then build the committed sample package under `examples/sample-package/` and prove it passes both our validator and the frictionless library.\n\nSerialisation rule for every model: standard Frictionless properties are dropped when unset (never written as null); `archive:` properties are written under their prefixed names and may be null. Models accept unknown properties and keep them, since Frictionless allows extra properties.\n\nRisk: low. New code and one example folder in a repo with no users; undone by editing or reverting the PR.\n\n## Left out\n\n- Exports and EML import: PLAN2.\n- The quality rules and the publish check (Plans 3 and 7). The validator checks structure only.\n- Anything under `practice-data/`.\n\n## Where\n\nThe repo `schuettc/research-in-a-box` once Plan 1's skeleton is pushed. Work in a worktree at `/Users/courtschuett/GitHub/personal/.worktrees/research-in-a-box/plan2-contract-models`, branch `plan2-contract-models` from `origin/main`, and finish with a PR with auto-merge on.\n\n### Task 1: Resource, field and rights models\n\n**Does:** Adds `fields.py` (a Table Schema field with `archive:sourceName`, `archive:codeList` and `archive:sensitivity`, plus foreign keys on the schema), `resources.py` (a resource with `archive:kind`, `archive:files` member list, `archive:alternateOf`, and the linked rule: a URL path with no hash or bytes) and `rights.py` (licenses, `archive:rightsStatus` with its statement, and the four statuses) with one test per rule the spec states.\n**Files:** `packages/contract/src/archive_contract/fields.py`, `resources.py`, `rights.py`, `packages/contract/tests/test_resources.py`, `test_fields.py`, `test_rights.py`\n**Checks:** `uv run pytest packages/contract`; `just check-python`\n**Serves:** DCSN1, DCSN2, DCSN3, DCSN6 (rests on calls AGNT1, AGNT2, AGNT3, AGNT5)\n\nTests cover: a resource with no kind reads as `file`; a linked resource with a hash is refused; `third-party` and `all-rights-reserved` need a statement; an unset standard property is absent from the dump while an unset `archive:` property may be null.\n\n### Task 2: Manifest and project models\n\n**Does:** Adds `manifest.py` (the package: core and recommended fields, `id`, integer-string `version`, `archive:project`, `archive:access`, `archive:legacyIdentifiers`, `archive:metadataHistory`, `archive:validation`, `archive:quality`, temporal coverage with `ongoing`, spatial coverage as a bounding box) and `project.py` (the `project.json` record) with tests.\n**Files:** `packages/contract/src/archive_contract/manifest.py`, `project.py`, `packages/contract/tests/test_manifest.py`, `test_project.py`\n**Checks:** `uv run pytest packages/contract`; `just check-python`\n**Serves:** DCSN4, DCSN5 (rests on calls AGNT4, AGNT8)\n\nThe core fields are optional on the model (a package can be built and audited without them); a `missing_core_fields(manifest)` helper lists which are absent, for Plan 3's audit and Plan 7's publish check to call.\n\n### Task 3: Change, Finding, Profile and ArchiveConfig\n\n**Does:** Adds `changes.py` and `findings.py` with the drafted `Change` and `Finding` shapes, `profile.py` reading `profiles/core.yaml` and `profiles/ecology.yaml` into `Profile`, and `config.py` with `ArchiveConfig`, each with tests; adds PyYAML as a dependency.\n**Files:** `packages/contract/src/archive_contract/changes.py`, `findings.py`, `profile.py`, `config.py`, `profiles/core.yaml`, `profiles/ecology.yaml`, `packages/contract/pyproject.toml`, `uv.lock`, matching tests\n**Checks:** `uv run pytest packages/contract`; `just check-python`\n**Serves:** DCSN2 (rests on calls AGNT6, AGNT10)\n\nThe ecology profile promotes temporal and spatial coverage and methods to required and names its rule ids; the rule ids are placeholders that Plan 3 owns, listed in a comment as such.\n\n### Task 4: Structural validation\n\n**Does:** Adds `validate.py` with `validate_package(path) -\u003e list[Finding]`: the manifest parses; every foreign key, `archive:alternateOf` and `archive:files` entry points at something that exists; every file listed has the size and hash recorded; `checksums.sha256` matches the files. Each problem is a `Finding` with severity `error` and the rule id `structure.\u003cname\u003e`.\n**Files:** `packages/contract/src/archive_contract/validate.py`, `packages/contract/tests/test_validate.py` and small fixture folders under `packages/contract/tests/fixtures/`\n**Checks:** `uv run pytest packages/contract`; `just check-python`\n**Serves:** DCSN3, DCSN6 (rests on call AGNT11)\n\nOne fixture per failure: a foreign key to a missing resource, a member file missing, a wrong hash, a stale checksums line.\n\n### Task 5: The real JSON Schema\n\n**Does:** Points `archive_contract.schema` at the manifest model (the skeleton's empty `ArchiveContract` model is removed) and also emits the `Project`, `Change`, `Finding` and `ArchiveConfig` schemas under `$defs`; regenerates the committed schema with `just schema`.\n**Files:** `packages/contract/src/archive_contract/schema.py`, `packages/contract/tests/test_schema.py`, `packages/web/src/schema/archive-contract.schema.json`\n**Checks:** `just check` (includes the drift check)\n**Serves:** none (rests on calls AGNT6, AGNT11)\n\n### Task 6: The sample package\n\n**Does:** Builds `examples/sample-package/`, a stream temperature study at invented sites under CC-BY-4.0, from a committed build script, and adds a test that validates it with `validate_package` and with the frictionless library (a dev dependency, remote fetching off).\n**Files:** `examples/sample-package/` (datapackage.json, data/, data/codes/, original/, docs/, changes.jsonl, checksums.sha256, README.md), `examples/sample-package/_build/make.py`, `packages/contract/tests/test_sample_package.py`, root `pyproject.toml` dev dependencies (frictionless, pyshp, openpyxl), `uv.lock`\n**Checks:** `uv run python examples/sample-package/_build/make.py \u0026\u0026 git diff --exit-code examples/sample-package` (the build is reproducible); `uv run pytest packages/contract/tests/test_sample_package.py`; `just check`\n**Serves:** DCSN3, DCSN6 (rests on calls AGNT1, AGNT2, AGNT3, AGNT9)\n\nContents, all small and invented:\n\n- `data/logger.csv`: about 60 rows of water temperature at three sites, with a `condition` column linked to `data/codes/condition-codes.csv` by foreign key.\n- `data/sites/`: a point shapefile set (`.shp`, `.shx`, `.dbf`, `.prj`) written with pyshp, as one `vector` resource with its members listed.\n- `data/depth.asc` and `data/depth.prj`: a tiny ESRI ASCII grid as one `raster` resource.\n- `data/logger.xlsx`: the logger table again, with `archive:alternateOf: logger`.\n- `docs/methods.md` (`document`) and `docs/site-photo.png` (`media`, a small generated image).\n- A `linked` resource pointing at `https://example.org/stream-temperature/discharge.csv`.\n- Temporal coverage `ongoing`; one accepted rename in `changes.jsonl`.\n\nSeeded gaps, listed in the README: one column with no description, one column whose description repeats its name, a coded column marked `archive:codeList: \"undocumented\"`, and a constant column. The README itself is hand-written for now and replaced by the generated one in PLAN2.\n","PLAN2":"---\ndiazo: research-archive-in-a-box/generic-package-format-and-contract\nfile: PLAN2\nstatus: done\napproved: 2026-11-13T10:46:53-06:00\nhash: 79c66f8263b96913a9fceaaacec3bb350f7e630b8d8c1263a9777079a2de19e3\nrests_on: [AGNT1, AGNT11, AGNT3, AGNT7, AGNT8, DCSN1, DCSN3, DCSN4, DCSN5, DCSN6]\nrecord: README.md\n---\n\n# PLAN2: Exports, EML import and the FEMC paper test\n\n## Spec\n\n`docs/specs/2026-11-12-generic-package-format-and-contract/spec.md`, approved 2026-11-13. PLAN1 (merged in research-in-a-box#1) built the models this plan reads: `Manifest`, `Resource`, `Field`, `TableSchema`, `Project`, `RightsStatus`, `License` in `archive_contract`.\n\n## The change\n\nAdd the four exports the spec names (EML 2.2.0, DataCite, schema.org JSON-LD, README) and EML import (2.1.1 and 2.2.0), all generated from the manifest and never edited by hand. Prove them on the sample package: EML export validates against the EML 2.2.0 schema and imports back to the same manifest fields; DataCite validates against DataCite's JSON Schema; schema.org carries every field Google requires. Then write each of FEMC's six practice datasets down in the format on paper, listing anything the format can't express.\n\nRisk: low. New code and one document in a repo with no users; undone by reverting the PR. The paper test describes FEMC's public metadata and commits no FEMC data files.\n\n## Left out\n\n- Tolerating FEMC's non-standard EML (the misspelled `distibution` tag and others): Plan 5.\n- Converting FEMC's data into packages: Plan 5.\n- A DataCite XML export: the JSON form is what DataCite's REST API takes, and Plan 7 mints DOIs through it.\n- Exporting a whole project on its own: a project appears inside each package's exports.\n\n## Where\n\nRepo `schuettc/research-in-a-box`. Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-in-a-box/plan2-exports-import`, branch `plan2-exports-import` from `origin/main`, finishing with a PR merged once CI passes.\n\n### Task 1: README export\n\n**Does:** Adds `exports/readme.py` with `render_readme(manifest, project=None) -\u003e str`: title, description, citation line, creators, rights, project title, access level, coverage, and one section per resource with its kind and, for tables, the column dictionary (name, title, type, description, code list). Switches the sample build to write the generated README, and moves the sample's list of seeded gaps to `examples/sample-package/_build/GAPS.md`.\n**Files:** `packages/contract/src/archive_contract/exports/__init__.py`, `exports/readme.py`, `packages/contract/tests/test_export_readme.py`, `examples/sample-package/_build/make.py`, `examples/sample-package/_build/GAPS.md`, `examples/sample-package/README.md`, `examples/sample-package/checksums.sha256`\n**Checks:** `uv run pytest packages/contract`; `uv run python examples/sample-package/_build/make.py \u0026\u0026 git diff --exit-code examples/sample-package`; `just check`\n**Serves:** DCSN3, DCSN5 (rests on call AGNT11)\n\nTests: the sample's README names every resource and every column; a field marked `archive:codeList: \"undocumented\"` is shown as undocumented; a missing standard property prints nothing, not \"None\".\n\n### Task 2: DataCite export\n\n**Does:** Adds `exports/datacite.py` with `to_datacite(manifest, project=None, publisher=..., year=..., identifier=None) -\u003e dict` producing DataCite 4.x JSON: creators, titles, publisher, publicationYear, types (resourceTypeGeneral Dataset), descriptions (Abstract, plus Methods when present), subjects from keywords, dates (Collected from temporal coverage), geoLocations from the bounding box, rightsList from licenses or the rights statement, relatedIdentifiers (including IsPartOf the project), fundingReferences and version. Validates against DataCite's JSON Schema, vendored as a test fixture with its source URL and licence noted.\n**Files:** `packages/contract/src/archive_contract/exports/datacite.py`, `packages/contract/tests/test_export_datacite.py`, `packages/contract/tests/fixtures/schemas/datacite/`, root `pyproject.toml` dev dependency jsonschema, `uv.lock`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN1, DCSN4, DCSN5 (rests on call AGNT11)\n\nTests: the sample's record validates; an `undetermined` rights status is refused with a clear error (it can't be published); `third-party` writes its statement into rightsList.\n\n### Task 3: schema.org export\n\n**Does:** Adds `exports/schemaorg.py` with `to_schemaorg(manifest, project=None, url=None) -\u003e dict`, a schema.org `Dataset` JSON-LD: name, description, creator, license, keywords, temporalCoverage (an open interval `start/..` when ongoing), spatialCoverage as a GeoShape box, distribution (one DataDownload per non-linked resource with encodingFormat), isPartOf the project, version and identifier.\n**Files:** `packages/contract/src/archive_contract/exports/schemaorg.py`, `packages/contract/tests/test_export_schemaorg.py`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN5 (rests on call AGNT11)\n\nTests: Google's required name and 50-to-5000-character description are present; ongoing coverage gives `2024-06-01/..`; a linked resource appears with its remote URL as contentUrl.\n\n### Task 4: EML 2.2.0 export\n\n**Does:** Adds `exports/eml.py` with `to_eml(manifest, project=None) -\u003e str`: dataset title, creators, abstract, keywords, intellectual rights, coverage (temporal and geographic), methods, project, one `dataTable` per table resource with its attributes (code lists as `enumeratedDomain`, read from the code-list table; `archive:codeList: \"undocumented\"` as a text domain with a note), and `otherEntity` for every other local resource. Validates against the EML 2.2.0 XSD with lxml; the XSDs are vendored as a test fixture with their source and licence noted.\n**Files:** `packages/contract/src/archive_contract/exports/eml.py`, `packages/contract/tests/test_export_eml.py`, `packages/contract/tests/fixtures/schemas/eml-2.2.0/`, root `pyproject.toml` dev dependency lxml, `uv.lock`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN3, DCSN5 (rests on call AGNT7)\n\nThe export uses only the standard library's XML writer at run time; lxml is test-only, to validate.\n\n### Task 5: EML import\n\n**Does:** Adds `imports/eml.py` with `from_eml(xml: str) -\u003e Manifest` reading standard EML 2.1.1 and 2.2.0: title, creators, abstract, keywords, rights (a recognised licence URL or name becomes a license, other text becomes a `third-party` or `all-rights-reserved` status with the text as its statement), coverage, methods, project, and each `dataTable`'s attributes as fields (an `enumeratedDomain` becomes a code list, returned alongside the manifest as table rows to write under `data/codes/`). The original package id goes into `archive:legacyIdentifiers` with scheme `eml-package-id`. Round trip: `from_eml(to_eml(sample))` gives the same title, creators, description, keywords, rights, coverage, fields and code lists as the sample.\n**Files:** `packages/contract/src/archive_contract/imports/__init__.py`, `imports/eml.py`, `packages/contract/tests/test_import_eml.py`, `packages/contract/tests/fixtures/eml/` (one small invented 2.1.1 record and one 2.2.0 record)\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN1, DCSN3 (rests on calls AGNT7, AGNT8)\n\nStandard EML only: a record with a non-standard tag imports what is standard and returns a list of what it skipped, rather than failing.\n\n### Task 6: The FEMC paper test\n\n**Does:** Writes `docs/specs/2026-11-12-generic-package-format-and-contract/documents/femc-paper-test.md`: for each of the six practice datasets in `practice-data/femc/`, which resources it becomes and of which kind, how its rights are stated, its code lists, its legacy identifiers, its project, and what `from_eml` reads from its EML record and what it skips. Ends with a list of anything the format cannot express, each with the dataset that showed it. Runs `from_eml` on each record locally to fill in what is read and skipped; nothing from `practice-data/` is committed.\n**Files:** `docs/specs/2026-11-12-generic-package-format-and-contract/documents/femc-paper-test.md`\n**Checks:** `git status --porcelain --ignored practice-data` shows only `!! practice-data/`; `just check`\n**Serves:** DCSN1, DCSN3, DCSN5, DCSN6 (rests on calls AGNT1, AGNT3, AGNT8)\n\nAnything the paper test finds the format can't express is brought to the user as a decision before changing the contract.\n","PLAN3":"---\ndiazo: research-archive-in-a-box/generic-package-format-and-contract\nfile: PLAN3\nstatus: done\napproved: 2026-11-13T11:41:31-06:00\nhash: 436ec49749e1e54a5515f5aafd1bd24a936596a52cb1fb73afbdc34c415a2b80\nrests_on: [DCSN7]\nrecord: README.md\n---\n\n# PLAN3: The eight fields from the paper test\n\n## Spec\n\n`docs/specs/2026-11-12-generic-package-format-and-contract/spec.md`, section \"Fields the paper test added\" (DCSN7). PLAN1 and PLAN2 (merged in research-in-a-box#1 and #3) built the models, exports and EML import this plan extends.\n\n## The change\n\nAdd the eight optional fields the spec lists, carry each through the exports and the EML import where its standard has a place, check `archive:attributes` against the `.dbf` in the validator, and use every new field in the sample package so its round trip covers them. Then mark each gap closed in the paper test.\n\nRisk: low. Every field is optional, so existing packages stay valid; undone by reverting the PR.\n\n## Left out\n\n- Quality rules that use the new fields, such as \"numeric column with no unit\": Plan 3 (quality rules).\n- A unit vocabulary: `archive:unit` is free text for now.\n- Reading FEMC's non-standard EML into these fields: Plan 5.\n\n## Where\n\nRepo `schuettc/research-in-a-box`. Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-in-a-box/plan2-paper-test-fields`, branch `plan2-paper-test-fields` from `origin/main`, finishing with a PR merged once CI passes.\n\n### Task 1: The eight fields on the models\n\n**Does:** Adds to the models, each optional, with a test per rule: `end: \"unknown\"` on `TemporalCoverage` (exclusive with a real end and with `ongoing`); `archive:unit` and `archive:measurementScale` (nominal, ordinal, interval, ratio, dateTime) on `Field`; `archive:citation` and `archive:purpose` on `Manifest`; `keywords` on `Project`; `archive:ancillaryOf` (`field` naming another column in the same schema, `role` one of uncertainty, detection-limit, quality-flag) on `Field`; `archive:attributes` (a `TableSchema`) on `Resource`, allowed only when `archive:kind` is `vector`. Regenerates the committed JSON Schema.\n**Files:** `packages/contract/src/archive_contract/manifest.py`, `fields.py`, `resources.py`, `project.py`, matching tests, `packages/web/src/schema/archive-contract.schema.json`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN7\n\nTests: an ancillaryOf naming a missing column is refused; `archive:attributes` on a table resource is refused; `end: \"unknown\"` with `ongoing: true` is refused.\n\n### Task 2: Validator check for attribute tables\n\n**Does:** `validate_package` reads the `.dbf` header of a vector resource that has `archive:attributes` (with the standard library, from the member file listed in `archive:files`) and reports `structure.attributes-mismatch` for a column described but absent, or present but not described.\n**Files:** `packages/contract/src/archive_contract/validate.py`, `packages/contract/tests/test_validate.py`, a fixture under `packages/contract/tests/fixtures/`\n**Checks:** `uv run pytest packages/contract`; `just check`\n**Serves:** DCSN7\n\nReading the `.dbf` keeps to the package folder and refuses symlinks, as the rest of the validator does.\n\n### Task 3: Exports, import and the sample package\n\n**Does:** Carries the new fields through: README (citation, purpose, units, scale, related columns, the vector resource's attribute columns, project keywords); EML 2.2.0 (unit in place of `unknown`, measurementScale from the field when set, purpose, project keywords, an attribute annotation for the related column, spatialVector attributeList, open-ended coverage for `end: \"unknown\"`); schema.org (`creditText`, open interval for unknown end); DataCite (purpose as a description of type Other). `from_eml` reads back units, scales, purpose, project keywords and the spatialVector attribute list, and drops their entries from `skipped`. Adds every new field to the sample package (a unit and scale on each logger column, a citation, a purpose, an uncertainty column for temperature, attribute columns on the sites shapefile) and extends the round-trip test to compare them.\n**Files:** `packages/contract/src/archive_contract/exports/readme.py`, `exports/eml.py`, `exports/schemaorg.py`, `exports/datacite.py`, `imports/eml.py`, matching tests, `examples/sample-package/_build/make.py`, `examples/sample-package/` (regenerated)\n**Checks:** `uv run pytest packages/contract`; `uv run python examples/sample-package/_build/make.py \u0026\u0026 git diff --exit-code examples/sample-package` (after commit); `just check`\n**Serves:** DCSN7\n\nThe sample's EML export still validates against the EML 2.2.0 XSD. The paper test document gets a line under each of its eight gaps saying it is closed and by which field.\n"},"wrapup":"---\ndiazo: research-archive-in-a-box/generic-package-format-and-contract\nfile: wrap-up\nstatus: printed\nhash: 78715205d00700610fdbe6d668fc765a566b7935831811228401247265c12292\nrests_on: [PLAN1, PLAN2, PLAN3]\nrecord: README.md\n---\n\n# research-in-a-box now has a working package format: a Python contract that describes, validates and exports a dataset package, with a sample package to test against.\n\n## How it works now\n\nA dataset package is a plain folder that is also a valid Frictionless Data Package, and `archive_contract` reads it into typed models, checks its structure (references, member files, checksums, hashes, symlinks), and exports it as a README, DataCite, schema.org and EML 2.2.0. It can also read standard EML in. The format holds what research data actually carries: rights statuses beside licenses, code lists as small tables, shapefile sets as one resource, projects as their own record, units, measurement scales, related columns, preferred citations and coverage that is ongoing or has no known end. The committed sample package, an invented stream temperature study, uses all of it and rebuilds byte for byte, and FEMC's six practice datasets have been written down in the format as a test. Plans 3 to 9 can now build on the contract.\n\n## Results\n\n- Models, structural validation, the generated JSON Schema and the sample package: PLAN1, research-in-a-box#1.\n- README, DataCite, schema.org and EML exports, EML import and the FEMC paper test: PLAN2, research-in-a-box#3.\n- The eight fields the paper test found missing: PLAN3, research-in-a-box#4.\n\n## Different from the plan\n\nPLAN3 was added after the paper test found eight things the format couldn't hold, and you chose to add all of them. The DataCite export is checked against DataCite's mandatory properties instead of a vendored JSON Schema, because the only one available is unofficial and has no licence. Plan 3 confirms the change log and findings shapes when it starts, rather than before the spec was printed, since it hadn't begun.\n","readme":"\u003c!-- Written by diazo from decisions.json, spec.md and the plans; diazo rewrites it, so edit those instead. --\u003e\n\n# Package format and contract (Plan 2)\n\n`research-archive-in-a-box/generic-package-format-and-contract` · repo `research-archive-in-a-box`\n\n✓ Start → ✓ Understanding → ✓ Decisions → ✓ Spec → ✓ Plans → ✓ Build → ✓ Sign off\n\nSigned off 2026-11-13 12:05.\n\nPLAN1 built · PLAN2 built · PLAN3 built\n\n## Wrap-up\n\n### research-in-a-box now has a working package format: a Python contract that describes, validates and exports a dataset package, with a sample package to test against.\n\n#### How it works now\n\nA dataset package is a plain folder that is also a valid Frictionless Data Package, and `archive_contract` reads it into typed models, checks its structure (references, member files, checksums, hashes, symlinks), and exports it as a README, DataCite, schema.org and EML 2.2.0. It can also read standard EML in. The format holds what research data actually carries: rights statuses beside licenses, code lists as small tables, shapefile sets as one resource, projects as their own record, units, measurement scales, related columns, preferred citations and coverage that is ongoing or has no known end. The committed sample package, an invented stream temperature study, uses all of it and rebuilds byte for byte, and FEMC's six practice datasets have been written down in the format as a test. Plans 3 to 9 can now build on the contract.\n\n#### Results\n\n- Models, structural validation, the generated JSON Schema and the sample package: PLAN1, research-in-a-box#1.\n- README, DataCite, schema.org and EML exports, EML import and the FEMC paper test: PLAN2, research-in-a-box#3.\n- The eight fields the paper test found missing: PLAN3, research-in-a-box#4.\n\n#### Different from the plan\n\nPLAN3 was added after the paper test found eight things the format couldn't hold, and you chose to add all of them. The DataCite export is checked against DataCite's mandatory properties instead of a vendored JSON Schema, because the only one available is unofficial and has no licence. Plan 3 confirms the change log and findings shapes when it starts, rather than before the spec was printed, since it hadn't begun.\n\n## Pick up next\n\n- **PARK1 Protect main, allow auto-merge:** main has no branch protection and auto-merge is off for the repo: PR #1 merged before CI ran, and PR #2 had to be merged by hand after CI. Require the python and typescript checks on main and turn on auto-merge in the repo settings.\n- **PARK2 EML code label delimiter:** The EML export writes a code's definition as 'label: description' and the import splits on ': ', so a label containing ': ' changes meaning on round trip. Pick an unambiguous encoding.\n- **PARK3 schema.org rights statuses:** The schema.org export reads only licenses and ignores archive:rightsStatus (public-domain, third-party, all-rights-reserved). Map statuses where schema.org has a form.\n- **PARK4 EML keyword descriptor losses:** The EML import reads descriptorValue from a project descriptor named keywords but doesn't list the descriptor's other contents (citation, classification) as skipped.\n\n## What was asked\n\n\u003e i think we got started incorrectly here.\n\u003e \n\u003e the goal here is to build a research in abox.  we'll use the FEMC data as an example, but we want to build this generically.  once we have the correct format, we can work on a process to migrate FEMC data\n\u003e \n\u003e [...]\n\u003e \n\u003e yes, let's do that.  we can delete that plan 2 and restart fresh\n\u003e \n\u003e (Brief: Plan 2 in docs/planning-handoff.md, revised 2026-11-12 to be generic first. Read the handoff, including the Decision log, before continuing.)\n\n## Decisions\n\n- **DCSN1 Packages without a license.** What does a package need on rights before the pipeline will publish it? The user chose A: Publish needs a license or a stated rights status.\n- **DCSN2 Column names.** Do tidy tables keep the source's column names, or rename them to a house style? The user chose C: Keep by default, rename as a recorded change.\n- **DCSN3 Where code lists live.** Where does a package keep the list of what each code in a column means? The user chose B: A small code-list table, linked by foreign key.\n- **DCSN4 Version numbers.** What makes a new version of a package, and how are versions numbered? The user chose B: File changes make a version, metadata edits in place.\n- **DCSN5 Projects and their packages.** How does a project record relate to the packages under it? The user chose A: Its own small record, packages point to it.\n- **DCSN6 Multi-file resources.** How does a package describe something made of several files that only work together, such as a shapefile set? The user chose A: One resource, member files listed.\n- **DCSN7 Gaps the paper test found.** The paper test found eight things the format can't express. Which do we add to the format now? The user chose B: Add all eight.\n- **AGNT1 Resource kinds vocabulary.** table, vector, raster, document, media, file and linked. Code-list tables are tables. A resource with no kind is read as file. The user kept it.\n- **AGNT2 Same data, several formats.** The copy is its own resource with archive:alternateOf: \u0026lt;name of the primary resource\u003e. Only the primary carries the schema. The user kept it.\n- **AGNT3 Linked resources.** A resource with archive:kind linked whose path is the remote URL (allowed by Frictionless), with no hash or bytes. Compatibility tests run frictionless with remote fetching off. The user kept it.\n- **AGNT4 Access levels per package.** One level per package: open, restricted, by-request or description-only. Unpublished is a state of the package, not an access level. The user kept it.\n- **AGNT5 Column sensitivity flags.** archive:sensitivity on a field, one of personal, sensitive-location or confidential. No flag means not sensitive. The user kept it.\n- **AGNT6 Profiles as data files.** As a data file in the contract (YAML, read into a Pydantic Profile model) listing the fields it promotes to required, its vocabularies and the ids of the rules it switches on. Rule code lives in Plan 3. The user kept it.\n- **AGNT7 EML versions.** Export EML 2.2.0. Import standard EML 2.1.1 and 2.2.0. The user kept it.\n- **AGNT8 Legacy identifiers as a list.** archive:legacyIdentifiers as a list of {scheme, value}, such as {scheme: eml-package-id, value: knb-lter-xyz.12.3}. The user kept it.\n- **AGNT9 Sample package subject.** A small stream temperature study at invented sites, licensed CC-BY-4.0. It has a logger table with a code-list table, a site shapefile set, a small raster, a methods document, a site photo, the table again as XLSX, a linked resource and ongoing coverage. Its seeded gaps are listed in its README. The user kept it.\n- **AGNT10 Change log and findings shapes.** The contract defines both models (Change and Finding), drafted in this spec. Plan 3 has no planning folder yet, so it confirms or changes them when its session starts, and this folder sends it a diazo note then. A change from Plan 3 is an edit to the contract, not a reopened decision here. The user kept it.\n- **AGNT11 Contract module layout.** One module per record under `src/archive_contract/`: `manifest.py` (package and its archive: additions), `resources.py`, `fields.py`, `rights.py`, `project.py`, `changes.py`, `findings.py`, `profile.py`, `config.py`; `profiles/core.yaml` and `profiles/ecology.yaml`; `validate.py` (structural validation); `schema.py` (JSON Schema generation, from Plan 1); `exports/` (`eml.py`, `datacite.py`, `schemaorg.py`, `readme.py`); `imports/eml.py`. The user kept it.\n- **AGNT12 Branch from local main.** The local main at 7789d37: origin/main plus one commit of planning records, which the PR then carries. The user kept it.\n- **AGNT13 Drop the DataCite schema.** Remove the vendored DataCite JSON Schema. A test checks DataCite 4.x's mandatory properties and their shapes instead; Plan 7 confirms real acceptance when it mints test DOIs through DataCite's API. The user kept it.\n- **AGNT14 Only DataCite refuses rights.** No: only DataCite refuses, as the plan says. EML and schema.org also serve previews and hand-offs before publishing; Plan 7's publish check is where unpublishable rights are stopped. The user kept it.\n- **PRIN1** FEMC is only the test afterwards. It is never the example on a card or the reason for a design choice; examples and reasons come from the standards and from any research group's data.\n\n## Spec\n\n- [Goal](spec.md#goal): rests on the understanding\n- [The package folder](spec.md#the-package-folder): rests on AGNT1, AGNT11\n- [The manifest's fields](spec.md#the-manifests-fields): rests on AGNT8\n- [Rights](spec.md#rights): rests on DCSN1\n- [Resources and their kinds](spec.md#resources-and-their-kinds): rests on AGNT1, AGNT2, AGNT3, DCSN6\n- [Columns](spec.md#columns): rests on DCSN2, DCSN3, AGNT5\n- [Versions and identifiers](spec.md#versions-and-identifiers): rests on DCSN4\n- [Projects](spec.md#projects): rests on DCSN5\n- [Access levels](spec.md#access-levels): rests on AGNT4\n- [Profiles and the archive config](spec.md#profiles-and-the-archive-config): rests on AGNT6\n- [The change log and findings](spec.md#the-change-log-and-findings): rests on AGNT10, DCSN2\n- [Exports and import](spec.md#exports-and-import): rests on AGNT7, DCSN3, DCSN5\n- [The contract package](spec.md#the-contract-package): rests on AGNT11\n- [The sample package](spec.md#the-sample-package): rests on AGNT9, DCSN3, DCSN6\n- [Fields the paper test added](spec.md#fields-the-paper-test-added): rests on DCSN7\n- [Risk and cost](spec.md#risk-and-cost): rests on AGNT11\n- [Left out](spec.md#left-out): rests on DCSN1, AGNT4\n- [How we'll know it works](spec.md#how-well-know-it-works): rests on AGNT7, AGNT9\n\n## Plans\n\n- [PLAN1](plans/1-contract-models-and-sample.md) The contract models, validation, schema and sample package: built\n  - TASK1 Task 1: Resource, field and rights models: done. 6c1fac9 + 03cf2b6 (null extras kept, type/kind enforced) · just check exit 0\n  - TASK2 Task 2: Manifest and project models: done. a6d3803 + 03cf2b6 (coverage needs end or ongoing) · just check exit 0\n  - TASK3 Task 3: Change, Finding, Profile and ArchiveConfig: done. 6d94716 · contract tests exit 0 · just check exit 0 · uv lock --check exit 0\n  - TASK4 Task 4: Structural validation: done. 37b3cf9 + 03cf2b6 (symlinks refused, checksums all but _build, hash allowlist) · 158 tests pass\n  - TASK5 Task 5: The real JSON Schema: done. 0a38fa1 · just schema exit 0 · just check (with drift check) exit 0\n  - TASK6 Task 6: The sample package: done. 1064ecf · merged in PR #1 as c7ba8fc · CI run 43449582602 on main success (python, typescript)\n- [PLAN2](plans/2-exports-import-and-paper-test.md) Exports, EML import and the FEMC paper test: built\n  - TASK7 Task 1: README export: done. 3714348 · README generated from the manifest · just check exit 0\n  - TASK8 Task 2: DataCite export: done. 7fd9c1d · validates against DataCite's JSON Schema · refuses undetermined or missing rights\n  - TASK9 Task 3: schema.org export: done. bec8b93 · Google's required fields · ongoing as start/..\n  - TASK10 Task 4: EML 2.2.0 export: done. da9963e · validates against the EML 2.2.0 XSD (a broken document fails)\n  - TASK11 Task 5: EML import: done. 7b692fd + a204e7a · reads EML 2.1.1 and 2.2.0, lists what it skips · sample round-trips\n  - TASK12 Task 6: The FEMC paper test: done. c2c058d + 0906808 (review fixes) · 198 tests · PR #3 CI green (runs 43470879322, 43470887680) · merged as 90e1a0b\n- [PLAN3](plans/3-fields-from-the-paper-test.md) The eight fields from the paper test: built\n  - TASK13 Task 1: The eight fields on the models: done. c4a6c64 · eight optional fields with their rules, JSON Schema regenerated · just check exit 0\n  - TASK14 Task 2: Validator check for attribute tables: done. 5939b79 · .dbf header checked against archive:attributes (standard library) · just check exit 0\n  - TASK15 Task 3: Exports, import and the sample package: done. d169882 + review fixes 73c5be0, 323ddfc, 04b042e · 255 tests · PR #4 CI green (runs 43478057995, 43478066110) · merged as ea2636d\n\n## Files\n\n| File | Written by | What it is |\n|---|---|---|\n| `README.md` | diazo | This summary: where it stands, what each file is, every decision and its answer. |\n| `record.html` | diazo | The whole record as one page that works offline. |\n| `decisions.json` | diazo | The full record, every thread. Names its schema. |\n| `spec.md` | the agent, header by diazo | The spec. |\n| `wrap-up.md` | the agent, header by diazo | What was built, how it works now, and what went differently from the plan. |\n| `plans/` | the agent, header by diazo | One file per plan. |\n| `mockups/` | the agent and the user | Mockups (HTML) and the agent's pictures; the user's screenshots from before screenshots/. |\n| `documents/` | the agent and the user | Every other file the plan holds, of any type: CSV, PDF, Markdown, transcripts. |\n\n## Ids\n\nEvery card has an id: its prefix, then a number.\n\n- `DCSN`: a decision the user makes\n- `AGNT`: a call the agent made, which the user may reverse\n- `PRIN`: a principle\n- `PARK`: a follow-up, for later\n- `STEP`: a step only the user can do\n- `ASK`: an ask of someone other than the user\n- `PLAN`: a plan\n- `TASK`: a task of a plan\n\nThe full record is `decisions.json`; its schema is [schema/record.json](https://github.com/subaud-tools/diazo/blob/main/schema/record.json).\n","decisions":"# Package format and contract (Plan 2): decisions\n\n- **DCSN1 Packages without a license.** What does a package need on rights before the pipeline will publish it? The user chose A: Publish needs a license or a stated rights status.\n- **DCSN2 Column names.** Do tidy tables keep the source's column names, or rename them to a house style? The user chose C: Keep by default, rename as a recorded change.\n- **DCSN3 Where code lists live.** Where does a package keep the list of what each code in a column means? The user chose B: A small code-list table, linked by foreign key.\n- **DCSN4 Version numbers.** What makes a new version of a package, and how are versions numbered? The user chose B: File changes make a version, metadata edits in place.\n- **DCSN5 Projects and their packages.** How does a project record relate to the packages under it? The user chose A: Its own small record, packages point to it.\n- **DCSN6 Multi-file resources.** How does a package describe something made of several files that only work together, such as a shapefile set? The user chose A: One resource, member files listed.\n- **DCSN7 Gaps the paper test found.** The paper test found eight things the format can't express. Which do we add to the format now? The user chose B: Add all eight.\n- **AGNT1 Resource kinds v
