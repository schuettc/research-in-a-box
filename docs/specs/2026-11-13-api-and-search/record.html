on the table it flipped to. A failure there alerts like the other steps and does not undo the flip.\n- Tests: rows from the sample package's manifest (`examples/sample-package/datapackage.json`) and from a bare manifest with only a title; a two-dataset fake table writes one object with both rows; the reindex calls the writer only when it flipped.\n\n### Task 2: The API Lambda\n\n**Does:** Adds `archive_backend.search` (pure filtering over catalog rows) and `archive_backend.api` (one Powertools `APIGatewayRestResolver` with validation on), the usage answers model in the contract, and a committed OpenAPI spec with a drift check.\n**Files:** `packages/backend/pyproject.toml`, `uv.lock`, `packages/backend/src/archive_backend/search.py`, `packages/backend/src/archive_backend/api.py`, `packages/contract/src/archive_contract/usage.py`, `packages/backend/tests/test_search.py`, `packages/backend/tests/test_api.py`, `packages/contract/tests/test_usage.py`, `justfile`, `packages/web/src/schema/openapi.json`\n**Checks:** `uv run pytest packages/backend packages/contract` exits 0; `just check-python` exits 0; `just check-schema` exits 0.\n**Serves:** DCSN1, DCSN2, DCSN3, DCSN4 (rests on calls AGNT1, AGNT6, AGNT8, AGNT9, AGNT10)\n\nSearch (`search.py`, no AWS):\n\n- `search(rows, query) -\u003e SearchResult`, where the query holds `q`, `access`, `license`, `format`, `project` (lists), `from_`, `to` (dates), `bbox` and `page`, `size` (default 20, 1 to 100).\n- Each whitespace-separated word of `q` must appear, ignoring case, in `title`, `description`, `keywords` or `creators`. A list filter keeps a row that has any of the values. Dates keep a row whose coverage overlaps the range: `end: \"unknown\"` or `ongoing` counts as open-ended, a row without `start` drops out when a date filter is set. The box keeps a row whose box intersects it, splitting either box at the antimeridian when west is greater than east; a row without a box drops out when a box is set.\n- Order: rows with a word of `q` in the title first, then by `published` newest first with rows lacking it last, then `id`.\n- The answer is `rows` (that page), `total`, and `facets`: for each of `access`, `license`, `format` and `project`, every value's count among the rows matching all the other filters (so a facet doesn't hide its own alternatives).\n\nRoutes (`api.py`), paths as API Gateway passes them:\n\n- `GET /api/search`: query parameters as above (`from` and `to` in the URL); reads the catalog through a module-level cache that `head_object`s `site/catalog.json` at most every 60 seconds and re-reads on a new ETag.\n- `GET /api/datasets/\u003cid\u003e`, `/api/datasets/\u003cid\u003e/versions`, `/api/datasets/\u003cid\u003e/versions/\u003cversion\u003e`: query the active catalog table (the `/research-archive/\u003cstage\u003e/catalog-active` parameter, cached 60 seconds, naming `CATALOG_TABLE_A` or `CATALOG_TABLE_B`). The dataset answer is the dataset item's fields, the current version's manifest parsed as JSON, and its files; 404 when absent.\n- `GET /api/projects/\u003cid\u003e`: `projects/\u003cid\u003e/project.json` from the archive bucket, and the datasets from GSI1 (`GSI1PK=PROJECT#\u003cid\u003e`); 404 when the file is absent.\n- `GET /api/datasets/\u003cid\u003e/versions/\u003cversion\u003e/download?path=`: signed in (claims present). `open` answers `{\"url\": \"https://\u003cSITE_DOMAIN\u003e/data/\u003cid\u003e/\u003cversion\u003e/\u003cpath\u003e\"}`; `restricted` answers a presigned `get_object` URL on `restricted/\u003cid\u003e/\u003cversion\u003e/\u003cpath\u003e` with `ExpiresIn=300` and adds 1 to `restricted` on DownloadCounts (`datasetId`, `month` as `YYYY-MM`); `by-request` answers 403; `description-only` and a path that is not one of the version's file items answer 404.\n- `POST /api/datasets/\u003cid\u003e/usage`: body is `archive_contract.usage.UsageAnswers` (`organisation` and `purpose` each one of the spec's six values or absent, `note` up to 500 characters); 404 for an unknown dataset; stores `datasetId`, `entry` = `\u003cYYYY-MM\u003e#\u003cuuid4\u003e`, the answers and `at`; answers 204.\n- `GET /api/admin/usage?dataset=`: 403 unless the claims' `cognito:groups` holds `admin` (parse as `whoami.py` does); answers that dataset's entries, newest first.\n- Environment: `ARCHIVE_BUCKET`, `DERIVED_BUCKET`, `CATALOG_TABLE_A`, `CATALOG_TABLE_B`, `ACTIVE_CATALOG_PARAMETER`, `DOWNLOAD_COUNTS_TABLE`, `USAGE_TABLE`, `SITE_DOMAIN`. Handler `archive_backend.api.handler`.\n\nOpenAPI: `python -m archive_backend.api \u003cpath\u003e` writes `app.get_openapi_json_schema()` with sorted keys. Add `openapi_file := \"packages/web/src/schema/openapi.json\"`, a `just openapi` recipe that writes it, and a diff of it in `check-schema` beside the contract schema's.\n\nTests drive the resolver with API Gateway REST events and fakes for S3, DynamoDB and SSM: each search filter, facet counts, paging bounds, the antimeridian box, every download case above (including no claims: API Gateway refuses it, but the handler also answers 401), the usage 204 and 404, admin 403 and 200, and a 404 for each missing read.\n\n### Task 3: The download rollup\n\n**Does:** Adds `archive_backend.downloads.handler`, run daily, which adds CloudFront's open downloads to DownloadCounts and never counts a day twice.\n**Files:** `packages/backend/src/archive_backend/downloads.py`, `packages/backend/tests/test_downloads.py`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0.\n**Serves:** none (rests on call AGNT7)\n\n- Days to count: from the day after the Settings item `downloads-rolled-up-through` (`name`, `value` = `YYYY-MM-DD`), or from two days ago when there is none, through two days ago (UTC), since CloudFront may deliver a day's logs hours late.\n- For each day, list `logs/` keys whose name holds `.\u003cYYYY-MM-DD\u003e-`, read each gzip file (tab-separated, `#` lines are headers), and count lines with `cs-method` `GET`, `sc-status` `200` and `cs-uri-stem` starting `/data/`; the dataset id is the next path segment.\n- Add each dataset's count to `open` for that day's month with one `UpdateItem ... ADD`, then write the day to the Settings item before moving to the next day, so a crash mid-run recounts at most nothing already marked.\n- An event `{\"through\": \"YYYY-MM-DD\"}` replaces two days ago as the last day, so the test deploy can count today by hand; the schedule sends none.\n- Environment: `DERIVED_BUCKET`, `DOWNLOAD_COUNTS_TABLE`, `SETTINGS_TABLE`.\n- Tests: a fake log with a 200 GET, a 206, a HEAD, a 404 and a non-`/data` path counts one; a second run the same day counts nothing; two missed days are both counted once.\n\n### Task 4: The infrastructure\n\n**Does:** Adds the internal `ReadApi` construct, created by `ResearchArchive` after the distribution: the API Lambda and its routes, the UsageResponses table, the daily rollup schedule, and the reindex's grant to write the catalog file.\n**Files:** `packages/infra/src/read-api.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/src/reindex.ts`, `packages/infra/test/read-api.test.ts`, `packages/infra/test/reindex.test.ts`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0.\n**Serves:** DCSN2, DCSN3, DCSN4 (rests on calls AGNT7, AGNT10)\n\n- One Lambda from `archive.pythonFunction(\"ApiFunction\", { handler: \"archive_backend.api.handler\" })` with the Task 2 environment (`SITE_DOMAIN` is the distribution's domain name).\n- Routes under Plan 4's existing `/api` resource, each a `LambdaIntegration` to that one function. `download` and `admin/usage` use `AuthorizationType.COGNITO` with `archive.authorizer`; the rest `NONE`.\n- UsageResponses: plain `dynamodb.Table`, partition `datasetId`, sort `entry`, on-demand, point-in-time recovery, the same removal policy as Plan 4's operational tables for prod and non-prod. Add it to the operations dashboard as Plan 4 does with its tables.\n- Grants: read on both catalog tables and the active-catalog parameter; read `site/catalog.json` and the archive bucket's `restricted/*` and `projects/*`; `ADD` on DownloadCounts; read and write UsageResponses.\n- The rollup: `archive.pythonFunction(\"DownloadRollupFunction\", ...)`, timeout 15 minutes, read `logs/*`, write DownloadCounts and Settings, on an EventBridge Scheduler rate of one day with no retries, as `integrity.ts` schedules its check.\n- Reindex: add `derivedBucket.grantPut(fn, \"site/catalog.json\")`.\n- Synth tests: each route's method and authorization type, the table's keys and recovery, the schedule, and the reindex's new grant.\n\n### Task 5: The test deploy\n\n**Does:** Merges Tasks 1 to 4 and Task 6, deploys `ResearchArchive-test`, walks every check in the spec's \"How we'll know it works\" with you, measures search round trips, and destroys the stack.\n**Files:** none (results go in the task's result line and the build thread)\n**Checks:** every action in STEP1 is done; `aws cloudformation describe-stacks --stack-name ResearchArchive-test` fails with \"does not exist\" at the end.\n**Serves:** DCSN1, DCSN2, DCSN3\n\nSTEP1's actions, in order:\n\n1. You: name the AWS profile and the alert email address.\n2. Agent: open the PR for Tasks 1 to 4, merge it once CI's `python` and `typescript` checks pass, and check the profile's identity.\n3. You: Go for the deploy.\n4. Agent: `just lambda-assets`, deploy `ResearchArchive-test` with a test `ARCHIVE_CONFIG`, upload the sample package twice with `archive:published` set (once `open`, once with `archive:access` set to `restricted`, under `restricted/`), run `just reindex test` and wait for `COMPLETED`.\n5. Agent: check `/catalog.json` has both rows; `GET /api/search?q=` with a word from the description finds both, filters by `access=restricted` to one, facet counts add up; `GET /api/datasets/\u003cid\u003e` returns the manifest and files; the download route signed out answers 401.\n6. Agent invites you with `just invite-user test \u003cyour email\u003e`. You: open the sign-in link the agent gives (Plan 4's `cli` client with PKCE), sign in with the temporary password from the invitation email, set your own, and paste back the `localhost:8765` URL you land on, even though the page doesn't load.\n7. Agent: exchange the code; the restricted download link fetches the file; DownloadCounts shows one restricted; a usage answer posts; `GET /api/admin/usage` answers 403; add your user to `admin`.\n8. You: sign in again with the new link and paste back the URL.\n9. Agent: `GET /api/admin/usage` answers the posted answer; download an open file through `/data`, invoke the rollup with `{\"through\": \"\u003ctoday\u003e\"}` once the log file has arrived, and check DownloadCounts shows it; time ten searches warm and one after fifteen idle minutes through CloudFront.\n10. You: Go for the teardown.\n11. Agent: `cdk destroy ResearchArchive-test` and confirm the stack, buckets and tables are gone.\n\n### Task 6: Invitation-only accounts\n\n**Does:** Turns off self-service sign-up and adds a recipe for an admin to invite a person by email, optionally into a group, so restricted data reaches only people the archive invited. Added at your word through the coordinating session; Task 5 deploys it.\n**Files:** `packages/infra/src/auth.ts`, `packages/infra/test/auth.test.ts`, `justfile`, `docs/planning-handoff.md`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0.\n**Serves:** DCSN2\n\n- `selfSignUpEnabled: false` on the user pool; the synth test asserts `AdminCreateUserConfig.AllowAdminCreateUserOnly` is true.\n- `just invite-user \u003cstage\u003e \u003cemail\u003e [group]`: reads the user pool id from the stack's resources, runs `aws cognito-idp admin-create-user` with the email as username, `email_verified=true` and Cognito's invitation email, then `admin-add-user-to-group` when a group is given. Uses the caller's `AWS_PROFILE` and region, like `just reindex`.\n- One Decision log row: accounts are invitation-only; restricted means invited.\n","PLAN3":"---\ndiazo: research-archive-in-a-box/api-and-search\nfile: PLAN3\nstatus: done\napproved: 2026-11-14T00:23:08-06:00\nhash: e2d57470bd02fe32a34c0c9ee50133ac308ba0259c514484f2099076d8756b8f\nrests_on: [AGNT11, AGNT12, AGNT13, AGNT14, AGNT15, DCSN6, DCSN7, DCSN8]\nrecord: README.md\n---\n\n# PLAN3: Ranked keyword search and semantic search\n\n## Spec\n\n`docs/specs/2026-11-13-api-and-search/spec.md`, sections \"Search\", \"Semantic search\", \"Risk and cost\" and \"How we'll know it works\". PLAN1 is built and merged (research-in-a-box#22, #26): build on `archive_backend.search`, `archive_backend.api`, `archive_backend.reindex` (`catalog_items`, `dataset_item`), `archive_backend.catalog_file`, the `ReadApi` construct and Plan 4's `Tables`. The handoff's Decision log holds the catalog item shapes. The measurements behind DCSN6 to DCSN8 are on those cards. The implementer reads the spec beside this plan.\n\n## The change\n\nKeyword search ranks by how many words match instead of requiring every word. An optional `embeddings` module adds a vector index to both catalog tables, one shared function puts a Titan v2 embedding on each dataset item before it is written, and `/api/search` merges the vector index's nearest datasets with the keyword ranking by reciprocal rank fusion. Then one test deploy with Plan 5's ten datasets, embeddings on and then off, and the stack is destroyed.\n\n**Risk:**\n\n- Tasks 1 to 4 are local code and CI; a mistake is undone by reverting the PR.\n- Nothing here can expose a restricted file: search returns catalog rows, which are public at every access level.\n- A bad embedding or a dropped one only changes ranking, and a reindex rebuilds every embedding.\n- Task 5 creates real resources under a non-prod stage, all deleted with the stack, plus a few cents of Bedrock calls.\n\n**Cost:**\n\n- One walkthrough step for you (STEP2): Go for the deploy and Go for the teardown. No sign-in is needed; search is public.\n- New permissions only when the module is on: `bedrock:InvokeModel` on Titan v2 and `dynamodb:SearchVectors` on the index.\n- No new dependency: boto3 already has Bedrock and DynamoDB.\n\n## Left out\n\n- A score cut-off for semantic matches, and any model besides Titan v2 (spec, Left out).\n- Embedding the CLI or MCP server's own searches: they call `/api/search` like the web app.\n- The first search after idle (PARK3) stays its own follow-up; Task 5 measures it again with embeddings on.\n\n## Where\n\n- Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-archive-in-a-box/plan6/semantic-search`, branch `plan6/semantic-search` from `origin/main`. Confirm with `git -C \u003cwt\u003e branch --show-current` before editing.\n- Python: `packages/contract/src/archive_contract/config.py` with its test, `packages/backend/src/archive_backend/{search,embeddings,api,reindex}.py` with their tests.\n- TypeScript: `packages/infra/src/tables.ts`, `packages/infra/src/read-api.ts`, `packages/infra/src/reindex.ts`, `packages/infra/src/research-archive.ts`, their tests, and the regenerated `packages/infra/src/generated/archive-config.ts`.\n- `packages/web/src/schema/archive-contract.schema.json` and `openapi.json` (regenerated), `docs/planning-handoff.md` (Decision log).\n- Global constraints:\n  - Lambdas read the embeddings setting only from the archive-config parameter, `/research-archive/\u003cstage\u003e/archive-config`, which Plan 7's PLAN1 adds. If it isn't on `origin/main` when Task 2 starts, Tasks 1 to 2's pure code goes ahead and the reading waits for it; never add a second way to read the config.\n  - The embedding is set on the item before it is written, never by a later UpdateItem (muster thread 955).\n  - `just check` must exit 0. Nothing reaches AWS in Tasks 1 to 4.\n  - Task 5 runs only with your Go on STEP2, under the `personal` profile, on a stage named `search-test`, never `prod`.\n  - On any AWS auth error, stop and report; never copy or export credentials.\n\n### Task 7: Ranked keyword matching\n\n**Does:** Changes `archive_backend.search` so a dataset matches when any word of `q` matches, ranked by how many words match with title words counting half again, common words ignored and plurals matched.\n**Files:** `packages/backend/src/archive_backend/search.py`, `packages/backend/tests/test_search.py`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0.\n**Serves:** DCSN6\n\n- Words: lower-case `[a-z0-9]+` runs of `q`, minus a fixed stop list (`a an and the of on in near from for to with by at as or`), each reduced by stripping a trailing `ies`, `es` or `s`; a field matches a word when the reduced word appears in it.\n- Score: count of words found in title, description, keywords or creators, plus 0.5 per word found in the title. A row with score 0 doesn't match when `q` is given.\n- Order: score descending, then `published` newest first with rows lacking it last, then `id`. With no `q`, order as today.\n- Facets: the `q` filter counts as \"score above 0\", so facet counting is unchanged otherwise.\n- Expose `keyword_ranking(rows, q) -\u003e list[str]` (ids in order) for Task 9's merge.\n- Tests: \"ozone damage on plants\" finds the ozone row first; a title word outranks a description-only word; \"species\" matches \"Species\"; \"on the\" alone matches nothing; existing filter, facet and paging tests keep passing.\n\n### Task 8: The embeddings setting and the shared function\n\n**Does:** Adds the optional `infrastructure.modules.embeddings` setting to the contract, and `archive_backend.embeddings.with_embedding(item, manifest, bedrock)`, which returns the dataset item with `embedding` set; the reindex calls it on every dataset item when the setting is on.\n**Files:** `packages/contract/src/archive_contract/config.py`, `packages/contract/tests/test_config.py`, `packages/web/src/schema/archive-contract.schema.json`, `packages/infra/src/generated/archive-config.ts`, `packages/backend/src/archive_backend/embeddings.py`, `packages/backend/tests/test_embeddings.py`, `packages/backend/src/archive_backend/reindex.py`, `packages/backend/tests/test_reindex.py`, `docs/planning-handoff.md`\n**Checks:** `uv run pytest packages/backend packages/contract` exits 0; `just check-python` exits 0; `just check-schema` exits 0.\n**Serves:** DCSN6, DCSN7 (rests on calls AGNT11, AGNT12, AGNT14)\n\n- Contract: `Modules.embeddings: Embeddings | None` (alias `embeddings`), where `Embeddings` is a strict model with `model: Literal[\"amazon.titan-embed-text-v2:0\"]` defaulting to that value. Present means on. Run `just schema`.\n- `MODEL`, `DIMENSIONS = 1024`. `embedding_text(manifest)` is the title, description and keywords joined by newlines, as measured. `embed(bedrock, text)` calls `invoke_model` with `{\"inputText\": text, \"dimensions\": 1024, \"normalize\": true}` and returns the list. `with_embedding(item, manifest, bedrock)` returns a copy of the DynamoDB-JSON item with `\"embedding\": {\"L\": [{\"N\": ...}, ...]}`.\n- Reindex: read the archive config from the archive-config parameter once per run; when `infrastructure.modules.embeddings` is set, each dataset item passes through `with_embedding` inside the write step, before the lines are written. Off, nothing changes.\n- One Decision log row: the setting's name, `with_embedding` as the one way an embedding is set, called before the put by reindex and by Plan 7's publish.\n- Tests with a fake Bedrock: the item gains a 1,024-number list and keeps every other attribute; the reindex calls it once per dataset when on and never when off.\n\n### Task 9: Semantic results in /api/search\n\n**Does:** When the setting is on and `q` is given, `/api/search` embeds `q`, asks the index for 50 nearest datasets, and merges them with the keyword ranking by reciprocal rank fusion before filtering and paging; on a Bedrock or index error it answers the keyword ranking alone.\n**Files:** `packages/backend/src/archive_backend/search.py`, `packages/backend/src/archive_backend/api.py`, `packages/backend/tests/test_search.py`, `packages/backend/tests/test_api.py`, `packages/web/src/schema/openapi.json`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0; `just check-schema` exits 0.\n**Serves:** DCSN6, DCSN8 (rests on calls AGNT13, AGNT15)\n\n- `search(rows, query, semantic: list[str] | None = None)`: with `semantic`, the candidates are the union of keyword matches and the semantic ids, ordered by `fuse(keyword_ids, semantic_ids)` where each id scores the sum of `1 / (60 + place)` over the lists it appears in (place from 1), ties by `id`. Filters other than `q`, facets, total and paging work on that list as they do today.\n- `api.py`: read the setting from the archive-config parameter (cached like the active table); with it on and `q` non-empty, `embed(q)` then `dynamodb.search_vectors(TableName=\u003cactive table\u003e, IndexName=\"datasets\", SearchVector=..., TopK=50)` and take the ids from the returned keys. Verify the boto3 parameter and response names against the installed botocore, not this plan.\n- Any exception from Bedrock or `search_vectors` logs a warning, emits one `SemanticFallback` count in CloudWatch embedded metric format (namespace `ResearchArchive`, dimension `Stage`, from the `STAGE` environment variable), and calls `search` without `semantic`.\n- Tests: fusion order on two hand-made lists; a semantic-only id appears and a filter still removes it; facets count the merged list; the error path answers keyword results and prints one metric line; with the setting off Bedrock is never called.\n\n### Task 10: The vector index and permissions\n\n**Does:** When `infrastructure.modules.embeddings` is set, adds the `datasets` vector index to both catalog tables, grants the API and reindex functions Bedrock on Titan v2 and the API `SearchVectors`, and puts the `SemanticFallback` count on the dashboard with an alarm.\n**Files:** `packages/infra/src/tables.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/src/read-api.ts`, `packages/infra/src/reindex.ts`, `packages/infra/src/operations.ts`, `packages/infra/test/tables.test.ts`, `packages/infra/test/read-api.test.ts`, `packages/infra/test/reindex.test.ts`, `packages/infra/test/operations.test.ts`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0.\n**Serves:** DCSN6, DCSN7 (rests on calls AGNT12, AGNT14)\n\n- `Tables` takes `embeddings: boolean`. When true, on each catalog table's `node.defaultChild as dynamodb.CfnTable`, set `vectorIndexes` to one entry: `indexName: \"datasets\"`, `vectorAttribute: { attributeName: \"embedding\" }`, `dimensions: 1024`, `distanceFunction: \"COSINE\"`, `projection: { projectionType: \"KEYS_ONLY\" }`, no `searchSchema`. Plain `dynamodb.Table` stays (Decision log: bulk put items needs it).\n- Grants when on: `bedrock:InvokeModel` on `arn:aws:bedrock:\u003cregion\u003e::foundation-model/amazon.titan-embed-text-v2:0` for the API and reindex functions; `dynamodb:SearchVectors` on `\u003ctable arn\u003e/index/datasets` for both tables, for the API function.\n- The API function gets `STAGE`. When on, the operations dashboard gains a `SemanticFallback` widget, and one alarm on its sum, at least 5 in 15 minutes for 2 periods, notifies the alert topic, so an admin learns the module is failing rather than seeing weaker search.\n- Synth tests: with the module the index, grants, widget and alarm exist; without it, the template has no `VectorIndexes`, no Bedrock statement and no fallback alarm.\n\n### Task 11: The test deploy\n\n**Does:** Merges Tasks 7 to 10, deploys `ResearchArchive-search-test` with embeddings on, loads Plan 5's ten datasets, checks the spec's semantic checks, turns embeddings off and checks again, then destroys the stack.\n**Files:** none (results go in the task's result line and the build thread)\n**Checks:** every action in STEP2 is done; `aws cloudformation describe-stacks --stack-name ResearchArchive-search-test` fails with \"does not exist\" at the end.\n**Serves:** DCSN6, DCSN7, DCSN8\n\nSTEP2's actions, in order:\n\n1. Agent: open the PR for Tasks 7 to 10 and merge it once CI's `python` and `typescript` checks pass.\n2. You: Go for the deploy.\n3. Agent: deploy with a test config that has `stages: [search-test]` and `modules.embeddings: {}`; upload only each of Plan 5's ten packages' `datapackage.json` from `practice-data/packages/` (never committed), with `archive:published` set, under `open/` or `restricted/` by its access: the reindex and search read manifests only, and no FEMC data file is put where the test stage's CloudFront could serve it; `just reindex search-test`; check each dataset item has a 1,024-number `embedding`; run the 22 searches from DCSN6 through CloudFront and record found-first and top-3 counts; check `q=air pollution` puts the IMPROVE aerosol dataset first; time ten warm searches and one after 15 idle minutes.\n4. Agent: redeploy with the module removed; check `q=air pollution` answers keyword results (none) with no error, and `q=ozone` still finds the ozone dataset.\n5. You: Go for the teardown.\n6. Agent: destroy the stack and confirm the stack, buckets, tables and leftover log groups are gone.\n\n### Task 12: Embeddings on Plan 7's publish\n\n**Does:** Plan 7's publish step (research-in-a-box#29) landed before this plan, so Plan 6 adds the agreed call: when the embeddings setting is on, publish passes the dataset item through `with_embedding` before its put, and the ingest function gets the Bedrock grant. Without it, a dataset published with the module on has no embedding until the next reindex.\n**Files:** `packages/backend/src/archive_backend/ingest.py`, `packages/backend/tests/test_ingest.py`, the infra file that builds the ingest function and its synth test\n**Checks:** `uv run pytest packages/backend` exits 0; `npm test -w packages/infra` exits 0; `just check` exits 0.\n**Serves:** DCSN6, DCSN7 (rests on call AGNT12)\n\n- One call, before the put, only when `read_archive_config(...).infrastructure.modules.embeddings` is set; no later update (muster threads 955 and 979).\n- `archive.grantEmbedding(ingestFn)` only when the module is on; a synth test asserts the grant is absent when it is off.\n- Plan 7 is editing the same area of `ingest.py`; whichever PR merges second rebases.\n- Tests with a fake Bedrock: publish with the setting on writes a META item carrying a 1,024-number `embedding`; with it off Bedrock is never called.\n"},"wrapup":null,"readme":"\u003c!-- Written by diazo from decisions.json, spec.md and the plans; diazo rewrites it, so edit those instead. --\u003e\n\n# API and search (Plan 6)\n\n`research-archive-in-a-box/api-and-search` · repo `research-archive-in-a-box`\n\n✓ Start → ✓ Understanding → ✓ Decisions → ✓ Spec → ✓ Plans → ✓ Build → **Sign off · ready**\n\nReady to sign off. Built: Plan 6's API and search, on main: the read API, server search over catalog.json, restricted download links, download counts, the usage form and invitation-only accounts (PLAN1: research-in-a-box#22, #26); ranked keyword search and optional semantic search with Titan v2 and a DynamoDB vector index, also on Plan 7's publish (PLAN3: #30, #38). Both test deploys were walked with you and destroyed. Try: Search works the way you expect from the results above: on the ten FEMC datasets, 19 of 22 plain-language searches put the right dataset first with semantic search on; 'ozone damage on plants' and 'air pollution' both find their dataset.; Restricted data reaches only people the archive invited: sign-up is off, an admin invites with just invite-user \u003cstage\u003e \u003cemail\u003e [group], and a signed-in user gets a five-minute link to a restricted file.; Semantic search is off unless an archive adds infrastructure.modules.embeddings: {} to archive.yaml; with it off, search is keyword-only and no Bedrock is called.; Nothing is running in your AWS account: both test stages, ResearchArchive-test and ResearchArchive-search-test, are destroyed.; Follow-ups for later are on the Overview: PARK1 linked-resource download links, PARK2 expiring CloudFront logs, PARK3 the slow first search after idle (2.8 to 3.6 s), PARK4 empty text breaking embedding, PARK5 Bedrock throttling on large reindexes..\n\nPLAN1 built · PLAN3 built\n\n## Pick up next\n\n- **PARK1 Linked resource downloads:** A resource whose path is a URL (data held elsewhere) gets a file item, so the download route answers a /data or presigned link that doesn't resolve. Answer the resource's own URL instead.\n- **PARK2 Expire CloudFront logs:** Nothing expires the derived bucket's logs/, and the daily rollup lists the whole prefix each run, so the listing grows forever. Add a lifecycle rule on logs/ (say 30 days, after the rollup has counted them) or list from the last counted day's key.\n- **PARK3 First search after idle:** The first search after the API Lambda sits idle is slow: 2.81 s with keyword search alone (PLAN1's test deploy, 17 idle minutes) and 3.58 s with semantic search on (PLAN3's, 16 idle minutes); warm searches take 0.14 s and 0.29 s. A cold Lambda loading Powertools, boto3 and the catalog, plus the first Bedrock call. Measure the parts and decide whether it matters once Plan 8's search page exists; options are trimming imports, more memory, or SnapStart for Python.\n- **PARK4 Empty text breaks embedding:** With embeddings on, a manifest with no title, description or keywords (or text past Titan's input limit) makes Bedrock reject the call and fails the whole reindex batch, though the same manifest reindexes with embeddings off. Skip the embedding for empty text, and truncate long text.\n- **PARK5 Bedrock throttling in reindex:** The reindex embeds datasets one call at a time, up to 200 per batch; Bedrock throttling raises out of the step. Fine at ten datasets; for large archives check the durable step's retry or add backoff.\n\n## What was asked\n\n\u003e can we start all of the plans as planned so we don't forget them and have a way to track them with their own sessions\n\u003e \n\u003e (Saved as planned: mark this plan Planned with diazo_update planned: true and wait for Start planning. Do no research until then. It waits on Plan 2, folder 8da653f233f9, and Plan 4, the archive infrastructure.)\n\u003e \n\u003e Brief: Plan 6 in docs/planning-handoff.md. Starter prompt from the handoff:\n\u003e \n\u003e \u003e Read `docs/planning-handoff.md`. Plan the API and search (Plan 6). There is no relational database. Search is a catalog file filtered in the browser with DuckDB, plus an optional DynamoDB vector index. Plan the endpoints and the search design, and take the open questions with me one at a time.\n\n## Decisions\n\n- **DCSN1 Where search runs.** Where should the catalog be searched: in the reader's browser, or by the API? The user chose C: On the server, through a search endpoint.\n- **DCSN2 Who reads restricted data.** Who may download a dataset marked restricted? The user chose A: Anyone signed in.\n- **DCSN3 Optional usage form.** Should the optional 'who are you and how will you use this' form be built now, or later? The user chose B: Now.\n- **DCSN4 How the API is built.** Should the endpoints be one Lambda using Powertools' router, or one Lambda per endpoint? The user chose A: One API Lambda with Powertools' REST router.\n- **DCSN5 Keep or drop PLAN2.** Plan 7 now owns the submission and review endpoints. Should PLAN2 be dropped? The user chose A: Drop PLAN2.\n- **DCSN6 Semantic search now or later.** Should PLAN3 build semantic search now, or first fix keyword search and add semantic search once the search page has real readers? The user chose B: Fix keyword search and build semantic search now.\n- **DCSN7 Embedding model.** Which Bedrock model should turn datasets and searches into vectors: Amazon Titan Text Embeddings v2 or Cohere Embed v4? The user chose A: Amazon Titan Text Embeddings v2.\n- **DCSN8 Merging keyword and semantic.** How should /api/search combine the keyword matches and the semantic matches into one list? The user chose A: Reciprocal rank fusion.\n- **AGNT1 Reads from the active table.** `GET /api/datasets/{id}`, `GET /api/datasets/{id}/versions` and `GET /api/datasets/{id}/versions/{version}` read the active catalog table (the version item already holds the manifest text, plus the file items). Finding datasets is search's job (DCSN1), not a separate list endpoint. The user kept it.\n- **AGNT2 One catalog writer.** One function in archive-backend builds the catalog file from the active catalog table and writes it to the derived bucket's `site/`. The reindex calls it after it flips the table; Plan 7's publish step calls the same function later. The user kept it.\n- **AGNT3 Catalog fields.** One row per published dataset, every access level: id, current version, title, description, keywords, access, license ids and rights status, project, creators, resource formats, temporal start, end and ongoing, the bounding box (west, south, east, north), total bytes and published date. Theme and species facets join when the contract holds those fields: Plan 2's follow-ups PARK5 (archive:themes) and PARK6 (taxonomic coverage), timing yours. The user kept it.\n- **AGNT4 Catalog freshness.** The search Lambda keeps `catalog.json` in memory and checks the object's ETag in S3 at most once a minute, re-reading it when it changed. A publish or reindex reaches search within a minute, with no invalidation or notification. The user kept it.\n- **AGNT5 CLI and MCP sign-in.** Authorization code with PKCE through Plan 4's `cli` app client: the client opens the browser to managed login and listens on `http://localhost:8765/callback`. It keeps the one-hour access and ID tokens and discards the refresh token, so it holds short-lived tokens only. Plan 6 records the flow in the Decision log; the client code lands with its first user, Plan 9. The user kept it.\n- **AGNT6 OpenAPI is committed.** The OpenAPI spec is written to a committed file by a `just` recipe and CI fails when it drifts from the code, the same way the contract's JSON Schema is checked. Plan 8 generates its TypeScript types from it. The user kept it.\n- **AGNT7 What counts as a download.** A daily scheduled function reads the new CloudFront log files under the derived bucket's `logs/` and adds one per GET under `/data/` that answered 200, per dataset and month. Range reads (206) and HEAD are not counted, so the in-browser data preview, which reads by range, doesn't inflate counts. A restricted download counts when its link is issued. The user kept it.\n- **AGNT8 Project reads from the archive.** `GET /api/projects/{id}` reads `projects/\u0026lt;projectId\u003e/project.json` from the archive bucket (the home Plan 7 and the coordinating session settled) and lists the project's datasets from the active catalog table's GSI1. No reindex change: the record is read where it lives. The user kept it.\n- **AGNT9 Link lifetime.** Five minutes: long enough to start a large download, short enough that a shared link stops working. The user kept it.\n- **AGNT10 Usage form shape.** Three optional answers, no sign-in needed and no email or name asked: what kind of organisation (university, government, nonprofit, company, individual, other), what the data is for (research, teaching, policy or management, commercial, personal, other), and a free-text note of up to 500 characters. `POST /api/datasets/{id}/usage` stores them in a new UsageResponses table Plan 6 adds (key `datasetId`, sort `\u0026lt;month\u003e#\u0026lt;uuid\u003e`), and `GET /api/admin/usage?dataset=\u0026lt;id\u003e` lets the admin group read them. The question list is fixed in the contract, not set in the config. The user kept it.\n- **AGNT11 Config read from SSM.** Through the SSM parameter `/research-archive/\u0026lt;stage\u003e/archive-config` that Plan 7's spec has the CDK app write at synth from the validated archive.yaml. PLAN1's Lambdas need nothing from it yet; PLAN3's embeddings setting will be read the same way. The user kept it.\n- **AGNT12 Embeddings off by default.** A new optional module in the archive config, `infrastructure.modules.embeddings` with the model id, off by default like WAF and write-once locking. Switched on, the construct adds the vector index to both catalog tables and grants Bedrock; the API reads the setting from the archive-config parameter. Off, search is the improved keyword search alone. The user kept it.\n- **AGNT13 How many semantic matches.** SearchVectors asks for the 50 nearest (the service allows at most 100), the search's filters (access, licence, format, project, dates, box) are applied to them in the Lambda as they are to keyword matches, and the merged list is paged as today. The total counts the merged list. The user kept it.\n- **AGNT14 Vector index shape.** One index, `datasets`, on both catalog tables: attribute `embedding` on the dataset's META item (a list of 1,024 numbers from Titan v2, normalised), COSINE distance, KEYS_ONLY projection, and no vector partition key. Each archive has its own tables, so the whole index is one archive, which is how 'one partition key per archive' in the handoff is met. The user kept it.\n- **AGNT15 When Bedrock fails.** The keyword results alone, with a warning in the function's log, so the reader still gets a page. Errors on reindex or publish stop that run, as any other failed step does. The user kept it.\n\n## Spec\n\n- [Goal](spec.md#goal): rests on the understanding\n- [The plans](spec.md#the-plans): rests on DCSN5, DCSN1, DCSN6\n- [Endpoints](spec.md#endpoints): rests on DCSN4, AGNT1, AGNT8\n- [Search](spec.md#search): rests on DCSN1, AGNT2, AGNT3, AGNT4, DCSN6\n- [Semantic search](spec.md#semantic-search): rests on DCSN6, DCSN7, DCSN8, AGNT12, AGNT13, AGNT14, AGNT15, AGNT11\n- [Restricted downloads](spec.md#restricted-downloads): rests on DCSN2, AGNT9\n- [Download counts](spec.md#download-counts): res keyword results alone, with a warning in the function's log, so the reader still gets a page. Errors on reindex or publish stop that run, as any other failed step does. The user kept it.\n","files":{"screenshots/shot-83fe6085c35d.png":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACWwAAAWACAYAAADHlZ0WAAAMVGlDQ1BJQ0MgUHJvZmlsZQAASImVVwdYU8kWnltSIbQAAlJCb4KIlABSQg8gvQiiEpIAoYSYEFTEhi4quBZULFjRVRHFThMbNlQWxd4XCyrKuliworxJAujy9r33vfm+ufPf/5z558y5c++dAUC1myMSZaNqAOQI88TRQb6MCYlJDNJLQAX6QAMQgTWHKxGxIiPDACyD7d/Lh5sAkbXX7GRa/27/r0Wdx5dwAUAiIU7lSbg5EB8GAG/hisR5ABALIW86LU8kw1sg1hTDACE+LMPpCtwiw6kKfF/uExvtB3EPAGRlDkecDoBKH+QZ+dx0qKOqD7GDkCcQQiybj1dOTi4P4iUQW0EfEcQyfWbqTzrpf9NMHdLkcNKHsGIu8kL2F0hE2ZwZ/2c6/nfJyZYOjmEFq3KGODhaNmeYt56s3FAZVgYAxYWp4REQa0CsJuDJ/WXYJEMaHKfwR524Ej+YM6ANcbAkO4Y9wE/mcfxDIYZ5QsV8oR9rgF+aJgiU+cDVglYKs8PDBvoeFOSxYyHWgbiFLwmIGeA7xLnRgzF8SBPLdSCPkTlieTxQEzOUZsWxFGNhjhl89oAmFl6QEZsAMRViXr4gPhxiFYiFkqyY0AGfwoIMv/BBH7E0WjYvM4jL+MIg36GYxYHRA/61OZLBPGCtGQJ2+AB+mJcRG6zIG9bD5cjjh3PB+vhC1mCulvIlE8IG58Lj+wco8oBr8oVxMQoeNxPl+UYr+uIuouzIAX88nJ8dJONNIE6R5McM9i3KgwtVoY+XifIiYxVx4jsyOSGRinjwJhAG/IA/YAAprKkgF2QCQVt3XTe8U1gCAQeIQTrgA7sBZrBHgtwihNcYUAD+hIgPJEP9fOVWPsiH/LdhrIwTDHGKqx1IG7DJVLLAM4hzoCUXZMMqhXeD/vHgKbwTDMUTCj34cg8+1B0eJQdW7oCKrNc/84PsD4YFmbABRjo4AkN10JMYQPQnBhMDida4Hu6Fe+Bh8OoDqyPOxN0GY/3hT3hGaCc8JtwgdBDuTBEUiYdFOR50QP3AgZyl/pwz3AJqOuO+uCdUh8q4Nq4H7HAnOA4L94YjO0P25/iHov3pCQ1oURwoKGUExYdiNSz7DBUbFechFVkef86FIq7Uodz6DVmGqfxkEQAebEOHe2KLsEPYeewUdgFrwuoAAzuB1WOt2DEZHlpxT+UrbnC0aHk8WVBn+Jr58RRlWZM4VDt0OfQpbHn86Xmyl9EvVzRDLEjPyGOw4N+Dz2ALufajGI4Oji4AyP5Fik/duyj5PwbRbv3Bzf8DAM8T/f39R39wIScAOOAKPwkNPzgrJvzNKAHQ0sCVivMVHC67EOCXQxW+fbrAEJjCr6kdcAQuwAP4gAAQAiJALEgEk2H0GXCdi8E0UAjmgWJQCpaD1WA92Ay2gV1gLzgI6kATOAXOgUvgCrgB7sGV0glegR7wAXxFEISE0BA6oosYIeaILeKIMBEvJAAJQ6KRRCQFSUeEiBQpROYjpUgZsh7ZilQhB5AG5BRyAWlH7iCPkC7kLfIFxVBlVBM1QC3Q0SgTZaGhaCw6CU1Hp6IF6AJ0KboWrUT3oLXoKfQSegPtQF+hvRjAlDBtzBizw5iYHxaBJWFpmBibjZVg5VglVoM1wud8DevAurHPOBGn4wzcDq7WYDwO5+JT8dn4Enw9vguvxc/g1/BHeA/+nU
