<script type="application/json" id="dz-record">{"fv":{"id":"","path":"research-archive-in-a-box/docs/specs/2026-11-13-api-and-search","key":"research-archive-in-a-box/api-and-search","record":{"schema":4,"title":"API and search (Plan 6)","expect":8,"agent_at":"2026-11-14T16:58:57.748112Z","start":{"opening":{"text":"can we start all of the plans as planned so we don't forget them and have a way to track them with their own sessions\n\n(Saved as planned: mark this plan Planned with diazo_update planned: true and wait for Start planning. Do no research until then. It waits on Plan 2, folder 8da653f233f9, and Plan 4, the archive infrastructure.)\n\nBrief: Plan 6 in docs/planning-handoff.md. Starter prompt from the handoff:\n\n\u003e Read `docs/planning-handoff.md`. Plan the API and search (Plan 6). There is no relational database. Search is a catalog file filtered in the browser with DuckDB, plus an optional DynamoDB vector index. Plan the endpoints and the search design, and take the open questions with me one at a time."},"findings":[{"text":"Plan 4 is built and merged: the REST API under /api with a Cognito authorizer (only /api/health and /api/whoami exist), catalog tables A and B with the active-table SSM parameter, the five operational tables, two PKCE app clients (web, and cli with callback http://localhost:8765/callback), CloudFront serving the site from the derived bucket's site/, open data at /data/*, and standard logs into the derived bucket's logs/.","source":"git log origin/main (#10, #12, #13, #14, #15); packages/infra/src/api.ts, auth.ts, web.ts, tables.ts","cases":"1 of 1 deploy path"},{"text":"Nothing publishes yet. Plan 7 (the publish pipeline) has no rounds or decisions, so the only way a dataset reaches the catalog today is Plan 4's reindex, which reads manifests from the archive bucket and loads dataset, version and file items.","source":"docs/specs/2026-11-13-ingest-review-and-access-workflows/decisions.json (no rounds, no decisions); packages/backend/src/archive_backend/reindex.py","cases":"1 of 1"},{"text":"Plans 8 (web app) and 9 (agent layer), which consume Plan 6's endpoints, are still Planned with no decisions, so no consumer has fixed an endpoint shape yet.","source":"their decisions.json files","cases":"2 of 2"},{"text":"Plan 4 handed Plan 6: the vector index on both catalog tables (added through the tables' CfnTable vectorIndexes), the embedding model and its config setting, rolling CloudFront logs into DownloadCounts, counting restricted downloads, what a Settings item holds, and an admin reindex route (Plan 4's PARK1).","source":"docs/planning-handoff.md Decision log rows dated 2026-11-13 (4, 6); Plan 4 spec.md lines 76, 88, 151, 171-178","cases":"6 hand-offs"},{"text":"Plan 7 decides what a submission and a review event hold, and owns the review policy; Plan 4 only made the Submissions and Reviews tables and their keys.","source":"Plan 4 spec.md line 88; handoff Plan 7 brief","cases":"1"},{"text":"The catalog file's home is fixed: the derived bucket's site/, so CloudFront serves it beside the app. Its contents are Plan 6's.","source":"Plan 4 spec.md line 57","cases":"1"},{"text":"The manifest already holds everything a facet or filter needs: title, description, keywords, licenses and rights status, access level, project, temporal coverage (start, end, ongoing), a WGS 84 bounding box, and each resource's format. Themes are a config list, but no manifest field assigns a dataset a theme yet.","source":"packages/contract/src/archive_contract/manifest.py; config.py (themes: list[str])","cases":"1 model"}],"rounds":[{"take":"**Where Plan 6 starts from.** Plan 4 left a working API shell, the tables, sign-in and CloudFront, and named Plan 6 as the owner of everything that reads the catalog and searches it. But nothing publishes yet: Plan 7 isn't planned, so data reaches the catalog only through the reindex, and the records a submission and a review hold are Plan 7's to decide.\n\nThe brief lists seven areas. They split cleanly by what they wait on:\n\n| Area | Works end to end now? | Waits on |\n|---|---|---|\n| Catalog file and in-browser filtering | Yes, built from reindexed manifests | nothing |\n| Read endpoints: datasets, versions, files, projects | Yes | nothing (projects appear once Plan 7 stores them) |\n| Restricted downloads: access check and short-lived link | Yes | nothing |\n| Download counts from CloudFront logs, plus restricted downloads | Yes | nothing |\n| Sign-in for the browser, the CLI and the MCP server | Yes, on Plan 4's two clients | nothing |\n| Submission, review and admin-settings endpoints | No | Plan 7's submission and review records and review policy |\n| Semantic search with the vector index | Builds, but nothing to judge it on | a real corpus (Plan 5) to compare it with keyword search |\n\n**My take.** Plan 6 is several plans in this folder, built in dependency order:\n\n1. **Read and search, now.** The catalog file, written by one function that reindex calls today and Plan 7's publish step calls later; the read endpoints; restricted links; download counts; CLI sign-in; the OpenAPI spec generated from the contract. This is enough for Plan 8 to build the reader's flow (search, dataset page, download) and Plan 9 the search and fetch tools.\n2. **Write endpoints, after Plan 7 decides its records.** Submissions, reviews and settings, written once Plan 7 has said what they hold, so the API and the pipeline don't each invent a submission.\n3. **Semantic search, once there is a corpus.** The vector index, the embedding model and how its results merge with keyword results, judged on Plan 5's converted FEMC datasets rather than guessed.\n\nAll three stay in Plan 6's scope; only the order changes. I've sent the split to the coordinating session as a cross-plan question.","visuals":[{"kind":"mermaid","caption":"PLAN1's read path: one writer for the catalog file, the browser filters it, the API answers details and restricted links","mermaid":"flowchart LR\n  M[Manifests in archive bucket] --\u003e R[reindex now / Plan 7 publish later]\n  R --\u003e T[(Active catalog table)]\n  R --\u003e W[catalog writer]\n  W --\u003e C[catalog file in derived site/]\n  C --\u003e|CloudFront| B[Browser: DuckDB facets, keyword, bbox]\n  B --\u003e A[/api/datasets/id/]\n  A --\u003e T\n  B --\u003e L[/api/.../download restricted/]\n  L --\u003e S[Short-lived S3 link]\n  CF[CloudFront logs] --\u003e D[(DownloadCounts)]\n  L --\u003e D"}],"recommendation":"Plan the read and search side first, as PLAN1, end to end on what reindex already loads; declare the write endpoints and semantic search as later plans in this folder, each written when what it waits on exists."}],"direction":{"round":1,"at":"2026-11-13T21:33:04.161603-06:00","by":"user"}},"understanding":{"points":[{"kind":"outcome","text":"A read API open to all, a write API for signed-in users, and search that works with no relational database.","source":"said"},{"kind":"outcome","text":"Plan 6 is built as plans in this folder, in dependency order: read and search now (PLAN1), and semantic search once Plan 5's corpus exists to judge it on (PLAN3). Plan 7 owns the submission and review endpoints; whether PLAN2 stays is DCSN5.","source":"said"},{"kind":"outcome","text":"PLAN1 delivers, on data the reindex already loads: the catalog file and a server search endpoint over it, dataset, version and project reads, short-lived links for restricted files, download counts, the optional usage form, the CLI and MCP sign-in flow, and an OpenAPI spec generated from the code. That is enough for Plan 8's reader flow and Plan 9's search and fetch tools.","source":"assumed"},{"kind":"constraint","text":"No relational database. The packages in S3 are the source of truth; the catalog tables, the catalog file and any index are derived and rebuilt by reindex.","source":"said"},{"kind":"constraint","text":"Build on Plans 1, 2 and 4 as built (the contract, archive-backend, the ResearchArchive construct and its exposed tables, buckets, API and authorizer, pythonFunction); don't rebuild them.","source":"said"},{"kind":"constraint","text":"No generative AI on the server; the only model use is optional Bedrock embeddings, and with embeddings off the archive uses keyword search.","source":"said"},{"kind":"constraint","text":"Generic first: nothing specific to FEMC or ecology. FEMC is the test afterwards, never the source.","source":"said"},{"kind":"constraint","text":"Cross-plan questions go to the coordinating session first; anything other plans rely on goes in the handoff's Decision log.","source":"said"},{"kind":"success","text":"On a test deploy with two datasets loaded by reindex (one open, one restricted): GET /api/search finds both by keyword and filters them by access, licence, date and map box; GET /api/datasets/\u003cid\u003e returns each dataset's manifest and files; a signed-in user gets a working short-lived link to a restricted file and a signed-out request is refused; a download through /data shows up in DownloadCounts after the rollup runs; a usage answer is stored and an admin reads it back.","source":"assumed"},{"kind":"success","text":"The OpenAPI spec is committed, and CI fails when the code and the committed spec drift apart.","source":"assumed"}],"confirmed":true,"revisions":[{"at":"0001-01-01T00:00:00Z","text":"Search runs on the server through GET /api/search over the catalog file, not in the browser with DuckDB; success criteria test the endpoint.","because":"DCSN1"},{"at":"0001-01-01T00:00:00Z","text":"Plan 7 owns submission and review endpoints; project reads and the usage form join PLAN1.","because":"note:DCSN5"}]},"steps":[{"id":"STEP1","what":"Walk the test deploy of Plan 6's read API and search with me","why":"TASK5: proves search, reads, restricted links, the usage form and download counts on a real deploy, then tears it down","how":"One action at a time; the current one opens on its own. Your actions are naming the profile, two Go presses and two browser sign-ins.","done":true,"done_at":"2026-11-13T23:59:37.406548-06:00","actions":[{"id":"A1","who":"user","what":"Name the AWS profile and the alert email address","how":"1. Write in the note the AWS profile to deploy the test stage with (the same one as Plan 4's test deploy is fine) and the email address for its alerts.\n2. Press Done.\n\nNothing is deployed until your Go at A3.","state":"done","result":"personal court@subaud.io","answered_at":"2026-11-13T22:41:30.640333-06:00","via":"page"},{"id":"A2","who":"agent","what":"Open the PR for Tasks 1 to 4, merge it once CI's python and typescript checks pass, and check the profile's identity","state":"done","result":"research-in-a-box#22 merged as 6608bba after python and typescript passed; profile personal is account 316091283514, us-east-1"},{"id":"A3","who":"user","what":"Go for the deploy","how":"1. Press Go to deploy `ResearchArchive-test` to the profile you named. It costs a few dollars at most while it exists and is destroyed at A10.","state":"done","answered_at":"2026-11-13T23:10:24.79156-06:00","via":"page","answers":[{"id":"GO","label":"Go","detail":"The agent deploys ResearchArchive-test now"},{"id":"NOGO","label":"No go","hands_back":true}],"choice":"GO"},{"id":"A4","who":"agent","what":"Build the Lambda assets, deploy ResearchArchive-test, upload two sample packages (one open, one restricted, each with archive:published), run just reindex test, and check catalog.json, search, reads and a signed-out download refused","state":"done","result":"deploy exit 0; reindex SUCCEEDED (B, 30 items, catalog 2 rows); /catalog.json 200 max-age=60, 2 rows; search 'stream temperature' 2 hits, access=restricted 1, facets add up; dataset read returns manifest + 13 files; unknown dataset 404; signed-out download 401"},{"id":"A4B","who":"agent","what":"Merge Task 6 (invitation-only accounts, research-in-a-box#26) and update the stack so sign-up is off, then invite you with just invite-user test","state chArchive-search-test now"},{"id":"NOGO","label":"No go","hands_back":true}],"choice":"GO"},{"id":"A3","who":"agent","what":"Deploy with embeddings on, upload the ten datapackage.json records with archive:published, reindex, check every dataset carries an embedding, run the 22 searches through CloudFront, check 'air pollution' puts the IMPROVE aerosol dataset first, and time ten warm searches and one after 15 idle minutes","state":"done","result":"deploy exit 0 from fab8a87; reindex SUCCEEDED (148 items, catalog 10, pages 10); all 10 META items carry a 1,024-number embedding, vector index ACTIVE; 22 searches live: 19 first, 21 in top 3, 22 found; 'air pollution' puts improve-fine-aerosol first; no SemanticFallback in the API log; warm median 0.29 s (n=10); after 16 idle minutes 3.58 s, then 0.30 s"},{"id":"A4","who":"agent","what":"Redeploy with the module removed; check 'air pollution' answers keyword results with no error and 'ozone' still finds the ozone dataset","state":"done","result":"redeploy exit 0 in 86 s, no failures; 'air pollution' 200 with 0 keyword results (no error); 'ozone' 2 results, ozone-bioindicators first; both catalog tables have 0 vector indexes; API role has no Bedrock or SearchVectors permission; no SemanticFallback lines since the redeploy"},{"id":"A5","who":"user","what":"Go for the teardown","how":"1. Press Go to destroy `ResearchArchive-search-test` and everything in it.","state":"done","answered_at":"2026-11-14T10:49:40.027929-06:00","via":"page","answers":[{"id":"GO","label":"Go","detail":"The agent destroys ResearchArchive-search-test now"},{"id":"NOGO","label":"Keep it for now","hands_back":true}],"choice":"GO"},{"id":"A6","who":"agent","what":"Destroy ResearchArchive-search-test and confirm its stack, buckets, tables and leftover log groups are gone","state":"done","result":"cdk destroy exit 0; stack does not exist; 0 buckets, 0 tables, 0 functions, 0 /research-archive/search-test parameters, function log groups gone; the two CDK helper log groups (bucket deployment, auto-delete) deleted by hand; nothing left"}]}],"decisions":[{"id":"DCSN1","name":"Where search runs","question":"Where should the catalog be searched: in the reader's browser, or by the API?","example":"A reader types 'ozone' on the search page and ticks the CC-BY licence and a map box. Either the browser has already downloaded the whole catalog and filters it itself, or it sends the query to the API and gets back one page of matching datasets with facet counts. Plan 9's MCP server and the CLI need to search too, and PLAN3's semantic search embeds the query on the server.","options":[{"id":"A","title":"In the browser, with DuckDB","includes":"One `catalog.parquet`; the search page loads DuckDB-Wasm (5.3 MB compressed, cached after the first visit) and filters with SQL. As the handoff wrote it.","pulls_in":"DuckDB in archive-backend's Lambda package to write Parquet, and DuckDB-Wasm on Plan 8's search page. The MCP server and PLAN3 still need a server search.","visuals":[{"kind":"table","caption":"Time to the first search: engine plus catalog download, then load and filter","table":{"columns":["Datasets","Download, 10 Mbit/s","Download, 50 Mbit/s","Load","Each filter"],"rows":[["1,000","4.7 s","0.9 s","0.05 s","13 ms"],["10,000","8.5 s","1.7 s","0.05 s","3 ms"],["50,000","25 s","5.0 s","0.19 s","7 ms"]],"sample":"DuckDB-Wasm eh build in Node on this Mac, two runs; download is size x 8 / line speed"}}]},{"id":"B","title":"In the browser, plain JavaScript","includes":"One `catalog.json`, gzipped by CloudFront; the search page parses it and filters with ordinary JavaScript. Every filter change is instant once loaded. Past roughly 20,000 datasets the download gets too big and search moves to the server.","pulls_in":"Nothing new on the server. The MCP server and PLAN3 still need a server search, so there would be two search paths.","visuals":[{"kind":"table","caption":"Time to the first search: catalog download, then parse and filter","table":{"columns":["Datasets","Download, 10 Mbit/s","Download, 50 Mbit/s","Parse","Each filter"],"rows":[["1,000","0.6 s","0.1 s","3 ms","1 ms"],["10,000","6.2 s","1.2 s","22 ms","8 ms"],["50,000","31 s","6.2 s","0.11 s","45 ms"]],"sample":"Node on this Mac, two runs; download is gzip size x 8 / line speed"}}]},{"id":"C","title":"On the server, through a search endpoint","includes":"`GET /api/search` with the keyword, licence, access, format, project, date range and bounding box as query parameters, answering one page of results (20 by default) with a count per facet value for the current filter. The search Lambda reads `catalog.json` from the derived bucket and keeps it in memory, re-reading it when the file changes. The browser, the CLI and the MCP server all call the same endpoint, and PLAN3 adds semantic ranking to it later. The catalog file is still written by the one writer and stays readable by anyone.","pulls_in":"One more route on the API Lambda and its read of the derived bucket; a request per filter change, which the page debounces as the reader types. Changes the handoff's 'the browser uses DuckDB' to 'the browser asks the API'.","visuals":[{"kind":"table","caption":"Server-side filter in Python and the page it returns","table":{"columns":["Datasets","Parse catalog (once per warm Lambda)","Filter plus facet counts","Page returned (20 rows, gzip)","Round trip per search"],"rows":[["1,000","6 ms","1 ms","16 KB","about 0.1 to 0.2 s (estimated)"],["10,000","70 ms","9 ms","16 KB","about 0.1 to 0.2 s (estimated)"],["50,000","0.34 to 0.45 s","45 to 65 ms","16 KB","about 0.15 to 0.25 s (estimated)"]],"sample":"CPython on this Mac, two runs, same filter as A and B; a 512 MB arm64 Lambda may be 2 to 3 times slower (assumed); round trip through CloudFront and API Gateway not measured yet, first search after idle about a second (estimated)"}}]}],"recommendation":{"option":"C","why":"It is the one search every client already needs: Plan 9's MCP server and the CLI can't filter a browser-side catalog, and PLAN3's semantic search embeds the query with Bedrock on the server, so keyword and semantic results can only be merged there. The browser downloads about 16 KB per search instead of megabytes, so it works the same at 500 datasets or 50,000, and the filter itself takes under 10 ms at 10,000 datasets. The cost is a round trip per filter change, which I estimate at 0.1 to 0.2 s and will measure on the test deploy.","evidence":[{"text":"Python filter plus facet counts over the JSON catalog","source":"/tmp/p6measure/pyfilter.py, second run","output":"1000 parse ms 6 filter+facets ms 0.9 hits 75 page gzip KB 16\n10000 parse ms 69 filter+facets ms 8.5 hits 824 page gzip KB 16\n50000 parse ms 341 filter+facets ms 43.4 hits 4062 page gzip KB 16"},{"text":"Plain JavaScript and DuckDB-Wasm in the browser, same filter","source":"/tmp/p6measure/plainjs.cjs and wasm/bench.cjs","output":"10000 parse ms 22 filter ms 8 rows 824 (JavaScript)\n10000 parquet load ms 46 filter ms 3 rows 824 (DuckDB-Wasm)"},{"text":"Semantic search embeds text through Bedrock on the server","source":"docs/planning-handoff.md, Decisions already made, Infrastructure","output":"The server's only model use is optional embeddings for semantic search, through Bedrock. With embeddings off, the archive falls back to keyword search."},{"text":"The handoff decision this changes","source":"docs/planning-handoff.md, Decisions already made, Infrastructure","output":"On publish, the whole catalog is also written as one file. The browser uses DuckDB on it for facets, keyword and bounding-box filtering."}]},"state":"decided","choice":"C","revisions":[{"at":"2026-11-13T22:04:46.635373-06:00","text":"Added load, filter and download times after your note: download dominates, and the format only matters past a few thousand datasets","because":"note:DCSN1"},{"at":"2026-11-13T22:07:47.657226-06:00","text":"Revised after your note: replaced 'JSON read by DuckDB' with 'JSON filtered in plain JavaScript, no DuckDB on the search page', which measured as fast and much quicker to first search; recommendation moved from A to B","because":"note:DCSN1"},{"at":"2026-11-13T22:12:52.807909-06:00","text":"Revised after your note: added option C, a search endpoint that filters on the server, and moved the recommendation to it, since the MCP server and PLAN3's semantic search need a server-side search anyway","because":"note:DCSN1"}]},{"id":"DCSN2","name":"Who reads restricted data","question":"Who may download a dataset marked restricted?","example":"A dataset is published with access `restricted`. A visitor who is not signed in finds it in search, sees its title, description and column list, and presses Download. The API must decide whether to hand back a short-lived link to the file.","options":[{"id":"A","title":"Anyone signed in","includes":"Restricted means sign in to download. Any account in the user pool gets the link; signing up is self-service with email, as Plan 4 built it. By-request datasets need a grant from Plan 7's request workflow, which the same check reads once it exists.","pulls_in":"Nothing new: the Cognito authorizer Plan 4 built."},{"id":"B","title":"Only approved readers","includes":"Signed in and in a new `reader` group that a curator or admin adds people to. Restricted becomes a lighter by-request.","pulls_in":"A fourth Cognito group, and a way for admins to add people to it (a screen in Plan 8 or a command)."}],"recommendation":{"option":"A","why":"It is the only reading that keeps restricted and by-request distinct: by-request already covers 'someone must approve you'. It needs nothing beyond what Plan 4 built, and a group can be added later if an archive asks for it.","evidence":[{"text":"The access levels the contract offers","source":"packages/contract/src/archive_contract/manifest.py","output":"AccessLevel = Literal[\"open\", \"restricted\", \"by-request\", \"description-only\"]"},{"text":"By-request access is its own workflow that emails the owner and waits","source":"docs/planning-handoff.md, Decisions already made, Infrastructure","output":"By-request data starts a small durable function that emails the data owner and waits on a callback."}]},"state":"decided","choice":"A"},{"id":"DCSN3","name":"Optional usage form","question":"Should the optional 'who are you and how will you use this' form be built now, or later?","example":"Before a download, a reader is offered an optional short form: their organisation and what they plan to do with the data. Archives use the answers to show funders who uses their data. Nobody has asked for it in this kit yet, and no screen exists to show it.","options":[{"id":"A","title":"Later, as a follow-up","includes":"Download counts now; the form waits until an archive asks for it or Plan 8 designs the download screen.","pulls_in":"Nothing now."},{"id":"B","title":"Now","includes":"`POST /api/datasets/\u003cid\u003e/usage` taking the optional answers, stored per dataset and month, with an admin read of them.","pulls_in":"A new table (Plan 4 made none for this), an admin endpoint, and the form itself in Plan 8."}],"recommendation":{"option":"A","why":"No real user has asked for it, it needs a table Plan 4 didn't make and a screen Plan 8 hasn't planned, and download counts already give the funding numbers. It stays a named follow-up."},"state":"decided","choice":"B"},{"id":"DCSN4","name":"How the API is built","question":"Should the endpoints be one Lambda using Powertools' router, or one Lambda per endpoint?","example":"PLAN1 adds about five endpoints and PLAN2 more. Each needs a handler, request and response models, and an entry in the OpenAPI spec that Plan 8 and Plan 9 generate their clients from. Plan 4's two existing endpoints are one small Lambda each.","options":[{"id":"A","title":"One API Lambda with Powertools' REST router","includes":"Routes declared with Pydantic request and response models; Powertools writes the OpenAPI spec from them, which is committed and drift-checked in CI. API Gateway still declares each route, so the Cognito authorizer sits on the signed-in ones. One cold start covers every route.","pulls_in":"aws-lambda-powertools (pure Python) in archive-backend."},{"id":"B","title":"One Lambda per endpoint, as Plan 4 did","includes":"Each handler written by hand like whoami.py, and a script that assembles the OpenAPI spec from the Pydantic models and a route table we keep beside it.","pulls_in":"Our own OpenAPI assembly script and a route table to keep in step with the code; a function, log group and alarm per endpoint."}],"recommendation":{"option":"A","why":"The spec is generated from the same code that answers the request, so it can't drift from the handlers. B needs a second list of routes kept in step by hand. Powertools is AWS's own library and pure Python, so it adds no compiled wheels.","evidence":[{"text":"Powertools generates the OpenAPI schema from route definitions and Pydantic models","source":"https://docs.aws.amazon.com/powertools/python/latest/core/event_handler/openapi/","output":"Powertools for AWS Lambda supports automatic OpenAPI schema generation from your route definitions and type annotations."},{"text":"Plan 4's endpoints are hand-written single-purpose handlers","source":"packages/backend/src/archive_backend/whoami.py, health.py; packages/infra/src/api.ts"}]},"state":"decided","choice":"A"},{"id":"DCSN5","name":"Keep or drop PLAN2","question":"Plan 7 now owns the submission and review endpoints. Should PLAN2 be dropped?","example":"PLAN2 was to hold the submission, review and settings endpoints. The coordinating session and Plan 7 agreed that Plan 7 owns everything under /api/submissions, including the review-policy setting, and project reads now fit in PLAN1. What is left for PLAN2 is Plan 4's follow-up for starting a reindex from an admin API route, and no setting anyone has asked for.","options":[{"id":"A","title":"Drop PLAN2","includes":"Plan 6 becomes PLAN1 (read, search, downloads, usage form) and PLAN3 (semantic search). The admin reindex route stays Plan 4's follow-up PARK1, picked up when someone wants reindex outside `just reindex`.","pulls_in":"Nothing."},{"id":"B","title":"Keep PLAN2 for admin routes","includes":"PLAN2 holds the admin reindex route and any settings endpoint that turns up, written after PLAN1.","pulls_in":"A plan with one known task, waiting for a need."}],"recommendation":{"option":"A","why":"Nothing real is left in it: review policy went to Plan 7, projects fit in PLAN1, and the reindex route is already a follow-up with an owner. A plan can be added to this folder again when a need appears.","evidence":[{"text":"The coordinating decision","source":"muster thread #941 from the coordinating session","output":"Plan 7 owns everything under /api/submissions: creating a submission and its upload links, submitting it, the curator queue, one submission's state, the curator's decision, and the review-policy setting. ... Your PLAN2 shrinks to whatever settings remain once review policy leaves; if nothing real remains, drop it on Court's word."}]},"state":"decided","choice":"A"},{"id":"DCSN6","name":"Semantic search now or later","question":"Should PLAN3 build semantic search now, or first fix keyword search and add semantic search once the search page has real readers?","example":"On Plan 5's ten converted FEMC datasets, a reader typing 'ozone damage on plants' gets no results today: the search built in PLAN1 requires every word to appear, and 'damage' and 'on' don't. 'air pollution' finds nothing either, though the IMPROVE aerosol dataset is exactly that. Semantic search would catch the second kind; a looser keyword match catches the first.","options":[{"id":"A","title":"Fix keyword search now, semantic later","includes":"PLAN3 changes keyword matching: any word counts, results ranked by how many words match (title first), common words like 'on' and 'the' ignored, plurals matched. No Bedrock and no vector index. Semantic search becomes a follow-up, taken up once Plan 8's search page has readers and their missed searches show it is needed.","pulls_in":"A change to search.py and its tests, and the spec's Search section reworded. Nothing new on AWS.","visuals":[{"kind":"table","caption":"Each search tried against the 10 converted datasets","table":{"columns":["Search","Found first","In the top 3","Found at all"],"rows":[["Keyword as built (every word must match)","11 of 22","11 of 22","11 of 22"],["Keyword, any word, ranked (option A)","13 of 22","16 of 22","17 of 22"],["Semantic, Titan Text Embeddings v2","17 of 22","20 of 22","always ranks all"],["Semantic, Cohere Embed v4","17 of 22","21 of 22","always ranks all"]],"sample":"22 plain-language searches I wrote before running them, each with the one dataset it should find; 10 datasets, so the top 3 is 30% of the archive and 'found first' is the fairer measure"}}]},{"id":"B","title":"Fix keyword search and build semantic search now","includes":"Option A, plus the brief's semantic search: an embeddings setting in the archive config, the vector index on both catalog tables, embedding each dataset at reindex and publish, embedding the query in /api/search, and merging semantic with keyword results. Keyword stays the fallback when embeddings are off.","pulls_in":"Two more decisions for you (the embedding model, how the two result lists merge), Bedrock calls at reindex, publish and every search, a second test deploy, and the cold-start cost of embedding a query on top of PARK3's 2.8 s."},{"id":"C","title":"Not yet: leave search as built","includes":"No change now; PLAN3 waits until Plan 8's search page is used.","pulls_in":"Nothing, but searches like 'ozone damage on plants' keep returning nothing."}],"recommendation":{"option":"A","why":"The search every archive runs, embeddings on or off, misses half of these searches because every word must match; option A lifts that from 11 to 17 found out of 22 with a small change and nothing new on AWS. Semantic search finds 4 more first-place results, mostly synonyms ('air pollution' for the aerosol data, 'land cover map' for the vegetation raster), but that is 22 searches I wrote over 10 short records, and nobody has used the search page yet: Plan 8 hasn't built it. Readers' real missed searches are the better test of whether it's worth Bedrock on every search.","evidence":[{"text":"Keyword search as built, through archive_backend.search on catalog rows built from the ten packages","source":"/tmp/p6kw/run.py on practice-data/packages, main at 546e5dd","output":"MISS 'ozone damage on plants' ... got []\nMISS 'air pollution' ... got []\nHIT  'ozone' ... got ['ozone-bioindicators', 'white-clover-biomonitor']\n(11 HIT, 11 MISS)"},{"text":"Ranked any-word keyword matching, same rows and searches","source":"/tmp/p6kw/variant.py","output":"TOP1 'ozone damage on plants' rank 1\nTOP1 'insect damage from the air' rank 1\nMISS 'air pollution' rank None\nMISS 'land cover map' rank None\n(13 TOP1, 3 top3, 6 MISS)"},{"text":"Bedrock embeddings on title, description and keywords, cosine similarity","source":"/tmp/p6kw/embed.py with AWS_PROFILE=personal, us-east-1","output":"== titan-v2: top1 17/22, top3 20/22\n== cohere-v4: top1 17/22, top3 21/22"},{"text":"One miss no search fixes: the Camels Hump record's title is 'census_data' and its description is 26 characters; the place name is only in its citation","source":"practice-data/packages/camels-hump-census/datapackage.json","output":"'camels-hump-census': ('census_data', 26)"}]},"state":"decided","choice":"B"},{"id":"DCSN7","name":"Embedding model","question":"Which Bedrock model should turn datasets and searches into vectors: Amazon Titan Text Embeddings v2 or Cohere Embed v4?","example":"When a dataset is published or reindexed, its title, description and keywords are sent to the model, which returns a list of 1,024 numbers; each search is sent too, and the closest datasets come back. The model is fixed per archive: switching later means re-embedding every dataset, which a reindex does.","options":[{"id":"A","title":"Amazon Titan Text Embeddings v2","includes":"Amazon's own model, 1,024 dimensions, normalised. About $0.02 per million tokens (from AWS's pricing as quoted by third parties; not read from AWS directly).","pulls_in":"bedrock:InvokeModel on that model for the API and reindex functions.","visuals":[{"kind":"table","caption":"Each model on the 22 searches over the 10 converted datasets","table":{"columns":["Model","Found first (semantic only)","Found first (merged with keyword)","In the top 3 (merged)","Time to embed one search"],"rows":[["Titan v2","17 of 22","17 of 22","21 of 22","156 ms median, 953 ms max"],["Cohere v4","17 of 22","18 of 22","22 of 22","180 ms median, 242 ms max"]],"sample":"22 searches, 10 datasets, 10 timed calls per model from this Mac to us-east-1"}}]},{"id":"B","title":"Cohere Embed v4","includes":"Cohere's model through Bedrock, 1,024 dimensions, with separate modes for documents and searches. One more search found first when merged with keyword (18 against 17), and a steadier response time. Its Bedrock price I haven't confirmed.","pulls_in":"bedrock:InvokeModel on that model, and a third-party model's terms for each adopting archive."}],"recommendation":{"option":"A","why":"Both put 17 of 22 searches first on their own; Cohere's lead once merged is one search out of 22, which this sample can't tell apart from chance. Titan is Amazon's own model, so an adopting archive accepts no third party's terms, and it is the cheaper of the two by the figures I could find. If readers' searches later show Cohere is better, switching is a config change and a reindex.","evidence":[{"text":"Merged and semantic-only results per model","source":"/tmp/p6kw/merge.py, AWS_PROFILE=personal, us-east-1","output":"titan-v2  semantic only first 17/22 top3 20/22\ntitan-v2  RRF keyword+semantic first 17/22 top3 21/22\ncohere-v4 semantic only first 17/22 top3 21/22\ncohere-v4 RRF keyword+semantic first 18/22 top3 22/22"},{"text":"Time to embed one search, 10 calls each","source":"python timing of bedrock-runtime invoke_model from this Mac","output":"titan median/max ms (156, 953)\ncohere median/max ms (180, 242)"},{"text":"Titan v2 price","source":"https://caylent.com/blog/amazon-bedrock-pricing-explained (search result snippet)","output":"Amazon Titan Text Embeddings V2 costs $0.02 per million input tokens in supported US Regions and can produce 256-, 512-, or 1,024-dimensional vectors."}]},"depends_on":["DCSN6"],"state":"decided","choice":"A"},{"id":"DCSN8","name":"Merging keyword and semantic","question":"How should /api/search combine the keyword matches and the semantic matches into one list?","example":"A reader searches 'ozone damage on plants'. Keyword search ranks the ozone dataset first because three words match; semantic search also ranks it first, then the clover biomonitor. For 'air pollution' keyword finds nothing and semantic finds the aerosol data. The endpoint returns one ranked page either way.","options":[{"id":"A","title":"Reciprocal rank fusion","includes":"Each dataset scores 1/(60 + its place) in each list, the two scores are added, and the page is sorted by the sum. A dataset both searches rank high comes first; one only semantic search finds still appears. No scores to tune between the two.","pulls_in":"A few lines in search.py."},{"id":"B","title":"Keyword first, semantic after","includes":"Every keyword match, in keyword order, then the semantic-only matches after them. Predictable: a dataset with the words always beats one without.","pulls_in":"A few lines in search.py."},{"id":"C","title":"Semantic only, keyword as fallback","includes":"With embeddings on, rank by semantic search alone; keyword matching runs only when embeddings are off.","pulls_in":"Nothing extra, but exact words like a dataset's name or a code no longer decide the order."}],"recommendation":{"option":"A","why":"With Titan v2, fusion and keyword-first tie on these searches (17 first, 21 in the top 3) and both beat semantic-only (17 first, 20 in the top 3). Fusion is the safer of the two as the archive grows: keyword-first puts any dataset that shares one word above a strong semantic match, while fusion weighs both lists. Semantic-only drops exact matches on names and codes, which researchers type often.","evidence":[{"text":"Three ways of merging with Titan v2","source":"/tmp/p6kw/merge.py","output":"titan-v2  semantic only                first 17/22  top3 20/22\ntitan-v2  RRF keyword+semantic         first 17/22  top3 21/22\ntitan-v2  keyword first, then semantic first 17/22  top3 21/22"}]},"depends_on":["DCSN6","DCSN7"],"state":"decided","choice":"A","revisions":[{"at":"2026-11-14T00:18:30.153974-06:00","text":"Revised after DCSN7: the recommendation now rests on Titan v2's numbers, where fusion and keyword-first tie","because":"DCSN7"}]}],"calls":[{"id":"AGNT1","name":"Reads from the active table","question":"Where do the read endpoints get a dataset's details?","took":"`GET /api/datasets/{id}`, `GET /api/datasets/{id}/versions` and `GET /api/datasets/{id}/versions/{version}` read the active catalog table (the version item already holds the manifest text, plus the file items). Finding datasets is search's job (DCSN1), not a separate list endpoint.","instead":"Read each manifest from the archive bucket, or add a plain list endpoint beside search.","why":"The table has everything, and it works for restricted and description-only datasets whose manifests CloudFront can't serve.","evidence":[{"text":"Version items carry the manifest","source":"handoff Decision log 2026-11-13 (4, 6, 7), catalog items","output":"Version: PK=DATASET#\u003cid\u003e, SK=V#\u003cversion zero-padded to 6\u003e, version (number), prefix, manifest (the datapackage.json text)."}],"state":"standing"},{"id":"AGNT2","name":"One catalog writer","question":"Who writes the catalog file?","took":"One function in archive-backend builds the catalog file from the active catalog table and writes it to the derived bucket's `site/`. The reindex calls it after it flips the table; Plan 7's publish step calls the same function later.","instead":"Build it from the manifests in the archive bucket, or let each caller write its own.","why":"One writer means the file is never built two ways, and the active table is what every Lambda already reads.","evidence":[{"text":"The catalog file's home","source":"Plan 4 spec.md line 57","output":"Derived bucket. Everything rebuildable: site/ (the web app bundle, the per-dataset HTML pages and the catalog file)"}],"state":"standing"},{"id":"AGNT3","name":"Catalog fields","question":"What goes in each row of the catalog file?","took":"One row per published dataset, every access level: id, current version, title, description, keywords, access, license ids and rights status, project, creators, resource formats, temporal start, end and ongoing, the bounding box (west, south, east, north), total bytes and published date. Theme and species facets join when the contract holds those fields: Plan 2's follow-ups PARK5 (archive:themes) and PARK6 (taxonomic coverage), timing yours.","instead":"Leave restricted and description-only datasets out of search, or add fields the contract doesn't hold yet.","why":"These are the fields the manifest holds today; metadata is public at every access level, only data is restricted. Plan 2 confirmed neither theme nor taxonomic coverage is in the contract.","state":"standing"},{"id":"AGNT4","name":"Catalog freshness","question":"How quickly does a publish or reindex reach search?","took":"The search Lambda keeps `catalog.json` in memory and checks the object's ETag in S3 at most once a minute, re-reading it when it changed. A publish or reindex reaches search within a minute, with no invalidation or notification.","instead":"Have the writer notify the search Lambda, or re-read the file on every request.","why":"One cheap HEAD a minute per warm Lambda, nothing to wire between writer and reader, and a minute is fast enough for a publish.","state":"standing"},{"id":"AGNT5","name":"CLI and MCP sign-in","question":"How do the CLI and the MCP server sign in?","took":"Authorization code with PKCE through Plan 4's `cli` app client: the client opens the browser to managed login and listens on `http://localhost:8765/callback`. It keeps the one-hour access and ID tokens and discards the refresh token, so it holds short-lived tokens only. Plan 6 records the flow in the Decision log; the client code lands with its first user, Plan 9.","instead":"Keep the refresh token so a session lasts days, or build the client in Plan 6 now.","why":"The handoff settled short-lived tokens only, Cognito has no device-code flow, the client and callback already exist, and nothing in the repo signs in from the command line until Plan 9.","state":"standing"},{"id":"AGNT6","name":"OpenAPI is committed","question":"How do Plan 8 and Plan 9 get the API's types?","took":"The OpenAPI spec is written to a committed file by a `just` recipe and CI fails when it drifts from the code, the same way the contract's JSON Schema is checked. Plan 8 generates its TypeScript types from it.","instead":"Serve the spec only at run time.","why":"Anything that crosses the Python to TypeScript boundary is generated and machine-checked.","state":"standing"},{"id":"AGNT7","name":"What counts as a download","question":"What does DownloadCounts count?","took":"A daily scheduled function reads the new CloudFront log files under the derived bucket's `logs/` and adds one per GET under `/data/` that answered 200, per dataset and month. Range reads (206) and HEAD are not counted, so the in-browser data preview, which reads by range, doesn't inflate counts. A restricted download counts when its link is issued.","instead":"Count every request, or count hourly.","why":"DownloadCounts is keyed by dataset and month, so daily is fresh enough, and counting previews as downloads would overstate use.","state":"standing"},{"id":"AGNT8","name":"Project reads from the archive","question":"How are projects read in PLAN1?","took":"`GET /api/projects/{id}` reads `projects/\u003cprojectId\u003e/project.json` from the archive bucket (the home Plan 7 and the coordinating session settled) and lists the project's datasets from the active catalog table's GSI1. No reindex change: the record is read where it lives.","instead":"Wait until reindex loads project records into the catalog table, and add project reads then.","why":"The record's home is now decided, so the endpoint can be built and tested with one fixture project file, and datasets already carry their project in GSI1.","state":"standing"},{"id":"AGNT9","name":"Link lifetime","question":"How long does a restricted file's link last?","took":"Five minutes: long enough to start a large download, short enough that a shared link stops working.","instead":"A longer lifetime, such as an hour.","why":"S3 lets a download that started keep going after the link expires; five minutes only bounds when it can start.","state":"standing"},{"id":"AGNT10","name":"Usage form shape","question":"What does the usage form ask, and where do answers go?","took":"Three optional answers, no sign-in needed and no email or name asked: what kind of organisation (university, government, nonprofit, company, individual, other), what the data is for (research, teaching, policy or management, commercial, personal, other), and a free-text note of up to 500 characters. `POST /api/datasets/{id}/usage` stores them in a new UsageResponses table Plan 6 adds (key `datasetId`, sort `\u003cmonth\u003e#\u003cuuid\u003e`), and `GET /api/admin/usage?dataset=\u003cid\u003e` lets the admin group read them. The question list is fixed in the contract, not set in the config.","instead":"Let the archive config define its own questions, or ask for an email so the archive can follow up.","why":"These are the answers archives report to funders, asking for no personal data keeps the form optional in spirit and free of privacy duties, and a configurable form waits until an archive asks for different questions.","state":"standing"},{"id":"AGNT11","name":"Config read from SSM","question":"How do Plan 6's Lambdas read the archive config?","took":"Through the SSM parameter `/research-archive/\u003cstage\u003e/archive-config` that Plan 7's spec has the CDK app write at synth from the validated archive.yaml. PLAN1's Lambdas need nothing from it yet; PLAN3's embeddings setting will be read the same way.","instead":"Pass config values to each Lambda as environment variables.","why":"Plan 7 settled one way for every Lambda to read the config, and a second way would drift.","evidence":[{"text":"Shared fact from Plan 7's spec, passed on by the coordinating session","source":"muster thread #941","output":"Lambdas read the archive config from the SSM parameter /research-archive/\u003cstage\u003e/archive-config, written by the CDK app at synth from the validated archive.yaml (4 KB limit). Use it for anything your Lambdas need from the config ... and don't add a second way."}],"state":"standing"},{"id":"AGNT12","name":"Embeddings off by default","question":"How is semantic search switched on?","took":"A new optional module in the archive config, `infrastructure.modules.embeddings` with the model id, off by default like WAF and write-once locking. Switched on, the construct adds the vector index to both catalog tables and grants Bedrock; the API reads the setting from the archive-config parameter. Off, search is the improved keyword search alone.","instead":"Turn embeddings on by default for every new archive.","why":"The handoff makes embeddings optional with keyword search as the fallback, and an archive should not pay for Bedrock or need model access before it chooses to.","state":"standing"},{"id":"AGNT13","name":"How many semantic matches","question":"How many datasets does the vector index return per search, and which appear?","took":"SearchVectors asks for the 50 nearest (the service allows at most 100), the search's filters (access, licence, format, project, dates, box) are applied to them in the Lambda as they are to keyword matches, and the merged list is paged as today. The total counts the merged list.","instead":"Ask for 100, or cut semantic matches off below a similarity score.","why":"50 covers a page of 20 with room for filters to remove some; a score cut-off needs tuning on real searches we don't have yet.","evidence":[{"text":"DynamoDB vector index quotas","source":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/ServiceQuotas.html, Vector indexes","output":"Maximum dimensions per vector index 4,096 No · Maximum TopK per SearchVectors request 100 No"}],"state":"standing"},{"id":"AGNT14","name":"Vector index shape","question":"How is the vector index laid out on each catalog table?","took":"One index, `datasets`, on both catalog tables: attribute `embedding` on the dataset's META item (a list of 1,024 numbers from Titan v2, normalised), COSINE distance, KEYS_ONLY projection, and no vector partition key. Each archive has its own tables, so the whole index is one archive, which is how 'one partition key per archive' in the handoff is met.","instead":"A constant vector partition key attribute, or projecting the row fields into the index.","why":"Searches only need the dataset ids back (the rows come from catalog.json), and a partition key only helps an index far larger than any archive here.","evidence":[{"text":"Vector attribute format and projection","source":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/VectorSearchWorkingWith.html","output":"Store that vector in a DynamoDB item, in the attribute named by the vector index ( VectorAttribute ), as a list ( L ) of numbers ( N )."}],"state":"standing"},{"id":"AGNT15","name":"When Bedrock fails","question":"What does a search answer when Bedrock or the vector index errors?","took":"The keyword results alone, with a warning in the function's log, so the reader still gets a page. Errors on reindex or publish stop that run, as any other failed step does.","instead":"Answer the search with an error.","why":"A search page that fails whenever Bedrock throttles is worse for a reader than one that briefly ranks by words only; the handoff already makes keyword search the fallback.","state":"standing"}],"principles":[],"follow_ups":[{"id":"PARK1","name":"Linked resource downloads","text":"A resource whose path is a URL (data held elsewhere) gets a file item, so the download route answers a /data or presigned link that doesn't resolve. Answer the resource's own URL instead.","from":"TASK2","kind":"bug"},{"id":"PARK2","name":"Expire CloudFront logs","text":"Nothing expires the derived bucket's logs/, and the daily rollup lists the whole prefix each run, so the listing grows forever. Add a lifecycle rule on logs/ (say 30 days, after the rollup has counted them) or list from the last counted day's key.","from":"TASK3","kind":"improvement"},{"id":"PARK3","name":"First search after idle","text":"The first search after the API Lambda sits idle is slow: 2.81 s with keyword search alone (PLAN1's test deploy, 17 idle minutes) and 3.58 s with semantic search on (PLAN3's, 16 idle minutes); warm searches take 0.14 s and 0.29 s. A cold Lambda loading Powertools, boto3 and the catalog, plus the first Bedrock call. Measure the parts and decide whether it matters once Plan 8's search page exists; options are trimming imports, more memory, or SnapStart for Python.","from":"TASK5","kind":"improvement"},{"id":"PARK4","name":"Empty text breaks embedding","text":"With embeddings on, a manifest with no title, description or keywords (or text past Titan's input limit) makes Bedrock reject the call and fails the whole reindex batch, though the same manifest reindexes with embeddings off. Skip the embedding for empty text, and truncate long text.","from":"TASK8","kind":"bug"},{"id":"PARK5","name":"Bedrock throttling in reindex","text":"The reindex embeds datasets one call at a time, up to 200 per batch; Bedrock throttling raises out of the step. Fine at ten datasets; for large archives check the durable step's retry or add backoff.","from":"TASK8","kind":"improvement"}],"spec":{"hash":"2faf2b0aa9dd548e4ea5dcec9eed07446e98c46c80a9534f268ed452d6e41e61","sections":[{"id":"SPEC1","heading":"Goal","decisions":[]},{"id":"SPEC2","heading":"The plans","decisions":["DCSN5","DCSN1","DCSN6"]},{"id":"SPEC3","heading":"Endpoints","decisions":["DCSN4","AGNT1","AGNT8"]},{"id":"SPEC4","heading":"Search","decisions":["DCSN1","AGNT2","AGNT3","AGNT4","DCSN6"]},{"id":"SPEC5","heading":"Semantic search","decisions":["DCSN6","DCSN7","DCSN8","AGNT12","AGNT13","AGNT14","AGNT15","AGNT11"]},{"id":"SPEC6","heading":"Restricted downloads","decisions":["DCSN2","AGNT9"]},{"id":"SPEC7","heading":"Download counts","decisions":["AGNT7"]},{"id":"SPEC8","heading":"Usage form","decisions":["DCSN3","AGNT10"]},{"id":"SPEC9","heading":"Sign-in for the CLI and MCP server","decisions":["AGNT5"]},{"id":"SPEC10","heading":"How it is built","decisions":["DCSN4","AGNT6","AGNT11"]},{"id":"SPEC11","heading":"Risk and cost","decisions":["DCSN2","DCSN4","DCSN7"]},{"id":"SPEC12","heading":"Left out","decisions":["DCSN5","DCSN3","AGNT5"]},{"id":"SPEC13","heading":"How we'll know it works","decisions":["DCSN1","DCSN2","DCSN3","DCSN4","DCSN6","DCSN8"]}],"approved":{"hash":"efa1b5a93f7112fe9b6cff14c4cc1080bccf324ed32eb7c081e9c0f985e3eb41","at":"2026-11-13T22:34:38.131542-06:00","body":"# API and search: the read API, server search and downloads\n\n## Goal\n\nAnyone can find a dataset in the archive and fetch it, from the web app, the CLI or an MCP server, with no relational database. A read API open to all answers search, dataset, version and project reads; signed-in users get short-lived links to restricted files; the archive counts downloads and, optionally, asks readers how they use the data. It works today on what Plan 4's reindex loads, and Plan 7's publish step plugs into it later. Semantic search follows as its own plan once there is a real corpus to judge it on.\n\n## The plans\n\nPlan 6 is two plans in this folder. PLAN1 is the read API and search described below, buildable now. PLAN3 is semantic search: the vector index on both catalog tables, the embedding model and its setting, and ranking semantic results with keyword results inside the same search endpoint; it is written once PLAN1 is built and Plan 5's corpus exists. Plan 7 owns everything under `/api/submissions`, including the review-policy setting, so there is no PLAN2.\n\nRests on: DCSN5, DCSN1\n\n## Endpoints\n\nEvery route is served by one Python Lambda, declared in API Gateway one route at a time so the Cognito authorizer sits only on the signed-in ones. Plan 4's `/api/health` and `/api/whoami` stay as they are.\n\n| Route | Sign-in | Answers |\n|---|---|---|\n| `GET /api/search` | no | One page of matching datasets with a count per facet value (below) |\n| `GET /api/datasets/{id}` | no | The dataset, its current version's manifest and its files |\n| `GET /api/datasets/{id}/versions` | no | Every version's number and prefix |\n| `GET /api/datasets/{id}/versions/{version}` | no | That version's manifest and files |\n| `GET /api/projects/{id}` | no | `projects/\u003cid\u003e/project.json` from the archive bucket, and the project's datasets from GSI1 |\n| `GET /api/datasets/{id}/versions/{version}/download?path=` | yes | A five-minute link to one restricted file |\n| `POST /api/datasets/{id}/usage` | no | Stores the optional usage answers |\n| `GET /api/admin/usage?dataset=` | yes, `admin` group | The usage answers for one dataset |\n\nDataset, version and file reads come from the active catalog table, chosen by the `/research-archive/\u003cstage\u003e/catalog-active` parameter, cached for a minute as Plan 4's Lambdas do. The version item already holds the manifest text. Metadata is public at every access level; only files are restricted. A missing dataset, version or project answers 404.\n\nRests on: DCSN4, AGNT1, AGNT8\n\n## Search\n\n**The catalog file.** One function in `archive-backend` builds `catalog.json` from the active catalog table and writes it to the derived bucket's `site/`, so it is also public at `/catalog.json`. The reindex calls it after it flips the active table; Plan 7's publish step calls the same function. One row per published dataset at every access level: `id`, `version`, `title`, `description`, `keywords`, `access`, `licenses` (ids), `rightsStatus`, `project`, `creators`, `formats`, `start`, `end`, `ongoing`, `bbox` (west, south, east, north), `bytes` (the current version's total) and `published`. Theme and species join when the contract holds those fields (Plan 2's PARK5 and PARK6). It is written with Python's standard library; no DuckDB.\n\n**The endpoint.** `GET /api/search` takes `q` (keywords), `access`, `license`, `format`, `project` (each repeatable), `from` and `to` (dates), `bbox` (`west,south,east,north`), `page` and `size` (default 20, at most 100). Each keyword must appear, ignoring case, in the title, description, keywords or creators. Date filters keep a dataset whose coverage overlaps the range; the box keeps a dataset whose box intersects it, including boxes that cross the antimeridian. Results with a keyword in the title come first, then the rest, newest published first. The answer is the page of rows (the same fields as the catalog file, so a result card needs no further call), the total, and a count for each value of `access`, `license`, `format` and `project` under the current filter.\n\n**Freshness.** The search Lambda keeps the parsed catalog in memory and checks the object's ETag at most once a minute, re-reading it when it changed, so a publish or reindex reaches search within a minute. Filtering 10,000 datasets took 9 ms in a measurement on a laptop; past roughly 50,000 datasets, the next step is an index rather than an in-memory list.\n\nRests on: DCSN1, AGNT2, AGNT3, AGNT4\n\n## Restricted downloads\n\nOpen files are fetched straight from CloudFront at `/data/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e`; the API isn't involved. For a restricted dataset, a signed-in user calls the download route and gets an S3 presigned link to `restricted/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e` that lasts five minutes. Anyone signed in qualifies; signing up is self-service with email. The path must be one of the version's file items, so the route can't be used to reach any other key. A by-request dataset answers 403 until Plan 7's request workflow can grant access, which this check will then read. Description-only datasets have no files. An open dataset's download route answers its `/data` URL.\n\nRests on: DCSN2, AGNT9\n\n## Download counts\n\nDownloadCounts keeps, per dataset and month, `open` (downloads through CloudFront) and `restricted` (links issued). The download route adds one to `restricted` when it issues a link. A scheduled function runs daily, reads the previous day's CloudFront standard logs under the derived bucket's `logs/`, and adds one to `open` per `GET` under `/data/` that answered 200; range reads (206) and `HEAD` don't count, so a data preview that reads by range doesn't inflate the numbers. The last day rolled up is kept as a Settings item, `downloads-rolled-up-through`, so a rerun never counts a day twice.\n\nRests on: AGNT7\n\n## Usage form\n\nBefore a download, a reader may answer three optional questions, with no sign-in and no name or email: the kind of organisation (university, government, nonprofit, company, individual, other), what the data is for (research, teaching, policy or management, commercial, personal, other), and a note of up to 500 characters. The question list is a model in the contract. Answers go to a UsageResponses table that Plan 6 adds (`datasetId`, sort key `\u003cmonth\u003e#\u003cuuid\u003e`, on-demand, point-in-time recovery like the other operational tables). Admins read them through `GET /api/admin/usage`.\n\nRests on: DCSN3, AGNT10\n\n## Sign-in for the CLI and MCP server\n\nThe browser signs in through Plan 4's `web` client as built. The CLI and the MCP server use authorization code with PKCE through Plan 4's `cli` client: they open the browser to Cognito's managed login and listen on `http://localhost:8765/callback`. They keep the one-hour access and ID tokens and discard the refresh token, so they hold short-lived tokens only. Plan 6 records this in the handoff's Decision log; the client code is built by its first user, Plan 9.\n\nRests on: AGNT5\n\n## How it is built\n\nThe routes live in one module of `archive-backend` on Powertools' `APIGatewayRestResolver` with validation on, each with Pydantic request and response models. A `just openapi` recipe writes the OpenAPI spec from those routes to a committed file, and CI fails when the committed file and the code disagree, as it already does for the contract's JSON Schema; Plan 8 generates its TypeScript types from it. The CDK side is one internal construct in `packages/infra` that `ResearchArchive` creates: the API Lambda and its routes on Plan 4's `api` and `authorizer`, the UsageResponses table, the daily download rollup on a schedule, and the reindex's call to the catalog writer. Any Lambda that needs the archive config reads it from `/research-archive/\u003cstage\u003e/archive-config`; PLAN1's need nothing from it.\n\nRests on: DCSN4, AGNT6, AGNT11\n\n## Risk and cost\n\n**Risk.** A mistake could hand a restricted file to someone it shouldn't reach, for instance a download route that signs any key it is given. Links last five minutes, the route signs only paths listed in the version's file items, and CloudFront is denied `restricted/*` outright, so a fix and a redeploy close it; tests cover a signed-out call, a path outside the version, and a by-request dataset. Nothing here deletes or rewrites a package: every endpoint reads, and the only writes are counts, usage answers and the derived catalog file, all rebuildable or disposable.\n\n**Cost.** One test deploy to an AWS account you choose and its teardown, each a step for you on the page. No new programs on your machine; `aws-lambda-powertools` joins `archive-backend`. Running cost is one Lambda call per search and per read, a daily rollup and a small table, pennies a month for a small archive.\n\nRests on: DCSN2, DCSN4\n\n## Left out\n\n- Submission, review and review-policy endpoints: Plan 7's.\n- Semantic search, the embedding model and the vector index: PLAN3.\n- Theme and species facets: when Plan 2's PARK5 and PARK6 add the fields.\n- The CLI and MCP sign-in client code: Plan 9, its first user.\n- An admin route to start a reindex: stays Plan 4's follow-up PARK1.\n- Config-defined usage questions, or asking for an email: until an archive asks.\n- A search index for archives past about 50,000 datasets.\n\nRests on: DCSN5, DCSN3, AGNT5\n\n## How we'll know it works\n\n- `just check` passes, including tests for search filters, facet counts, paging and the antimeridian box; for the download route refusing a signed-out call, a path outside the version and a by-request dataset; for the rollup counting 200s only and never counting a day twice; and the OpenAPI drift check.\n- On one test deploy with two datasets loaded by `just reindex` (one open, one restricted): `GET /api/search?q=` finds each by a word in its description and the facet counts add up; `GET /api/datasets/\u003cid\u003e` returns the manifest and files; a signed-in user's download link fetches the restricted file and expires; the same call signed out answers 401; a usage answer posts and an admin reads it back; after an open download through `/data` and a run of the rollup, DownloadCounts shows it.\n- The round trip of a search through CloudFront, warm and after idle, is measured on that deploy and written in the plan's result.\n\nRests on: DCSN1, DCSN2, DCSN3, DCSN4\n"},"edited":"2026-11-14T00:20:33.554785-06:00"},"plans":[{"id":"PLAN1","topic":"read-api-and-catalog-search","covers":"The catalog file and in-browser search, dataset and version reads, restricted links, download counts, CLI and MCP sign-in, the OpenAPI spec","hash":"0ac73b3fa188e4510489aa87a4f43891ef7ad267b3ea1ec41cda244d554aafa6","tasks":[{"id":"TASK1","heading":"Task 1: The catalog file and its writer","does":"Adds write_catalog_file, which builds catalog.json from a catalog table into site/; carries the manifest's archive:published onto version items as publishedAt (adding the contract field if Plan 7 hasn't yet); the reindex calls the writer after it flips.","pulls_in":"catalog_file.py, Manifest.published in the contract if not yet there, one reindex step, one Decision log row","serves":["DCSN1"],"state":"keep","build":"done","result":"160a71b, fc3b233: catalog writer, publishedAt from Manifest.published, reindex step; pytest backend+contract exit 0, check-python 0, check-schema 0","build_at":"2026-11-13T22:57:28.362057-06:00"},{"id":"TASK2","heading":"Task 2: The API Lambda","does":"Adds pure search over catalog rows and one Powertools API Lambda: search, dataset, version and project reads, restricted download links, the usage form and its admin read, with a committed OpenAPI spec and drift check.","pulls_in":"aws-lambda-powertools in archive-backend, search.py, api.py, the UsageAnswers model in the contract, just openapi and its diff in check-schema","serves":["DCSN1","DCSN2","DCSN3","DCSN4"],"state":"keep","build":"done","result":"9fb6870: search.py, Powertools api.py with 8 routes, UsageAnswers, openapi.json under check-schema; all checks exit 0","build_at":"2026-11-13T22:57:28.362057-06:00"},{"id":"TASK3","heading":"Task 3: The download rollup","does":"Adds a daily function that counts 200 GETs under /data in CloudFront's logs into DownloadCounts per dataset and month, marking each day done so none is counted twice.","pulls_in":"downloads.py and its tests","serves":[],"state":"keep","build":"done","result":"d39cfe3: daily rollup with the rolled-up-through marker; pytest backend exit 0, check-python 0","build_at":"2026-11-13T22:57:28.362057-06:00"},{"id":"TASK4","heading":"Task 4: The infrastructure","does":"Adds the internal ReadApi construct: the API Lambda and its routes with the authorizer on the signed-in ones, the UsageResponses table, the daily rollup schedule, and the reindex's grant to write the catalog file.","pulls_in":"read-api.ts, edits to research-archive.ts and reindex.ts, synth tests","serves":["DCSN2","DCSN3","DCSN4"],"state":"keep","build":"done","result":"17f937d plus review fixes 8ab0e43, 1e70452, 6fa02b8; merged as research-in-a-box#22 (6608bba), CI python and typescript pass","build_at":"2026-11-13T22:57:28.362057-06:00"},{"id":"TASK5","heading":"Task 5: The test deploy","does":"Merges Tasks 1 to 4 and Task 6, deploys ResearchArchive-test, walks every check in the spec with you including an invited sign-in, measures search round trips, and destroys the stack.","pulls_in":"One walkthrough step for you (STEP1), a test stage in your AWS account for an hour or two","serves":["DCSN1","DCSN2","DCSN3"],"state":"keep","build":"done","result":"ResearchArchive-test deployed from main and walked: reindex wrote catalog.json, search filters and facets right, reads, restricted link (checksum match, traversal 404, signed-out 401), invited sign-in, usage form and admin read, rollup counted once; search warm median 0.14 s, after idle 2.81 s (PARK3); destroyed with nothing left","build_at":"2026-11-13T23:59:37.406548-06:00"},{"id":"TASK6","heading":"Task 6: Invitation-only accounts","does":"Turns off self-service sign-up and adds just invite-user \u003cstage\u003e \u003cemail\u003e [group], so restricted data reaches only people the archive invited.","pulls_in":"One line in auth.ts with its synth test, one justfile recipe, one Decision log row","serves":["DCSN2"],"state":"keep","build":"done","result":"2989c53: selfSignUpEnabled false (synth test RED then GREEN), just invite-user, Decision log row; just check exit 0; merged as research-in-a-box#26 (aa90504)","build_at":"2026-11-13T23:22:09.602874-06:00"}],"approved":{"hash":"956e3fb54d53f8ff986dab28d2b11fb8f75a4d9f202c98d4c41e265cbf771752","at":"2026-11-13T22:39:28.417489-06:00","body":"# PLAN1: The read API, server search and downloads\n\n## Spec\n\n`docs/specs/2026-11-13-api-and-search/spec.md`, every section. Plans 1, 2 and 4 are built and merged: build on `archive_contract`, `archive-backend` (`reindex.py` with `catalog_items` and `dataset_item`), and the `ResearchArchive` construct with its `api`, `authorizer`, `catalogTables`, `activeCatalogParameter`, `archiveBucket`, `derivedBucket`, `downloadCounts`, `settings`, `distribution` and `pythonFunction`. The handoff's Decision log (rows dated 2026-11-13 for Plans 4, 6 and 7) holds the catalog item shapes and the archive layout. The implementer reads the spec beside this plan.\n\n## The change\n\nOne API Lambda on Powertools answers search, dataset, version and project reads, restricted download links and the usage form. One function writes `catalog.json`, and the reindex calls it. A daily function rolls CloudFront's logs into DownloadCounts. One internal construct wires it all into `ResearchArchive`. Then one test deploy, a stage named `test` in your AWS account, walks the spec's \"How we'll know it works\" and is destroyed.\n\n**Risk:**\n\n- Tasks 1 to 4 are local code and CI; a mistake is undone by reverting the PR.\n- The one way to do harm is a download route that signs a key it shouldn't. Task 2's tests cover a signed-out call, a path outside the version, a by-request dataset and an open one; links last five minutes; CloudFront is denied `restricted/*`.\n- Task 5 creates real resources under a non-prod stage, all deleted with the stack; a few dollars at most, undone by `cdk destroy`. Nothing touches a prod stage.\n\n**Cost:**\n\n- One walkthrough step for you (STEP1): name the profile and alert address, Go for the deploy, sign in twice in the browser and paste back the URL, Go for the teardown.\n- New dependency: `aws-lambda-powertools` in `archive-backend` (pure Python).\n- No new programs on your machine.\n\n## Left out\n\n- Semantic search, the vector index and the embedding model (PLAN3).\n- Submission, review and review-policy endpoints (Plan 7).\n- Theme and species in the catalog (Plan 2's PARK5 and PARK6).\n- The CLI and MCP sign-in client (Plan 9); Task 5 walks the flow by hand once.\n- An admin reindex route (Plan 4's PARK1).\n- Loading project records into the catalog table: projects are read from the archive bucket where they live.\n\n## Where\n\n- Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-archive-in-a-box/plan6/read-api-and-catalog-search`, branch `plan6/read-api-and-catalog-search` from `origin/main`. Confirm with `git -C \u003cwt\u003e branch --show-current` before editing.\n- Python: `packages/backend/pyproject.toml`, `uv.lock`, `packages/backend/src/archive_backend/{catalog_file,search,api,downloads,reindex}.py`, their tests under `packages/backend/tests/`, `packages/contract/src/archive_contract/usage.py` with its test.\n- TypeScript: `packages/infra/src/read-api.ts` (new), `packages/infra/src/research-archive.ts`, `packages/infra/src/reindex.ts`, `packages/infra/test/read-api.test.ts` (new), `packages/infra/test/reindex.test.ts`.\n- `justfile`, `packages/web/src/schema/openapi.json` (new, generated), `docs/planning-handoff.md` (Decision log: `publishedAt`).\n- Global constraints:\n  - Lambdas are Python 3.13 on arm64 through `archive.pythonFunction`; `just check` must exit 0.\n  - Nothing reaches AWS in Tasks 1 to 4.\n  - Task 5 runs only with your Go on STEP1, under the profile you name, never against a stage named `prod`.\n  - On any AWS auth error, stop and report; never copy or export credentials.\n\n### Task 1: The catalog file and its writer\n\n**Does:** Adds `archive_backend.catalog_file.write_catalog_file(table_name, derived_bucket)`, which builds `catalog.json` from a catalog table and writes it to `site/catalog.json`; carries the manifest's publish time onto version items; the reindex calls the writer after it flips.\n**Files:** `packages/contract/src/archive_contract/manifest.py`, `packages/contract/tests/test_manifest.py`, `packages/web/src/schema/archive-contract.schema.json`, `packages/infra/src/generated/archive-config.ts` (if regenerated), `packages/backend/src/archive_backend/catalog_file.py`, `packages/backend/src/archive_backend/reindex.py`, `packages/backend/tests/test_catalog_file.py`, `packages/backend/tests/test_reindex.py`, `docs/planning-handoff.md`\n**Checks:** `uv run pytest packages/backend packages/contract` exits 0; `just check-python` exits 0; `just check-schema` exits 0.\n**Serves:** DCSN1 (rests on calls AGNT2, AGNT3)\n\n- The publish time lives in the manifest as `archive:published`, an ISO 8601 UTC datetime the archive sets at publish and nobody else writes (agreed with Plan 7 and the coordinating session, muster thread 945). If `origin/main` doesn't have it yet, add `Manifest.published: datetime | None` with alias `archive:published` to `archive_contract`, run `just schema`, and add one Decision log row; if Plan 7 landed it first, use theirs.\n- `catalog_items` reads `archive:published` from the manifest it already parses and writes it as `publishedAt` on the version item. No new argument and no fallback: a manifest without it gets no `publishedAt`.\n- `catalog_rows(items) -\u003e list[dict]`: pure, from the dataset `META` items and their current version items. Row fields, each left out when the manifest lacks it: `id`, `version`, `title`, `description`, `keywords`, `access`, `licenses` (each license's `name`, else `path`), `rightsStatus`, `project`, `creators` (contributors with the `creator` role: `title`, else `givenName familyName`, else `organization`), `formats` (distinct resource formats, sorted), `start`, `end` (date, or `\"unknown\"`), `ongoing`, `bbox` (`[west, south, east, north]`), `bytes` (sum of the version's file items' `bytes`) and `published` (the version item's `publishedAt`). Rows sorted by `id`.\n- `write_catalog_file` scans the table (paginated), builds the rows and puts `site/catalog.json` with `ContentType: application/json` and `CacheControl: max-age=60`. It returns the row count.\n- In the reindex, a new checkpointed step after `flip` calls it on the table it flipped to. A failure there alerts like the other steps and does not undo the flip.\n- Tests: rows from the sample package's manifest (`examples/sample-package/datapackage.json`) and from a bare manifest with only a title; a two-dataset fake table writes one object with both rows; the reindex calls the writer only when it flipped.\n\n### Task 2: The API Lambda\n\n**Does:** Adds `archive_backend.search` (pure filtering over catalog rows) and `archive_backend.api` (one Powertools `APIGatewayRestResolver` with validation on), the usage answers model in the contract, and a committed OpenAPI spec with a drift check.\n**Files:** `packages/backend/pyproject.toml`, `uv.lock`, `packages/backend/src/archive_backend/search.py`, `packages/backend/src/archive_backend/api.py`, `packages/contract/src/archive_contract/usage.py`, `packages/backend/tests/test_search.py`, `packages/backend/tests/test_api.py`, `packages/contract/tests/test_usage.py`, `justfile`, `packages/web/src/schema/openapi.json`\n**Checks:** `uv run pytest packages/backend packages/contract` exits 0; `just check-python` exits 0; `just check-schema` exits 0.\n**Serves:** DCSN1, DCSN2, DCSN3, DCSN4 (rests on calls AGNT1, AGNT6, AGNT8, AGNT9, AGNT10)\n\nSearch (`search.py`, no AWS):\n\n- `search(rows, query) -\u003e SearchResult`, where the query holds `q`, `access`, `license`, `format`, `project` (lists), `from_`, `to` (dates), `bbox` and `page`, `size` (default 20, 1 to 100).\n- Each whitespace-separated word of `q` must appear, ignoring case, in `title`, `description`, `keywords` or `creators`. A list filter keeps a row that has any of the values. Dates keep a row whose coverage overlaps the range: `end: \"unknown\"` or `ongoing` counts as open-ended, a row without `start` drops out when a date filter is set. The box keeps a row whose box intersects it, splitting either box at the antimeridian when west is greater than east; a row without a box drops out when a box is set.\n- Order: rows with a word of `q` in the title first, then by `published` newest first with rows lacking it last, then `id`.\n- The answer is `rows` (that page), `total`, and `facets`: for each of `access`, `license`, `format` and `project`, every value's count among the rows matching all the other filters (so a facet doesn't hide its own alternatives).\n\nRoutes (`api.py`), paths as API Gateway passes them:\n\n- `GET /api/search`: query parameters as above (`from` and `to` in the URL); reads the catalog through a module-level cache that `head_object`s `site/catalog.json` at most every 60 seconds and re-reads on a new ETag.\n- `GET /api/datasets/\u003cid\u003e`, `/api/datasets/\u003cid\u003e/versions`, `/api/datasets/\u003cid\u003e/versions/\u003cversion\u003e`: query the active catalog table (the `/research-archive/\u003cstage\u003e/catalog-active` parameter, cached 60 seconds, naming `CATALOG_TABLE_A` or `CATALOG_TABLE_B`). The dataset answer is the dataset item's fields, the current version's manifest parsed as JSON, and its files; 404 when absent.\n- `GET /api/projects/\u003cid\u003e`: `projects/\u003cid\u003e/project.json` from the archive bucket, and the datasets from GSI1 (`GSI1PK=PROJECT#\u003cid\u003e`); 404 when the file is absent.\n- `GET /api/datasets/\u003cid\u003e/versions/\u003cversion\u003e/download?path=`: signed in (claims present). `open` answers `{\"url\": \"https://\u003cSITE_DOMAIN\u003e/data/\u003cid\u003e/\u003cversion\u003e/\u003cpath\u003e\"}`; `restricted` answers a presigned `get_object` URL on `restricted/\u003cid\u003e/\u003cversion\u003e/\u003cpath\u003e` with `ExpiresIn=300` and adds 1 to `restricted` on DownloadCounts (`datasetId`, `month` as `YYYY-MM`); `by-request` answers 403; `description-only` and a path that is not one of the version's file items answer 404.\n- `POST /api/datasets/\u003cid\u003e/usage`: body is `archive_contract.usage.UsageAnswers` (`organisation` and `purpose` each one of the spec's six values or absent, `note` up to 500 characters); 404 for an unknown dataset; stores `datasetId`, `entry` = `\u003cYYYY-MM\u003e#\u003cuuid4\u003e`, the answers and `at`; answers 204.\n- `GET /api/admin/usage?dataset=`: 403 unless the claims' `cognito:groups` holds `admin` (parse as `whoami.py` does); answers that dataset's entries, newest first.\n- Environment: `ARCHIVE_BUCKET`, `DERIVED_BUCKET`, `CATALOG_TABLE_A`, `CATALOG_TABLE_B`, `ACTIVE_CATALOG_PARAMETER`, `DOWNLOAD_COUNTS_TABLE`, `USAGE_TABLE`, `SITE_DOMAIN`. Handler `archive_backend.api.handler`.\n\nOpenAPI: `python -m archive_backend.api \u003cpath\u003e` writes `app.get_openapi_json_schema()` with sorted keys. Add `openapi_file := \"packages/web/src/schema/openapi.json\"`, a `just openapi` recipe that writes it, and a diff of it in `check-schema` beside the contract schema's.\n\nTests drive the resolver with API Gateway REST events and fakes for S3, DynamoDB and SSM: each search filter, facet counts, paging bounds, the antimeridian box, every download case above (including no claims: API Gateway refuses it, but the handler also answers 401), the usage 204 and 404, admin 403 and 200, and a 404 for each missing read.\n\n### Task 3: The download rollup\n\n**Does:** Adds `archive_backend.downloads.handler`, run daily, which adds CloudFront's open downloads to DownloadCounts and never counts a day twice.\n**Files:** `packages/backend/src/archive_backend/downloads.py`, `packages/backend/tests/test_downloads.py`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0.\n**Serves:** none (rests on call AGNT7)\n\n- Days to count: from the day after the Settings item `downloads-rolled-up-through` (`name`, `value` = `YYYY-MM-DD`), or from two days ago when there is none, through two days ago (UTC), since CloudFront may deliver a day's logs hours late.\n- For each day, list `logs/` keys whose name holds `.\u003cYYYY-MM-DD\u003e-`, read each gzip file (tab-separated, `#` lines are headers), and count lines with `cs-method` `GET`, `sc-status` `200` and `cs-uri-stem` starting `/data/`; the dataset id is the next path segment.\n- Add each dataset's count to `open` for that day's month with one `UpdateItem ... ADD`, then write the day to the Settings item before moving to the next day, so a crash mid-run recounts at most nothing already marked.\n- An event `{\"through\": \"YYYY-MM-DD\"}` replaces two days ago as the last day, so the test deploy can count today by hand; the schedule sends none.\n- Environment: `DERIVED_BUCKET`, `DOWNLOAD_COUNTS_TABLE`, `SETTINGS_TABLE`.\n- Tests: a fake log with a 200 GET, a 206, a HEAD, a 404 and a non-`/data` path counts one; a second run the same day counts nothing; two missed days are both counted once.\n\n### Task 4: The infrastructure\n\n**Does:** Adds the internal `ReadApi` construct, created by `ResearchArchive` after the distribution: the API Lambda and its routes, the UsageResponses table, the daily rollup schedule, and the reindex's grant to write the catalog file.\n**Files:** `packages/infra/src/read-api.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/src/reindex.ts`, `packages/infra/test/read-api.test.ts`, `packages/infra/test/reindex.test.ts`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0.\n**Serves:** DCSN2, DCSN3, DCSN4 (rests on calls AGNT7, AGNT10)\n\n- One Lambda from `archive.pythonFunction(\"ApiFunction\", { handler: \"archive_backend.api.handler\" })` with the Task 2 environment (`SITE_DOMAIN` is the distribution's domain name).\n-
