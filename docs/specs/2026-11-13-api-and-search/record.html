 Routes under Plan 4's existing `/api` resource, each a `LambdaIntegration` to that one function. `download` and `admin/usage` use `AuthorizationType.COGNITO` with `archive.authorizer`; the rest `NONE`.\n- UsageResponses: plain `dynamodb.Table`, partition `datasetId`, sort `entry`, on-demand, point-in-time recovery, the same removal policy as Plan 4's operational tables for prod and non-prod. Add it to the operations dashboard as Plan 4 does with its tables.\n- Grants: read on both catalog tables and the active-catalog parameter; read `site/catalog.json` and the archive bucket's `restricted/*` and `projects/*`; `ADD` on DownloadCounts; read and write UsageResponses.\n- The rollup: `archive.pythonFunction(\"DownloadRollupFunction\", ...)`, timeout 15 minutes, read `logs/*`, write DownloadCounts and Settings, on an EventBridge Scheduler rate of one day with no retries, as `integrity.ts` schedules its check.\n- Reindex: add `derivedBucket.grantPut(fn, \"site/catalog.json\")`.\n- Synth tests: each route's method and authorization type, the table's keys and recovery, the schedule, and the reindex's new grant.\n\n### Task 5: The test deploy\n\n**Does:** Merges Tasks 1 to 4, deploys `ResearchArchive-test`, walks every check in the spec's \"How we'll know it works\" with you, measures search round trips, and destroys the stack.\n**Files:** none (results go in the task's result line and the build thread)\n**Checks:** every action in STEP1 is done; `aws cloudformation describe-stacks --stack-name ResearchArchive-test` fails with \"does not exist\" at the end.\n**Serves:** DCSN1, DCSN2, DCSN3\n\nSTEP1's actions, in order:\n\n1. You: name the AWS profile and the alert email address.\n2. Agent: open the PR for Tasks 1 to 4, merge it once CI's `python` and `typescript` checks pass, and check the profile's identity.\n3. You: Go for the deploy.\n4. Agent: `just lambda-assets`, deploy `ResearchArchive-test` with a test `ARCHIVE_CONFIG`, upload the sample package twice with `archive:published` set (once `open`, once with `archive:access` set to `restricted`, under `restricted/`), run `just reindex test` and wait for `COMPLETED`.\n5. Agent: check `/catalog.json` has both rows; `GET /api/search?q=` with a word from the description finds both, filters by `access=restricted` to one, facet counts add up; `GET /api/datasets/\u003cid\u003e` returns the manifest and files; the download route signed out answers 401.\n6. You: open the sign-in link the agent gives (Plan 4's `cli` client with PKCE), sign up, and paste back the `localhost:8765` URL you land on, even though the page doesn't load.\n7. Agent: exchange the code; the restricted download link fetches the file; DownloadCounts shows one restricted; a usage answer posts; `GET /api/admin/usage` answers 403; add your user to `admin`.\n8. You: sign in again with the new link and paste back the URL.\n9. Agent: `GET /api/admin/usage` answers the posted answer; download an open file through `/data`, invoke the rollup with `{\"through\": \"\u003ctoday\u003e\"}` once the log file has arrived, and check DownloadCounts shows it; time ten searches warm and one after fifteen idle minutes through CloudFront.\n10. You: Go for the teardown.\n11. Agent: `cdk destroy ResearchArchive-test` and confirm the stack, buckets and tables are gone.\n"},"edited":"2026-11-13T23:17:35.549267-06:00"},{"id":"PLAN3","topic":"semantic-search","covers":"The vector index on both catalog tables, the embedding model and its setting, and merging semantic with keyword results, judged on Plan 5's corpus","waits_on":["PLAN1"],"hash":"e2d57470bd02fe32a34c0c9ee50133ac308ba0259c514484f2099076d8756b8f","tasks":[{"id":"TASK7","heading":"Task 7: Ranked keyword matching","does":"Search matches any word of q, ranked by how many words match (title words count half again), ignoring common words and matching plurals.","pulls_in":"search.py and its tests","serves":["DCSN6"],"state":"keep","build":"done","result":"d942575 + 6a706c7 (short words, review fix): ranked any-word matching; backend 98/98, check-python 0","build_at":"2026-11-14T00:36:12.490574-06:00"},{"id":"TASK8","heading":"Task 8: The embeddings setting and the shared function","does":"Adds the optional modules.embeddings setting to the contract and with_embedding, which sets a Titan v2 embedding on a dataset item before it is written; the reindex calls it when the setting is on.","pulls_in":"One contract model and regenerated schemas, embeddings.py, a reindex change, one Decision log row","serves":["DCSN6","DCSN7"],"state":"keep","build":"done","result":"2bebf85 + 94e45eb: modules.embeddings, with_embedding, reindex reads the setting through Plan 7's read_archive_config; pytest 0, check-schema 0","build_at":"2026-11-14T00:36:12.490574-06:00"},{"id":"TASK9","heading":"Task 9: Semantic results in /api/search","does":"With embeddings on, /api/search embeds q, takes the index's 50 nearest datasets and merges them with the keyword ranking by reciprocal rank fusion; on a Bedrock or index error it answers keyword results alone and counts the fallback.","pulls_in":"Changes to search.py and api.py, one embedded-format metric, regenerated openapi.json","serves":["DCSN6","DCSN8"],"state":"keep","build":"done","result":"ccf1ac1 + c0a4b2c: fusion in /api/search, config read inside the fallback with SemanticFallback metric; pytest 0","build_at":"2026-11-14T00:36:12.490574-06:00"},{"id":"TASK10","heading":"Task 10: The vector index and permissions","does":"With the module on, adds the datasets vector index to both catalog tables, grants Bedrock and SearchVectors to the functions that need them, and puts the fallback count on the dashboard with an alarm.","pulls_in":"Changes to tables.ts, read-api.ts, reindex.ts, operations.ts and their synth tests","serves":["DCSN6","DCSN7"],"state":"keep","build":"done","result":"7d17d44 + 94e45eb: vector index, grants, widget, alarm; ARCHIVE_CONFIG_PARAMETER and read grant for API and reindex; infra 60/60, just check 0; PR research-in-a-box#30","build_at":"2026-11-14T00:36:12.490574-06:00"},{"id":"TASK11","heading":"Task 11: The test deploy","does":"Merges Tasks 7 to 10, deploys a search-test stage with Plan 5's ten manifests (no data files) and embeddings on, checks semantic results and timing, turns embeddings off and checks keyword results, then destroys the stack.","pulls_in":"One walkthrough step for you (STEP2) with two Go presses, a test stage for an hour or two, a few cents of Bedrock","serves":["DCSN6","DCSN7","DCSN8"],"state":"keep","build":"done","result":"search-test deployed from fab8a87 with Plan 5's ten manifests (no data files): every dataset embedded, 22 searches live 19 first / 21 top 3 / 22 found, 'air pollution' first; module off answers keyword results with no index or Bedrock grant; warm 0.29 s, after idle 3.58 s (PARK3); destroyed with nothing left","build_at":"2026-11-14T10:58:44.278011-06:00"},{"id":"TASK12","heading":"Task 12: Embeddings on Plan 7's publish","does":"Plan 7's publish landed first, so Plan 6 adds the agreed call: with the module on, publish sets the embedding on the dataset item before its put, and the ingest function gets the Bedrock grant.","pulls_in":"One call in ingest.py, one conditional grant with a synth test, a small PR touching Plan 7's file","serves":["DCSN6","DCSN7"],"state":"keep","build":"done","result":"Merged as research-in-a-box#38 (1643ba7): publish sets the embedding before its put when the module is on, ingest Bedrock grant only when on; CI python and typescript passed","build_at":"2026-11-14T01:21:17.463919-06:00"}],"approved":{"hash":"0cb69533179c64e634fb8e2aae834c93e901549596c38885654aa3fd5a54ab32","at":"2026-11-14T00:23:08.084748-06:00","body":"# PLAN3: Ranked keyword search and semantic search\n\n## Spec\n\n`docs/specs/2026-11-13-api-and-search/spec.md`, sections \"Search\", \"Semantic search\", \"Risk and cost\" and \"How we'll know it works\". PLAN1 is built and merged (research-in-a-box#22, #26): build on `archive_backend.search`, `archive_backend.api`, `archive_backend.reindex` (`catalog_items`, `dataset_item`), `archive_backend.catalog_file`, the `ReadApi` construct and Plan 4's `Tables`. The handoff's Decision log holds the catalog item shapes. The measurements behind DCSN6 to DCSN8 are on those cards. The implementer reads the spec beside this plan.\n\n## The change\n\nKeyword search ranks by how many words match instead of requiring every word. An optional `embeddings` module adds a vector index to both catalog tables, one shared function puts a Titan v2 embedding on each dataset item before it is written, and `/api/search` merges the vector index's nearest datasets with the keyword ranking by reciprocal rank fusion. Then one test deploy with Plan 5's ten datasets, embeddings on and then off, and the stack is destroyed.\n\n**Risk:**\n\n- Tasks 1 to 4 are local code and CI; a mistake is undone by reverting the PR.\n- Nothing here can expose a restricted file: search returns catalog rows, which are public at every access level.\n- A bad embedding or a dropped one only changes ranking, and a reindex rebuilds every embedding.\n- Task 5 creates real resources under a non-prod stage, all deleted with the stack, plus a few cents of Bedrock calls.\n\n**Cost:**\n\n- One walkthrough step for you (STEP2): Go for the deploy and Go for the teardown. No sign-in is needed; search is public.\n- New permissions only when the module is on: `bedrock:InvokeModel` on Titan v2 and `dynamodb:SearchVectors` on the index.\n- No new dependency: boto3 already has Bedrock and DynamoDB.\n\n## Left out\n\n- A score cut-off for semantic matches, and any model besides Titan v2 (spec, Left out).\n- Embedding the CLI or MCP server's own searches: they call `/api/search` like the web app.\n- Plan 7's call to the embedding function: whichever of Plan 6 and Plan 7 lands second adds it (muster thread 955).\n- The first search after idle (PARK3) stays its own follow-up; Task 5 measures it again with embeddings on.\n\n## Where\n\n- Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-archive-in-a-box/plan6/semantic-search`, branch `plan6/semantic-search` from `origin/main`. Confirm with `git -C \u003cwt\u003e branch --show-current` before editing.\n- Python: `packages/contract/src/archive_contract/config.py` with its test, `packages/backend/src/archive_backend/{search,embeddings,api,reindex}.py` with their tests.\n- TypeScript: `packages/infra/src/tables.ts`, `packages/infra/src/read-api.ts`, `packages/infra/src/reindex.ts`, `packages/infra/src/research-archive.ts`, their tests, and the regenerated `packages/infra/src/generated/archive-config.ts`.\n- `packages/web/src/schema/archive-contract.schema.json` and `openapi.json` (regenerated), `docs/planning-handoff.md` (Decision log).\n- Global constraints:\n  - Lambdas read the embeddings setting only from the archive-config parameter, `/research-archive/\u003cstage\u003e/archive-config`, which Plan 7's PLAN1 adds. If it isn't on `origin/main` when Task 2 starts, Tasks 1 to 2's pure code goes ahead and the reading waits for it; never add a second way to read the config.\n  - The embedding is set on the item before it is written, never by a later UpdateItem (muster thread 955).\n  - `just check` must exit 0. Nothing reaches AWS in Tasks 1 to 4.\n  - Task 5 runs only with your Go on STEP2, under the `personal` profile, on a stage named `search-test`, never `prod`.\n  - On any AWS auth error, stop and report; never copy or export credentials.\n\n### Task 7: Ranked keyword matching\n\n**Does:** Changes `archive_backend.search` so a dataset matches when any word of `q` matches, ranked by how many words match with title words counting half again, common words ignored and plurals matched.\n**Files:** `packages/backend/src/archive_backend/search.py`, `packages/backend/tests/test_search.py`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0.\n**Serves:** DCSN6\n\n- Words: lower-case `[a-z0-9]+` runs of `q`, minus a fixed stop list (`a an and the of on in near from for to with by at as or`), each reduced by stripping a trailing `ies`, `es` or `s`; a field matches a word when the reduced word appears in it.\n- Score: count of words found in title, description, keywords or creators, plus 0.5 per word found in the title. A row with score 0 doesn't match when `q` is given.\n- Order: score descending, then `published` newest first with rows lacking it last, then `id`. With no `q`, order as today.\n- Facets: the `q` filter counts as \"score above 0\", so facet counting is unchanged otherwise.\n- Expose `keyword_ranking(rows, q) -\u003e list[str]` (ids in order) for Task 9's merge.\n- Tests: \"ozone damage on plants\" finds the ozone row first; a title word outranks a description-only word; \"species\" matches \"Species\"; \"on the\" alone matches nothing; existing filter, facet and paging tests keep passing.\n\n### Task 8: The embeddings setting and the shared function\n\n**Does:** Adds the optional `infrastructure.modules.embeddings` setting to the contract, and `archive_backend.embeddings.with_embedding(item, manifest, bedrock)`, which returns the dataset item with `embedding` set; the reindex calls it on every dataset item when the setting is on.\n**Files:** `packages/contract/src/archive_contract/config.py`, `packages/contract/tests/test_config.py`, `packages/web/src/schema/archive-contract.schema.json`, `packages/infra/src/generated/archive-config.ts`, `packages/backend/src/archive_backend/embeddings.py`, `packages/backend/tests/test_embeddings.py`, `packages/backend/src/archive_backend/reindex.py`, `packages/backend/tests/test_reindex.py`, `docs/planning-handoff.md`\n**Checks:** `uv run pytest packages/backend packages/contract` exits 0; `just check-python` exits 0; `just check-schema` exits 0.\n**Serves:** DCSN6, DCSN7 (rests on calls AGNT11, AGNT12, AGNT14)\n\n- Contract: `Modules.embeddings: Embeddings | None` (alias `embeddings`), where `Embeddings` is a strict model with `model: Literal[\"amazon.titan-embed-text-v2:0\"]` defaulting to that value. Present means on. Run `just schema`.\n- `MODEL`, `DIMENSIONS = 1024`. `embedding_text(manifest)` is the title, description and keywords joined by newlines, as measured. `embed(bedrock, text)` calls `invoke_model` with `{\"inputText\": text, \"dimensions\": 1024, \"normalize\": true}` and returns the list. `with_embedding(item, manifest, bedrock)` returns a copy of the DynamoDB-JSON item with `\"embedding\": {\"L\": [{\"N\": ...}, ...]}`.\n- Reindex: read the archive config from the archive-config parameter once per run; when `infrastructure.modules.embeddings` is set, each dataset item passes through `with_embedding` inside the write step, before the lines are written. Off, nothing changes.\n- One Decision log row: the setting's name, `with_embedding` as the one way an embedding is set, called before the put by reindex and by Plan 7's publish.\n- Tests with a fake Bedrock: the item gains a 1,024-number list and keeps every other attribute; the reindex calls it once per dataset when on and never when off.\n\n### Task 9: Semantic results in /api/search\n\n**Does:** When the setting is on and `q` is given, `/api/search` embeds `q`, asks the index for 50 nearest datasets, and merges them with the keyword ranking by reciprocal rank fusion before filtering and paging; on a Bedrock or index error it answers the keyword ranking alone.\n**Files:** `packages/backend/src/archive_backend/search.py`, `packages/backend/src/archive_backend/api.py`, `packages/backend/tests/test_search.py`, `packages/backend/tests/test_api.py`, `packages/web/src/schema/openapi.json`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0; `just check-schema` exits 0.\n**Serves:** DCSN6, DCSN8 (rests on calls AGNT13, AGNT15)\n\n- `search(rows, query, semantic: list[str] | None = None)`: with `semantic`, the candidates are the union of keyword matches and the semantic ids, ordered by `fuse(keyword_ids, semantic_ids)` where each id scores the sum of `1 / (60 + place)` over the lists it appears in (place from 1), ties by `id`. Filters other than `q`, facets, total and paging work on that list as they do today.\n- `api.py`: read the setting from the archive-config parameter (cached like the active table); with it on and `q` non-empty, `embed(q)` then `dynamodb.search_vectors(TableName=\u003cactive table\u003e, IndexName=\"datasets\", SearchVector=..., TopK=50)` and take the ids from the returned keys. Verify the boto3 parameter and response names against the installed botocore, not this plan.\n- Any exception from Bedrock or `search_vectors` logs a warning, emits one `SemanticFallback` count in CloudWatch embedded metric format (namespace `ResearchArchive`, dimension `Stage`, from the `STAGE` environment variable), and calls `search` without `semantic`.\n- Tests: fusion order on two hand-made lists; a semantic-only id appears and a filter still removes it; facets count the merged list; the error path answers keyword results and prints one metric line; with the setting off Bedrock is never called.\n\n### Task 10: The vector index and permissions\n\n**Does:** When `infrastructure.modules.embeddings` is set, adds the `datasets` vector index to both catalog tables, grants the API and reindex functions Bedrock on Titan v2 and the API `SearchVectors`, and puts the `SemanticFallback` count on the dashboard with an alarm.\n**Files:** `packages/infra/src/tables.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/src/read-api.ts`, `packages/infra/src/reindex.ts`, `packages/infra/src/operations.ts`, `packages/infra/test/tables.test.ts`, `packages/infra/test/read-api.test.ts`, `packages/infra/test/reindex.test.ts`, `packages/infra/test/operations.test.ts`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0.\n**Serves:** DCSN6, DCSN7 (rests on calls AGNT12, AGNT14)\n\n- `Tables` takes `embeddings: boolean`. When true, on each catalog table's `node.defaultChild as dynamodb.CfnTable`, set `vectorIndexes` to one entry: `indexName: \"datasets\"`, `vectorAttribute: { attributeName: \"embedding\" }`, `dimensions: 1024`, `distanceFunction: \"COSINE\"`, `projection: { projectionType: \"KEYS_ONLY\" }`, no `searchSchema`. Plain `dynamodb.Table` stays (Decision log: bulk put items needs it).\n- Grants when on: `bedrock:InvokeModel` on `arn:aws:bedrock:\u003cregion\u003e::foundation-model/amazon.titan-embed-text-v2:0` for the API and reindex functions; `dynamodb:SearchVectors` on `\u003ctable arn\u003e/index/datasets` for both tables, for the API function.\n- The API function gets `STAGE`. When on, the operations dashboard gains a `SemanticFallback` widget, and one alarm on its sum, at least 5 in 15 minutes for 2 periods, notifies the alert topic, so an admin learns the module is failing rather than seeing weaker search.\n- Synth tests: with the module the index, grants, widget and alarm exist; without it, the template has no `VectorIndexes`, no Bedrock statement and no fallback alarm.\n\n### Task 11: The test deploy\n\n**Does:** Merges Tasks 7 to 10, deploys `ResearchArchive-search-test` with embeddings on, loads Plan 5's ten datasets, checks the spec's semantic checks, turns embeddings off and checks again, then destroys the stack.\n**Files:** none (results go in the task's result line and the build thread)\n**Checks:** every action in STEP2 is done; `aws cloudformation describe-stacks --stack-name ResearchArchive-search-test` fails with \"does not exist\" at the end.\n**Serves:** DCSN6, DCSN7, DCSN8\n\nSTEP2's actions, in order:\n\n1. Agent: open the PR for Tasks 7 to 10 and merge it once CI's `python` and `typescript` checks pass.\n2. You: Go for the deploy.\n3. Agent: deploy with a test config that has `stages: [search-test]` and `modules.embeddings: {}`; upload only each of Plan 5's ten packages' `datapackage.json` from `practice-data/packages/` (never committed), with `archive:published` set, under `open/` or `restricted/` by its access: the reindex and search read manifests only, and no FEMC data file is put where the test stage's CloudFront could serve it; `just reindex search-test`; check each dataset item has a 1,024-number `embedding`; run the 22 searches from DCSN6 through CloudFront and record found-first and top-3 counts; check `q=air pollution` puts the IMPROVE aerosol dataset first; time ten warm searches and one after 15 idle minutes.\n4. Agent: redeploy with the module removed; check `q=air pollution` answers keyword results (none) with no error, and `q=ozone` still finds the ozone dataset.\n5. You: Go for the teardown.\n6. Agent: destroy the stack and confirm the stack, buckets, tables and leftover log groups are gone.\n"},"edited":"2026-11-14T01:09:09.657305-06:00"}],"signoff":{"due_at":"2026-11-14T10:58:44.278011-06:00","built":"Plan 6's API and search, on main: the read API, server search over catalog.json, restricted download links, download counts, the usage form and invitation-only accounts (PLAN1: research-in-a-box#22, #26); ranked keyword search and optional semantic search with Titan v2 and a DynamoDB vector index, also on Plan 7's publish (PLAN3: #30, #38). Both test deploys were walked with you and destroyed.","try":["Search works the way you expect from the results above: on the ten FEMC datasets, 19 of 22 plain-language searches put the right dataset first with semantic search on; 'ozone damage on plants' and 'air pollution' both find their dataset.","Restricted data reaches only people the archive invited: sign-up is off, an admin invites with just invite-user \u003cstage\u003e \u003cemail\u003e [group], and a signed-in user gets a five-minute link to a restricted file.","Semantic search is off unless an archive adds infrastructure.modules.embeddings: {} to archive.yaml; with it off, search is keyword-only and no Bedrock is called.","Nothing is running in your AWS account: both test stages, ResearchArchive-test and ResearchArchive-search-test, are destroyed.","Follow-ups for later are on the Overview: PARK1 linked-resource download links, PARK2 expiring CloudFront logs, PARK3 the slow first search after idle (2.8 to 3.6 s), PARK4 empty text breaking embedding, PARK5 Bedrock throttling on large reindexes."],"posted_at":"2026-11-14T10:58:57.748112-06:00"},"messages":[{"id":1,"card":"plan","from":"session","action":"note","text":"From the coordinating session for research-in-a-box. Court asked that every planning session know this. Muster alias: personal-personal/generic-package-format-and-contract (the name is left over from Plan 2; this session now coordinates all the plans).\n\n1. Send cross-plan questions here first: anything that touches another plan's interface, ownership or order, or the overall direction. Ask over muster or with diazo_note to this alias. Questions only Court can answer still go on your own page as decision cards.\n2. Send a one-line muster message here when your understanding is confirmed, your spec is printed, each plan is printed, and the build is done. I check each spec and plan for scope before Court approves it.\n3. Record anything other plans rely on in the Decision log of docs/planning-handoff.md.\n4. Keep it small. Plans 1 and 2 are built: the repo, the uv and npm workspaces, archive_contract, the exports and the sample package. Build on them and don't rebuild. Plan only what your brief needs to work end to end now, and put everything else in follow-ups. Size checks to the risk. Question every option, config field and fallback that no real case needs yet.\n5. FEMC is the test afterwards, never the source of the design (Plan 2's PRIN1).","at":"2026-11-13T15:11:09.045018-06:00","state":"answered","claim":"b7d3c06eb5d31be7","sender":{"project":"personal"}},{"id":2,"card":"plan","from":"session","action":"note","text":"From the coordinating session: Plan 4 moved the DynamoDB vector index, the embeddings config setting and the embedding model choice to Plan 6. Plan 4 builds the catalog tables (A and B, switched by an SSM parameter) and exposes them, so Plan 6 adds the index on them. Plan 6 also owns rolling CloudFront logs up into DownloadCounts. All of this is in the handoff Decision log on main (research-in-a-box#7).","at":"2026-11-13T15:14:51.845613-06:00","state":"answered","claim":"3885dbbb52226416","sender":{"project":"personal"}},{"id":3,"card":"plan","from":"user","action":"start-planning","at":"2026-11-13T21:14:17.693596-06:00","state":"answered","claim":"74e17af8394889ca"},{"id":4,"card":"DIRN","from":"user","action":"direction","at":"2026-11-13T21:33:04.161603-06:00","state":"answered","claim":"ad7d8317d26f227b"},{"id":5,"card":"plan","from":"session","action":"note","text":"From Plan 2 (package format and contract): you're right, neither is in the contract and neither was planned. ArchiveConfig lists themes, but the manifest has no field assigning a dataset to one, and there is no taxonomic coverage (only free keywords). I recorded both as follow-ups on Plan 2 (PARK5: archive:themes checked against the config; PARK6: taxonomic coverage, exported as EML taxonomicCoverage), so you needn't record your own. Carry the facets the manifest has today, and add theme and species when those fields land; Court decides when.","at":"2026-11-13T21:36:21.692311-06:00","state":"answered","claim":"61b41b0545bdb780","sender":{"project":"personal"}},{"id":6,"card":"UNDR","from":"user","action":"confirm","at":"2026-11-13T22:00:25.131615-06:00","state":"answered","claim":"2d15e3cfe68331e2"},{"id":7,"card":"DCSN1","from":"user","action":"note","text":"do we have any estimates about times for these?","at":"2026-11-13T22:02:26.551297-06:00","state":"answered","claim":"8727f2e046889a89"},{"id":8,"card":"DCSN1","from":"agent","action":"reply","text":"Yes, measured now; the table is on option A. Once the file is loaded, filtering takes under 15 ms at every size, and loading takes 0.05 to 0.3 s, both formats alike. Download is what readers feel: the DuckDB engine itself is 5.3 MB compressed (the same for both formats, cached after the first visit), and up to about 1,000 datasets it costs more than the catalog. At 10,000 datasets the first search is about 2 s on a 50 Mbit/s line with Parquet against 2.4 s with JSON, or 8 s against 10 s on 10 Mbit/s. So the format only matters past a few thousand datasets. I still recommend Parquet, but it is a close call for a small archive.","at":"2026-11-13T22:04:46.635373-06:00","answers":[7]},{"id":9,"card":"DCSN2","from":"user","action":"choose","option":"A","at":"2026-11-13T22:06:13.622499-06:00","state":"answered","claim":"520ea4d14ed1548a"},{"id":10,"card":"DCSN1","from":"user","action":"note","text":"wait, the duckdb is going to be on the user's machine?  why?  in what scenario?","at":"2026-11-13T22:07:01.032189-06:00","state":"answered","claim":"8772580c85fc2196"},{"id":11,"card":"DCSN1","from":"agent","action":"reply","text":"Yes: in the reader's browser tab, not installed. The handoff decided \"the browser uses DuckDB on [the catalog file] for facets, keyword and bounding-box filtering\", so every visitor to the search page would download DuckDB's WebAssembly build (5.3 MB) with the page; Plan 8 also plans to use it to preview a dataset's CSV files. Your question made me test the alternative: plain JavaScript filtering the same JSON file is just as fast (8 ms at 10,000 datasets, 45 ms at 50,000), and with no engine to download the first search at 1,000 datasets drops from about 4.7 s to 0.6 s on a 10 Mbit/s line. I've rewritten the card with that as option B and now recommend it. It changes a handoff decision Plan 8 relies on, so I've told the coordinating session.","at":"2026-11-13T22:07:47.657226-06:00","answers":[10]},{"id":12,"card":"plan","from":"session","action":"note","text":"From Plan 2: no objection from Plans 1 or 2; the package format and contract don't depend on how the browser filters the catalog. This session owns only Plans 1 and 2, not Plan 8, so this isn't Plan 8's answer: send the heads-up to Plan 8's folder (2026-11-13-web-app-catalog-and-curation) too.","at":"2026-11-13T22:08:03.714042-06:00","state":"answered","claim":"b26ab4133143c567","sender":{"project":"personal"}},{"id":13,"card":"plan","from":"session","action":"note","text":"From Plan 8 (web app, b35aa36581c2), answering your heads-up on DCSN1. Plan 8 has no reason to want DuckDB-Wasm on the search page. It is still Planned and nobody has worked on it yet, and its brief (search, then dataset page, then download) needs nothing beyond filtering the catalog rows. So a JSON catalog at /catalog.json filtered in plain JavaScript suits Plan 8. Plan 8 will read the row fields you listed as the contract. If it later needs DuckDB-Wasm to preview a dataset's files, that loads on the dataset page only.","at":"2026-11-13T22:08:20.53859-06:00","state":"answered","claim":"65a9e22ea13de22b","sender":{"project":"personal","folder":"b35aa36581c2"}},{"id":14,"card":"DCSN3","from":"user","action":"choose","option":"B","at":"2026-11-13T22:10:35.747315-06:00","state":"answered","claim":"0efeacb1ef7824a7"},{"id":15,"card":"DCSN1","from":"user","action":"note","text":"can we not filter on the backend?","at":"2026-11-13T22:12:03.86765-06:00","state":"answered","claim":"95c403eb4d568db3"},{"id":16,"card":"DCSN1","from":"agent","action":"reply","text":"Yes, and I now think we should. A `GET /api/search` endpoint reads the same catalog file from S3, keeps it in memory between requests, and filters it in Python: 9 ms at 10,000 datasets and about 45 to 65 ms at 50,000 on this Mac, then returns one page of 20 results with facet counts (about 16 KB). The browser downloads no catalog and no engine, so the first search is fast at any size. It costs a round trip per filter change (I estimate 0.1 to 0.2 s, and about a second on the first search after the function has been idle; not measured on AWS yet). It also gives Plan 9's MCP server and the CLI one search to call, and it is where PLAN3's semantic search has to merge with keyword results anyway, since embedding the query happens on the server. I've added it as option C and recommend it.","at":"2026-11-13T22:12:52.807909-06:00","answers":[15]},{"id":17,"card":"plan","from":"session","action":"note","text":"From Plan 8 (b35aa36581c2), answering your follow-up on backend search. Plan 8 sees no problem with GET /api/search. A request per filter change, with typing debounced, works for the search page. This replaces my earlier note: Plan 8 needs nothing from the client-side catalog. One thing Plan 8 will rely on: each result row should carry what a result card shows (id, title, a description or snippet, access, formats, temporal range and project), so the search page never fetches per result. Plan 8 is still Planned, so this is from its brief, not from research.","at":"2026-11-13T22:12:59.691346-06:00","state":"answered","claim":"7f603c01c91b22d7","sender":{"project":"personal","folder":"b35aa36581c2"}},{"id":18,"card":"plan","from":"session","action":"note","text":"Correction from the coordinating session: reach me only over muster, at personal-personal/generic-package-format-and-contract. A diazo note to Plan 2's folder now goes to a different session.","at":"2026-11-13T22:13:43.335995-06:00","state":"answered","claim":"8dbe83ef8ec3928a","sender":{"project":"personal"}},{"id":19,"card":"DCSN1","from":"user","action":"choose","option":"C","at":"2026-11-13T22:29:42.627993-06:00","state":"answered","claim":"7ff7a32f5a33d0ab"},{"id":20,"card":"DCSN4","from":"user","action":"choose","option":"A","at":"2026-11-13T22:30:59.012995-06:00","state":"answered","claim":"14cafa50dc230bf7"},{"id":21,"card":"UNDR","from":"user","action":"confirm","at":"2026-11-13T22:32:35.159887-06:00","state":"answered","claim":"b3b72abdab5461e3"},{"id":22,"card":"DCSN5","from":"user","action":"choose","option":"A","at":"2026-11-13T22:32:49.543405-06:00","state":"answered","claim":"1d68dd93a7732d10"},{"id":23,"card":"spec","from":"user","action":"approve-spec","at":"2026-11-13T22:34:38.131542-06:00","state":"answered","claim":"9db2d2b1213c16eb"},{"id":24,"card":"PLAN1","from":"user","action":"approve-plan","at":"2026-11-13T22:39:28.417489-06:00","state":"answered","claim":"fcb19718aa81e9ee"},{"id":25,"card":"STEP1","from":"user","action":"tick","option":"A1","text":"personal court@subaud.io","at":"2026-11-13T22:41:30.640333-06:00","state":"answered","claim":"7afd1164e1a7f7cf"},{"id":26,"card":"STEP1","from":"user","action":"answer","option":"A3","answer":"GO","at":"2026-11-13T23:10:24.79156-06:00","state":"answered","claim":"67a86e38fcaf1ca2"},{"id":27,"card":"plan","from":"session","action":"note","text":"From the coordinating session, at Court's word: accounts become invitation-only. Self-service sign-up goes off (selfSignUpEnabled false in packages/infra/src/auth.ts), and an admin invites a user by email with an optional group, for example a just invite-user \u003cstage\u003e \u003cemail\u003e [group] recipe using AdminCreateUser and AdminAddUserToGroup. \"Restricted\" then means \"people the archive invited\", which is what Court wants until by-request access exists. Please take this into PLAN1 (it sits with your sign-in and restricted-download work), update the spec's \"Anyone signed in qualifies; signing up is self-service with email\" line, and change Task 5's walkthrough so your test user is invited rather than signing up. Also note: Plan 7 will use its own test stage name so your Task 5 teardown can't hit its run.","at":"2026-11-13T23:17:02.425801-06:00","state":"answered","claim":"3b6e23edeaa332df","sender":{"project":"personal"}},{"id":28,"card":"plan","from":"agent","action":"reply","text":"Taken into PLAN1 as Task 6 (invitation-only accounts and just invite-user), research-in-a-box#26; the spec's restricted-downloads line and Task 5's walkthrough now invite the test user instead of signing up.","at":"2026-11-13T23:20:21.88821-06:00","answers":[27]},{"id":29,"card":"STEP1","from":"user","action":"tick","option":"A5","text":"why is this still failing on the callback","at":"2026-11-13T23:28:21.715681-06:00","state":"answered","claim":"0cb60f1f3205ef53","attachments":[{"path":"screenshots/shot-83fe6085c35d.png"}]},{"id":30,"card":"STEP1","from":"agent","action":"reply","text":"It isn't failing: \"localhost refused to connect\" is expected. The callback address points at port 8765 on your machine, where Plan 9's CLI will listen; nothing listens there today. All that's needed is the code in the address bar, which your screenshot gave me, and the sign-in worked: the token exchange answered 200, and your signed-in call fetched the restricted file through its link. The next sign-in lands on the same page.","at":"2026-11-13T23:29:10.700754-06:00"},{"id":31,"card":"STEP1","from":"user","action":"tick","option":"A7","at":"2026-11-13T23:34:16.22175-06:00","state":"answered","claim":"7eb91671b10b922a"},{"id":32,"card":"STEP1","from":"user","action":"answer","option":"A9","answer":"GO","at":"2026-11-13T23:53:44.707367-06:00","state":"answered","claim":"c0f7e64841fcd6e2"},{"id":33,"card":"DCSN6","from":"user","action":"choose","option":"B","at":"2026-11-14T00:10:58.631476-06:00","state":"answered","claim":"7f0419b5ec43fc3b"},{"id":34,"card":"DCSN7","from":"user","action":"choose","option":"A","at":"2026-11-14T00:18:20.500924-06:00","state":"answered","claim":"008f7f6d384616da"},{"id":35,"card":"DCSN8","from":"user","action":"choose","option":"A","at":"2026-11-14T00:19:17.687161-06:00","state":"answered","claim":"e46562947871aebd"},{"id":36,"card":"PLAN3","from":"user","action":"approve-plan","at":"2026-11-14T00:23:08.084748-06:00","state":"answered","claim":"38b2c2445fafc549"},{"id":37,"card":"STEP2","from":"user","action":"answer","option":"A2","answer":"GO","at":"2026-11-14T10:04:24.867576-06:00","state":"answered","claim":"7dd446ce26bfbe54"},{"id":38,"card":"plan","from":"session","action":"note","text":"From the coordinating session, at Court's word: main on schuettc/research-in-a-box is now protected. Every change goes through a pull request (direct pushes and force pushes are refused, admins included), and a merge needs the python, typescript and security checks green. Branches don't have to be up to date with main. Auto-merge is on for the repo (gh pr merge \u003cn\u003e --auto), and head branches are deleted on merge.","at":"2026-11-14T10:18:52.931644-06:00","state":"answered","claim":"044143b5f6bb0f44","sender":{"project":"personal"}},{"id":39,"card":"STEP2","from":"user","action":"answer","option":"A5","answer":"GO","at":"2026-11-14T10:49:40.027929-06:00","state":"answered","claim":"87f2165d38af28d7"}],"planned_history":[{"action":"planned","by":"agent","at":"2026-11-13T08:48:32.368041-06:00"},{"action":"started","by":"user","at":"2026-11-13T21:14:17.693596-06:00"}]},"view":{"status":{"DCSN1":"decided","DCSN2":"decided","DCSN3":"decided","DCSN4":"decided","DCSN5":"decided","DCSN6":"decided","DCSN7":"decided","DCSN8":"decided"},"step_status":{"STEP1":"done","STEP2":"done"},"waiting_on":{},"need_you":1,"needs":[{"kind":"signoff","card":"SIGNOFF","name":"Ready to sign off"}],"by_agent":15,"spec_hash":"2faf2b0aa9dd548e4ea5dcec9eed07446e98c46c80a9534f268ed452d6e41e61","plan_hashes":{"PLAN1":"0ac73b3fa188e4510489aa87a4f43891ef7ad267b3ea1ec41cda244d554aafa6","PLAN3":"e2d57470bd02fe32a34c0c9ee50133ac308ba0259c514484f2099076d8756b8f"},"plans":{"PLAN1":"done","PLAN3":"done"},"task_status":{"TASK1":"done","TASK10":"done","TASK11":"done","TASK12":"done","TASK2":"done","TASK3":"done","TASK4":"done","TASK5":"done","TASK6":"done","TASK7":"done","TASK8":"done","TASK9":"done"},"task_waits":{},"waits_by":[],"need_agent":0,"changed":[],"diffs":{"PLAN1":{"added":13,"removed":2,"hunks":[{"section":"Task 5: The test deploy","before":113,"lines":[{"op":"same","text":""},{"op":"same","text":"### Task 5: The test deploy"},{"op":"same","text":""},{"op":"del","text":"**Does:** Merges Tasks 1 to 4, deploys `ResearchArchive-test`, walks every check in the spec's \"How we'll know it works\" with you, measures search round trips, and destroys the stack."},{"op":"add","text":"**Does:** Merges Tasks 1 to 4 and Task 6, deploys `ResearchArchive-test`, walks every check in the spec's \"How we'll know it works\" with you, measures search round trips, and destroys the stack."},{"op":"same","text":"**Files:** none (results go in the task's result line and the build thread)"},{"op":"same","text":"**Checks:** every action in STEP1 is done; `aws cloudformation describe-stacks --stack-name ResearchArchive-test` fails with \"does not exist\" at the end."},{"op":"same","text":"**Serves:** DCSN1, DCSN2, DCSN3"}]},{"section":"Task 5: The test deploy","before":5,"lines":[{"op":"same","text":"3. You: Go for the deploy."},{"op":"same","text":"4. Agent: `just lambda-assets`, deploy `ResearchArchive-test` with a test `ARCHIVE_CONFIG`, upload the sample package twice with `archive:published` set (once `open`, once with `archive:access` set to `restricted`, under `restricted/`), run `just reindex test` and wait for `COMPLETED`."},{"op":"same","text":"5. Agent: check `/catalog.json` has both rows; `GET /api/search?q=` with a word from the description finds both, filters by `access=restricted` to one, facet counts add up; `GET /api/datasets/\u003cid\u003e` returns the manifest and files; the download route signed out answers 401."},{"op":"del","text":"6. You: open the sign-in link the agent gives (Plan 4's `cli` client with PKCE), sign up, and paste back the `localhost:8765` URL you land on, even though the page doesn't load."},{"op":"add","text":"6. Agent invites you with `just invite-user test \u003cyour email\u003e`. You: open the sign-in link the agent gives (Plan 4's `cli` client with PKCE), sign in with the temporary password from the invitation email, set your own, and paste back the `localhost:8765` URL you land on, even though the page doesn't load."},{"op":"same","text":"7. Agent: exchange the code; the restricted download link fetches the file; DownloadCounts shows one restricted; a usage answer posts; `GET /api/admin/usage` answers 403; add your user to `admin`."},{"op":"same","text":"8. You: sign in again with the new link and paste back the URL."},{"op":"same","text":"9. Agent: `GET /api/admin/usage` answers the posted answer; download an open file through `/data`, invoke the rollup with `{\"through\": \"\u003ctoday\u003e\"}` once the log file has arrived, and check DownloadCounts shows it; time ten searches warm and one after fifteen idle minutes through CloudFront."},{"op":"same","text":"10. You: Go for the teardown."},{"op":"same","text":"11. Agent: `cdk destroy ResearchArchive-test` and confirm the stack, buckets and tables are gone."},{"op":"add","text":""},{"op":"add","text":"### Task 6: Invitation-only accounts"},{"op":"add","text":""},{"op":"add","text":"**Does:** Turns off self-service sign-up and adds a recipe for an admin to invite a person by email, optionally into a group, so restricted data reaches only people the archive invited. Added at your word through the coordinating session; Task 5 deploys it."},{"op":"add","text":"**Files:** `packages/infra/src/auth.ts`, `packages/infra/test/auth.test.ts`, `justfile`, `docs/planning-handoff.md`"},{"op":"add","text":"**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0."},{"op":"add","text":"**Serves:** DCSN2"},{"op":"add","text":""},{"op":"add","text":"- `selfSignUpEnabled: false` on the user pool; the synth test asserts `AdminCreateUserConfig.AllowAdminCreateUserOnly` is true."},{"op":"add","text":"- `just invite-user \u003cstage\u003e \u003cemail\u003e [group]`: reads the user pool id from the stack's resources, runs `aws cognito-idp admin-create-user` with the email as username, `email_verified=true` and Cognito's invitation email, then `admin-add-user-to-group` when a group is given. Uses the caller's `AWS_PROFILE` and region, like `just reindex`."},{"op":"add","text":"- One Decision log row: accounts are invitation-only; restricted means invited."}]}],"after":0},"PLAN3":{"added":12,"removed":1,"hunks":[{"section":"Left out","before":24,"lines":[{"op":"same","text":""},{"op":"same","text":"- A score cut-off for semantic matches, and any model besides Titan v2 (spec, Left out)."},{"op":"same","text":"- Embedding the CLI or MCP server's own searches: they call `/api/search` like the web app."},{"op":"del","text":"- Plan 7's call to the embedding function: whichever of Plan 6 and Plan 7 lands second adds it (muster thread 955)."},{"op":"same","text":"- The first search after idle (PARK3) stays its own follow-up; Task 5 measures it again with embeddings on."},{"op":"same","text":""},{"op":"same","text":"## Where"}]},{"section":"Task 11: The test deploy","before":75,"lines":[{"op":"same","text":"4. Agent: redeploy with the module removed; check `q=air pollution` answers keyword results (none) with no error, and `q=ozone` still finds the ozone dataset."},{"op":"same","text":"5. You: Go for the teardown."},{"op":"same","text":"6. Agent: destroy the stack and confirm the stack, buckets, tables and leftover log groups are gone."},{"op":"add","text":""},{"op":"add","text":"### Task 12: Embeddings on Plan 7's publish"},{"op":"add","text":""},{"op":"add","text":"**Does:** Plan 7's publish step (research-in-a-box#29) landed before this plan, so Plan 6 adds the agreed call: when the embeddings setting is on, publish passes the dataset item through `with_embedding` before its put, and the ingest function gets the Bedrock grant. Without it, a dataset published with the module on has no embedding until the next reindex."},{"op":"add","text":"**Files:** `packages/backend/src/archive_backend/ingest.py`, `packages/backend/tests/test_ingest.py`, the infra file that builds the ingest function and its synth test"},{"op":"add","text":"**Checks:** `uv run pytest packages/backend` exits 0; `npm test -w packages/infra` exits 0; `just check` exits 0."},{"op":"add","text":"**Serves:** DCSN6, DCSN7 (rests on call AGNT12)"},{"op":"add","text":""},{"op":"add","text":"- One call, before the put, only when `read_archive_config(...).infrastructure.modules.embeddings` is set; no later update (muster threads 955 and 979)."},{"op":"add","text":"- `archive.grantEmbedding(ingestFn)` only when the module is on; a synth test asserts the grant is absent when it is off."},{"op":"add","text":"- Plan 7 is editing the same area of `ingest.py`; whichever PR merges second rebases."},{"op":"add","text":"- Tests with a fake Bedrock: publish with the setting on writes a META item carrying a 1,024-number `embedding`; with it off Bedrock is never called."}]}],"after":0},"spec":{"added":21,"removed":10,"hunks":[{"section":"Goal","before":1,"lines":[{"op":"same","text":""},{"op":"same","text":"## Goal"},{"op":"same","text":""},{"op":"del","text":"Anyone can find a dataset in the archive and fetch it, from the web app, the CLI or an MCP server, with no relational database. A read API open to all answers search, dataset, version and project reads; signed-in users get short-lived links to restricted files; the archive counts downloads and, optionally, asks readers how they use the data. It works today on what Plan 4's reindex loads, and Plan 7's publish step plugs into it later. Semantic search follows as its own plan once there is a real corpus to judge it on."},{"op":"add","text":"Anyone can find a dataset in the archive and fetch it, from the web app, the CLI or an MCP server, with no relational database. A read API open to all answers search, dataset, version and project reads; signed-in users get short-lived links to restricted files; the archive counts downloads and, optionally, asks readers how they use the data. It works today on what Plan 4's reindex loads, and Plan 7's publish step plugs into it later. An archive can switch on semantic search, which finds datasets by meaning as well as by their words."},{"op":"same","text":""},{"op":"same","text":"## The plans"},{"op":"same","text":""},{"op":"del","text":"Plan 6 is two plans in this folder. PLAN1 is the read API and search described below, buildable now. PLAN3 is semantic search: the vector index on both catalog tables, the embedding model and its setting, and ranking semantic results with keyword results inside the same search endpoint; it is written once PLAN1 is built and Plan 5's corpus exists. Plan 7 owns everything under `/api/submissions`, including the review-policy setting, so there is no PLAN2."},{"op":"add","text":"Plan 6 is two plans in this folder. PLAN1 is the read API and search described below, buildable now. PLAN3 makes keyword matching rank by how many words match, and adds semantic search: the vector index on both catalog tables, the embedding setting, and merging semantic with keyword results inside the same search endpoint, as described under Semantic search. Plan 7 owns everything under `/api/submissions`, including the review-policy setting, so there is no PLAN2."},{"op":"same","text":""},{"op":"del","text":"Rests on: DCSN5, DCSN1"},{"op":"add","text":"Rests on: DCSN5, DCSN1, DCSN6"},{"op":"same","text":""},{"op":"same","text":"## Endpoints"},{"op":"same","text":""}]},{"section":"Search","before":18,"lines":[{"op":"same","text":""},{"op":"same","text":"**The catalog file.** One function in `archive-backend` builds `catalog.json` from the active catalog table and writes it to the derived bucket's `site/`, so it is also public at `/catalog.json`. The reindex calls it after it flips the active table; Plan 7's publish step calls the same function. One row per published dataset at every access level: `id`, `version`, `title`, `description`, `keywords`, `access`, `licenses` (ids), `rightsStatus`, `project`, `creators`, `formats`, `start`, `end`, `ongoing`, `bbox` (west, south, east, north), `bytes` (the current version's total) and `published`. Theme and species join when the contract holds those fields (Plan 2's PARK5 and PARK6). It is written with Python's standard library; no DuckDB."},{"op":"same","text":""},{"op":"del","text":"**The endpoint.** `GET /api/search` takes `q` (keywords), `access`, `license`, `format`, `project` (each repeatable), `from` and `to` (dates), `bbox` (`west,south,east,north`), `page` and `size` (default 20, at most 100). Each keyword must appear, ignoring case, in the title, description, keywords or creators. Date filters keep a dataset whose coverage overlaps the range; the box keeps a dataset whose box intersects it, including boxes that cross the antimeridian. Results with a keyword in the title come first, then the rest, newest published first. The answer is the page of rows (the same fields as the catalog file, so a result card needs no further call), the total, and a count for each value of `access`, `license`, `format` and `project` under the current filter."},{"op":"add","text":"**The endpoint.** `GET /api/search` takes `q` (keywords), `access`, `license`, `format`, `project` (each repeatable), `from` and `to` (dates), `bbox` (`west,south,east,north`), `page` and `size` (default 20, at most 100). A dataset matches when any word of `q` appears, ignoring case, in its title, description, keywords or creators; common words such as `on` and `the` are ignored and a plural matches its singular. Date filters keep a dataset whose coverage overlaps the range; the box keeps a dataset whose box intersects it, including boxes that cross the antimeridian. Results are ranked by how many words match, a word in the title counting half again; ties go newest published first. The answer is the page of rows (the same fields as the catalog file, so a result card needs no further call), the total, and a count for each value of `access`, `license`, `format` and `project` under the current filter."},{"op":"same","text":""},{"op":"same","text":"**Freshness.** The search Lambda keeps the parsed catalog in memory and checks the object's ETag at most once a minute, re-reading it when it changed, so a publish or reindex reaches search within a minute. Filtering 10,000 datasets took 9 ms in a measurement on a laptop; past roughly 50,000 datasets, the next step is an index rather than an in-memory list."},{"op":"same","text":""},{"op":"del","text":"Rests on: DCSN1, AGNT2, AGNT3, AGNT4"},{"op":"add","text":"Rests on: DCSN1, AGNT2, AGNT3, AGNT4, DCSN6"},{"op":"same","text":""},{"op":"add","text":"## Semantic search"},{"op":"add","text":""},{"op":"add","text":"Semantic search is an optional module, `infrastructure.modules.embeddings`, off by default. Switched on, the construct adds a vector index named `datasets` to both catalog tables (attribute `embedding`, 1,024 dimensions, COSINE, keys only, no vector partition key) and grants Bedrock on Amazon Titan Text Embeddings v2. One function in `archive-backend` takes a dataset item and its manifest and returns the item with `embedding` set, from the title, description and keywords. The reindex calls it on every dataset item before the bulk load, and Plan 7's publish calls the same function before its put, so the embedding is never written by a separate update that a later put would erase."},{"op":"add","text":""},{"op":"add","text":"With embeddings on and a `q`, `/api/search` embeds the query with the same model, asks the index for the 50 nearest datasets, and merges that list with the keyword ranking by reciprocal rank fusion: each dataset scores 1/(60 + its place) in each list and the page is sorted by the sum. The filters apply to the merged list as they do to keyword matches, and the total and facet counts are taken over it. If Bedrock or the index errors, the search answers the keyword ranking alone and logs a warning. With embeddings off, search is the keyword ranking. Any Lambda reads the setting from the archive-config parameter."},{"op":"add","text":""},{"op":"add","text":"On Plan 5's ten converted datasets, 22 plain-language searches found 11 with every-word keyword matching, 17 with any-word ranking, and put 17 first with Titan v2 merged by fusion (21 in the top 3)."},{"op":"add","text":""},{"op":"add","text":"Rests on: DCSN6, DCSN7, DCSN8, AGNT12, AGNT13, AGNT14, AGNT15, AGNT11"},{"op":"add","text":""},{"op":"same","text":"## Restricted downloads"},{"op":"same","text":""},{"op":"del","text":"Open files are fetched straight from CloudFront at `/data/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e`; the API isn't involved. For a restricted dataset, a signed-in user calls the download route and gets an S3 presigned link to `restricted/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e` that lasts five minutes. Anyone signed in qualifies; signing up is self-service with email. The path must be one of the version's file items, so the route can't be used to reach any other key. A by-request dataset answers 403 until Plan 7's request workflow can grant access, which this check will then read. Description-only datasets have no files. An open dataset's download route answers its `/data` URL."},{"op":"add","text":"Open files are fetched straight from CloudFront at `/data/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e`; the API isn't involved. For a restricted dataset, a signed-in user calls the download route and gets an S3 presigned link to `restricted/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e` that lasts five minutes. Anyone signed in qualifies, and accounts are by invitation only: self-service sign-up is off, and an admin invites a person by email with `just invite-user \u003cstage\u003e \u003cemail\u003e [group]`. So restricted means people the archive invited, until by-request access exists. The path must be one of the version's file items, so the route can't be used to reach any other key. A by-request dataset answers 403 until Plan 7's request workflow can grant access, which this check will then read. Description-only datasets have no files. An open dataset's download route answers its `/data` URL."},{"op":"same","text":""},{"op":"same","text":"Rests on: DCSN2, AGNT9"},{"op":"same","text":""}]},{"section":"Risk and cost","before":25,"lines":[{"op":"same","text":""},{"op":"same","text":"**Risk.** A mistake could hand a restricted file to someone it shouldn't reach, for instance a download route that signs any key it is given. Links last five minutes, the route signs only paths listed in the version's file items, and CloudFront is denied `restricted/*` outright, so a fix and a redeploy close it; tests cover a signed-out call, a path outside the version, and a by-request dataset. Nothing here deletes or rewrites a package: every endpoint reads, and the only writes are counts, usage answers and the derived catalog file, all rebuildable or disposable."},{"op":"same","text":""},{"op":"del","text":"**Cost.** One test deploy to an AWS account you choose and its teardown, each a step for you on the page. No new programs on your machine; `aws-lambda-powertools` joins `archive-backend`. Running cost is one Lambda call per search and per read, a daily rollup and a small table, pennies a month for a small archive."},{"op":"add","text":"**Cost.** One test deploy to an AWS account you choose and its teardown, each a step for you on the page. No new programs on your machine; `aws-lambda-powertools` joins `archive-backend`. Running cost is one Lambda call per search and per read, a daily rollup and a small table, pennies a month for a small archive. With embeddings on, each search and each reindexed or published dataset adds one Bedrock call (about $0.02 per million tokens for Titan v2, quoted by third parties) and the vector index's storage and searches; a wrong embedding is undone by a reindex."},{"op":"same","text":""},{"op":"del","text":"Rests on: DCSN2, DCSN4"},{"op":"add","text":"Rests on: DCSN2, DCSN4, DCSN7"},{"op":"same","text":""},{"op":"same","text":"## Left out"},{"op":"same","text":""},{"op":"same","text":"- Submission, review and review-policy endpoints: Plan 7's."},{"op":"del","text":"- Semantic search, the embedding model and the vector index: PLAN3."},{"op":"add","text":"- A score cut-off for semantic matches, and choosing the model per archive: until real searches show they are needed."},{"op":"same","text":"- Theme and species facets: when Plan 2's PARK5 and PARK6 add the fields."},{"op":"same","text":"- The CLI and MCP sign-in client code: Plan 9, its first user."},{"op":"same","text":"- An admin route to start a reindex: stays Plan 4's follow-up PARK1."}]},{"section":"How we'll know it works","before":7,"lines":[{"op":"same","text":"- `just check` passes, including tests for search filters, facet counts, paging and the antimeridian box; for the download route refusing a signed-out call, a path outside the version and a by-request dataset; for the rollup counting 200s only and never counting a day twice; and the OpenAPI drift check."},{"op":"same","text":"- On one test deploy with two datasets loaded by `just reindex` (one open, one restricted): `GET /api/search?q=` finds each by a word in its description and the facet counts add up; `GET /api/datasets/\u003cid\u003e` returns the manifest and files; a signed-in user's download link fetches the restricted file and expires; the same call signed out answers 401; a usage answer posts and an admin reads it back; after an open download through `/data` and a run of the rollup, DownloadCounts shows it."},{"op":"same","text":"- The round trip of a search through CloudFront, warm and after idle, is measured on that deploy and written in the plan's result."},{"op":"add","text":"- For PLAN3, tests cover any-word ranking, fusion order, filters on the merged list, and keyword-only answers when Bedrock fails; on a test deploy with embeddings on and Plan 5's ten datasets reindexed, `GET /api/search?q=air%20pollution` puts the IMPROVE aerosol dataset first, and with embeddings off the same stack answers keyword results."},{"op":"same","text":""},{"op":"del","text":"Rests on: DCSN1, DCSN2, DCSN3, DCSN4"},{"op":"add","text":"Rests on: DCSN1, DCSN2, DCSN3, DCSN4, DCSN6, DCSN8"}]}],"after":0}},"stages":[{"key":"start","state":"done"},{"key":"understanding","state":"done"},{"key":"decisions","state":"done"},{"key":"spec","state":"done","detail":{"title":"Edited after approval · 2026-11-14 00:20","note":"21 lines changed in Goal, Search, Risk and cost and How we'll know it works. Opens the spec with the change marked."}},{"key":"plans","state":"done","detail":{"title":"2 plans","rows":[{"id":"PLAN1","text":"The read API, server search and downloads","meta":"built · edited after approval"},{"id":"PLAN3","text":"Ranked keyword search and semantic search","meta":"built · edited after approval"}]}},{"key":"build","state":"done"},{"key":"signoff","state":"now","words":"ready"}],"plan_reason":{"PLAN1":{"state":"built","done":6,"total":6,"words":"built"},"PLAN3":{"state":"built","done":6,"total":6,"words":"built"}},"plan_title":{"PLAN1":"The read API, server search and downloads","PLAN3":"Ranked keyword search and semantic search"},"running":[],"build_done":12,"build_total":12,"build_line":"built · 12 of 12 done","builds":[{"id":"BUILD1","plan":"PLAN1"},{"id":"BUILD3","plan":"PLAN3"}],"no_who":[],"questions":[],"stalls":[],"wrap_up":"","signoff":"ready","completed":false},"files":[{"path":"decisions.json","mtime":0},{"path":"diagrams/e622a48ae0d7.svg","mtime":0},{"path":"plans/1-read-api-and-catalog-search.md","mtime":0},{"path":"plans/3-semantic-search.md","mtime":0},{"path":"screenshots/shot-83fe6085c35d.png","mtime":0},{"path":"spec.md","mtime":0}],"names":{"README.md":"2026-11-13-api-and-search.md","decisions.md":"2026-11-13-api-and-search-decisions.md","plans/1-read-api-and-catalog-search.md":"2026-11-13-api-and-search-plan-1-read-api-and-catalog-search.md","plans/3-semantic-search.md":"2026-11-13-api-and-search-plan-3-semantic-search.md","record.html":"2026-11-13-api-and-search.html","spec.md":"2026-11-13-api-and-search-spec.md","wrap-up.md":"2026-11-13-api-and-search-wrap-up.md"}},"spec":"---\ndiazo: research-archive-in-a-box/api-and-search\nfile: spec\nstatus: approved\napproved: 2026-11-13T22:34:38-06:00\nhash: 2faf2b0aa9dd548e4ea5dcec9eed07446e98c46c80a9534f268ed452d6e41e61\nrests_on: [DCSN5, DCSN1, DCSN6, DCSN4, AGNT1, AGNT8, AGNT2, AGNT3, AGNT4, DCSN7, DCSN8, AGNT12, AGNT13, AGNT14, AGNT15, AGNT11, DCSN2, AGNT9, AGNT7, DCSN3, AGNT10, AGNT5, AGNT6]\nrecord: README.md\n---\n\n# API and search: the read API, server search and downloads\n\n## Goal\n\nAnyone can find a dataset in the archive and fetch it, from the web app, the CLI or an MCP server, with no relational database. A read API open to all answers search, dataset, version and project reads; signed-in users get short-lived links to restricted files; the archive counts downloads and, optionally, asks readers how they use the data. It works today on what Plan 4's reindex loads, and Plan 7's publish step plugs into it later. An archive can switch on semantic search, which finds datasets by meaning as well as by their words.\n\n## The plans\n\nPlan 6 is two plans in this folder. PLAN1 is the read API and search described below, buildable now. PLAN3 makes keyword matching rank by how many words match, and adds semantic search: the vector index on both catalog tables, the embedding setting, and merging semantic with keyword results inside the same search endpoint, as described under Semantic search. Plan 7 owns everything under `/api/submissions`, including the review-policy setting, so there is no PLAN2.\n\nRests on: DCSN5, DCSN1, DCSN6\n\n## Endpoints\n\nEvery route is served by one Python Lambda, declared in API Gateway one route at a time so the Cognito authorizer sits only on the signed-in ones. Plan 4's `/api/health` and `/api/whoami` stay as they are.\n\n| Route | Sign-in | Answers |\n|---|---|---|\n| `GET /api/search` | no | One page of matching datasets with a count per facet value (below) |\n| `GET /api/datasets/{id}` | no | The dataset, its current version's manifest and its files |\n| `GET /api/datasets/{id}/versions` | no | Every version's number and prefix |\n| `GET /api/datasets/{id}/versions/{version}` | no | That version's manifest and files |\n| `GET /api/projects/{id}` | no | `projects/\u003cid\u003e/project.json` from the archive bucket, and the project's datasets from GSI1 |\n| `GET /api/datasets/{id}/versions/{version}/download?path=` | yes | A five-minute link to one restricted file |\n| `POST /api/datasets/{id}/usage` | no | Stores the optional usage answers |\n| `GET /api/admin/usage?dataset=` | yes, `admin` group | The usage answers for one dataset |\n\nDataset, version and file reads come from the active catalog table, chosen by the `/research-archive/\u003cstage\u003e/catalog-active` parameter, cached for a minute as Plan 4's Lambdas do. The version item already holds the manifest text. Metadata is public at every access level; only files are restricted. A missing dataset, version or project answers 404.\n\nRests on: DCSN4, AGNT1, AGNT8\n\n## Search\n\n**The catalog file.** One function in `archive-backend` builds `catalog.json` from the active catalog table and writes it to the derived bucket's `site/`, so it is also public at `/catalog.json`. The reindex calls it after it flips the active table; Plan 7's publish step calls the same function. One row per published dataset at every access level: `id`, `version`, `title`, `description`, `keywords`, `access`, `licenses` (ids), `rightsStatus`, `project`, `creators`, `formats`, `start`, `end`, `ongoing`, `bbox` (west, south, east, north), `bytes` (the current version's total) and `published`. Theme and species join when the contract holds those fields (Plan 2's PARK5 and PARK6). It is written with Python's standard library; no DuckDB.\n\n**The endpoint.** `GET /api/search` takes `q` (keywords), `access`, `license`, `format`, `project` (each repeatable), `from` and `to` (dates), `bbox` (`west,south,east,north`), `page` and `size` (default 20, at most 100). A dataset matches when any word of `q` appears, ignoring case, in its title, description, keywords or creators; common words such as `on` and `the` are ignored and a plural matches its singular. Date filters keep a dataset whose coverage overlaps the range; the box keeps a dataset whose box intersects it, including boxes that cross the antimeridian. Results are ranked by how many words match, a word in the title counting half again; ties go newest published first. The answer is the page of rows (the same fields as the catalog file, so a result card needs no further call), the total, and a count for each value of `access`, `license`, `format` and `project` under the current filter.\n\n**Freshness.** The search Lambda keeps the parsed catalog in memory and checks the object's ETag at most once a minute, re-reading it when it changed, so a publish or reindex reaches search within a minute. Filtering 10,000 datasets took 9 ms in a measurement on a laptop; past roughly 50,000 datasets, the next step is an index rather than an in-memory list.\n\nRests on: DCSN1, AGNT2, AGNT3, AGNT4, DCSN6\n\n## Semantic search\n\nSemantic search is an optional module, `infrastructure.modules.embeddings`, off by default. Switched on, the construct adds a vector index named `datasets` to both catalog tables (attribute `embedding`, 1,024 dimensions, COSINE, keys only, no vector partition key) and grants Bedrock on Amazon Titan Text Embeddings v2. One function in `archive-backend` takes a dataset item and its manifest and returns the item with `embedding` set, from the title, description and keywords. The reindex calls it on every dataset item before the bulk load, and Plan 7's publish calls the same function before its put, so the embedding is never written by a separate update that a later put would erase.\n\nWith embeddings on and a `q`, `/api/search` embeds the query with the same model, asks the index for the 50 nearest datasets, and merges that list with the keyword ranking by reciprocal rank fusion: each dataset scores 1/(60 + its place) in each list and the page is sorted by the sum. The filters apply to the merged list as they do to keyword matches, and the total and facet counts are taken over it. If Bedrock or the index errors, the search answers the keyword ranking alone and logs a warning. With embeddings off, search is the keyword ranking. Any Lambda reads the setting from the archive-config parameter.\n\nOn Plan 5's ten converted datasets, 22 plain-language searches found 11 with every-word keyword matching, 17 with any-word ranking, and put 17 first with Titan v2 merged by fusion (21 in the top 3).\n\nRests on: DCSN6, DCSN7, DCSN8, AGNT12, AGNT13, AGNT14, AGNT15, AGNT11\n\n## Restricted downloads\n\nOpen files are fetched straight from CloudFront at `/data/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e`; the API isn't involved. For a restricted dataset, a signed-in user calls the download route and gets an S3 presigned link to `restricted/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e` that lasts five minutes. Anyone signed in qualifies, and accounts are by invitation only: self-service sign-up is off, and an admin invites a person by email with `just invite-user \u003cstage\u003e \u003cemail\u003e [group]`. So restricted means people the archive invited, until by-request access exists. The path must be one of the version's file items, so the route can't be used to reach any other key. A by-request dataset answers 403 until Plan 7's request workflow can grant access, which this check will then read. Description-only datasets have no files. An open dataset's download route answers its `/data` URL.\n\nRests on: DCSN2, AGNT9\n\n## Download counts\n\nDownloadCounts keeps, per dataset and month, `open` (downloads through CloudFront) and `restricted` (links issued). The download route adds one to `restricted` when it issues a link. A scheduled function runs daily, reads the previous day's CloudFront standard logs under the derived bucket's `logs/`, and adds one to `open` per `GET` under `/data/` that answered 200; range reads (206) and `HEAD` don't count, so a data preview that reads by range doesn't inflate the numbers. The last day rolled up is kept as a Settings item, `downloads-rolled-up-through`, so a rerun never counts a day twice.\n\nRests on: AGNT7\n\n## Usage form\n\nBefore a download, a reader may answer three optional questions, with no sign-in and no name or email: the kind of organisation (university, government, nonprofit, company, individual, other), what the data is for (research, teaching, policy or management, commercial, personal, other), and a note of up to 500 characters. The question list is a model in the contract. Answers go to a UsageResponses table that Plan 6 adds (`datasetId`, sort key `\u003cmonth\u003e#\u003cuuid\u003e`, on-demand, point-in-time recovery like the other operational tables). Admins read them through `GET /api/admin/usage`.\n\nRests on: DCSN3, AGNT10\n\n## Sign-in for the CLI and MCP server\n\nThe browser signs in through Plan 4's `web` client as built. The CLI and the MCP server use authorization code with PKCE through Plan 4's `cli` client: they open the browser to Cognito's managed login and listen on `http://localhost:8765/callback`. They keep the one-hour access and ID tokens and discard the refresh token, so they hold short-lived tokens only. Plan 6 records this in the handoff's Decision log; the client code is built by its first user, Plan 9.\n\nRests on: AGNT5\n\n## How it is built\n\nThe routes live in one module of `archive-backend` on Powertools' `APIGatewayRestResolver` with validation on, each with Pydantic request and response models. A `just openapi` recipe writes the OpenAPI spec from those routes to a committed file, and CI fails when the committed file and the code disagree, as it already does for the contract's JSON Schema; Plan 8 generates its TypeScript types from it. The CDK side is one internal construct in `packages/infra` that `ResearchArchive` creates: the API Lambda and its routes on Plan 4's `api` and `authorizer`, the UsageResponses table, the daily download rollup on a schedule, and the reindex's call to the catalog writer. Any Lambda that needs the archive config reads it from `/research-archive/\u003cstage\u003e/archive-config`; PLAN1's need nothing from it.\n\nRests on: DCSN4, AGNT6, AGNT11\n\n## Risk and cost\n\n**Risk.** A mistake could hand a restricted file to someone it shouldn't reach, for instance a download route that signs any key it is given. Links last five minutes, the route signs only paths listed in the version's file items, and CloudFront is denied `restricted/*` outright, so a fix and a redeploy close it; tests cover a signed-out call, a path outside the version, and a by-request dataset. Nothing here deletes or rewrites a package: every endpoint reads, and the only writes are counts, usage answers and the derived catalog file, all rebuildable or disposable.\n\n**Cost.** One test deploy to an AWS account you choose and its teardown, each a step for you on the page. No new programs on your machine; `aws-lambda-powertools` joins `archive-backend`. Running cost is one Lambda call per search and per read, a daily rollup and a small table, pennies a month for a small archive. With embeddings on, each search and each reindexed or published dataset adds one Bedrock call (about $0.02 per million tokens for Titan v2, quoted by third parties) and the vector index's storage and searches; a wrong embedding is undone by a reindex.\n\nRests on: DCSN2, DCSN4, DCSN7\n\n## Left out\n\n- Submission, review and review-policy endpoints: Plan 7's.\n- A score cut-off for semantic matches, and choosing the model per archive: until real searches show they are needed.\n- Theme and species facets: when Plan 2's PARK5 and PARK6 add the fields.\n- The CLI and MCP sign-in client code: Plan 9, its first user.\n- An admin route to start a reindex: stays Plan 4's follow-up PARK1.\n- Config-defined usage questions, or asking for an email: until an archive asks.\n- A search index for archives past about 50,000 datasets.\n\nRests on: DCSN5, DCSN3, AGNT5\n\n## How we'll know it works\n\n- `just check` passes, including tests for search filters, facet counts, paging and the antimeridian box; for the download route refusing a signed-out call, a path outside the version and a by-request dataset; for the rollup counting 200s only and never counting a day twice; and the OpenAPI drift check.\n- On one test deploy with two datasets loaded by `just reindex` (one open, one restricted): `GET /api/search?q=` finds each by a word in its description and the facet counts add up; `GET /api/datasets/\u003cid\u003e` returns the manifest and files; a signed-in user's download link fetches the restricted file and expires; the same call signed out answers 401; a usage answer posts and an admin reads it back; after an open download through `/data` and a run of the rollup, DownloadCounts shows it.\n- The round trip of a search through CloudFront, warm and after idle, is measured on that deploy and written in the plan's result.\n- For PLAN3, tests cover any-word ranking, fusion order, filters on the merged list, and keyword-only answers when Bedrock fails; on a test deploy with embeddings on and Plan 5's ten datasets reindexed, `GET /api/search?q=air%20pollution` puts the IMPROVE aerosol dataset first, and with embeddings off the same stack answers keyword results.\n\nRests on: DCSN1, DCSN2, DCSN3, DCSN4, DCSN6, DCSN8\n","plans":{"PLAN1":"---\ndiazo: research-archive-in-a-box/api-and-search\nfile: PLAN1\nstatus: done\napproved: 2026-11-13T22:39:28-06:00\nhash: 0ac73b3fa188e4510489aa87a4f43891ef7ad267b3ea1ec41cda244d554aafa6\nrests_on: [AGNT1, AGNT10, AGNT2, AGNT3, AGNT6, AGNT7, AGNT8, AGNT9, DCSN1, DCSN2, DCSN3, DCSN4]\nrecord: README.md\n---\n\n# PLAN1: The read API, server search and downloads\n\n## Spec\n\n`docs/specs/2026-11-13-api-and-search/spec.md`, every section. Plans 1, 2 and 4 are built and merged: build on `archive_contract`, `archive-backend` (`reindex.py` with `catalog_items` and `dataset_item`), and the `ResearchArchive` construct with its `api`, `authorizer`, `catalogTables`, `activeCatalogParameter`, `archiveBucket`, `derivedBucket`, `downloadCounts`, `settings`, `distribution` and `pythonFunction`. The handoff's Decision log (rows dated 2026-11-13 for Plans 4, 6 and 7) holds the catalog item shapes and the archive layout. The implementer reads the spec beside this plan.\n\n## The change\n\nOne API Lambda on Powertools answers search, dataset, version and project reads, restricted download links and the usage form. One function writes `catalog.json`, and the reindex calls it. A daily function rolls CloudFront's logs into DownloadCounts. One internal construct wires it all into `ResearchArchive`. Then one test deploy, a stage named `test` in your AWS account, walks the spec's \"How we'll know it works\" and is destroyed.\n\n**Risk:**\n\n- Tasks 1 to 4 are local code and CI; a mistake is undone by reverting the PR.\n- The one way to do harm is a download route that signs a key it shouldn't. Task 2's tests cover a signed-out call, a path outside the version, a by-request dataset and an open one; links last five minutes; CloudFront is denied `restricted/*`.\n- Task 5 creates real resources under a non-prod stage, all deleted with the stack; a few dollars at most, undone by `cdk destroy`. Nothing touches a prod stage.\n\n**Cost:**\n\n- One walkthrough step for you (STEP1): name the profile and alert address, Go for the deploy, sign in twice in the browser and paste back the URL, Go for the teardown.\n- New dependency: `aws-lambda-powertools` in `archive-backend` (pure Python).\n- No new programs on your machine.\n\n## Left out\n\n- Semantic search, the vector index and the embedding model (PLAN3).\n- Submission, review and review-policy endpoints (Plan 7).\n- Theme and species in the catalog (Plan 2's PARK5 and PARK6).\n- The CLI and MCP sign-in client (Plan 9); Task 5 walks the flow by hand once.\n- An admin reindex route (Plan 4's PARK1).\n- Loading project records into the catalog table: projects are read from the archive bucket where they live.\n\n## Where\n\n- Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-archive-in-a-box/plan6/read-api-and-catalog-search`, branch `plan6/read-api-and-catalog-search` from `origin/main`. Confirm with `git -C \u003cwt\u003e branch --show-current` before editing.\n- Python: `packages/backend/pyproject.toml`, `uv.lock`, `packages/backend/src/archive_backend/{catalog_file,search,api,downloads,reindex}.py`, their tests under `packages/backend/tests/`, `packages/contract/src/archive_contract/usage.py` with its test.\n- TypeScript: `packages/infra/src/read-api.ts` (new), `packages/infra/src/research-archive.ts`, `packages/infra/src/reindex.ts`, `packages/infra/test/read-api.test.ts` (new), `packages/infra/test/reindex.test.ts`.\n- `justfile`, `packages/web/src/schema/openapi.json` (new, generated), `docs/planning-handoff.md` (Decision log: `publishedAt`).\n- Global constraints:\n  - Lambdas are Python 3.13 on arm64 through `archive.pythonFunction`; `just check` must exit 0.\n  - Nothing reaches AWS in Tasks 1 to 4.\n  - Task 5 runs only with your Go on STEP1, under the profile you name, never against a stage named `prod`.\n  - On any AWS auth error, stop and report; never copy or export credentials.\n\n### Task 1: The catalog file and its writer\n\n**Does:** Adds `archive_backend.catalog_file.write_catalog_file(table_name, derived_bucket)`, which builds `catalog.json` from a catalog table and writes it to `site/catalog.json`; carries the manifest's publish time onto version items; the reindex calls the writer after it flips.\n**Files:** `packages/contract/src/archive_contract/manifest.py`, `packages/contract/tests/test_manifest.py`, `packages/web/src/schema/archive-contract.schema.json`, `packages/infra/src/generated/archive-config.ts` (if regenerated), `packages/backend/src/archive_backend/catalog_file.py`, `packages/backend/src/archive_backend/reindex.py`, `packages/backend/tests/test_catalog_file.py`, `packages/backend/tests/test_reindex.py`, `docs/planning-handoff.md`\n**Checks:** `uv run pytest packages/backend packages/contract` exits 0; `just check-python` exits 0; `just check-schema` exits 0.\n**Serves:** DCSN1 (rests on calls AGNT2, AGNT3)\n\n- The publish time lives in the manifest as `archive:published`, an ISO 8601 UTC datetime the archive sets at publish and nobody else writes (agreed with Plan 7 and the coordinating session, muster thread 945). If `origin/main` doesn't have it yet, add `Manifest.published: datetime | None` with alias `archive:published` to `archive_contract`, run `just schema`, and add one Decision log row; if Plan 7 landed it first, use theirs.\n- `catalog_items` reads `archive:published` from the manifest it already parses and writes it as `publishedAt` on the version item. No new argument and no fallback: a manifest without it gets no `publishedAt`.\n- `catalog_rows(items) -\u003e list[dict]`: pure, from the dataset `META` items and their current version items. Row fields, each left out when the manifest lacks it: `id`, `version`, `title`, `description`, `keywords`, `access`, `licenses` (each license's `name`, else `path`), `rightsStatus`, `project`, `creators` (contributors with the `creator` role: `title`, else `givenName familyName`, else `organization`), `formats` (distinct resource formats, sorted), `start`, `end` (date, or `\"unknown\"`), `ongoing`, `bbox` (`[west, south, east, north]`), `bytes` (sum of the version's file items' `bytes`) and `published` (the version item's `publishedAt`). Rows sorted by `id`.\n- `write_catalog_file` scans the table (paginated), builds the rows and puts `site/catalog.json` with `ContentType: application/json` and `CacheControl: max-age=60`. It returns the row count.\n- In the reindex, a new checkpointed step after `flip` calls it
