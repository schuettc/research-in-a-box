100`, metrics on.\n  - `readonly authorizer: apigateway.CognitoUserPoolsAuthorizer`.\n  - Resources `api/health` (`GET`, no auth) and `api/whoami` (`GET`, Cognito authorizer). The whoami route exists because CDK refuses an authorizer attached to no method, and it lets PLAN3 prove a signed-in call end to end.\n  - When `waf`: a `CfnWebACL` (scope `REGIONAL`, default allow) with `AWSManagedRulesCommonRuleSet`, `AWSManagedRulesKnownBadInputsRuleSet` and `AWSManagedRulesAmazonIpReputationList`, associated with the API's deployment stage.\n- `integrity.ts`: `class IntegrityCheck extends Construct`:\n  - Makes the function with `pythonFunction` (`archive_backend.integrity.handler`, timeout 15 minutes, environment `ARCHIVE_BUCKET` and `ALERT_TOPIC_ARN`) and grants it read on the archive bucket and publish on the topic.\n  - Schedules it with `scheduler.Schedule`, `ScheduleExpression.rate(Duration.days(7))`, target `LambdaInvoke` with `retryAttempts: 0`.\n  - Sets the function's async invoke config to `retryAttempts: 0`.\n- `ResearchArchive` exposes `userPool`, `userPoolClients`, `api` (the `RestApi`) and `authorizer`. It wires the WAF switch from `config.infrastructure.modules.waf`.\n\nTests:\n\n- `the user pool signs in with email and has contributor, curator and admin groups`.\n- `managed login is the newer version, and each client has branding`.\n- `both app clients use code with PKCE and no secret, with the site and localhost callbacks`.\n- `the prod user pool is retained with deletion protection; a dev stage's is not`.\n- `health is public and whoami uses the Cognito authorizer`.\n- `the stage throttles at 50 per second with a burst of 100`.\n- `WAF appears only when modules.waf is true, associated with the API stage`.\n- `the integrity check runs weekly with no retries`.\n\nCommit: `Add Cognito, the API shell and the weekly integrity check`\n\n### Task 4: CloudFront\n\n**Does:** Adds one distribution: the default behaviour is the derived bucket's `site/` with an index fallback; `/data/*` is the archive bucket's `open/` at stable URLs; `/api/*` is the REST API, uncached. It writes standard logs to the derived bucket's `logs/`, wires the web app client's callbacks to its domain and records the cross-plan facts.\n**Files:** `packages/infra/src/web.ts`, `packages/infra/src/storage.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/test/web.test.ts`, `docs/planning-handoff.md`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0; `npx cdk synth -q` in `packages/infra` exits 0.\n**Serves:** none (rests on calls AGNT6, AGNT11)\n\n- `storage.ts`: the derived bucket gets `objectOwnership: BUCKET_OWNER_PREFERRED`. CloudFront's standard logs are delivered with an ACL, which a bucket that enforces the owner refuses. Public access stays fully blocked.\n- `web.ts`: `class Web extends Construct`, props `{ derivedBucket; archiveBucket; restApi }`, with `readonly distribution: cloudfront.Distribution`:\n  - Default behaviour: `S3BucketOrigin.withOriginAccessControl(derivedBucket, { originPath: \"/site\" })`, redirect to HTTPS, cache optimized. A viewer-request CloudFront Function rewrites a URI whose last segment has no `.` to `/index.html`, and one ending in `/` to `\u003curi\u003eindex.html`. `defaultRootObject: \"index.html\"`.\n  - `/data/*`: `S3BucketOrigin.withOriginAccessControl(archiveBucket, { originPath: \"/open\" })`, with a viewer-request function stripping the leading `/data`. A request for `/data/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e` reads `open/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e`. Cache optimized, GET and HEAD only.\n  - `/api/*`: `RestApiOrigin(restApi)`, all methods, `CACHING_DISABLED`, `ALL_VIEWER_EXCEPT_HOST_HEADER` origin request policy.\n  - No distribution-wide error responses, so a missing data file or an API 404 stays a 404.\n  - Logging on, to `derivedBucket` with prefix `logs/`.\n- `ResearchArchive` exposes `distribution` and calls `auth.addAppClients(distribution.distributionDomainName)` after creating it.\n- Decision log lines (today's date), added to `docs/planning-handoff.md`:\n  - Plans 4 and 7: an archived version lives at `\u003copen|restricted\u003e/\u003cdatasetId\u003e/\u003cversion\u003e/` with `checksums.sha256` at its root. Every object is written in one PUT with a full-object SHA-256 checksum, which the weekly integrity check compares. Open files are served at `/data/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e` on the CloudFront domain. A metadata edit that rewrites `datapackage.json` or `README.md` in place must rewrite `checksums.sha256` too, or the weekly check alerts. Changing a dataset's access level moves it between `open/` and `restricted/`, so its `/data` URL changes; Plan 7 owns both.\n  - Plans 4, 6 and 9: the API lives under `/api/*` on the CloudFront domain. Two Cognito app clients use code with PKCE and no secret: `web` (callback `/auth/callback`) and `cli` (callback `http://localhost:8765/callback`, which Plan 6 may change when it designs the CLI and MCP sign-in). Roles are the Cognito groups `contributor`, `curator` and `admin`.\n  - Plans 4 and 7: the site's CloudFront Function sends extensionless paths to `/index.html`; Plan 7 changes it when it writes per-dataset pages.\n\nTests:\n\n- `the default behaviour serves site/ from the derived bucket through origin access control`.\n- `/data/* serves open/ from the archive bucket and strips /data`.\n- `/api/* goes to the REST API uncached with all methods`.\n- `the distribution has no error responses`.\n- `standard logs go to the derived bucket under logs/, and the derived bucket accepts the log ACL`.\n- `the web client's callback is on the distribution's domain`.\n\nCommit: `Add CloudFront for the site, open data and the API`\n\nThe implementer stops after Task 4's commit. The Plan 4 planning session (which dispatched the implementer) pushes the branch, opens the PR and merges it once CI passes on it.\n","PLAN3":"---\ndiazo: research-archive-in-a-box/archive-infrastructure-cdk-construct\nfile: PLAN3\nstatus: done\napproved: 2026-11-13T16:31:09-06:00\nhash: 73556a3c44e81618d678d419dcbf3cf97cdc4a37bf200165dbf8c8dfd97666a2\nrests_on: [AGNT10, AGNT8, DCSN1, DCSN2, DCSN3, DCSN4]\nrecord: README.md\n---\n\n# PLAN3: Reindex and the test deploy\n\n## Spec\n\n`docs/specs/2026-11-13-archive-infrastructure-cdk-construct/spec.md`, sections \"Reindex\", \"Risk and cost\" and \"How we'll know it works\". PLAN1 (research-in-a-box#10) and PLAN2 (research-in-a-box#12) are built and merged. Build on their code: `ResearchArchive`, `pythonFunction`, `catalogTables` with `activeCatalogParameter`, `derivedBucket`, `archiveBucket` and `alertTopic`. The implementer reads the spec beside this plan.\n\n## The change\n\nThe reindex is a Python durable function in the construct. It:\n\n1. Empties the inactive catalog table.\n2. Turns every published manifest in the archive bucket into line-delimited DynamoDB JSON under the derived bucket's `reindex/\u003crun\u003e/`.\n3. Bulk-loads that into the inactive table and waits for the load to end.\n4. Flips the active-catalog parameter only when the load ends `COMPLETED`.\n\nAn admin starts it with `just reindex \u003cstage\u003e` and follows it with `just reindex-status \u003cstage\u003e`. Then one test deploy, a stage named `test` in your AWS account, walks every check in the spec's \"How we'll know it works\" and is destroyed.\n\n**Risk:**\n\n- Tasks 1 and 2 are local code and CI; a mistake is undone by reverting the PR.\n- Task 3 creates real resources in one AWS account you choose, under a non-prod stage, so every bucket, table and user pool deletes with the stack. A mistake there costs a few dollars at most, and `cdk destroy` undoes it.\n- Nothing touches a prod stage; none exists.\n\n**Cost:**\n\n- One walkthrough step for you (STEP1). You name the AWS profile and alert address, approve the deploy, confirm the alert email subscription, sign up once in the browser and paste back one URL, then approve the teardown.\n- New dependency: `aws-durable-execution-sdk-python==3.0.2` in `archive-backend`.\n- No new programs on your machine; the AWS CLI is already installed.\n\n## Left out\n\n- Projects in the catalog. Where a project record lives in the archive bucket is Plan 7's to decide, so reindex loads datasets, versions and files only (follow-up PARK6).\n- Catching up packages published during a reindex (follow-up PARK5).\n- Reindex from `cruise` (follow-up PARK1).\n- A prod deploy, a CI deploy and the deployment skill (Plan 10a).\n- Testing write-once locking and WAF on the test deploy. Both stay synth-tested; locked objects can't be removed by a clean teardown, and WAF needs no outside credentials to synth.\n\n## Where\n\n- Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-archive-in-a-box/plan4/reindex-and-test-deploy`, branch `plan4/reindex-and-test-deploy` from `origin/main`. Confirm with `git -C \u003cwt\u003e branch --show-current` before editing.\n- Python: `packages/backend/pyproject.toml`, `uv.lock`, `packages/backend/src/archive_backend/reindex.py`, `packages/backend/tests/test_reindex.py`.\n- TypeScript: `packages/infra/src/python-function.ts`, `packages/infra/src/reindex.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/bin/app.ts`, `packages/infra/vitest.config.ts`, `packages/infra/test/reindex.test.ts`, `packages/infra/test/app.test.ts`.\n- `justfile`, `docs/planning-handoff.md` (decision log).\n- Global constraints:\n  - Lambdas are Python 3.13 on arm64; `just check` must exit 0.\n  - Nothing reaches AWS in Tasks 1 and 2.\n  - Task 3 runs only with your Go on STEP1, under the profile you name, never against a stage named `prod`.\n  - On any AWS auth error, stop and report; never copy or export credentials.\n\n### Task 1: The reindex function\n\n**Does:** Adds `archive_backend.reindex`. Plain functions turn manifests into DynamoDB JSON lines; a durable handler runs the empty, write, load, wait and flip as checkpointed steps and alerts on a bad outcome. All of it is unit-tested with fakes.\n**Files:** `packages/backend/pyproject.toml`, `uv.lock`, `packages/backend/src/archive_backend/reindex.py`, `packages/backend/tests/test_reindex.py`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0.\n**Serves:** DCSN1, DCSN3 (rests on calls AGNT8, AGNT10)\n\nAdd `aws-durable-execution-sdk-python==3.0.2` to `archive-backend` and run `uv lock`. The package needs `boto3\u003e=1.43.114`; the lock has 1.44.3.\n\nArchive layout, from the decision log: a published version sits at `\u003copen|restricted\u003e/\u003cdatasetId\u003e/\u003cversion\u003e/` with `datapackage.json` at its root.\n\nCatalog items (catalog keys from the spec; attributes beyond the keys are Plan 4's first cut, which Plan 6 may extend). Every value is a DynamoDB JSON string unless noted.\n\n- **Dataset:** `PK=DATASET#\u003cid\u003e`, `SK=META`, `id`, `title`, `access` (from `archive:access`, default `open`), `currentVersion` (number, the highest version found), `prefix` (`open` or `restricted`, of the current version). When `archive:project` is set: `project`, `GSI1PK=PROJECT#\u003cproject\u003e` and `GSI1SK=DATASET#\u003cid\u003e`.\n- **Version:** `PK=DATASET#\u003cid\u003e`, `SK=V#\u003cversion zero-padded to 6\u003e`, `version` (number), `prefix`, `manifest` (the `datapackage.json` text as one string).\n- **File:** `PK=DATASET#\u003cid\u003e`, `SK=V#\u003cversion padded\u003e#FILE#\u003cpath\u003e`, `path`, `name` (resource name), and `format`, `bytes` (number) and `hash` when the resource has them. One item per resource `path`, plus one per member of `archive:files` when a resource lists them.\n\nFunctions:\n\n- `catalog_items(prefix: str, dataset_id: str, version: int, manifest_text: str) -\u003e list[dict[str, Any]]`: the version item and its file items, as DynamoDB JSON maps (`{\"S\": ...}`, `{\"N\": ...}`).\n- `dataset_item(versions: list[tuple[str, int, dict[str, Any]]]) -\u003e dict[str, Any]`: given `(prefix, version, manifest)` for every version of one dataset, the dataset item for the highest version.\n- `to_lines(items: list[dict[str, Any]]) -\u003e str`: one `{\"Item\": {...}}` per line, newline-terminated, the bulk put items input format.\n- `manifest_keys(s3, bucket: str) -\u003e list[str]`: every key ending `/datapackage.json` exactly three segments under `open/` or `restricted/`, sorted.\n\n`@durable_execution def handler(event: dict[str, Any], context: DurableContext) -\u003e dict[str, Any]` reads `ARCHIVE_BUCKET`, `DERIVED_BUCKET`, `CATALOG_TABLE_A`, `CATALOG_TABLE_B`, `ACTIVE_CATALOG_PARAMETER` and `ALERT_TOPIC_ARN`. It does only these, each as a named `context.step`:\n\n1. `start`: return `{\"run\": \u003cUTC timestamp YYYYMMDDTHHMMSSZ\u003e, \"active\": \u003cparameter value\u003e}`. The target is the other table (`A` loads `B`, and back).\n2. `empty`, repeated: each step scans one page of the target table (projection `PK, SK`), deletes it with `batch_write_item` in groups of 25, retrying unprocessed items, and returns the `LastEvaluatedKey` (or `None` when done).\n3. `list`: return `manifest_keys`.\n4. `write-\u003cn\u003e`: for each batch of 200 keys, read the manifests, write `reindex/\u003crun\u003e/data/part-\u003cn:05d\u003e.json` with `to_lines`, and return the item count. Group keys by dataset id first, so a dataset's item is written in the batch holding its versions; a batch boundary never splits a dataset.\n5. `load`: `start_bulk_put_items` into the target table with input `{S3Bucket: DERIVED_BUCKET, S3KeyPrefix: \"reindex/\u003crun\u003e/data/\", InputFormat: \"DYNAMODB_JSON\"}`, output `{S3Bucket: DERIVED_BUCKET, S3KeyPrefix: \"reindex/\u003crun\u003e/report/\", OutputType: [\"ERROR\"]}`, `PerformanceTier: \"STANDARD\"` and `ClientToken` = the run. Return the operation ARN. With no manifests, skip the load and treat it as `COMPLETED`.\n6. `wait_for_condition` named `wait-load`: the check describes the operation and returns `{\"status\", \"processed\", \"failed\"}`. The strategy stops once the status is not `IN_PROGRESS` or `CANCELLING`, else waits `min(30 * attempt, 300)` seconds.\n7. On `COMPLETED`, a step `flip` writes the target letter to the parameter (overwrite). On anything else, a step `alert` publishes `Reindex \u003crun\u003e on \u003ctarget\u003e ended \u003cstatus\u003e` with the report prefix to the alert topic, and the parameter is left alone.\n8. Return `{\"run\", \"target\", \"status\", \"items\", \"flipped\": bool}`.\n\nTests use fake S3, DynamoDB, SSM and SNS clients and a `FakeContext` whose `step(func, name)` calls `func(None)` and whose `wait_for_condition` loops the check until the strategy stops, recording each step name. The handler takes its clients from a module function `clients()` that the tests monkeypatch.\n\n- `test_catalog_items_for_the_sample_package`: `examples/sample-package/datapackage.json` as version 1 under `open` yields one version item with the manifest text, and one file item per resource path and per `archive:files` member, each with its `format`, `bytes` and `hash` where present.\n- `test_dataset_item_takes_the_highest_version_and_its_prefix`: versions 1 (`open`) and 2 (`restricted`) give `currentVersion` 2 and `prefix` `restricted`.\n- `test_dataset_item_has_gsi1_only_with_a_project`.\n- `test_to_lines_is_one_item_per_line`: each line parses as `{\"Item\": {...}}`.\n- `test_manifest_keys_skips_nested_and_other_prefixes`: `open/a/1/datapackage.json` is kept; `open/a/1/docs/datapackage.json` and `staging/a/1/datapackage.json` are not.\n- `test_reindex_loads_the_inactive_table_and_flips_on_completed`: active `A`, the load targets table B, and the parameter ends `B`.\n- `test_reindex_empties_the_target_before_loading`: target items present before the run are deleted, and `empty` runs before `load`.\n- `test_reindex_does_not_flip_and_alerts_on_completed_with_errors`: also for `FAILED`.\n- `test_reindex_with_no_packages_flips_to_an_empty_table`.\n\nCommit: `Add the reindex durable function`\n\n### Task 2: The reindex in the construct, the just recipes and a test-stage config\n\n**Does:** Adds the reindex as a durable function with a `live` alias, its permissions and a stack output. Adds `just reindex` and `just reindex-status`. Lets the default app read another config file through `ARCHIVE_CONFIG`, raises the infra test timeout, and records the reindex facts in the decision log.\n**Files:** `packages/infra/src/python-function.ts`, `packages/infra/src/reindex.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/bin/app.ts`, `packages/infra/vitest.config.ts`, `packages/infra/test/reindex.test.ts`, `packages/infra/test/app.test.ts`, `justfile`, `docs/planning-handoff.md`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0; `npx cdk synth -q` in `packages/infra` exits 0.\n**Serves:** DCSN3 (rests on calls AGNT8, AGNT10)\n\n- `PythonFunctionProps` gains `readonly durableConfig?: lambda.DurableConfig`, passed through. Plan 7's durable functions use the same helper.\n- `reindex.ts`: `class Reindex extends Construct`, props `{ archive: ResearchArchive }`:\n  - The function comes from `archive.pythonFunction(\"ReindexFunction\", { handler: \"archive_backend.reindex.handler\", timeout: Duration.minutes(15), memorySize: 1024, durableConfig: { executionTimeout: Duration.hours(12), retentionPeriod: Duration.days(30) }, environment: {...} })`. The environment holds the six names Task 1 reads.\n  - `readonly alias = new lambda.Alias(this, \"Live\", { aliasName: \"live\", version: fn.currentVersion })`. Durable functions are invoked only through a version or alias.\n  - Grants:\n    - read on the archive bucket;\n    - read and write on the derived bucket's `reindex/*`;\n    - read and write data on both catalog tables;\n    - read and write on the active-catalog parameter;\n    - publish on the alert topic;\n    - `dynamodb:StartBulkOperation` on `*` (account-scoped, per AWS);\n    - `dynamodb:BulkPutItems` and `dynamodb:DescribeBulkOperation` on both catalog table ARNs and `\u003ctable ARN\u003e/bulk-operation/*`.\n\n    Task 3's deploy proves these grants against the real service; if an action name differs, Task 3 fixes it with the error text as its evidence.\n  - `new CfnOutput(Stack.of(this), \"ReindexFunction\", { key: \"ReindexFunction\", value: alias.functionArn })`.\n- `ResearchArchive` creates `Reindex` last and exposes `reindexFunction` (the alias).\n- `bin/app.ts`: the config path is `process.env.ARCHIVE_CONFIG ?? \u003crepo root\u003e/archive.yaml`, so a test stage needs no edit to `archive.yaml`.\n- `vitest.config.ts` in `packages/infra`: `testTimeout: 30_000`. On research-in-a-box#12's CI run, the infra test files took 3.7 to 7.0 seconds each against a 5-second per-test default.\n- `justfile`:\n  - `reindex stage`: reads the `ReindexFunction` output of `ResearchArchive-\u003cstage\u003e` with `aws cloudformation describe-stacks`, then `aws lambda invoke --invocation-type Event --function-name \u003calias ARN\u003e --payload '{}' --cli-binary-format raw-in-base64-out /dev/null`. It prints `reindex started on \u003cstage\u003e; follow it with just reindex-status \u003cstage\u003e`.\n  - `reindex-status stage`: `aws lambda list-durable-executions-by-function --function-name \u003calias ARN\u003e --max-items 1`, then `aws lambda get-durable-execution` on its ARN, printing the status and the result.\n  - Both use the caller's `AWS_PROFILE` and region as set in their shell.\n- Decision log (today's date), added to `docs/planning-handoff.md`:\n  - Plans 4, 6 and 7: catalog items as listed in Task 1.\n  - Plans 4 and 7: reindex loads datasets, versions and files from manifests only; projects join once Plan 7 decides where project records live in the archive bucket.\n  - Plans 4, 7 and 10a: `pythonFunction` takes `durableConfig`; durable functions are invoked through a `live` alias, never unqualified. `ARCHIVE_CONFIG` points the default app at another config file.\n\nTests in `test/reindex.test.ts` (with `testApp()`):\n\n- `the reindex function is durable with a 12-hour execution timeout`.\n- `it is invoked through a live alias, which the ReindexFunction output names`.\n- `it may start bulk operations and bulk-load both catalog tables`.\n- `its environment names both catalog tables, the active-catalog parameter, both buckets and the alert topic`.\n\nIn `test/app.test.ts`: `ARCHIVE_CONFIG points the default app at another config file` (a temp file with stage `test` gives stack `ResearchArchive-test`).\n\nCommit: `Add the reindex to the construct with its just recipes`\n\nAfter Task 2's commit, the implementer stops. The Plan 4 planning session runs the final review, pushes, opens the PR and merges it once CI passes, before Task 3.\n\n### Task 3: The test deploy\n\n**Does:** Deploys a `test` stage from main to your AWS account and walks every check in the spec's \"How we'll know it works\" against it. Fixes what the live run shows, then destroys the stack. This is one walkthrough step for you, STEP1, with the agent's actions between yours.\n**Files:** a test config at `~/.local/state/plans/plan4-3-reindex-and-test-deploy/test.yaml`, outside the repo. Repo files change only if a check fails, through a fix PR.\n**Checks:** each walkthrough action records its result. `cdk destroy` exits 0, and `aws cloudformation describe-stacks --stack-name ResearchArchive-test` then reports that the stack does not exist.\n**Serves:** DCSN1, DCSN2, DCSN3, DCSN4 (rests on calls AGNT8, AGNT10)\n\nThe test config is `archive.yaml`'s catalog settings, with `infrastructure.alertEmail` set to the address you give, `stages: [{name: test, account: \u003cyour account id\u003e, region: \u003cregion\u003e}]`, and no modules.\n\nSTEP1's actions, in order:\n\n1. You: name the AWS profile and the alert address (Ready).\n2. Agent: `aws sts get-caller-identity` under that profile, then `cdk bootstrap` if the account and region have no `CDKToolkit` stack. STEP1's how says that a bootstrap leaves the `CDKToolkit` stack and its bucket in the account after the teardown, which is normal and shared by any CDK app there.\n3. You: Go for the deploy.\n4. Agent: `just lambda-assets`, then `ARCHIVE_CONFIG=\u003ctest.yaml\u003e npx cdk deploy ResearchArchive-test --require-approval never`.\n5. You: confirm the SNS subscription email (Done).\n6. Agent:\n   - `curl` of `https://\u003cdistribution\u003e/api/health` returns 200 with `{\"status\": \"ok\"}`.\n   - A burst of 400 concurrent requests shows at least one 429.\n   - An object put with `aws s3 cp --checksum-algorithm SHA256` under `open/sample/1/` downloads from `/data/sample/1/...` with the same bytes.\n   - A put under `restricted/` returns 403 from `/data/...`.\n7. You: open the authorize URL the agent gives, for the `cli` client with a PKCE challenge. Sign up with email, then paste back the `http://localhost:8765/callback?code=...` URL from the address bar. The page there won't load; that's expected.\n8. Agent: exchanges the code at `/oauth2/token`, and `curl` of `/api/whoami` with the ID token returns your email and `groups: []`.\n9. Agent:\n   - Uploads the sample package as `open/stream-temperature-sample/1/`, and a copy with a second id as `open/second-sample/1/`, every object with `--checksum-algorithm SHA256`.\n   - Runs `just reindex test`, then `just reindex-status test` until it ends.\n   - Expects `COMPLETED`, the active-catalog parameter flipped to `B`, and two dataset items in catalog table B.\n10. Agent:\n    - Invokes the integrity function by hand: `problems: 0`.\n    - Overwrites one archived file with different bytes and invokes it again: one `mismatch`, and the alert email arrives.\n11. You: Go for the teardown.\n12. Agent: `ARCHIVE_CONFIG=\u003ctest.yaml\u003e npx cdk destroy ResearchArchive-test --force`, then confirms the stack, its buckets and its tables are gone.\n\nA failing check stops the walk. The fix is a new commit on a branch, with a test that reproduces it where one can, merged by PR. Then the agent redeploys and repeats that action.\n"},"wrapup":null,"readme":"\u003c!-- Written by diazo from decisions.json, spec.md and the plans; diazo rewrites it, so edit those instead. --\u003e\n\n# Archive infrastructure (Plan 4)\n\n`research-archive-in-a-box/archive-infrastructure-cdk-construct` · repo `research-archive-in-a-box`\n\n✓ Start → ✓ Understanding → ✓ Decisions → ✓ Spec → ✓ Plans → ✓ Build → **Sign off · due**\n\nPLAN1 built · PLAN2 built · PLAN3 built\n\n## Pick up next\n\n- **PARK1 Reindex from cruise:** Let a signed-in admin start and follow a reindex from cruise through an admin API route with a short-lived token, so no AWS credentials are needed. Needs an admin route from Plan 6.\n- **PARK2 Custom domain:** Let the config name a domain and an existing us-east-1 ACM certificate so CloudFront and Cognito's managed login serve under the archive's own domain. Left out of Plan 4 until an adopter needs it; the CloudFront domain is already a stable URL.\n- **PARK3 ORCID sign-in:** Optional ORCID sign-in as a Cognito OIDC identity provider, with the client secret in an SSM SecureString the config names. Left out of Plan 4 at the coordinating session's review: nobody has an ORCID client to test it with yet.\n- **PARK4 University sign-in:** Optional university single sign-on as a Cognito SAML identity provider from a metadata URL in the config. Left out of Plan 4 at the coordinating session's review until an adopter has SAML metadata to test with.\n- **PARK5 Reindex catch-up:** Before flipping the active catalog, re-put every package published after the reindex's snapshot time, so a publish during a run isn't lost from the new table. Needed once Plan 7 publishes; until then a reindex runs while publishing is quiet.\n- **PARK6 Projects in reindex:** Load project records into the catalog on reindex once Plan 7 decides where a project.json lives in the archive bucket. Until then reindex loads datasets, versions and files only.\n- **PARK7 Reserved stage names:** A stage name containing a Cognito reserved word (aws, amazon, cognito) makes the user pool domain prefix fail at deploy. Refuse such names in the Stage model, or encode the prefix, if an adopter ever hits it.\n- **PARK8 Reindex at scale:** The reindex's list step checkpoints every manifest key in one result, capped at 256 KB (about 4,000 versions). Write the key list to S3, or list inside each write step, when an archive nears that.\n- **PARK9 Reindex failure alerts:** A reindex that fails before the load, or whose status check keeps failing, ends with no reindex alert; only the function's errors alarm fires. Send the reindex alert from those paths too.\n- **PARK10 Oversized manifests:** A manifest over DynamoDB's 400 KB item limit fails its version item, so the reindex ends COMPLETED_WITH_ERRORS and never flips. Store large manifests by reference (an S3 key) instead of inline.\n- **PARK11 Missing data file is 403:** A request for an open file that doesn't exist returns 403 from /data, not 404: CloudFront's origin access control has GetObject but not ListBucket, so S3 answers 403. Grant s3:ListBucket scoped to open/, or map 403 to 404 on the /data behaviour, so readers and link checkers see a plain not found.\n- **PARK12 Leftover helper log group:** Destroying a non-prod stage leaves the log group of CDK's S3 auto-delete helper, which Lambda creates outside CloudFormation. Plan 10a's teardown should delete /aws/lambda/ResearchArchive-\u0026lt;stage\u003e-CustomS3AutoDeleteObjects* after cdk destroy.\n\n## What was asked\n\n\u003e can we start all of the plans as planned so we don't forget them and have a way to track them with their own sessions\n\u003e \n\u003e (Saved as planned: mark this plan Planned with diazo_update planned: true and wait for Start planning. Do no research until then. It waits on Plan 1, repo layout, folder d65ecf18be29, and the manifest shape from Plan 2, folder 8da653f233f9.)\n\u003e \n\u003e Brief: Plan 4 in docs/planning-handoff.md. Starter prompt from the handoff:\n\u003e \n\u003e \u003e Read `docs/planning-handoff.md`. Plan the archive infrastructure as a TypeScript CDK construct (Plan 4). The service choices are decided and listed under \"Infrastructure\". Do not reopen them. Plan the resources, the DynamoDB design and the construct's interface, and take the open questions with me one at a time.\n\n## Decisions\n\n- **DCSN1 Table layout.** How should the DynamoDB data be split across tables? The user chose D: One catalog table, one table per kind of operational record.\n- **DCSN2 Config to construct.** How should the archive config file reach the TypeScript construct? The user chose A: One file, an infrastructure section in the contract, typed construct props.\n- **DCSN3 Who starts a reindex.** Where should a reindex run: in a Lambda in the archive, or from an admin's machine? The user chose A: A durable Lambda in the archive, started by an admin.\n- **DCSN4 Dev and prod stages.** How should dev and prod be laid out? The user chose C: Prod only by default.\n- **AGNT1 Modules switched by config.** A modules section in the archive config; the construct builds each part only when its switch is on. The user kept it.\n- **AGNT2 Python Lambda packaging.** arm64 functions. A just recipe uses uv to install locked dependencies as manylinux aarch64 wheels (--only-binary) into an asset folder before synth; no Docker. One helper on the construct builds a function from archive-backend so Plans 6 and 7 package the same way. The user kept it.\n- **AGNT3 Vector index in Plan 6.** Plan 6 adds it to both catalog tables, along with the embedding model it chooses and the embeddings config setting. Plan 4 makes the catalog tables on-demand and exposes them, so Plan 6 adds the index without changing Plan 4's design. Moved at the coordinating session's review. The user kept it.\n- **AGNT4 On-demand tables.** On-demand for both tables. The user kept it.\n- **AGNT5 Users live in Cognito.** Cognito holds each user, with groups for contributor, curator and admin. A user-profiles table keeps only what Cognito can't hold: the display name for citations, the ORCID iD and notification settings. The user kept it.\n- **AGNT6 Download logs.** Plan 4 turns on CloudFront standard logs into the derived bucket's logs/ prefix and creates the DownloadCounts table. Rolling the logs up into counts belongs to Plan 6, whose brief holds download counts. The user kept it.\n- **AGNT7 Integrity check.** Objects are written with S3 SHA-256 checksums. A weekly EventBridge Scheduler job runs a Lambda that compares each archived object's stored checksum with the package's checksums.sha256 and alerts on any mismatch or missing object. The user kept it.\n- **AGNT8 Reindex from the CLI.** Two just recipes: reindex \u0026lt;stage\u003e invokes the reindex durable function asynchronously with the AWS CLI and prints the execution ARN, and reindex-status \u0026lt;stage\u003e reports the execution's state and the bulk put outcome. The function name comes from a stack output. The user kept it.\n- **AGNT9 Adding a stage.** The config's infrastructure section has a stages list holding prod by default. Each entry has a name and optionally an account and region; the default app makes one stack per entry, named ResearchArchive-\u0026lt;stage\u003e. A stage named prod keeps data on delete (retain and deletion protection); any other stage is set to be torn down cleanly. The user kept it.\n- **AGNT10 Catalog switch.** CDK creates two catalog tables, A and B, with the same keys. An SSM parameter per stage names the active one, and every Lambda reads it (cached briefly). Reindex empties the inactive table, bulk-loads it, checks the report, then flips the parameter. It runs while publishing is quiet; catching up packages published during a run is follow-up PARK5. The user kept it.\n- **AGNT11 REST API behind CloudFront.** A REST API, with stage throttling and an optional regional WAF attached directly to it. CloudFront routes /api/* to it, so the web app calls the API on its own origin with no CORS. The user kept it.\n- **AGNT12 Backups for what can't be rebuilt.** Point-in-time recovery on every operational table (submissions, reviews, settings, user profiles, download counts). None on the catalog tables, which reindex rebuilds from S3. The user kept it.\n\n## Spec\n\n- [Goal](spec.md#goal): rests on the understanding\n- [The parts](spec.md#the-parts): rests on DCSN2, AGNT1\n- [Storage](spec.md#storage): rests on AGNT7\n- [Tables](spec.md#tables): rests on DCSN1, AGNT3, AGNT4, AGNT5, AGNT12\n- [Reindex](spec.md#reindex): rests on DCSN1, DCSN3, AGNT8, AGNT10\n- [Config and the construct's interface](spec.md#config-and-the-constructs-interface): rests on DCSN2, AGNT1\n- [Python Lambdas](spec.md#python-lambdas): rests on AGNT2\n- [Auth](spec.md#auth): rests on AGNT5\n- [API shell and web](spec.md#api-shell-and-web): rests on AGNT6, AGNT11\n- [Operations and stages](spec.md#operations-and-stages): rests on DCSN4, AGNT9\n- [Risk and cost](spec.md#risk-and-cost): rests on DCSN4, AGNT10, AGNT12\n- [Left out](spec.md#left-out): rests on DCSN3, AGNT1, AGNT3\n- [How we'll know it works](spec.md#how-well-know-it-works): rests on DCSN1, DCSN2, DCSN3, DCSN4, AGNT8, AGNT10\n\n## Plans\n\n- [PLAN1](plans/1-config-storage-and-tables.md) Config, storage and tables: built\n  - TASK1 Task 1: The infrastructure section of the archive config: done. 1bec0bd; test_config.py exit 0 (11 passed); just check-python check-schema exit 0\n  - TASK2 Task 2: Generated config type and the default app: done. 6cbe86d; infra tests and typecheck exit 0; drift check fails (exit 1) on an unregenerated field, passes once regenerated\n  - TASK3 Task 3: Storage: done. ab49b4b; infra tests exit 0\n  - TASK4 Task 4: Tables and the active-catalog parameter: done. 99e5b52; just check exit 0; review approved, no findings; research-in-a-box#10 CI green, merged as 213f95c\n- [PLAN2](plans/2-auth-api-web-and-operations.md) Auth, API, web and operations: built\n  - TASK5 Task 1: Lambda packaging, pythonFunction and operations: done. 878a540; just lambda-assets exit 0 (aarch64 pydantic_core .so present); infra tests exit 0\n  - TASK6 Task 2: The health and whoami handlers, and the integrity check code: done. 52169bf; pytest packages/backend exit 0 (7 passed); just check-python exit 0\n  - TASK7 Task 3: Auth, the API shell and the integrity schedule: done. 0ae57d1; infra tests exit 0\n  - TASK8 Task 4: CloudFront: done. 2f63c81 + review fixes; just check exit 0; research-in-a-box#12 CI green (infra files 4-7 s each on CI), merged as 15596b4\n- [PLAN3](plans/3-reindex-and-test-deploy.md) Reindex and the test deploy: built\n  - TASK9 Task 1: The reindex function: done. 88a218b; pytest packages/backend exit 0 (21 passed, 13 reindex); just check-python exit 0\n  - TASK10 Task 2: The reindex in the construct, the just recipes and a test-stage config: done. 7dec535 + review fix; just check exit 0 (343 Python, 41 infra); research-in-a-box#13 CI green, merged as 97151a2\n  - TASK11 Task 3: The test deploy: done. ResearchArchive-test deployed from main and every spec check passed after fixes #14 (f1bea57) and #15 (2d8ac81); destroyed cleanly, nothing left in the account\n\n## Steps\n\n- STEP1 Walk the test deploy of the archive with me: done\n  1. The user · Name the AWS profile and the alert email address · done: Ready (2026-11-13 16:33, on the page)\n  2. The user · Write the profile and the alert email in the note · done. “personal court@subaud.io” (2026-11-13 16:35, on the page)\n  3. agent · Check the profile's identity and bootstrap the account and region if needed · done. sts: account 316091283514, AdministratorAccess via SSO; CDKToolkit in us-east-1 already at bootstrap version 28, so no bootstrap; no ResearchArchive-test stack exists yet\n  4. agent · Merge the reindex code (PLAN3 tasks 1 and 2) so the deploy runs from main · done. research-in-a-box#13 CI green on all four runs, merged as 97151a2\n  5. The user · Go for the deploy · done: Go (2026-11-13 16:58, on the page)\n  6. agent · Build the Lambda assets and deploy ResearchArchive-test · done. cdk deploy exit 0 in 206 s, 79 of 79 resources CREATE_COMPLETE; distribution d15sl9pkxent0z.cloudfront.net Deployed\n  7. agent · Check health, throttling, an open download, and that restricted data is refused · done. /api/health 200 {\"status\": \"ok\"}; /api/whoami without a token 401; 400 requests at 100 concurrent: 383 x 200, 17 x 429; open/sample/1/data/hello.csv downloads from /data/sample/1/data/hello.csv with the same bytes; restricted/ object 403 from /data (also with /data/../restricted); direct S3 URL 403\n  8. The user · Confirm the alert subscription email · done (2026-11-13 17:16, on the page)\n  9. The user · Sign up once and paste back the URL you land on · done. “screenshot of localhost:8765/callback?code=a6976b99-... from the note” (2026-11-13 17:17, in the terminal)\n  10. agent · Exchange the code for a token and call /api/whoami with it · done. PKCE token exchange 200 (access, id, refresh tokens); /api/whoami with the ID token 200: {\"email\": \"court@subaud.io\", \"groups\": []}\n  11. agent · Run the integrity check clean, then after one file is overwritten, and check the alert email went out · done. clean run: checked 30, problems 0; after overwriting open/second-sample/1/data/logger.csv: problems 1; alert email \"mismatch open/second-sample/1/data/logger.csv\" arrived at court@subaud.io (your screenshot)\n  12. agent · Upload two sample packages, run just reindex test, and check the catalog flipped to table B · done. after fixes #14 (f1bea57) and #15: just reindex-status test SUCCEEDED {target B, status COMPLETED, items 30, flipped true}; /research-archive/test/catalog-active = B; table B holds DATASET#stream-temperature-sample and DATASET#second-sample, 30 items\n  13. The user · Go for the teardown · done: Go (2026-11-13 21:07, on the page)\n  14. agent · Destroy ResearchArchive-test and confirm its stack, buckets and tables are gone · done. cdk destroy exit 0; stack does not exist; no researcharchive-test-* buckets, no ResearchArchive-test-* tables or functions, user pool and parameter gone; the CDK auto-delete helper's log group (created by Lambda outside the stack) deleted by hand; nothing left\n\n## Files\n\n| File | Written by | What it is |\n|---|---|---|\n| `README.md` | diazo | This summary: where it stands, what each file is, every decision and its answer. |\n| `record.html` | diazo | The whole record as one page that works offline. |\n| `decisions.json` | diazo | The full record, every thread. Names its schema. |\n| `spec.md` | the agent, header by diazo | The spec. |\n| `plans/` | the agent, header by diazo | One file per plan. |\n| `mockups/` | the agent and the user | Mockups (HTML) and the agent's pictures; the user's screenshots from before screenshots/. |\n| `screenshots/` | the user | The screenshots the user pasted into a note or the opening. |\n| `diagrams/` | diazo | The drawn picture (SVG) of each mermaid diagram in the folder. |\n\n## Ids\n\nEvery card has an id: its prefix, then a number.\n\n- `DCSN`: a decision the user makes\n- `AGNT`: a call the agent made, which the user may reverse\n- `PRIN`: a principle\n- `PARK`: a follow-up, for later\n- `STEP`: a step only the user can do\n- `ASK`: an ask of someone other than the user\n- `PLAN`: a plan\n- `TASK`: a task of a plan\n\nThe full record is `decisions.json`; its schema is [schema/record.json](https://github.com/subaud-tools/diazo/blob/main/schema/record.json).\n","decisions":"# Archive infrastructure (Plan 4): decisions\n\n- **DCSN1 Table layout.** How should the DynamoDB data be split across tables? The user chose D: One catalog table, one table per kind of operational record.\n- **DCSN2 Config to construct.** How should the archive config file reach the TypeScript
