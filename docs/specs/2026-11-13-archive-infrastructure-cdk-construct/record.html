ations.test.ts`:\n\n- `the alert topic emails the configured address`.\n- `the budget is monthly, at the configured limit, and alerts at 80 and 100 percent`.\n- `pythonFunction makes an arm64 Python 3.13 function with an errors alarm on the alert topic`.\n- `there is one dashboard per stage`.\n\nCommit: `Package Python Lambdas and add operations defaults`\n\n### Task 2: The health and whoami handlers, and the integrity check code\n\n**Does:** Adds the Python handlers for `/api/health` and `/api/whoami` and the integrity check's logic, each with unit tests and no AWS.\n**Files:** `packages/backend/src/archive_backend/health.py`, `whoami.py`, `integrity.py`, `packages/backend/tests/test_health.py`, `test_whoami.py`, `test_integrity.py`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0.\n**Serves:** none (rests on calls AGNT5, AGNT7)\n\n- `health.handler(event: dict[str, Any], context: object) -\u003e dict[str, Any]`: returns `{\"statusCode\": 200, \"headers\": {\"content-type\": \"application/json\"}, \"body\": \"{\\\"status\\\": \\\"ok\\\"}\"}`.\n- `whoami.handler(event, context)`: reads `event[\"requestContext\"][\"authorizer\"][\"claims\"]` and returns 200 with a JSON body `{\"sub\": ..., \"email\": ..., \"groups\": [...]}`. `groups` comes from `cognito:groups` (absent means `[]`).\n- `integrity.py`. Archived package layout (recorded in the decision log in Task 4): each published version sits at `\u003copen|restricted\u003e/\u003cdatasetId\u003e/\u003cversion\u003e/`, with `checksums.sha256` at its root in `sha256sum` format (`\u003chex\u003e  \u003crelative path\u003e`, as `examples/sample-package/checksums.sha256` shows). Each object is written in one PUT with a full-object SHA-256 checksum.\n  - `@dataclass(frozen=True) class Problem: key: str; kind: Literal[\"mismatch\", \"missing\", \"no-checksum\"]`.\n  - `check_archive(s3: S3Client, bucket: str) -\u003e list[Problem]`:\n    1. Find every `checksums.sha256` under `open/` and `restricted/` with the `list_objects_v2` paginator.\n    2. For each line, `head_object(..., ChecksumMode=\"ENABLED\")` on the version folder plus the relative path.\n    3. A 404 is `missing`. An absent `ChecksumSHA256`, or a composite one (it contains `-`), is `no-checksum`. A base64-decoded value that differs from the line's hex is `mismatch`.\n  - `handler(event, context)`: runs `check_archive` on `ARCHIVE_BUCKET`. When there are problems, it publishes one message to `ALERT_TOPIC_ARN`: subject `Archive integrity check: \u003cn\u003e problems`, body the first 50 as `\u003ckind\u003e \u003ckey\u003e` lines. It returns `{\"checked\": \u003cobjects\u003e, \"problems\": \u003cn\u003e}` and never raises for problems found. A raise would make Lambda's async invoke retry the whole scan.\n  - Type the client as `mypy_boto3_s3.S3Client` and create it in the handler.\n- Tests use a small in-memory fake implementing `get_paginator(\"list_objects_v2\")`, `get_object` and `head_object`, not moto:\n  - `test_matching_objects_have_no_problems`.\n  - `test_changed_object_is_a_mismatch`.\n  - `test_listed_file_that_is_gone_is_missing`.\n  - `test_object_without_a_full_sha256_is_no_checksum` (absent, and composite `abc-2`).\n  - `test_handler_alerts_only_when_there_are_problems` (fake SNS records publishes).\n  - `test_health_answers_ok`.\n  - `test_whoami_returns_sub_email_and_groups`.\n\nCommit: `Add the health, whoami and integrity check handlers`\n\n### Task 3: Auth, the API shell and the integrity schedule\n\n**Does:** Adds the Cognito user pool with groups and managed login, and the REST API (`/api/health` public, `/api/whoami` behind the Cognito authorizer, fixed throttling, optional regional WAF). Schedules the integrity check weekly.\n**Files:** `packages/infra/src/auth.ts`, `packages/infra/src/api.ts`, `packages/infra/src/integrity.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/test/auth.test.ts`, `packages/infra/test/api.test.ts`\n**Checks:** `npm test -w packages/infra` exits 0.\n**Serves:** none (rests on calls AGNT5, AGNT7, AGNT11)\n\n- `auth.ts`: `class Auth extends Construct`, props `{ stage: string; isProd: boolean }`:\n  - `readonly userPool`: self sign-up, sign-in with email, email auto-verified, account recovery by email. Prod: `RETAIN` and `deletionProtection: true`; other stages: `DESTROY`.\n  - Groups `contributor`, `curator`, `admin` (`CfnUserPoolGroup`).\n  - A Cognito domain with prefix `archive-\u003cstage\u003e-\u003caccount\u003e` and `managedLoginVersion: NEWER_MANAGED_LOGIN`.\n  - `addAppClients(siteDomain: string): { web: UserPoolClient; cli: UserPoolClient }`: both use authorization code with PKCE, no client secret, and scopes `openid email profile`.\n    - `web`: callback `https://\u003csiteDomain\u003e/auth/callback`, logout `https://\u003csiteDomain\u003e/`.\n    - `cli`: callback `http://localhost:8765/callback`.\n    - Each gets a `CfnManagedLoginBranding` with `useCognitoProvidedValues: true`, since managed login shows no page for a client without one.\n- `api.ts`: `class Api extends Construct`, props `{ userPool; waf: boolean; health: lambda.Function; whoami: lambda.Function }`:\n  - `readonly restApi: apigateway.RestApi`, with a regional endpoint and deploy options `throttlingRateLimit: 50`, `throttlingBurstLimit: 100`, metrics on.\n  - `readonly authorizer: apigateway.CognitoUserPoolsAuthorizer`.\n  - Resources `api/health` (`GET`, no auth) and `api/whoami` (`GET`, Cognito authorizer). The whoami route exists because CDK refuses an authorizer attached to no method, and it lets PLAN3 prove a signed-in call end to end.\n  - When `waf`: a `CfnWebACL` (scope `REGIONAL`, default allow) with `AWSManagedRulesCommonRuleSet`, `AWSManagedRulesKnownBadInputsRuleSet` and `AWSManagedRulesAmazonIpReputationList`, associated with the API's deployment stage.\n- `integrity.ts`: `class IntegrityCheck extends Construct`:\n  - Makes the function with `pythonFunction` (`archive_backend.integrity.handler`, timeout 15 minutes, environment `ARCHIVE_BUCKET` and `ALERT_TOPIC_ARN`) and grants it read on the archive bucket and publish on the topic.\n  - Schedules it with `scheduler.Schedule`, `ScheduleExpression.rate(Duration.days(7))`, target `LambdaInvoke` with `retryAttempts: 0`.\n  - Sets the function's async invoke config to `retryAttempts: 0`.\n- `ResearchArchive` exposes `userPool`, `userPoolClients`, `api` (the `RestApi`) and `authorizer`. It wires the WAF switch from `config.infrastructure.modules.waf`.\n\nTests:\n\n- `the user pool signs in with email and has contributor, curator and admin groups`.\n- `managed login is the newer version, and each client has branding`.\n- `both app clients use code with PKCE and no secret, with the site and localhost callbacks`.\n- `the prod user pool is retained with deletion protection; a dev stage's is not`.\n- `health is public and whoami uses the Cognito authorizer`.\n- `the stage throttles at 50 per second with a burst of 100`.\n- `WAF appears only when modules.waf is true, associated with the API stage`.\n- `the integrity check runs weekly with no retries`.\n\nCommit: `Add Cognito, the API shell and the weekly integrity check`\n\n### Task 4: CloudFront\n\n**Does:** Adds one distribution: the default behaviour is the derived bucket's `site/` with an index fallback; `/data/*` is the archive bucket's `open/` at stable URLs; `/api/*` is the REST API, uncached. It writes standard logs to the derived bucket's `logs/`, wires the web app client's callbacks to its domain and records the cross-plan facts.\n**Files:** `packages/infra/src/web.ts`, `packages/infra/src/storage.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/test/web.test.ts`, `docs/planning-handoff.md`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0; `npx cdk synth -q` in `packages/infra` exits 0.\n**Serves:** none (rests on calls AGNT6, AGNT11)\n\n- `storage.ts`: the derived bucket gets `objectOwnership: BUCKET_OWNER_PREFERRED`. CloudFront's standard logs are delivered with an ACL, which a bucket that enforces the owner refuses. Public access stays fully blocked.\n- `web.ts`: `class Web extends Construct`, props `{ derivedBucket; archiveBucket; restApi }`, with `readonly distribution: cloudfront.Distribution`:\n  - Default behaviour: `S3BucketOrigin.withOriginAccessControl(derivedBucket, { originPath: \"/site\" })`, redirect to HTTPS, cache optimized. A viewer-request CloudFront Function rewrites a URI whose last segment has no `.` to `/index.html`, and one ending in `/` to `\u003curi\u003eindex.html`. `defaultRootObject: \"index.html\"`.\n  - `/data/*`: `S3BucketOrigin.withOriginAccessControl(archiveBucket, { originPath: \"/open\" })`, with a viewer-request function stripping the leading `/data`. A request for `/data/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e` reads `open/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e`. Cache optimized, GET and HEAD only.\n  - `/api/*`: `RestApiOrigin(restApi)`, all methods, `CACHING_DISABLED`, `ALL_VIEWER_EXCEPT_HOST_HEADER` origin request policy.\n  - No distribution-wide error responses, so a missing data file or an API 404 stays a 404.\n  - Logging on, to `derivedBucket` with prefix `logs/`.\n- `ResearchArchive` exposes `distribution` and calls `auth.addAppClients(distribution.distributionDomainName)` after creating it.\n- Decision log lines (today's date), added to `docs/planning-handoff.md`:\n  - Plans 4 and 7: an archived version lives at `\u003copen|restricted\u003e/\u003cdatasetId\u003e/\u003cversion\u003e/` with `checksums.sha256` at its root. Every object is written in one PUT with a full-object SHA-256 checksum, which the weekly integrity check compares. Open files are served at `/data/\u003cdatasetId\u003e/\u003cversion\u003e/\u003cpath\u003e` on the CloudFront domain. A metadata edit that rewrites `datapackage.json` or `README.md` in place must rewrite `checksums.sha256` too, or the weekly check alerts. Changing a dataset's access level moves it between `open/` and `restricted/`, so its `/data` URL changes; Plan 7 owns both.\n  - Plans 4, 6 and 9: the API lives under `/api/*` on the CloudFront domain. Two Cognito app clients use code with PKCE and no secret: `web` (callback `/auth/callback`) and `cli` (callback `http://localhost:8765/callback`, which Plan 6 may change when it designs the CLI and MCP sign-in). Roles are the Cognito groups `contributor`, `curator` and `admin`.\n  - Plans 4 and 7: the site's CloudFront Function sends extensionless paths to `/index.html`; Plan 7 changes it when it writes per-dataset pages.\n\nTests:\n\n- `the default behaviour serves site/ from the derived bucket through origin access control`.\n- `/data/* serves open/ from the archive bucket and strips /data`.\n- `/api/* goes to the REST API uncached with all methods`.\n- `the distribution has no error responses`.\n- `standard logs go to the derived bucket under logs/, and the derived bucket accepts the log ACL`.\n- `the web client's callback is on the distribution's domain`.\n\nCommit: `Add CloudFront for the site, open data and the API`\n\nThe implementer stops after Task 4's commit. The Plan 4 planning session (which dispatched the implementer) pushes the branch, opens the PR and merges it once CI passes on it.\n"}},{"id":"PLAN3","topic":"reindex-and-test-deploy","covers":"The reindex durable function and its just recipes, then one test deploy in your AWS account that walks every check, and its teardown","waits_on":["PLAN2"],"hash":"73556a3c44e81618d678d419dcbf3cf97cdc4a37bf200165dbf8c8dfd97666a2","tasks":[{"id":"TASK9","heading":"Task 1: The reindex function","does":"Adds archive_backend.reindex: manifests become DynamoDB JSON lines; a durable handler empties the inactive catalog table, writes the input files, bulk-loads them, waits, and flips the active-catalog parameter only on COMPLETED, alerting otherwise. Unit-tested with fakes.","pulls_in":"aws-durable-execution-sdk-python 3.0.2 in archive-backend; a first cut of the catalog item attributes that Plan 6 may extend.","serves":["DCSN1","DCSN3"],"state":"keep","build":"done","result":"88a218b; pytest packages/backend exit 0 (21 passed, 13 reindex); just check-python exit 0","build_at":"2026-11-13T16:38:57.224647-06:00"},{"id":"TASK10","heading":"Task 2: The reindex in the construct, the just recipes and a test-stage config","does":"Adds the reindex as a durable function behind a live alias with its permissions and a ReindexFunction stack output, just reindex and just reindex-status, ARCHIVE_CONFIG for another config file, a 30-second infra test timeout, and the decision-log lines.","pulls_in":"durableConfig on pythonFunction, which Plan 7 reuses.","serves":["DCSN3"],"state":"keep","build":"done","result":"7dec535 + review fix; just check exit 0 (343 Python, 41 infra); research-in-a-box#13 CI green, merged as 97151a2","build_at":"2026-11-13T16:51:55.899644-06:00"},{"id":"TASK11","heading":"Task 3: The test deploy","does":"Deploys a test stage to your AWS account and walks every spec check (health, throttling, open and restricted downloads, sign-up and a signed-in call, reindex, integrity check), fixes what the live run shows, then destroys it. One walkthrough step for you.","pulls_in":"Real AWS resources for the length of the walk, a few dollars at most; your Go before the deploy and before the teardown.","serves":["DCSN1","DCSN2","DCSN3","DCSN4"],"state":"keep","build":"done","result":"ResearchArchive-test deployed from main and every spec check passed after fixes #14 (f1bea57) and #15 (2d8ac81); destroyed cleanly, nothing left in the account","build_at":"2026-11-13T21:13:03.684793-06:00"}],"approved":{"hash":"73556a3c44e81618d678d419dcbf3cf97cdc4a37bf200165dbf8c8dfd97666a2","at":"2026-11-13T16:31:09.112828-06:00","body":"# PLAN3: Reindex and the test deploy\n\n## Spec\n\n`docs/specs/2026-11-13-archive-infrastructure-cdk-construct/spec.md`, sections \"Reindex\", \"Risk and cost\" and \"How we'll know it works\". PLAN1 (research-in-a-box#10) and PLAN2 (research-in-a-box#12) are built and merged. Build on their code: `ResearchArchive`, `pythonFunction`, `catalogTables` with `activeCatalogParameter`, `derivedBucket`, `archiveBucket` and `alertTopic`. The implementer reads the spec beside this plan.\n\n## The change\n\nThe reindex is a Python durable function in the construct. It:\n\n1. Empties the inactive catalog table.\n2. Turns every published manifest in the archive bucket into line-delimited DynamoDB JSON under the derived bucket's `reindex/\u003crun\u003e/`.\n3. Bulk-loads that into the inactive table and waits for the load to end.\n4. Flips the active-catalog parameter only when the load ends `COMPLETED`.\n\nAn admin starts it with `just reindex \u003cstage\u003e` and follows it with `just reindex-status \u003cstage\u003e`. Then one test deploy, a stage named `test` in your AWS account, walks every check in the spec's \"How we'll know it works\" and is destroyed.\n\n**Risk:**\n\n- Tasks 1 and 2 are local code and CI; a mistake is undone by reverting the PR.\n- Task 3 creates real resources in one AWS account you choose, under a non-prod stage, so every bucket, table and user pool deletes with the stack. A mistake there costs a few dollars at most, and `cdk destroy` undoes it.\n- Nothing touches a prod stage; none exists.\n\n**Cost:**\n\n- One walkthrough step for you (STEP1). You name the AWS profile and alert address, approve the deploy, confirm the alert email subscription, sign up once in the browser and paste back one URL, then approve the teardown.\n- New dependency: `aws-durable-execution-sdk-python==3.0.2` in `archive-backend`.\n- No new programs on your machine; the AWS CLI is already installed.\n\n## Left out\n\n- Projects in the catalog. Where a project record lives in the archive bucket is Plan 7's to decide, so reindex loads datasets, versions and files only (follow-up PARK6).\n- Catching up packages published during a reindex (follow-up PARK5).\n- Reindex from `cruise` (follow-up PARK1).\n- A prod deploy, a CI deploy and the deployment skill (Plan 10a).\n- Testing write-once locking and WAF on the test deploy. Both stay synth-tested; locked objects can't be removed by a clean teardown, and WAF needs no outside credentials to synth.\n\n## Where\n\n- Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-archive-in-a-box/plan4/reindex-and-test-deploy`, branch `plan4/reindex-and-test-deploy` from `origin/main`. Confirm with `git -C \u003cwt\u003e branch --show-current` before editing.\n- Python: `packages/backend/pyproject.toml`, `uv.lock`, `packages/backend/src/archive_backend/reindex.py`, `packages/backend/tests/test_reindex.py`.\n- TypeScript: `packages/infra/src/python-function.ts`, `packages/infra/src/reindex.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/bin/app.ts`, `packages/infra/vitest.config.ts`, `packages/infra/test/reindex.test.ts`, `packages/infra/test/app.test.ts`.\n- `justfile`, `docs/planning-handoff.md` (decision log).\n- Global constraints:\n  - Lambdas are Python 3.13 on arm64; `just check` must exit 0.\n  - Nothing reaches AWS in Tasks 1 and 2.\n  - Task 3 runs only with your Go on STEP1, under the profile you name, never against a stage named `prod`.\n  - On any AWS auth error, stop and report; never copy or export credentials.\n\n### Task 1: The reindex function\n\n**Does:** Adds `archive_backend.reindex`. Plain functions turn manifests into DynamoDB JSON lines; a durable handler runs the empty, write, load, wait and flip as checkpointed steps and alerts on a bad outcome. All of it is unit-tested with fakes.\n**Files:** `packages/backend/pyproject.toml`, `uv.lock`, `packages/backend/src/archive_backend/reindex.py`, `packages/backend/tests/test_reindex.py`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0.\n**Serves:** DCSN1, DCSN3 (rests on calls AGNT8, AGNT10)\n\nAdd `aws-durable-execution-sdk-python==3.0.2` to `archive-backend` and run `uv lock`. The package needs `boto3\u003e=1.43.114`; the lock has 1.44.3.\n\nArchive layout, from the decision log: a published version sits at `\u003copen|restricted\u003e/\u003cdatasetId\u003e/\u003cversion\u003e/` with `datapackage.json` at its root.\n\nCatalog items (catalog keys from the spec; attributes beyond the keys are Plan 4's first cut, which Plan 6 may extend). Every value is a DynamoDB JSON string unless noted.\n\n- **Dataset:** `PK=DATASET#\u003cid\u003e`, `SK=META`, `id`, `title`, `access` (from `archive:access`, default `open`), `currentVersion` (number, the highest version found), `prefix` (`open` or `restricted`, of the current version). When `archive:project` is set: `project`, `GSI1PK=PROJECT#\u003cproject\u003e` and `GSI1SK=DATASET#\u003cid\u003e`.\n- **Version:** `PK=DATASET#\u003cid\u003e`, `SK=V#\u003cversion zero-padded to 6\u003e`, `version` (number), `prefix`, `manifest` (the `datapackage.json` text as one string).\n- **File:** `PK=DATASET#\u003cid\u003e`, `SK=V#\u003cversion padded\u003e#FILE#\u003cpath\u003e`, `path`, `name` (resource name), and `format`, `bytes` (number) and `hash` when the resource has them. One item per resource `path`, plus one per member of `archive:files` when a resource lists them.\n\nFunctions:\n\n- `catalog_items(prefix: str, dataset_id: str, version: int, manifest_text: str) -\u003e list[dict[str, Any]]`: the version item and its file items, as DynamoDB JSON maps (`{\"S\": ...}`, `{\"N\": ...}`).\n- `dataset_item(versions: list[tuple[str, int, dict[str, Any]]]) -\u003e dict[str, Any]`: given `(prefix, version, manifest)` for every version of one dataset, the dataset item for the highest version.\n- `to_lines(items: list[dict[str, Any]]) -\u003e str`: one `{\"Item\": {...}}` per line, newline-terminated, the bulk put items input format.\n- `manifest_keys(s3, bucket: str) -\u003e list[str]`: every key ending `/datapackage.json` exactly three segments under `open/` or `restricted/`, sorted.\n\n`@durable_execution def handler(event: dict[str, Any], context: DurableContext) -\u003e dict[str, Any]` reads `ARCHIVE_BUCKET`, `DERIVED_BUCKET`, `CATALOG_TABLE_A`, `CATALOG_TABLE_B`, `ACTIVE_CATALOG_PARAMETER` and `ALERT_TOPIC_ARN`. It does only these, each as a named `context.step`:\n\n1. `start`: return `{\"run\": \u003cUTC timestamp YYYYMMDDTHHMMSSZ\u003e, \"active\": \u003cparameter value\u003e}`. The target is the other table (`A` loads `B`, and back).\n2. `empty`, repeated: each step scans one page of the target table (projection `PK, SK`), deletes it with `batch_write_item` in groups of 25, retrying unprocessed items, and returns the `LastEvaluatedKey` (or `None` when done).\n3. `list`: return `manifest_keys`.\n4. `write-\u003cn\u003e`: for each batch of 200 keys, read the manifests, write `reindex/\u003crun\u003e/data/part-\u003cn:05d\u003e.json` with `to_lines`, and return the item count. Group keys by dataset id first, so a dataset's item is written in the batch holding its versions; a batch boundary never splits a dataset.\n5. `load`: `start_bulk_put_items` into the target table with input `{S3Bucket: DERIVED_BUCKET, S3KeyPrefix: \"reindex/\u003crun\u003e/data/\", InputFormat: \"DYNAMODB_JSON\"}`, output `{S3Bucket: DERIVED_BUCKET, S3KeyPrefix: \"reindex/\u003crun\u003e/report/\", OutputType: [\"ERROR\"]}`, `PerformanceTier: \"STANDARD\"` and `ClientToken` = the run. Return the operation ARN. With no manifests, skip the load and treat it as `COMPLETED`.\n6. `wait_for_condition` named `wait-load`: the check describes the operation and returns `{\"status\", \"processed\", \"failed\"}`. The strategy stops once the status is not `IN_PROGRESS` or `CANCELLING`, else waits `min(30 * attempt, 300)` seconds.\n7. On `COMPLETED`, a step `flip` writes the target letter to the parameter (overwrite). On anything else, a step `alert` publishes `Reindex \u003crun\u003e on \u003ctarget\u003e ended \u003cstatus\u003e` with the report prefix to the alert topic, and the parameter is left alone.\n8. Return `{\"run\", \"target\", \"status\", \"items\", \"flipped\": bool}`.\n\nTests use fake S3, DynamoDB, SSM and SNS clients and a `FakeContext` whose `step(func, name)` calls `func(None)` and whose `wait_for_condition` loops the check until the strategy stops, recording each step name. The handler takes its clients from a module function `clients()` that the tests monkeypatch.\n\n- `test_catalog_items_for_the_sample_package`: `examples/sample-package/datapackage.json` as version 1 under `open` yields one version item with the manifest text, and one file item per resource path and per `archive:files` member, each with its `format`, `bytes` and `hash` where present.\n- `test_dataset_item_takes_the_highest_version_and_its_prefix`: versions 1 (`open`) and 2 (`restricted`) give `currentVersion` 2 and `prefix` `restricted`.\n- `test_dataset_item_has_gsi1_only_with_a_project`.\n- `test_to_lines_is_one_item_per_line`: each line parses as `{\"Item\": {...}}`.\n- `test_manifest_keys_skips_nested_and_other_prefixes`: `open/a/1/datapackage.json` is kept; `open/a/1/docs/datapackage.json` and `staging/a/1/datapackage.json` are not.\n- `test_reindex_loads_the_inactive_table_and_flips_on_completed`: active `A`, the load targets table B, and the parameter ends `B`.\n- `test_reindex_empties_the_target_before_loading`: target items present before the run are deleted, and `empty` runs before `load`.\n- `test_reindex_does_not_flip_and_alerts_on_completed_with_errors`: also for `FAILED`.\n- `test_reindex_with_no_packages_flips_to_an_empty_table`.\n\nCommit: `Add the reindex durable function`\n\n### Task 2: The reindex in the construct, the just recipes and a test-stage config\n\n**Does:** Adds the reindex as a durable function with a `live` alias, its permissions and a stack output. Adds `just reindex` and `just reindex-status`. Lets the default app read another config file through `ARCHIVE_CONFIG`, raises the infra test timeout, and records the reindex facts in the decision log.\n**Files:** `packages/infra/src/python-function.ts`, `packages/infra/src/reindex.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/bin/app.ts`, `packages/infra/vitest.config.ts`, `packages/infra/test/reindex.test.ts`, `packages/infra/test/app.test.ts`, `justfile`, `docs/planning-handoff.md`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0; `npx cdk synth -q` in `packages/infra` exits 0.\n**Serves:** DCSN3 (rests on calls AGNT8, AGNT10)\n\n- `PythonFunctionProps` gains `readonly durableConfig?: lambda.DurableConfig`, passed through. Plan 7's durable functions use the same helper.\n- `reindex.ts`: `class Reindex extends Construct`, props `{ archive: ResearchArchive }`:\n  - The function comes from `archive.pythonFunction(\"ReindexFunction\", { handler: \"archive_backend.reindex.handler\", timeout: Duration.minutes(15), memorySize: 1024, durableConfig: { executionTimeout: Duration.hours(12), retentionPeriod: Duration.days(30) }, environment: {...} })`. The environment holds the six names Task 1 reads.\n  - `readonly alias = new lambda.Alias(this, \"Live\", { aliasName: \"live\", version: fn.currentVersion })`. Durable functions are invoked only through a version or alias.\n  - Grants:\n    - read on the archive bucket;\n    - read and write on the derived bucket's `reindex/*`;\n    - read and write data on both catalog tables;\n    - read and write on the active-catalog parameter;\n    - publish on the alert topic;\n    - `dynamodb:StartBulkOperation` on `*` (account-scoped, per AWS);\n    - `dynamodb:BulkPutItems` and `dynamodb:DescribeBulkOperation` on both catalog table ARNs and `\u003ctable ARN\u003e/bulk-operation/*`.\n\n    Task 3's deploy proves these grants against the real service; if an action name differs, Task 3 fixes it with the error text as its evidence.\n  - `new CfnOutput(Stack.of(this), \"ReindexFunction\", { key: \"ReindexFunction\", value: alias.functionArn })`.\n- `ResearchArchive` creates `Reindex` last and exposes `reindexFunction` (the alias).\n- `bin/app.ts`: the config path is `process.env.ARCHIVE_CONFIG ?? \u003crepo root\u003e/archive.yaml`, so a test stage needs no edit to `archive.yaml`.\n- `vitest.config.ts` in `packages/infra`: `testTimeout: 30_000`. On research-in-a-box#12's CI run, the infra test files took 3.7 to 7.0 seconds each against a 5-second per-test default.\n- `justfile`:\n  - `reindex stage`: reads the `ReindexFunction` output of `ResearchArchive-\u003cstage\u003e` with `aws cloudformation describe-stacks`, then `aws lambda invoke --invocation-type Event --function-name \u003calias ARN\u003e --payload '{}' --cli-binary-format raw-in-base64-out /dev/null`. It prints `reindex started on \u003cstage\u003e; follow it with just reindex-status \u003cstage\u003e`.\n  - `reindex-status stage`: `aws lambda list-durable-executions-by-function --function-name \u003calias ARN\u003e --max-items 1`, then `aws lambda get-durable-execution` on its ARN, printing the status and the result.\n  - Both use the caller's `AWS_PROFILE` and region as set in their shell.\n- Decision log (today's date), added to `docs/planning-handoff.md`:\n  - Plans 4, 6 and 7: catalog items as listed in Task 1.\n  - Plans 4 and 7: reindex loads datasets, versions and files from manifests only; projects join once Plan 7 decides where project records live in the archive bucket.\n  - Plans 4, 7 and 10a: `pythonFunction` takes `durableConfig`; durable functions are invoked through a `live` alias, never unqualified. `ARCHIVE_CONFIG` points the default app at another config file.\n\nTests in `test/reindex.test.ts` (with `testApp()`):\n\n- `the reindex function is durable with a 12-hour execution timeout`.\n- `it is invoked through a live alias, which the ReindexFunction output names`.\n- `it may start bulk operations and bulk-load both catalog tables`.\n- `its environment names both catalog tables, the active-catalog parameter, both buckets and the alert topic`.\n\nIn `test/app.test.ts`: `ARCHIVE_CONFIG points the default app at another config file` (a temp file with stage `test` gives stack `ResearchArchive-test`).\n\nCommit: `Add the reindex to the construct with its just recipes`\n\nAfter Task 2's commit, the implementer stops. The Plan 4 planning session runs the final review, pushes, opens the PR and merges it once CI passes, before Task 3.\n\n### Task 3: The test deploy\n\n**Does:** Deploys a `test` stage from main to your AWS account and walks every check in the spec's \"How we'll know it works\" against it. Fixes what the live run shows, then destroys the stack. This is one walkthrough step for you, STEP1, with the agent's actions between yours.\n**Files:** a test config at `~/.local/state/plans/plan4-3-reindex-and-test-deploy/test.yaml`, outside the repo. Repo files change only if a check fails, through a fix PR.\n**Checks:** each walkthrough action records its result. `cdk destroy` exits 0, and `aws cloudformation describe-stacks --stack-name ResearchArchive-test` then reports that the stack does not exist.\n**Serves:** DCSN1, DCSN2, DCSN3, DCSN4 (rests on calls AGNT8, AGNT10)\n\nThe test config is `archive.yaml`'s catalog settings, with `infrastructure.alertEmail` set to the address you give, `stages: [{name: test, account: \u003cyour account id\u003e, region: \u003cregion\u003e}]`, and no modules.\n\nSTEP1's actions, in order:\n\n1. You: name the AWS profile and the alert address (Ready).\n2. Agent: `aws sts get-caller-identity` under that profile, then `cdk bootstrap` if the account and region have no `CDKToolkit` stack. STEP1's how says that a bootstrap leaves the `CDKToolkit` stack and its bucket in the account after the teardown, which is normal and shared by any CDK app there.\n3. You: Go for the deploy.\n4. Agent: `just lambda-assets`, then `ARCHIVE_CONFIG=\u003ctest.yaml\u003e npx cdk deploy ResearchArchive-test --require-approval never`.\n5. You: confirm the SNS subscription email (Done).\n6. Agent:\n   - `curl` of `https://\u003cdistribution\u003e/api/health` returns 200 with `{\"status\": \"ok\"}`.\n   - A burst of 400 concurrent requests shows at least one 429.\n   - An object put with `aws s3 cp --checksum-algorithm SHA256` under `open/sample/1/` downloads from `/data/sample/1/...` with the same bytes.\n   - A put under `restricted/` returns 403 from `/data/...`.\n7. You: open the authorize URL the agent gives, for the `cli` client with a PKCE challenge. Sign up with email, then paste back the `http://localhost:8765/callback?code=...` URL from the address bar. The page there won't load; that's expected.\n8. Agent: exchanges the code at `/oauth2/token`, and `curl` of `/api/whoami` with the ID token returns your email and `groups: []`.\n9. Agent:\n   - Uploads the sample package as `open/stream-temperature-sample/1/`, and a copy with a second id as `open/second-sample/1/`, every object with `--checksum-algorithm SHA256`.\n   - Runs `just reindex test`, then `just reindex-status test` until it ends.\n   - Expects `COMPLETED`, the active-catalog parameter flipped to `B`, and two dataset items in catalog table B.\n10. Agent:\n    - Invokes the integrity function by hand: `problems: 0`.\n    - Overwrites one archived file with different bytes and invokes it again: one `mismatch`, and the alert email arrives.\n11. You: Go for the teardown.\n12. Agent: `ARCHIVE_CONFIG=\u003ctest.yaml\u003e npx cdk destroy ResearchArchive-test --force`, then confirms the stack, its buckets and its tables are gone.\n\nA failing check stops the walk. The fix is a new commit on a branch, with a test that reproduces it where one can, merged by PR. Then the agent redeploys and repeats that action.\n"}}],"signoff":{"due_at":"2026-11-13T21:13:03.684793-06:00"},"messages":[{"id":1,"card":"plan","from":"user","action":"start-planning","at":"2026-11-13T12:17:25.28248-06:00","state":"answered","claim":"e17597c0524f8426"},{"id":2,"card":"DIRN","from":"user","action":"direction","at":"2026-11-13T12:25:03.027443-06:00","state":"answered","claim":"9801c8162c6cac06"},{"id":3,"card":"UNDR","from":"user","action":"confirm","at":"2026-11-13T12:35:27.766333-06:00","state":"answered","claim":"db19bb80d0e855e6"},{"id":4,"card":"DCSN1","from":"user","action":"note","text":"More IAM grants, more alarms, more names for every Lambda, \n\nThese are not really a big deal with CDK.   is there any other reason to not do C?","at":"2026-11-13T12:36:44.975632-06:00","state":"answered","claim":"b96db73c3bde3852"},{"id":5,"card":"DCSN1","from":"agent","action":"reply","text":"You're right: grants, alarms and names cost nothing real in CDK, and my other point against C was wrong too. The one-operation limit is per table, so separate tables can load in parallel. One real reason remains, and it only applies to the catalog. Reindex builds fresh tables and switches the API to them. If datasets, versions, projects and files sit in four tables, that switch has to happen across four tables at once, or the API can briefly pair new datasets with old projects. Operational records (submissions, reviews, settings, profiles, download counts) are never rebuilt, so that reason doesn't touch them, and one table per kind reads more plainly for a Python-first team than an overloaded single-table design. I added that mix as option D and now recommend it over B.","at":"2026-11-13T12:37:14.172153-06:00","answers":[4]},{"id":6,"card":"DCSN1","from":"user","action":"choose","option":"D","at":"2026-11-13T15:02:34.228887-06:00","state":"answered","claim":"875c5b1abb5b92c9"},{"id":7,"card":"DCSN2","from":"user","action":"choose","option":"A","at":"2026-11-13T15:05:17.720583-06:00","state":"answered","claim":"b633f1c912a045d1"},{"id":8,"card":"DCSN3","from":"user","action":"choose","option":"A","text":"can we also have a way to trigger that lambda?  maybe from cli?","at":"2026-11-13T15:07:13.400989-06:00","state":"answered","claim":"b8364cdba20706b9"},{"id":9,"card":"DCSN3","from":"agent","action":"reply","text":"Yes. Plan 4 ships a CLI trigger: `just reindex \u003cstage\u003e` starts the function with the admin's AWS credentials (the same ones they deploy with). It prints the execution so you can follow it, and `just reindex-status \u003cstage\u003e` shows where the run stands and the bulk put outcome. The function's name comes from a stack output, so neither command needs editing in a fork. A `cruise` command that goes through the API with a signed-in admin's short-lived token would need an admin route, which is Plan 6's to build. I've recorded that as a follow-up rather than a task here (AGNT8, PARK1).","at":"2026-11-13T15:07:25.083592-06:00","answers":[8]},{"id":10,"card":"DCSN4","from":"user","action":"choose","option":"C","at":"2026-11-13T15:09:05.132613-06:00","state":"answered","claim":"3872fbd50bcfed0b"},{"id":11,"card":"UNDR","from":"user","action":"confirm","at":"2026-11-13T15:10:31.833592-06:00","state":"answered","claim":"7c612f6b472eb4bd"},{"id":12,"card":"plan","from":"session","action":"note","text":"From the coordinating session for research-in-a-box. Court asked that every planning session know this. Muster alias: personal-personal/generic-package-format-and-contract (the name is left over from Plan 2; this session now coordinates all the plans).\n\n1. Send cross-plan questions here first: anything that touches another plan's interface, ownership or order, or the overall direction. Ask over muster or with diazo_note to this alias. Questions only Court can answer still go on your own page as decision cards.\n2. Send a one-line muster message here when your understanding is confirmed, your spec is printed, each plan is printed, and the build is done. I check each spec and plan for scope before Court approves it.\n3. Record anything other plans rely on in the Decision log of docs/planning-handoff.md.\n4. Keep it small. Plans 1 and 2 are built: the repo, the uv and npm workspaces, archive_contract, the exports and the sample package. Build on them and don't rebuild. Plan only what your brief needs to work end to end now, and put everything else in follow-ups. Size checks to the risk. Question every option, config field and fallback that no real case needs yet.\n5. FEMC is the test afterwards, never the source of the design (Plan 2's PRIN1).","at":"2026-11-13T15:11:09.001364-06:00","state":"answered","claim":"5246857942777e58","sender":{"project":"personal"}},{"id":13,"card":"UNDR","from":"agent","action":"reply","text":"Thanks. The spec is written from this understanding and printed for your approval.","at":"2026-11-13T15:12:07.500175-06:00","answers":[11]},{"id":14,"card":"spec","from":"user","action":"approve-spec","at":"2026-11-13T15:19:14.928701-06:00","state":"answered","claim":"6747bc0f1d552338"},{"id":15,"card":"PLAN1","from":"user","action":"approve-plan","at":"2026-11-13T15:39:26.189965-06:00","state":"answered","claim":"8a776ba39cb5223a"},{"id":16,"card":"PLAN2","from":"user","action":"approve-plan","at":"2026-11-13T16:00:56.021094-06:00","state":"answered","claim":"155933ba8433e9ad"},{"id":17,"card":"PLAN3","from":"user","action":"approve-plan","at":"2026-11-13T16:31:09.112828-06:00","state":"answered","claim":"132207de13339506"},{"id":18,"card":"STEP1","from":"user","action":"answer","option":"A1","answer":"READY","at":"2026-11-13T16:33:52.389775-06:00","state":"answered","claim":"98294891b5a56590"},{"id":19,"card":"STEP1","from":"user","action":"tick","option":"A1B","text":"personal court@subaud.io","at":"2026-11-13T16:35:17.592109-06:00","state":"answered","claim":"958da9b220f1e723"},{"id":20,"card":"STEP1","from":"user","action":"answer","option":"A3","answer":"GO","at":"2026-11-13T16:58:30.580978-06:00","state":"answered","claim":"6741de00b3e83bb4"},{"id":21,"card":"STEP1","from":"user","action":"tick","option":"A5","at":"2026-11-13T17:16:03.017926-06:00","state":"answered","claim":"25367ef8d04fd7dd"},{"id":22,"card":"STEP1","from":"user","action":"note","at":"2026-11-13T17:17:04.223974-06:00","state":"answered","claim":"bb8 eta":"built"},{"id":"PLAN2","text":"Auth, API, web and operations","meta":"built"},{"id":"PLAN3","text":"Reindex and the test deploy","meta":"built"}]}},{"key":"build","state":"done"},{"key":"signoff","state":"now","words":"due"}],"plan_reason":{"PLAN1":{"state":"built","done":4,"total":4,"words":"built"},"PLAN2":{"state":"built","done":4,"total":4,"words":"built"},"PLAN3":{"state":"built","done":3,"total":3,"words":"built"}},"plan_title":{"PLAN1":"Config, storage and tables","PLAN2":"Auth, API, web and operations","PLAN3":"Reindex and the test deploy"},"running":[],"build_done":11,"build_total":11,"build_line":"built · 11 of 11 done","builds":[{"id":"BUILD1","plan":"PLAN1"},{"id":"BUILD2","plan":"PLAN2"},{"id":"BUILD3","plan":"PLAN3"}],"no_who":[],"questions":[],"stalls":[],"wrap_up":"","signoff":"due","completed":false},"files":[{"path":"decisions.json","mtime":0},{"path":"diagrams/2e48eb3664eb.svg","mtime":0},{"path":"diagrams/8d2b06f20625.svg","mtime":0},{"path":"plans/1-config-storage-and-tables.md","mtime":0},{"path":"plans/2-auth-api-web-and-operations.md","mtime":0},{"path":"plans/3-reindex-and-test-deploy.md","mtime":0},{"path":"screenshots/shot-0bd1f5a6e2eb.png","mtime":0},{"path":"screenshots/shot-a211e5e4829a.png","mtime":0},{"path":"spec.md","mtime":0}],"names":{"README.md":"2026-11-13-archive-infrastructure-cdk-construct.md","decisions.md":"2026-11-13-archive-infrastructure-cdk-construct-decisions.md","plans/1-config-storage-and-tables.md":"2026-11-13-archive-infrastructure-cdk-construct-plan-1-config-storage-and-tables.md","plans/2-auth-api-web-and-operations.md":"2026-11-13-archive-infrastructure-cdk-construct-plan-2-auth-api-web-and-operations.md","plans/3-reindex-and-test-deploy.md":"2026-11-13-archive-infrastructure-cdk-construct-plan-3-reindex-and-test-deploy.md","record.html":"2026-11-13-archive-infrastructure-cdk-construct.html","spec.md":"2026-11-13-archive-infrastructure-cdk-construct-spec.md","wrap-up.md":"2026-11-13-archive-infrastructure-cdk-construct-wrap-up.md"}},"spec":"---\ndiazo: research-archive-in-a-box/archive-infrastructure-cdk-construct\nfile: spec\nstatus: approved\napproved: 2026-11-13T15:19:14-06:00\nhash: de41c8857102eaeb274f947a3d56ff42e857da3dbbebe6ca0fd1a5f12d2b945e\nrests_on: [DCSN2, AGNT1, AGNT7, DCSN1, AGNT3, AGNT4, AGNT5, AGNT12, DCSN3, AGNT8, AGNT10, AGNT2, AGNT6, AGNT11, DCSN4, AGNT9]\nrecord: README.md\n---\n\n# Archive infrastructure: the ResearchArchive CDK construct\n\n## Goal\n\nRunning `cdk deploy` on the default app stands up an empty, working research archive in the adopter's own AWS account: storage, the DynamoDB tables, sign-in, an API shell, web hosting with direct downloads for open data, operations defaults and the reindex path. It is one public `ResearchArchive` construct in `packages/infra`, built from internal parts and driven by the one archive config file, so a fork edits only that file. The construct exposes its tables, buckets, user pool and API so Plan 6's endpoints and Plan 7's durable function attach without editing Plan 4's code. The service choices under \"Infrastructure\" in the handoff are taken as settled.\n\n## The parts\n\nThe construct is made of seven internal parts. Each is a plain construct in `packages/infra/src/`, and only `ResearchArchive` is exported.\n\n```mermaid\nflowchart LR\n  cfg[archive.yaml] --\u003e app[default app]\n  app --\u003e RA\n  subgraph RA[ResearchArchive, one per stage]\n    S[Storage]\n    T[Tables]\n    A[Auth]\n    API[API shell]\n    W[Web]\n    O[Operations]\n    J[Jobs: reindex, integrity check]\n  end\n  P6[Plan 6 endpoints] -.attach to.-\u003e API\n  P7[Plan 7 durable function] -.uses.-\u003e S\n  P7 -.writes.-\u003e T\n```\n\n| Part | What it creates |\n| --- | --- |\n| Storage | Staging, archive and derived buckets |\n| Tables | Two catalog tables (A and B), five operational tables, the active-catalog parameter |\n| Auth | Cognito user pool with email sign-in, groups, app clients |\n| API shell | REST API, Cognito authorizer, throttling, one health route, optional regional WAF |\n| Web | CloudFront distribution over the site, open data and the API |\n| Operations | Budget alarm, alert topic, failure alarms, dashboard |\n| Jobs | Reindex durable function, weekly integrity check |\n\nTwo optional modules, WAF and write-once locking, are switched on in the config; the construct builds each one only when its switch is on. Later plans add their own modules the same way.\n\nRests on: DCSN2, AGNT1\n\n## Storage\n\n- **Staging bucket.** Uploads land here before ingest (Plan 7). Not versioned; objects expire after 30 days.\n- **Archive bucket.** Complete published packages, the source of truth. Versioning on. Two prefixes: `open/` for open data, served straight from CloudFront, and `restricted/` for restricted and by-request data, reached only through a short-lived link from the API. Objects are written with S3 SHA-256 checksums. Write-once locking (S3 Object Lock in governance mode, with a retention period from the config) is optional.\n- **Derived bucket.** Everything rebuildable: `site/` (the web app bundle, the per-dataset HTML pages and the catalog file), `reindex/` (bulk put input and reports) and `logs/` (CloudFront standard logs).\n- All buckets block public access, enforce TLS and use S3-managed encryption. CloudFront reads through origin access control.\n- **Integrity check.** A weekly EventBridge Scheduler job runs a Lambda that compares each archived object's stored SHA-256 checksum with the package's `checksums.sha256` and sends an alert for any mismatch or missing object.\n\nRests on: AGNT7\n\n## Tables\n\nAll tables are on-demand. Catalog records are rebuildable from S3; operational records exist nowhere else.\n\n**Catalog tables (A and B).** One single-table design, created twice. Keys are `PK` and `SK`, plus one index `GSI1` (`GSI1PK`, `GSI1SK`).\n\n| Item | PK | SK | GSI1 |\n| --- | --- | --- | --- |\n| Dataset (current state) | `DATASET#\u003cid\u003e` | `META` | `PROJECT#\u003cproject\u003e` / `DATASET#\u003cid\u003e` |\n| Dataset version | `DATASET#\u003cid\u003e` | `V#\u003cversion, zero-padded to 6\u003e` | |\n| File of a version | `DATASET#\u003cid\u003e` | `V#\u003cversion\u003e#FILE#\u003cpath\u003e` | |\n| Project | `PROJECT#\u003cid\u003e` | `META` | |\n\nThe dataset item carries the current version, title, access level, theme and project. Plan 6 adds the vector index to both catalog tables, with the embedding model it chooses, and any further indexes its endpoints need; both catalog tables are on-demand, as a vector index requires.\n\n**Operational tables.** One plain table per kind of record, each with point-in-time recovery.\n\n| Table | Key | Index |\n| --- | --- | --- |\n| Submissions | `submissionId` | by `status` and `createdAt` (the curator queue); by `submitter` |\n| Reviews | `submissionId`, `at#\u003ceventId\u003e` | |\n| Settings | `name` | |\n| UserProfiles | `userId` (Cognito sub) | |\n| DownloadCounts | `datasetId`, `month` | |\n\nUsers and their roles live in Cognito; UserProfiles keeps only what Cognito can't hold (display name for citations, ORCID iD, notification settings). Plan 7 decides what goes in a review event, and Plan 6 what a setting holds; Plan 4 creates the tables and their keys.\n\nRests on: DCSN1, AGNT3, AGNT4, AGNT5, AGNT12\n\n## Reindex\n\nThe catalog switch: an SSM parameter per stage, `/research-archive/\u003cstage\u003e/catalog-active`, names the active catalog table, `A` or `B`. Every Lambda reads it, cached for a minute.\n\nThe reindex is a Python durable function:\n\n1. Empty the inactive catalog table.\n2. In steps of a few hundred packages, read each published manifest from the archive bucket and write line-delimited DynamoDB JSON to `reindex/\u003crun\u003e/` in the derived bucket.\n3. Start a bulk put items operation into the inactive table, with the report to `reindex/\u003crun\u003e/report/`.\n4. Wait, polling the operation, until it ends. On `FAILED` or `CANCELLED`, stop and alert; the active table is untouched.\n5. On `COMPLETED_WITH_ERRORS`, stop and alert with the report's location, leaving the active table in place.\n6. Flip the parameter to the newly loaded table.\n\nA reindex is run while publishing is quiet: a package published during the run would be missing from the new table until the next reindex (follow-up PARK5).\n\nAn admin starts it with `just reindex \u003cstage\u003e`, which invokes the function asynchronously with their AWS credentials and prints the execution ARN, and follows it with `just reindex-status \u003cstage\u003e`. The function name comes from a stack output.\n\nRests on: DCSN1, DCSN3, AGNT8, AGNT10\n\n## Config and the construct's interface\n\nThe infrastructure settings join the one archive config as an `infrastructure` section of the Pydantic `ArchiveConfig`:\n\n```yaml\ninfrastructure:\n  stages:\n    - name: prod            # account and region optional\n  alertEmail: data@example.edu\n  monthlyBudgetUsd: 50\n  modules:\n    waf: true                             # optional\n    objectLock: { retentionDays: 3650 }   # optional\n```\n\nThe contract's generated JSON Schema also generates the construct's TypeScript props type, `ArchiveConfig`, committed beside the web schema and covered by the same drift check in CI. `ResearchArchive` takes `{ config: ArchiveConfig, stage: string }` and plain props, so it can be used without a file. The default app reads `archive.yaml`, validates it against the schema, and makes one stack per stage.\n\nThe construct exposes, as read-only properties: `stagingBucket`, `archiveBucket`, `derivedBucket`, `catalogTables` with `activeCatalogParameter`, `submissions`, `reviews`, `settings`, `userProfiles`, `downloadCounts`, `userPool`, `api` with its authorizer, `distribution`, `alertTopic`, and one method, `pythonFunction(id, props)`, that builds a Python Lambda from `archive-backend` the same way Plan 4's own functions are built, with the alert alarm wired. Plans 6 and 7 attach through these.\n\nRests on: DCSN2, AGNT1\n\n## Python Lambdas\n\nEvery Python function runs on arm64 with Python 3.13. A just recipe, `just lambda-assets`, uses uv to install `archive-backend` and its locked dependencies as manylinux aarch64 wheels, binary-only, into `packages/infra/assets/python/`, which `pythonFunction` packages. No Docker. The synth tests use the same recipe, so a dependency with no aarch64 wheel fails CI, not a deploy.\n\nRests on: AGNT2\n\n## Auth\n\n- A Cognito user pool with email sign-in and self-service sign-up. Groups: `contributor`, `curator`, `admin`. Roles reach the API in the token, so the authorizer needs no table read.\n- Two app clients, both with authorization code and PKCE and no client secret: one for the web app, one for the CLI and MCP server, which sign in through the browser and hold short-lived tokens only.\n- Cognito's managed login on a Cognito domain.\n- Open data needs no account.\n\nRests on: AGNT5\n\n## API shell and web\n\n- **API.** A REST API with stage throttling (rate and burst from the config, with defaults), a Cognito authorizer, and one route, `GET /health`, backed by a Python function from `pythonFunction`. Optional regional WAF with AWS managed rule groups, attached to the API stage.\n- **CloudFront.** One distribution. Default behaviour: the derived bucket's `site/` prefix, with unknown paths falling back to the app's `index.html`. `/data/*`: the archive bucket's `open/` prefix, at stable URLs. `/api/*`: the REST API, uncached, so the app calls the API on its own origin. Standard logs to the derived bucket's `logs/`.\n- **Download logs.** CloudFront's standard logs are the only record of an open download, so they are on from the first deploy. Plan 6 rolls them up into DownloadCounts and counts restricted downloads when the API issues the link.\n\nRests on: AGNT6, AGNT11\n\n## Operations and stages\n\n- **Operations in every deploy.** An AWS Budgets monthly budget with an email alert at 80 and 100 percent; an SNS alert topic subscribed to the config's alert email; alarms on Lambda errors, durable execution failures, API 5xx and throttles, and the integrity check; a CloudWatch dashboard with the API, Lambdas, tables and CloudFront.\n- **Stages.** One stage, `prod`, by default. Each entry in `stages` makes a stack, `ResearchArchive-\u003cstage\u003e`, with its own buckets, tables and user pool, optionally in its own account and region. The `prod` stage keeps its data on delete (retained buckets and tables, deletion protection); any other stage is set to be torn down cleanly. Every stack carries the `Repo` tag.\n\nRests on: DCSN4, AGNT9\n\n## Risk and cost\n\n- **Risk.** A mistake in a deployed `prod` stage could delete archived packages or the operational tables. Nothing is deployed yet and there are no users, so the construct is changed directly. Retained buckets and tables, deletion protection, bucket versioning and point-in-time recovery on the operational tables make a bad change recoverable. A reindex never touches the active catalog until its load has completed cleanly.\n- **Cost.** One test deploy to an AWS account you choose, and its teardown, each a step for you on the page. No new programs on your machine: uv, npm, just and the AWS CLI are already used. The test deploy's running cost is a few dollars at most while it exists.\n\nRests on: DCSN4, AGNT10, AGNT12\n\n## Left out\n\n- API endpoints, the catalog file's contents and search (Plan 6).\n- The ingest pipeline, review workflow, publish steps, by-request workflow and DOIs, including the DOI config setting (Plan 7).\n- Rolling CloudFront logs up into download counts, and counting restricted downloads (Plan 6).\n- A custom domain (follow-up PARK2); the archive runs on its CloudFront domain, which is a stable URL.\n- The deployment skill and the CI deploy workflows with OIDC (Plan 10a).\n- The vector index, the embeddings config setting and choosing the embedding model (Plan 6).\n- ORCID and university sign-in (follow-ups PARK3 and PARK4): nobody has an ORCID client or SAML metadata to test with yet, and email sign-in covers every case we have.\n- Reindex from `cruise` through an admin API route (follow-up PARK1, needs Plan 6).\n- A second-region copy (not offered, per the handoff) and a one-click template (deferred).\n- Composing the parts as separate exported constructs, for a later library release.\n\nRests on: DCSN3, AGNT1, AGNT3\n\n## How we'll know it works\n\n- `just check` passes, including vitest synth tests on the default app with the sample config: every resource in \"The parts\" is present; with both optional modules off, no WAF or Object Lock appears; with a second stage in the config, a second stack appears; the `prod` stage's buckets and tables are retained and a `dev` stage's are not.\n- The schema drift check fails when the Python `ArchiveConfig` changes and the generated TypeScript type is not regenerated.\n- On one test deploy in your AWS account: `GET /api/health` answers 200 through CloudFront and returns 429 when throttled; an email user signs up and signs in through managed login; a file put under `open/` downloads from `/data/...` on the CloudFront domain; `just reindex test` loads a two-dataset DynamoDB JSON file into the inactive catalog, `just reindex-status test` reports `COMPLETED`, and the active-catalog parameter has flipped; the integrity check run by hand reports no mismatch, then reports one after an object is overwritten.\n- The test deploy is destroyed cleanly afterwards.\n\nRests on: DCSN1, DCSN2, DCSN3, DCSN4, AGNT8, AGNT10\n","plans":{"PLAN1":"---\ndiazo: research-archive-in-a-box/archive-infrastructure-cdk-construct\nfile: PLAN1\nstatus: done\napproved: 2026-11-13T15:39:26-06:00\nhash: e3ea944d0007b976571def108ed82035055a9449669c44ee48a1a49cc4d3f2ff\nrests_on: [AGNT1, AGNT10, AGNT12, AGNT4, AGNT5, AGNT7, AGNT9, DCSN1, DCSN2, DCSN4]\nrecord: README.md\n---\n\n# PLAN1: Config, storage and tables\n\n## Spec\n\n`docs/specs/2026-11-13-archive-infrastructure-cdk-construct/spec.md`, sections \"The parts\", \"Storage\", \"Tables\", \"Config and the construct's interface\" and \"Operations and stages\" (the stages half). The implementer reads the spec beside this plan.\n\n## The change\n\nThe archive config gains an `infrastructure` section in the Python contract. Its JSON Schema generates the construct's TypeScript props type, under the existing drift check. The default app reads the committed `archive.yaml`, validates it, and makes one stack per stage. Each stack holds a `ResearchArchive` with its storage (staging, archive and derived buckets, optional write-once locking) and its tables (catalog A and B, the active-catalog parameter, five operational tables). It is proven by Python tests and vitest synth tests, with no deploy.\n\n**Risk:** local code and CI only; nothing reaches AWS in this plan. A mistake is undone by reverting the PR. The stage rules (prod retains its data) are pinned by tests now so the first deploy in PLAN3 inherits them.\n\n**Cost:** no steps for you. New npm dependencies in `packages/infra`: `yaml` and `ajv` (runtime of the default app) and `json-schema-to-typescript` (dev). No new programs.\n\n## Left out\n\n- Python Lambda packaging and `pythonFunction`, the health route, auth, the API, CloudFront, operations and the integrity check (PLAN2).\n- The reindex function and its just recipes, and the test deploy (PLAN3).\n- API throttling settings in the config: PLAN2 uses fixed defaults unless a real need appears.\n- Teardown of a non-prod stage with write-once locking on (locked objects can't be auto-deleted): follow-up if an adopter turns locking on in dev.\n\n## Where\n\n- Worktree: `/Users/courtschuett/GitHub/personal/.worktrees/research-archive-in-a-box/plan4/config-storage-and-tables`, branch `plan4/config-storage-and-tables`, from `origin/main`. Confirm with `git -C \u003cwt\u003e branch --show-current` before editing.\n- Python: `packages/contract/src/archive_contract/config.py`, `packages/contract/tests/test_config.py`.\n- Config: `archive.yaml` at the repo root (new), the one file a fork edits.\n- TypeScript: `packages/infra/bin/app.ts`, `packages/infra/src/` (`research-archive.ts`, `storage.ts`, `tables.ts`, `config.ts`, `generated/archive-config.ts`), `packages/infra/scripts/generate-config-type.ts`, `packages/infra/test/`.\n- `justfile` (`schema`, `check-schema`), `packages/web/src/schema/archive-contract.schema.json` (regenerated).\n- Global constraints: Python \u003e=3.12, ruff, mypy strict; TypeScript strict per `tsconfig.base.json`, ESM; `just check` is the gate and must exit 0; nothing published; every stack keeps the `Repo` tag `schuettc/research-in-a-box`.\n\n### Task 1: The infrastructure section of the archive config\n\n**Does:** Adds the `infrastructure` section to `ArchiveConfig`, commits the root `archive.yaml`, and regenerates the JSON Schema.\n**Files:** `packages/contract/src/archive_contract/config.py`, `packages/contract/tests/test_config.py`, `archive.yaml`, `packages/web/src/schema/archive-contract.schema.json`\n**Checks:** `uv run pytest packages/contract/tests/test_config.py` exits 0; `just check-python check-schema` exits 0.\n**Serves:** DCSN2, DCSN4 (rests on calls AGNT1, AGNT9)\n\nModels in `config.py`, each refusing unknown keys (`model_config = ConfigDict(extra=\"forbid\")` on top of `ArchiveModel`), so a typo in this section fails validation:\n\n- `Stage`: `name: str` matching `^[a-z][a-z0-9-]{0,19}$`; `account: str | None` matching `^[0-9]{12}$`; `region: str | None`.\n- `ObjectLock`: `retention_days: PositiveInt`, alias `retentionDays`.\n- `Modules`: `waf: bool = False`; `object_lock: ObjectLock | None = None`, alias `objectLock`.\n- `Infrastructure`: `stages: list[Stage]`, default `[Stage(name=\"prod\")]`, at least one, names unique; `alert_email: str`, alias `alertEmail`, required; `monthly_budget_usd: PositiveInt = 50`, alias `monthlyBudgetUsd`; `modules: Modules = Modules()`.\n- `ArchiveConfig.infrastructure: Infrastructure | None = None`. It stays optional so `cruise` keeps working with catalog-only configs; the default app requires it (Task 2).\n\nTests, added to `test_config.py`:\n\n- `test_infrastructure_reads_from_yaml`: a YAML with `alertEmail`, `monthlyBudgetUsd: 80`, two stages (one with `account: \"123456789012\"`, `region: us-east-2`) and `modules: {waf: true, objectLock: {retentionDays: 3650}}` loads through `load_config` with those values.\n- `test_infrastructure_defaults_to_prod_only`: `Infrastructure(alertEmail=\"a@b.c\")` has one stage named `prod`, budget 50, WAF off, no object lock.\n- `test_infrastructure_refuses_unknown_keys`: `modules: {wafs: true}` raises `ValidationError`.\n- `test_infrastructure_refuses_duplicate_stage_names` and `test_stage_refuses_bad_names_and_accounts` (`Prod`, `123`).\n- `test_root_archive_yaml_is_valid`: `load_config(\u003crepo root\u003e/archive.yaml)` succeeds and has an infrastructure section.\n\n`archive.yaml` at the root: `publisher: Invented Research Cooperative`, `profiles: [core, ecology]`, and an `infrastructure` section with `alertEmail: archive-admin@example.org`, `monthlyBudgetUsd: 50`, `stages: [{name: prod}]` and no modules. A comment line at the top says this is the one file a fork edits. Regenerate the schema with `just schema`.\n\nCommit: `Add the infrastructure section to the archive config`\n\n### Task 2: Generated config type and the default app\n\n**Does:** Generates the TypeScript `ArchiveConfig` type from the committed schema under the drift check. Makes the default app read and validate `archive.yaml` and build one stack per stage, with `ResearchArchive` taking typed props.\n**Files:** `packages/infra/scripts/generate-config-type.ts`, `packages/infra/src/generated/archive-config.ts`, `packages/infra/src/config.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/bin/app.ts`, `packages/infra/test/app.test.ts`, `packages/infra/package.json`, `justfile`\n**Checks:** `npm test -w packages/infra` exits 0; `npm run typecheck -w packages/infra` exits 0; `just check-schema` exits 0, and exits non-zero after a field is added to `Infrastructure` in Python without regenerating (try it, then revert).\n**Serves:** DCSN2, DCSN4 (rests on call AGNT9)\n\n- `scripts/generate-config-type.ts \u003cschema\u003e \u003cout\u003e`: reads `packages/web/src/schema/archive-contract.schema.json`, compiles `{ ...$defs.ArchiveConfig, $defs }` with json-schema-to-typescript (banner says generated, do not edit), and writes `src/generated/archive-config.ts`, then formats it with prettier. The exported names include `ArchiveConfig`, `Infrastructure`, `Stage`, `Modules`.\n- `justfile`: `schema` also runs the generator (`npx tsx packages/infra/scripts/generate-config-type.ts ...`). `check-schema` also regenerates the TypeScript to a temp file and diffs it against `src/generated/archive-config.ts`. CI's python job already runs `check-schema`, so add `actions/setup-node` with `npm ci` to that job.\n- `src/config.ts`: `loadArchiveConfig(path: string): ArchiveConfig` parses YAML with `yaml` and validates with ajv against the committed schema's `ArchiveConfig` definition. On failure it throws an error listing ajv's messages. It throws `archive.yaml needs an infrastructure section` when that section is missing.\n- `src/research-archive.ts`: `export interface ResearchArchiveProps { readonly config: ArchiveConfig; readonly stage: string }`. The constructor throws `stage \"\u003cname\u003e\" is not in infrastructure.stages` for an unknown stage, and keeps `readonly isProd = stage === \"prod\"` for the parts.\n- `bin/app.ts`: `createApp(configPath = \u003crepo root\u003e/archive.yaml): App` makes, for each stage, `new Stack(app, \\`ResearchArchive-${name}\\`, { env })`, with `env` set only when the stage names an account or region, and one `ResearchArchive` in it. It keeps the `Repo` tag. `STACK_NAME` is replaced by `stackName(stage: string): string`.\n\nTests in `test/app.test.ts`, writing temp YAML files for the variants:\n\n- `the default app makes ResearchArchive-prod from the committed archive.yaml, with the Repo tag`.\n- `a second stage makes a second stack` (stages `prod` and `dev`).\n- `a stage with an account and region sets the stack's environment`.\n- `a config with no infrastructure section is refused with a clear message`.\n- `a typo in modules is refused` (`wafs: true`).\n- `ResearchArchive refuses a stage not in the config`.\n\nCommit: `Generate the construct's config type and build one stack per stage`\n\n### Task 3: Storage\n\n**Does:** Adds the staging, archive and derived buckets, with optional write-once locking and the prod/non-prod removal rules.\n**Files:** `packages/infra/src/storage.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/test/storage.test.ts`\n**Checks:** `npm test -w packages/infra` exits 0.\n**Serves:** DCSN4 (rests on calls AGNT1, AGNT7, AGNT9)\n\n`class Storage extends Construct` with `readonly stagingBucket`, `archiveBucket` and `derivedBucket` (`s3.Bucket`). Props: `{ isProd: boolean; objectLock?: { retentionDays: number } }`.\n\n- Every bucket: `blockPublicAccess: BLOCK_ALL`, `enforceSSL: true`, `encryption: S3_MANAGED`. Prod: `removalPolicy: RETAIN`. Non-prod: `removalPolicy: DESTROY` with `autoDeleteObjects: true`.\n- Staging: a lifecycle rule expiring objects after 30 days.\n- Archive: `versioned: true`. When `objectLock` is set, `objectLockEnabled: true` with `objectLockDefaultRetention: ObjectLockRetention.governance(Duration.days(retentionDays))`. The `open/` and `restricted/` prefixes are conventions used by PLAN2 and Plans 6 and 7; no resources.\n- Derived: not versioned.\n- `ResearchArchive` creates `Storage` and exposes `stagingBucket`, `archiveBucket`, `derivedBucket`.\n\nTests (`Template.fromStack`):\n\n- `the archive bucket is versioned, blocks public access and enforces TLS`.\n- `staging objects expire after 30 days`.\n- `prod buckets are retained and a dev stage's are deleted with their objects`.\n- `write-once locking appears only when objectLock is set, in governance mode with its retention days`.\n\nCommit: `Add the archive's buckets`\n\n### Task 4: Tables and the active-catalog parameter\n\n**Does:** Adds catalog tables A and B, the `/research-archive/\u003cstage\u003e/catalog-active` parameter and the five operational tables, all exposed on the construct.\n**Files:** `packages/infra/src/tables.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/test/tables.test.ts`\n**Checks:** `npm test -w packages/infra` exits 0; `just check` exits 0.\n**Serves:** DCSN1, DCSN4 (rests on calls AGNT4, AGNT5, AGNT10, AGNT12)\n\nUse `dynamodb.Table`, not `TableV2`. `TableV2` synthesises `AWS::DynamoDB::GlobalTable`, and bulk put items does not support global tables, which PLAN3's reindex needs. Every table uses `billingMode: PAY_PER_REQUEST`, string keys and generated names, so stages never collide. Prod: `removalPolicy: RETAIN` and `deletionProtection: true`. Non-prod: `DESTROY` and no deletion protection.\n\n`class Tables extends Construct`, props `{ stage: string; isProd: boolean }`:\n\n- `readonly catalogTables: { a: Table; b: Table }`: each with partition `PK`, sort `SK`, and GSI `GSI1` (partition `GSI1PK`, sort `GSI1SK`, projection ALL). No point-in-time recovery.\n- `readonly activeCatalogParameter: ssm.StringParameter`: name `/research-archive/\u003cstage\u003e/catalog-active`, initial value `A`.\n- Operational tables, each with `pointInTimeRecoverySpecification: { pointInTimeRecoveryEnabled: true }`:\n  - `submissions`: partition `submissionId`; GSI `byStatus` (`status`, `createdAt`); GSI `bySubmitter` (`submitter`, `createdAt`).\n  - `reviews`: partition `submissionId`, sort `eventKey` (written as `\u003cat\u003e#\u003ceventId\u003e`).\n  - `settings`: partition `name`.\n  - `userProfiles`: partition `userId`.\n  - `downloadCounts`: partition `datasetId`, sort `month`.\n- `ResearchArchive` creates `Tables` and exposes `catalogTables`, `activeCatalogParameter`, `submissions`, `reviews`, `settings`, `userProfiles`, `downloadCounts` as readonly properties.\n\nTests:\n\n- `there are two catalog tables with PK, SK and GSI1, on demand, without point-in-time recovery`.\n- `no table is a global table` (no `AWS::DynamoDB::GlobalTable` in the template).\n- `the active-catalog parameter is named for the stage and starts at A`.\n- `each operational table has its key and point-in-time recovery` (one assertion per table, keys as above, including both Submissions indexes).\n- `prod tables have deletion protection and are retained; a dev stage's are not`.\n\nAdd one line to the Decision log at the end of `docs/planning-handoff.md`: `| \u003cdate\u003e | 4, 6 | The catalog and operational tables are plain dynamodb.Table (AWS::DynamoDB::Table), not TableV2, because TableV2 synthesises a GlobalTable and bulk put items does not support global tables. Plan 6 adds the vector index through the catalog tables' CfnTable (vectorIndexes). |`\n\nCommit: `Add the catalog and operational tables`\n\nAfter Task 4, push the branch, open a PR against `main` with `gh api`, and enable auto-merge after CI passes on the PR (main has no branch protection, so `--auto` merges at once: wait for the PR's CI run to pass, then merge).\n","PLAN2":"---\ndiazo: research-archive-in-a-box/archive-infrastructure-cdk-construct\nfile: PLAN2\nstatus: done\napproved: 2026-11-13T16:00:56-06:00\nhash: 6097d0b91ec4afe9fe5d39b475dd919f03b7164632dc00934426a2385f052621\nrests_on: [AGNT11, AGNT2, AGNT5, AGNT6, AGNT7, AGNT9]\nrecord: README.md\n---\n\n# PLAN2: Auth, API, web and operations\n\n## Spec\n\n`docs/specs/2026-11-13-archive-infrastructure-cdk-construct/spec.md`, sections \"Python Lambdas\", \"Auth\", \"API shell and web\", \"Operations and stages\" (the operations half) and \"Storage\" (the integrity check). PLAN1 is built and merged (research-in-a-box#10). Build on what it made: `ResearchArchive` in `packages/infra/src/research-archive.ts` with `Storage` and `Tables`, the generated `ArchiveConfig` type, and `archive.yaml`. The implementer reads the spec beside this plan.\n\n## The change\n\nThe construct gets everything else the spec's parts list except the reindex:\n\n- **Packaging:** a just recipe packages Python Lambdas without Docker, and `pythonFunction` builds functions from them.\n- **Operations:** an alert topic, a budget, failure alarms and a dashboard.\n- **Auth:** a Cognito user pool with managed login and two app clients.\n- **API:** a REST API with a public health route and one signed-in route, fixed throttling, and optional regional WAF.\n- **Web:** one CloudFront distribution over the site, open data and the API, with standard logs.\n- **Integrity check:** a weekly job. Its Python code lives in `archive-backend` with unit tests.\n\nEverything is proven by synth and unit tests; nothing deploys.\n\n**Risk:** local code and CI only; nothing reaches AWS in this plan, and a mistake is undone by reverting the PR. Two rules are pinned by tests so PLAN3's deploy inherits them: the prod user pool is retained with deletion protection, and the integrity check never retries on its own.\n\n**Cost:** no steps for you. New dependencies:\n\n- `boto3` (runtime) in `archive-backend`.\n- `boto3-stubs[s3,sns]` in the root dev group, for mypy strict.\n- CI's typescript job installs uv to build the Lambda assets.\n\nNo new programs on your machine.\n\n## Left out\n\n- The reindex function, `just reindex` and `just reindex-status`, and the test deploy (PLAN3).\n- API endpoints beyond `/api/health` and `/api/whoami` (Plan 6).\n- The dataset-page rewrite. The site function sends every extensionless path to the app's `index.html`; Plan 7 changes it when it writes per-dataset pages.\n- Deploying the web bundle to `site/` (Plans 8 and 10a).\n- An alarm on API throttling. A REST API has no separate throttle metric, so 4xx (which includes 429) is shown on the dashboard, and only 5xx alarms.\n- Integrity checking at large scale. The check lists and heads every archived object weekly, which suits a small archive; S3 Inventory with checksums is a follow-up for when an archive outgrows a 15-minute run.\n\n## Where\n\n- Worktree `/Users/courtschuett/GitHub/personal/.worktrees/research-archive-in-a-box/plan4/auth-api-web-and-operations`, branch `plan4/auth-api-web-and-operations` from `origin/main`. Confirm with `git -C \u003cwt\u003e branch --show-current` before editing.\n- Python: `packages/backend/pyproject.toml`, `packages/backend/src/archive_backend/` (`health.py`, `whoami.py`, `integrity.py`), `packages/backend/tests/`, root `pyproject.toml` (dev group).\n- TypeScript: `packages/infra/src/` (`python-function.ts`, `operations.ts`, `auth.ts`, `api.ts`, `web.ts`, `integrity.ts`, `research-archive.ts`), `packages/infra/test/`.\n- `justfile`, `.gitignore`, `.github/workflows/ci.yml`, `docs/planning-handoff.md` (decision log).\n- Global constraints: Python \u003e=3.12 for the workspace, Lambdas on Python 3.13 arm64; ruff, mypy strict; TypeScript strict, ESM; `just check` must exit 0; nothing published; every stack keeps the `Repo` tag; prod retains data and other stages tear down cleanly (PLAN1's `isProd`).\n\n### Task 1: Lambda packaging, pythonFunction and operations\n\n**Does:** Adds `just lambda-assets` and `pythonFunction`, which builds an arm64 Python 3.13 Lambda from the packaged `archive-backend` with an error alarm. Adds the operations part: alert topic, monthly budget and dashboard.\n**Files:** `justfile`, `.gitignore`, `.github/workflows/ci.yml`, `packages/backend/pyproject.toml`, `pyproject.toml`, `uv.lock`, `packages/infra/src/python-function.ts`, `packages/infra/src/operations.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/test/operations.test.ts`\n**Checks:** `just lambda-assets` exits 0 and `packages/infra/assets/python/pydantic_core/` holds a `*aarch64-linux-gnu.so`; `npm test -w packages/infra` exits 0.\n**Serves:** none (rests on calls AGNT2, AGNT9)\n\n- `justfile` `lambda-assets`:\n  1. Remove `packages/infra/assets/python`.\n  2. `uv export --package archive-backend --no-dev --no-hashes --frozen --no-emit-workspace -o \u003ctmp\u003e/requirements.txt`.\n  3. `uv pip install --python-platform aarch64-manylinux2014 --python-version 3.13 --only-binary :all: --target packages/infra/assets/python -r \u003ctmp\u003e/requirements.txt`. This exact command was run against the current lock and produced `_pydantic_core.cpython-313-aarch64-linux-gnu.so`.\n  4. `uv pip install --no-deps --python-version 3.13 --target packages/infra/assets/python packages/contract packages/backend`.\n\n  `check-ts` depends on `lambda-assets`. Add `packages/infra/assets/` to `.gitignore`. CI's typescript job adds `astral-sh/setup-uv` (same pin as the python job) before `just check-ts`.\n- `archive-backend` gains the dependency `boto3`, and the root dev group gains `boto3-stubs[s3,sns]`. Run `uv lock`.\n- `operations.ts`: `class Operations extends Construct`, props `{ alertEmail: string; monthlyBudgetUsd: number }`:\n  - `readonly alertTopic: sns.Topic`, with an email subscription to `alertEmail`.\n  - A `budgets.CfnBudget`: monthly, `COST`, limit `monthlyBudgetUsd` USD. Notifications on `ACTUAL` at 80 and 100 percent (`GREATER_THAN`, `PERCENTAGE`), each emailing `alertEmail`.\n  - `readonly dashboard: cloudwatch.Dashboard`, named `ResearchArchive-\u003cstage\u003e`.\n  - `addFunction(fn: lambda.Function): void`: adds an alarm on `fn.metricErrors()` (sum ≥ 1 over 5 minutes, one period, missing data not breaching) with an SNS action on the alert topic, and adds an errors-and-duration graph for the function to the dashboard.\n- `python-function.ts`: `export interface PythonFunctionProps { readonly handler: string; readonly environment?: Record\u003cstring, string\u003e; readonly timeout?: Duration; readonly memorySize?: number }`. `handler` is a dotted path in `archive_backend`, such as `archive_backend.health.handler`.\n- `ResearchArchive`:\n  - Creates `Operations` from `config.infrastructure` (which the default app always supplies; throw `ResearchArchive needs config.infrastructure` if it is missing) and exposes `alertTopic`.\n  - `pythonFunction(id: string, props: PythonFunctionProps): lambda.Function` makes a function in the archive's scope: `Runtime.PYTHON_3_13`, `Architecture.ARM_64`, `Code.fromAsset(\u003cpackages/infra/assets/python\u003e)`, timeout default 30 seconds, memory default 512, and a log group with one-month retention, removed with the stack unless prod. It calls `operations.addFunction`.\n  - Synth throws `run just lambda-assets first` when the asset folder is missing.\n\nTests in `operations.test.ts`:\n\n- `the alert topic emails the configured address`.\n- `the budget is monthly, at the configured limit, and alerts at 80 and 100 percent`.\n- `pythonFunction makes an arm64 Python 3.13 function with an errors alarm on the alert topic`.\n- `there is one dashboard per stage`.\n\nCommit: `Package Python Lambdas and add operations defaults`\n\n### Task 2: The health and whoami handlers, and the integrity check code\n\n**Does:** Adds the Python handlers for `/api/health` and `/api/whoami` and the integrity check's logic, each with unit tests and no AWS.\n**Files:** `packages/backend/src/archive_backend/health.py`, `whoami.py`, `integrity.py`, `packages/backend/tests/test_health.py`, `test_whoami.py`, `test_integrity.py`\n**Checks:** `uv run pytest packages/backend` exits 0; `just check-python` exits 0.\n**Serves:** none (rests on calls AGNT5, AGNT7)\n\n- `health.handler(event: dict[str, Any], context: object) -\u003e dict[str, Any]`: returns `{\"statusCode\": 200, \"headers\": {\"content-type\": \"application/json\"}, \"body\": \"{\\\"status\\\": \\\"ok\\\"}\"}`.\n- `whoami.handler(event, context)`: reads `event[\"requestContext\"][\"authorizer\"][\"claims\"]` and returns 200 with a JSON body `{\"sub\": ..., \"email\": ..., \"groups\": [...]}`. `groups` comes from `cognito:groups` (absent means `[]`).\n- `integrity.py`. Archived package layout (recorded in the decision log in Task 4): each published version sits at `\u003copen|restricted\u003e/\u003cdatasetId\u003e/\u003cversion\u003e/`, with `checksums.sha256` at its root in `sha256sum` format (`\u003chex\u003e  \u003crelative path\u003e`, as `examples/sample-package/checksums.sha256` shows). Each object is written in one PUT with a full-object SHA-256 checksum.\n  - `@dataclass(frozen=True) class Problem: key: str; kind: Literal[\"mismatch\", \"missing\", \"no-checksum\"]`.\n  - `check_archive(s3: S3Client, bucket: str) -\u003e list[Problem]`:\n    1. Find every `checksums.sha256` under `open/` and `restricted/` with the `list_objects_v2` paginator.\n    2. For each line, `head_object(..., ChecksumMode=\"ENABLED\")` on the version folder plus the relative path.\n    3. A 404 is `missing`. An absent `ChecksumSHA256`, or a composite one (it contains `-`), is `no-checksum`. A base64-decoded value that differs from the line's hex is `mismatch`.\n  - `handler(event, context)`: runs `check_archive` on `ARCHIVE_BUCKET`. When there are problems, it publishes one message to `ALERT_TOPIC_ARN`: subject `Archive integrity check: \u003cn\u003e problems`, body the first 50 as `\u003ckind\u003e \u003ckey\u003e` lines. It returns `{\"checked\": \u003cobjects\u003e, \"problems\": \u003cn\u003e}` and never raises for problems found. A raise would make Lambda's async invoke retry the whole scan.\n  - Type the client as `mypy_boto3_s3.S3Client` and create it in the handler.\n- Tests use a small in-memory fake implementing `get_paginator(\"list_objects_v2\")`, `get_object` and `head_object`, not moto:\n  - `test_matching_objects_have_no_problems`.\n  - `test_changed_object_is_a_mismatch`.\n  - `test_listed_file_that_is_gone_is_missing`.\n  - `test_object_without_a_full_sha256_is_no_checksum` (absent, and composite `abc-2`).\n  - `test_handler_alerts_only_when_there_are_problems` (fake SNS records publishes).\n  - `test_health_answers_ok`.\n  - `test_whoami_returns_sub_email_and_groups`.\n\nCommit: `Add the health, whoami and integrity check handlers`\n\n### Task 3: Auth, the API shell and the integrity schedule\n\n**Does:** Adds the Cognito user pool with groups and managed login, and the REST API (`/api/health` public, `/api/whoami` behind the Cognito authorizer, fixed throttling, optional regional WAF). Schedules the integrity check weekly.\n**Files:** `packages/infra/src/auth.ts`, `packages/infra/src/api.ts`, `packages/infra/src/integrity.ts`, `packages/infra/src/research-archive.ts`, `packages/infra/test/auth.test.ts`, `packages/infra/test/api.test.ts`\n**Checks:** `npm test -w packages/infra` exits 0.\n**Serves:** none (rests on calls AGNT5, AGNT7, AGNT11)\n\n- `auth.ts`: `class Auth extends Construct`, props `{ stage: string; isProd: boolean }`:\n  - `readonly userPool`: self sign-up, sign-in with email, email auto-verified, account recovery by email. Prod: `RETAIN` and `deletionProtection: true`; other stages: `DESTROY`.\n  - Groups `contributor`, `curator`, `admin` (`CfnUserPoolGroup`).\n  - A Cognito domain with prefix `archive-\u003cstage\u003e-\u003caccount\u003e` and `managedLoginVersion: NEWER_MANAGED_LOGIN`.\n  - `addAppClients(siteDomain: string): { web: UserPoolClient; cli: UserPoolClient }`: both use authorization code with PKCE, no client secret, and scopes `openid email profile`.\n    - `web`: callback `https://\u003csiteDomain\u003e/auth/callback`, logout `https://\u003csiteDomain\u003e/`.\n    - `cli`: callback `http://localhost:8765/callback`.\n    - Each gets a `CfnManagedLoginBranding` with `useCognitoProvidedValues: true`, since managed login shows no page for a client without one.\n- `api.ts`: `class Api extends Construct`, props `{ userPool; waf: boolean; health: lambda.Function; whoami: lambda.Function }`:\n  - `readonly restApi: apigateway.RestApi`, with a regional endpoint and deploy options `throttlingRateLimit: 50`, `throttlingBurstLimit:
