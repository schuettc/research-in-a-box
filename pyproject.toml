[project]
name = "research-in-a-box"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contract", "packages/tool", "packages/backend"]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pydantic",
    "types-pyyaml>=6.0.12.20261113",
    "frictionless>=5.21.0",
    "pyshp>=3.1.8",
    "openpyxl>=3.1.5",
    "lxml>=6.1.3",
    "lxml-stubs>=0.5.1",
    "boto3-stubs[s3,sns]",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/contract/src", "packages/tool/src", "packages/backend/src"]
explicit_package_bases = true
# just lambda-assets installs third-party code here for the Lambda bundle
exclude = ["^packages/infra/assets/"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint.isort]
known-first-party = ["archive_contract", "cruise", "archive_backend"]
