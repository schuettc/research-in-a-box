[project]
name = "research-in-a-box"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/contract", "packages/tool", "packages/backend"]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pydantic"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["packages/contract/src", "packages/tool/src", "packages/backend/src"]
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint.isort]
known-first-party = ["archive_contract", "cruise", "archive_backend"]
