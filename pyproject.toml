[project]
name = "research-in-a-box"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/contract",
    "packages/tool",
    "packages/backend",
    "packages/client",
    "packages/agent",
    "examples/femc",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pydantic",
    "types-pyyaml>=6.0.12.20261113",
    "frictionless>=5.21.0",
    "pyshp>=3.1.8",
    "openpyxl>=3.1.5",
    "lxml>=6.1.3",
    "lxml-stubs>=0.5.1",
    "boto3-stubs[s3,sns]",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = [
    "packages/contract/src",
    "packages/tool/src",
    "packages/backend/src",
    "packages/client/src",
    "packages/agent/src",
    "examples/femc/src",
    "scripts",
]
explicit_package_bases = true
# Third-party code for the Lambda bundle: installed by just lambda-assets, staged by cdk synth
exclude = ["^packages/infra/assets/", "^packages/infra/cdk\\.out/"]

[tool.pytest.ini_options]
testpaths = ["packages", "examples/femc", "scripts"]
pythonpath = ["scripts"]
addopts = ["--import-mode=importlib"]

[tool.ruff.lint.isort]
known-first-party = [
    "archive_contract",
    "cruise",
    "archive_backend",
    "archive_client",
    "archive_agent",
    "femc",
    "smoke",
    "seed",
]
